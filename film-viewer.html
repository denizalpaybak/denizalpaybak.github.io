<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Denizalp Aybak — Film</title>

<link rel="stylesheet" href="https://use.typekit.net/rmn7qgm.css">

<link rel="preconnect" href="https://library.denizalpaybak.com" crossorigin>
<link rel="dns-prefetch" href="//library.denizalpaybak.com">


<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #fff;
    color: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

button {
    font: inherit;
}


/* =====================================================
   VARIABLES
   ===================================================== */

:root {

    --font-size: 15px;
    --line-height: 1.15;

    /*
        NUMERAL ACTIVE STATE
        Digits cannot uppercase, so during the same morph state
        they gain a subtle amount of tracking instead.
    */
    --active-number-tracking: 0.055em;

    --side: 48px;
    --top: 32px;

    --index-bottom: 24px;

    /*
        INDEX follows the actual horizontal center of SOUND ON/OFF.
        JS updates this value from soundButton.getBoundingClientRect().
    */
    --index-center-x: 50%;

    --meta-gap: 6px;
    --meta-top-gap: 10px;

    --index-gap: 54px;

}


/* =====================================================
   BODY
   ===================================================== */

body {
    cursor: default;
}


/* =====================================================
   INFO
   ===================================================== */

.info {
    position: fixed;

    top: var(--top);
    left: var(--side);

    z-index: 500;

    font-size: var(--font-size);
    line-height: var(--line-height);
}


/* =====================================================
   LOGO
   ===================================================== */

.logo {
    position: relative;

    display: block;

    width: 190px;
    height: 52px;

    color: inherit;
    text-decoration: none;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

.logo-name {
    position: absolute;

    top: 0;
    left: 0;

    white-space: nowrap;
}

.logo-aybak {
    position: absolute;

    top: 17px;
    left: 0;

    white-space: nowrap;
}


/* =====================================================
   CONTACT
   ===================================================== */

.contact,
.social {
    margin: 0;
    padding: 0;
}

.social {
    display: flex;
    flex-direction: column;
}

.info a {
    color: inherit;
    text-decoration: none;
}

.contact a:hover,
.social a:hover {
    text-decoration: underline;
}


/* =====================================================
   PHOTOGRAPHY
   ===================================================== */

.section-switch {
    position: fixed;

    top: var(--top);
    right: var(--side);

    z-index: 500;

    color: #000;
    text-decoration: none;

    font-size: var(--font-size);
    line-height: var(--line-height);

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   VIDEO STAGE
   ===================================================== */

#video-stage {
    position: fixed;

    inset: 0;

    z-index: 10;

    pointer-events: none;
}


/* =====================================================
   VIDEO BLOCK
   ===================================================== */

#video-block {
    position: absolute;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    display: flex;
    flex-direction: column;

    align-items: stretch;

    pointer-events: none;
}


/*
    Media gets its own holder.

    This is important because on landscape phones a
    portrait film may be narrow, but the controls must
    NOT inherit that tiny width.
*/

#media-holder {
    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;

    pointer-events: none;
}


/* =====================================================
   MAIN VIDEO
   ===================================================== */

#film-video {
    display: block;

    width: auto;
    height: auto;

    max-width: 100%;
    max-height: 100%;

    object-fit: contain;

    background: transparent;

    cursor: pointer;

    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   PROJECT META
   ===================================================== */

#project-meta {
    position: relative;

    z-index: 60;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    grid-template-rows:
        auto
        auto;

    width: 100%;

    margin-top:
        var(--meta-top-gap);

    font-size:
        var(--font-size);

    line-height:
        var(--line-height);

    pointer-events: none;
}

#project-title {
    grid-column: 1;
    grid-row: 1;

    min-width: 0;

    white-space: nowrap;
}

#project-date {
    grid-column: 1;
    grid-row: 2;

    min-width: 0;

    white-space: nowrap;
}

#project-counter {
    grid-column: 2;
    grid-row: 1;

    justify-self: end;

    padding-left: 28px;

    white-space: nowrap;
}

#view-all-button {
    grid-column: 2;
    grid-row: 2;

    justify-self: end;

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: inherit;

    line-height: inherit;

    text-align: right;

    white-space: nowrap;

    cursor: pointer;

    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   CONTROLS
   ===================================================== */

#controls {
    display: grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items: center;

    width: 100%;

    margin-top: 10px;

    font-size:
        var(--font-size);

    line-height:
        var(--line-height);

    pointer-events: auto;
}

#controls button {
    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    line-height: inherit;

    cursor: pointer;

    white-space: nowrap;

    -webkit-tap-highlight-color: transparent;
}

#previous-button {
    justify-self: start;
}

#sound-button {
    justify-self: center;
}

#next-button {
    justify-self: end;
}


/* =====================================================
   VIEW ALL MODE
   ===================================================== */

body.project-all-mode #media-holder {
    visibility: hidden;
}

body.project-all-mode #controls {
    visibility: hidden;
}


/* =====================================================
   VIEW ALL
   ===================================================== */

#project-all-view {
    position: fixed;

    z-index: 30;

    display: none;

    overflow: hidden;

    pointer-events: auto;
}

body.project-all-mode #project-all-view {
    display: block;
}


/* =====================================================
   VIEW ALL GRID
   ===================================================== */

#project-all-grid {
    position: relative;

    display: block;

    width: 100%;
    height: 100%;
}


/* =====================================================
   VIEW ALL THUMB
   ===================================================== */

.project-all-thumb {
    appearance: none;
    -webkit-appearance: none;

    position: absolute;

    display: flex;

    align-items: center;
    justify-content: center;

    width: 0;
    height: 0;

    min-width: 0;
    min-height: 0;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;

    cursor: pointer;

    overflow: hidden;

    -webkit-tap-highlight-color: transparent;
}

.project-all-thumb video {
    display: block;

    width: auto;
    height: auto;

    max-width: 100%;
    max-height: 100%;

    object-fit: contain;

    pointer-events: none;
}


/*
    Preview videos use their JPG poster as the immediate visual.
    No fade is added: poster simply gives way to the first decoded
    video frame, preserving the site's crisp motion language.
*/

.project-all-thumb video,
.card-video-wrap video {
    background: transparent;
}


/* =====================================================
   INDEX BUTTON
   ===================================================== */

#index-button {
    position: fixed;

    left: var(--index-center-x);

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom)
        );

    z-index: 600;

    transform:
        translateX(-50%);

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    font-size:
        var(--font-size);

    line-height:
        var(--line-height);

    white-space: nowrap;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   INDEX VIEW
   ===================================================== */

#index-view {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    background: #fff;
}

#index-view.visible {
    display: block;
}

body.index-mode #video-stage {
    visibility: hidden;
}


/* =====================================================
   INDEX SCROLLER
   ===================================================== */

#index-scroller {
    position: absolute;

    left: 0;
    right: 0;

    top: 130px;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom) +
            34px
        );

    display: flex;

    align-items: center;

    overflow-x: auto;
    overflow-y: hidden;

    scrollbar-width: none;

    -webkit-overflow-scrolling: touch;

    user-select: none;

    cursor: grab;

    outline: none;

    pointer-events: auto;
}

#index-scroller::-webkit-scrollbar {
    display: none;
}

#index-scroller.dragging {
    cursor: grabbing;
}


/* =====================================================
   INDEX RAIL
   ===================================================== */

#index-grid {
    display: flex;

    flex-direction: row;
    flex-wrap: nowrap;

    align-items: flex-start;

    gap:
        var(--index-gap);

    width: max-content;

    padding-left:
        var(--side);

    padding-right:
        var(--side);
}


/* =====================================================
   INDEX CARD
   ===================================================== */

.project-card {
    appearance: none;
    -webkit-appearance: none;

    flex: 0 0 auto;

    display: flex;
    flex-direction: column;

    align-items: flex-start;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;
    color: #000;

    text-align: left;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   INDEX MEDIA STAGE

   All cards get the SAME invisible media height.

   A landscape video is centered vertically inside it.

   A portrait video can use almost all of the height.

   Copy always begins AFTER this wrapper, therefore all
   project titles/dates remain aligned.
   ===================================================== */

.card-video-wrap {
    position: relative;

    display: block;

    flex: 0 0 auto;

    overflow: visible;

    pointer-events: none;
}

.card-video-wrap video {
    position: absolute;

    top: 50%;
    left: 0;

    display: block;

    transform:
        translateY(-50%);

    margin: 0;

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   INDEX COPY
   ===================================================== */

.card-copy {
    display: flex;
    flex-direction: column;

    align-items: flex-start;

    width: 100%;

    margin-top:
        var(--meta-gap);

    font-size:
        var(--font-size);

    line-height:
        var(--line-height);

    text-align: left;

    pointer-events: none;
}

.card-title,
.card-date {
    display: block;

    margin: 0;
    padding: 0;

    max-width: 100%;

    text-align: left;

    white-space: nowrap;

    overflow: hidden;
}


/* =====================================================
   TABLET
   ===================================================== */

@media
    (min-width: 601px)
    and (max-width: 1366px) {

    :root {
        --index-gap: 48px;
    }

}


/* =====================================================
   PHONE
   ===================================================== */

@media
    (max-width: 600px) {

    :root {

        --font-size: 13px;

        --side: 24px;
        --top: 20px;

        --index-bottom: 18px;

        --meta-gap: 5px;

        --index-gap: 54px;

    }


    .logo {
        width: 160px;
        height: 45px;
    }


    .logo-aybak {
        top: 15px;
    }

}


/* =====================================================
   PHONE PORTRAIT
   ===================================================== */

@media
    (max-width: 600px)
    and (orientation: portrait) {

    #video-block {
        transform:
            translateX(-50%);
    }


    /*
        On phone portrait the project metadata is a viewport UI bar,
        not a caption tied to the current video's width.

        This keeps the title/date fixed to the left safe edge and
        counter/view-all fixed to the right safe edge even when the
        current film is a narrow portrait clip.
    */
    #project-meta {
        width: calc(100vw - (var(--side) * 2));
        align-self: center;
    }


    #controls {
        margin-top: 9px;
    }


    #project-all-grid {
        gap: 5px;
    }


    #index-scroller {
        top: 190px;

        bottom:
            calc(
                var(--index-bottom) +
                env(safe-area-inset-bottom) +
                54px
            );

        align-items: center;
    }


    #index-grid {
        padding-left: 24px;
        padding-right: 24px;

        gap: 54px;
    }

}


/* =====================================================
   PHONE LANDSCAPE
   ===================================================== */

@media
    (max-height: 650px)
    and (orientation: landscape)
    and (max-width: 1000px) {

    :root {

        --font-size: 13px;

        --side: 24px;
        --top: 18px;

        --index-bottom: 14px;

        /*
            Photography-site rhythm:
            relatively small works + generous horizontal air.
        */

        --index-gap: 92px;

    }


    .logo {
        width: 155px;
        height: 42px;
    }


    .logo-aybak {
        top: 15px;
    }


    /*
        LANDSCAPE SLIDE

        The photography site does not treat the left info
        block and the artwork as two rigid columns.

        Instead:
        - identity/contact stays in the upper-left
        - content remains visually centered in the viewport
        - title/date anchors to the lower-left
        - counter/view-all anchors to the lower-right
        - INDEX remains centered at the bottom

        Film keeps its extra previous / sound / next row,
        but that row also spans the viewport rather than
        collapsing to the current video's width.
    */

    #video-block {
        width:
            calc(
                100vw -
                var(--side) * 2
            );

        height: 100%;

        max-width: none;
    }


    #media-holder {
        position: absolute;

        left: 0;
        right: 0;

        top: 18px;
        bottom: 118px;

        width: 100%;

        display: flex;

        align-items: center;
        justify-content: center;
    }


    #project-meta {
        position: absolute;

        left: 0;
        right: 0;

        /* Restore the breathing room used in the other modes. */
        bottom: 112px;

        width: 100%;

        margin: 0;

        grid-template-columns:
            minmax(0, 1fr)
            auto;

        font-size: 13px;
        line-height: 1.15;
    }


    #project-title,
    #project-date {
        overflow: visible;

        text-overflow: clip;

        white-space: nowrap;
    }


    #project-counter {
        padding-left: 24px;
    }


    #controls {
        position: absolute;

        left: 0;
        right: 0;

        /*
            Keep a real gap both above this row and below it.
            INDEX remains a separate third row, as in portrait.
        */
        bottom: 72px;

        width: 100%;

        margin: 0;

        font-size: 13px;
        line-height: 1.15;
    }


    /*
        VIEW ALL uses the same broad horizontal field as
        photography. The actual top/bottom bounds are
        calculated in JS from the info and metadata.
    */

    #project-all-grid {
        gap: 5px;
    }


    /*
        INDEX should feel like the photography landscape
        index: small works, common visual height, generous
        horizontal spacing, captions aligned below.
    */

    #index-scroller {
        left: 0;
        right: 0;

        align-items: center;
    }


    #index-grid {
        align-items: flex-start;
    }


    /*
        Landscape index follows portrait-mobile logic:
        every card owns the same invisible media stage;
        the actual video is centered inside that stage.
        Caption width is independent from a very narrow
        portrait thumbnail so title + date stay readable.
    */

    .card-video-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .card-copy {
        /*
            Caption width must not collapse to the width of a
            very narrow portrait film. Smaller thumbnails + a
            stable copy width make both title and date readable.

            The margin is the exact visible-thumbnail offset
            calculated by JS, so title/date always begin on the
            thumbnail's actual left edge.
        */
        margin-left: var(--landscape-preview-offset, 0px);
        min-width: 178px;
        width: 100%;
        overflow: visible;
    }

    .card-title,
    .card-date {
        overflow: visible;
        text-overflow: clip;
        white-space: nowrap;
    }

}


/* =====================================================
   REDUCED MOTION
   ===================================================== */

@media
    (prefers-reduced-motion: reduce) {

    * {
        scroll-behavior:
            auto !important;
    }

}



/* =====================================================
   PHOTO-SITE UI PORT — FILM
   Only the requested meta/index/end-card layers are overridden.
   ===================================================== */

/* Slide: VIEW ALL over total film count. View All mode: ALL (...) over CLOSE. */
#view-all-button {
    grid-column: 2 !important;
    grid-row: 1 !important;
}

#project-counter {
    grid-column: 2 !important;
    grid-row: 2 !important;
    padding-left: 28px;
    text-align: right;
}

body.project-all-mode #project-counter {
    grid-row: 1 !important;
}

body.project-all-mode #view-all-button {
    grid-row: 2 !important;
}


/* White page keeps only Denizalp Aybak at left and INDEX at right. */
#index-button {
    position: fixed !important;
    top: var(--top) !important;
    right: var(--side) !important;
    left: auto !important;
    bottom: auto !important;
    transform: none !important;
    z-index: 600;
    cursor: pointer;
}


/* =====================================================
   TYPOGRAPHIC INDEX
   ===================================================== */

#index-view {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    overflow: hidden;
    background: #fff;
}

#index-view.visible {
    display: block;
}

body.index-mode #video-stage {
    visibility: hidden;
}

#index-scroller {
    position: absolute !important;
    top: calc(var(--top) + 72px) !important;
    left: var(--side) !important;
    right: calc(var(--side) + min(36vw, 560px) + clamp(34px, 4vw, 76px)) !important;
    bottom: var(--top) !important;
    display: block !important;
    overflow: hidden !important;
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
    overscroll-behavior: contain;
    outline: none;
    cursor: default !important;
    user-select: none;
}

#index-scroller::-webkit-scrollbar {
    display: none !important;
}

#index-grid {
    --index-row-gap: calc(var(--font-size) * var(--line-height));
    --index-column-gap: clamp(32px, 4vw, 72px);

    position: relative;
    display: grid !important;
    grid-auto-flow: column !important;
    grid-template-rows:
        repeat(
            var(--index-row-count, 1),
            calc(var(--font-size) * var(--line-height) * 2)
        ) !important;
    grid-template-columns:
        repeat(
            var(--index-column-count, 2),
            max-content
        ) !important;
    column-gap: var(--index-column-gap) !important;
    row-gap: var(--index-row-gap) !important;
    align-content: start !important;
    width: max-content !important;
    min-width: 100%;
    min-height: 100%;
    padding:
        calc(var(--font-size) * var(--line-height))
        0 !important;
    transform: none !important;
}

.index-project-row {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    min-width: 0;
    min-height: 0;
    margin: 0;
    padding: 0;
    font-size: var(--font-size);
    line-height: var(--line-height);
    overflow: visible;
}

.index-project-title,
.index-project-date {
    appearance: none;
    -webkit-appearance: none;
    display: block;
    width: max-content;
    max-width: none;
    margin: 0;
    padding: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: #000;
    font: inherit;
    line-height: inherit;
    white-space: nowrap;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

#index-preview {
    position: fixed;
    right: var(--side);
    top: 50%;
    width: min(36vw, 560px);
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 150ms ease, visibility 0s linear 150ms;
}

#index-preview.visible {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity 150ms ease, visibility 0s linear 0s;
}

#index-preview-video {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 54vh;
    object-fit: contain;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

#index-project-action {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    width: 100%;
    margin-top: calc(var(--font-size) * .75);
    font-size: var(--font-size);
    line-height: var(--line-height);
    text-align: right;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

#index-project-action.visible {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

#index-project-view-all {
    appearance: none;
    -webkit-appearance: none;
    margin: 0;
    padding: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: #000;
    font: inherit;
    line-height: inherit;
    text-align: right;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

#index-project-count {
    display: block;
    width: 100%;
    text-align: right;
}


/* Phones: one text column with the preview/action fixed at right.
   The list scrolls only when one-line minimum spacing no longer fits. */
body.phone-portrait #index-scroller,
body.phone-landscape #index-scroller {
    top: calc(var(--top) + 58px) !important;
    left: var(--side) !important;
    right: calc(var(--side) + min(42vw, 320px) + 18px) !important;
    bottom: calc(var(--top) + env(safe-area-inset-bottom)) !important;
    overflow-x: hidden !important;
    overflow-y: auto !important;
    touch-action: pan-y !important;
    -webkit-overflow-scrolling: touch;
}

body.phone-landscape #index-scroller {
    top: calc(var(--top) + 46px) !important;
    right: calc(var(--side) + min(34vw, 300px) + 20px) !important;
}

body.phone-portrait #index-grid,
body.phone-landscape #index-grid {
    display: flex !important;
    flex-direction: column !important;
    flex-wrap: nowrap !important;
    width: 100% !important;
    min-width: 0 !important;
    height: auto !important;
    min-height: 100% !important;
    padding:
        calc(var(--font-size) * var(--line-height))
        0 !important;
    gap: var(--index-row-gap) !important;
}

body.phone-portrait .index-project-row,

/* =====================================================
   MOBILE INDEX SCROLL HINT
   ===================================================== */

/*
   The hint belongs to the viewport, not to the narrow text scroller.
   That keeps the full sentence visible even while the right side of
   the index is reserved for project preview media.
*/
#index-scroll-hint {
    position: fixed;
    left: var(--side);
    right: var(--side);
    top: auto;
    bottom: var(--top);
    z-index: 520;
    display: none;
    align-items: center;
    gap: 0.30em;
    width: auto;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: var(--font-size);
    line-height: var(--line-height);
    color: #000;
    opacity: 1;
    pointer-events: none;
    white-space: nowrap;
}

body.phone-portrait.index-mode.index-needs-scroll:not(.index-scroll-hint-dismissed) #index-scroll-hint,
body.phone-landscape.index-mode.index-needs-scroll:not(.index-scroll-hint-dismissed) #index-scroll-hint {
    display: inline-flex;
}

.index-scroll-hint-host {
    position: relative !important;
}

.index-scroll-hint-clipped {
    visibility: hidden !important;
    pointer-events: none !important;
}

/* =====================================================
   AYBAK END CARD
   ===================================================== */

html.aybak-end-card-active,
body.aybak-end-card-active {
    background: #000 !important;
}

#aybak-end-card {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: block;
    overflow: hidden;
    box-sizing: border-box;
    background: rgba(0, 0, 0, 0);
    color: #fff;
    visibility: hidden;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    transition:
        background-color 460ms cubic-bezier(.22, .61, .36, 1),
        visibility 0s linear 460ms;
}

body.aybak-end-card-active #aybak-end-card {
    visibility: visible;
    pointer-events: auto;
    background: rgba(0, 0, 0, 1);
    transition:
        background-color 460ms cubic-bezier(.22, .61, .36, 1),
        visibility 0s linear 0s;
}

#aybak-end-card-word {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 170ms ease 0ms;
}

body.aybak-end-card-active #aybak-end-card-word {
    opacity: 1;
    transition-delay: 255ms;
}

.aybak-end-card-copy {
    position: absolute;
    z-index: 2;
    top: var(--top);
    font-family: Arial, Helvetica, sans-serif;
    font-size: var(--font-size);
    line-height: var(--line-height);
    opacity: 0;
    transition: opacity 170ms ease 0ms;
}

body.aybak-end-card-active .aybak-end-card-copy {
    opacity: 1;
    transition-delay: 255ms;
}

.aybak-end-card-contact {
    left: var(--side);
    display: flex;
    flex-direction: column;
}

.aybak-end-card-section {
    right: var(--side);
}

.aybak-end-card-copy a {
    color: #fff;
    text-decoration: none;
}

.aybak-end-card-contact a:hover {
    text-decoration: underline;
}

.aybak-end-card-section a,
.aybak-end-card-section a:hover,
.aybak-end-card-section a:focus,
.aybak-end-card-section a:active,
#aybak-end-card .section-switch,
#aybak-end-card .section-switch:hover,
#aybak-end-card .section-switch:focus,
#aybak-end-card .section-switch:active {
    text-decoration: none !important;
    outline: 0;
}

#aybak-end-card .section-switch {
    position: static;
    top: auto;
    right: auto;
    z-index: auto;
    color: #fff;
}

/* Arrow-bearing labels use the same optical gap everywhere. */
#index-scroll-hint,
#aybak-end-card .section-switch,
#aybak-end-card .aybak-end-card-link {
    gap: 0.30em;
}

/* =====================================================
   CONSISTENT SITE ARROWS
   ===================================================== */

/*
   Compact Helvetica-compatible arrow family.
   Both glyphs share one optical cell and one stroke weight, but their
   internal geometry is tuned separately so down/external arrows feel
   equal rather than merely measuring equal.
*/
.site-arrow {
    display: inline-block;
    flex: 0 0 auto;
    width: 0.66em;
    height: 0.66em;
    overflow: visible;
    color: currentColor;
    pointer-events: none;
    vertical-align: -0.055em;
}

.site-arrow path {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.02;
    stroke-linecap: square;
    stroke-linejoin: miter;
}

.site-arrow--down,
.site-arrow--external {
    transform: none;
}


@media (prefers-reduced-motion: reduce) {
    #aybak-end-card,
    #aybak-end-card-word,
    .aybak-end-card-copy,
    #index-preview {
        transition-duration: 0ms !important;
        transition-delay: 0ms !important;
    }
}



/* =====================================================
   V25 — REQUESTED FILM UI ADJUSTMENTS ONLY
   ===================================================== */

/*
    Keep the original white-page contact + photography nodes in the
    layout tree for the film player's existing geometry calculations,
    but make them completely invisible/non-interactive.
*/
.info > .contact,
.info > .social,
body > .section-switch {
    visibility: hidden !important;
    pointer-events: none !important;
}

/*
    Slide order:
    video
    one-line gap
    previous / sound / next (still exactly video-width)
    one-line gap
    project title/date at viewport left + view all/count at viewport right
*/
#media-holder {
    order: 0;
}

#controls {
    order: 1;
    margin-top:
        calc(
            var(--font-size) *
            var(--line-height)
        ) !important;
}

#project-meta {
    order: 2;
    width:
        calc(
            100vw -
            var(--side) * 2
        ) !important;
    align-self: center !important;
    margin-top:
        calc(
            var(--font-size) *
            var(--line-height)
        ) !important;
}

/* Keep the action stack on the right: view all above the film count. */
#view-all-button {
    grid-column: 2 !important;
    grid-row: 1 !important;
}

#project-counter {
    grid-column: 2 !important;
    grid-row: 2 !important;
    justify-self: end !important;
    text-align: right !important;
}

/* In View All: all (x films) above close. */
body.project-all-mode #project-counter {
    grid-row: 1 !important;
}

body.project-all-mode #view-all-button {
    grid-row: 2 !important;
}

/*
    Phone landscape uses absolute bars in the original working film layout.
    Swap only their vertical positions; do not alter the player geometry code.
*/
@media
    (max-height: 650px)
    and (orientation: landscape)
    and (max-width: 1000px) {

    #controls {
        bottom: 112px !important;
        margin-top: 0 !important;
    }

    #project-meta {
        bottom: 72px !important;
        margin-top: 0 !important;
    }

}

/*
    Desktop/tablet index: use at least three text columns when there are
    enough projects. The JS still increases columns further if required.
*/
@media
    (min-width: 1001px),
    (min-width: 601px) and (min-height: 651px) {

    #index-scroller {
        right:
            calc(
                var(--side) +
                min(36vw, 560px) +
                clamp(24px, 3vw, 54px)
            ) !important;
    }

}

/* Black-card photography link is a plain white link, never underlined. */
.aybak-end-card-link,
.aybak-end-card-link:hover,
.aybak-end-card-link:focus,
.aybak-end-card-link:active {
    color: #fff;
    text-decoration: none !important;
}

/*

*/
#aybak-end-card::before {
    content: "";
    position: fixed;
    inset: -128px;
    z-index: -1;
    background: #000;
    pointer-events: none;
}

html.aybak-end-card-active,
body.aybak-end-card-active {
    background: #000 !important;
}

/*

#controls,

#aybak-end-card::before {

<script>

/* =====================================================
   AYBAK END CARD — TWO-STATE VERTICAL NAVIGATION
   ===================================================== */

const aybakEndCard =
    document.getElementById(
        "aybak-end-card"
    );

let aybakEndCardActive =
    false;

let aybakResumeVideo =
    false;

let aybakEndCardLight =
    false;

let aybakTouchStartX =
    null;

let aybakTouchStartY =
    null;

let aybakTouchStartedInIndexScroller =
    false;

let aybakWheelAccumulator =
    0;

let aybakWheelResetTimer =
    null;

const AYBAK_WHEEL_THRESHOLD =
    48;

const AYBAK_SWIPE_THRESHOLD =
    52;


function fitAybakEndCardWord() {

    const canvas =
        document.getElementById(
            "aybak-end-card-word"
        );

    if (
        !canvas ||
        !aybakEndCard
    ) {
        return;
    }

    /*
        Match the landing-page geometry exactly:
        - the end card itself is the real viewport, never an oversized safe-area box
        - A / K visible ink edges sit on the same left / right axes as the top copy
        - native Acumin kerning only
        - lower edge follows the rendered project-meta bottom margin
    */
    const viewportWidth =
        Math.max(
            1,
            document.documentElement.clientWidth ||
            window.innerWidth ||
            aybakEndCard.clientWidth
        );

    const viewportHeight =
        Math.max(
            1,
            document.documentElement.clientHeight ||
            window.innerHeight ||
            aybakEndCard.clientHeight
        );

    const computedStyle =
        getComputedStyle(
            document.documentElement
        );

    const computedSide =
        parseFloat(
            computedStyle.getPropertyValue(
                "--side"
            )
        ) || 0;

    const computedTop =
        parseFloat(
            computedStyle.getPropertyValue(
                "--top"
            )
        ) || 0;

    const targetInkLeft =
        computedSide;

    const targetInkRight =
        viewportWidth -
        computedSide;

    const projectMetaElement =
        document.getElementById(
            "project-meta"
        );

    const projectMetaRect =
        projectMetaElement
            ? projectMetaElement.getBoundingClientRect()
            : null;

    const bottomGap =
        projectMetaRect &&
        Number.isFinite(
            projectMetaRect.bottom
        ) &&
        projectMetaRect.bottom > 0
            ? Math.max(
                0,
                viewportHeight -
                projectMetaRect.bottom
            )
            : Math.max(
                0,
                computedTop
            );

    const word =
        "AYBAK";

    const sampleSize =
        1000;

    const measureCanvas =
        document.createElement(
            "canvas"
        );

    const measureContext =
        measureCanvas.getContext(
            "2d"
        );

    measureContext.textBaseline =
        "alphabetic";

    measureContext.font =
        `600 ${sampleSize}px "acumin-pro-wide", Arial, Helvetica, sans-serif`;

    if (
        "fontKerning" in measureContext
    ) {
        measureContext.fontKerning =
            "auto";
    }

    const metrics =
        measureContext.measureText(
            word
        );

    const inkLeft =
        Number.isFinite(
            metrics.actualBoundingBoxLeft
        )
            ? metrics.actualBoundingBoxLeft
            : 0;

    const inkRight =
        Number.isFinite(
            metrics.actualBoundingBoxRight
        )
            ? metrics.actualBoundingBoxRight
            : metrics.width;

    const inkDescent =
        Number.isFinite(
            metrics.actualBoundingBoxDescent
        )
            ? metrics.actualBoundingBoxDescent
            : 0;

    const sampleInkWidth =
        Math.max(
            1,
            inkLeft +
            inkRight
        );

    const targetInkWidth =
        Math.max(
            1,
            targetInkRight -
            targetInkLeft
        );

    const fontSize =
        targetInkWidth *
        sampleSize /
        sampleInkWidth;

    const scale =
        fontSize /
        sampleSize;

    const originX =
        targetInkLeft +
        inkLeft *
        scale;

    const baselineY =
        viewportHeight -
        bottomGap -
        inkDescent *
        scale;

    const pixelRatio =
        Math.max(
            1,
            window.devicePixelRatio || 1
        );

    canvas.width =
        Math.max(
            1,
            Math.round(
                viewportWidth *
                pixelRatio
            )
        );

    canvas.height =
        Math.max(
            1,
            Math.round(
                viewportHeight *
                pixelRatio
            )
        );

    canvas.style.width =
        `${viewportWidth}px`;

    canvas.style.height =
        `${viewportHeight}px`;

    const context =
        canvas.getContext(
            "2d"
        );

    context.setTransform(
        pixelRatio,
        0,
        0,
        pixelRatio,
        0,
        0
    );

    context.clearRect(
        0,
        0,
        viewportWidth,
        viewportHeight
    );

    context.textBaseline =
        "alphabetic";

    context.fillStyle =
        "#fff";

    context.font =
        `600 ${fontSize}px "acumin-pro-wide", Arial, Helvetica, sans-serif`;

    if (
        "fontKerning" in context
    ) {
        context.fontKerning =
            "auto";
    }

    context.fillText(
        word,
        originX,
        baselineY
    );

}

function setAybakEndCard(
    active
) {

    const nextActive =
        Boolean(
            active
        );

    if (
        nextActive ===
        aybakEndCardActive
    ) {
        return;
    }

    if (
        nextActive
    ) {

        clearDesktopProjectAdvance();


        /*
            AYBAK is always the inverse of the surface beneath it:
            dark surface -> white AYBAK page / black copy
            light surface -> black AYBAK page / white copy
        */
        /* AYBAK is the only black surface and never inherits project theme. */
        aybakEndCardLight =
            false;


        body.classList.toggle(
            "aybak-end-card-light",
            aybakEndCardLight
        );


        document.documentElement.classList.toggle(
            "aybak-end-card-light",
            aybakEndCardLight
        );


        aybakResumeVideo =
            !video.paused &&
            !indexMode &&
            !projectAllMode;


        video.pause();

    }

    aybakEndCardActive =
        nextActive;

    body.classList.toggle(
        "aybak-end-card-active",
        aybakEndCardActive
    );

    document.documentElement.classList.toggle(
        "aybak-end-card-active",
        aybakEndCardActive
    );

    aybakEndCard.setAttribute(
        "aria-hidden",
        aybakEndCardActive
            ? "false"
            : "true"
    );

    if (
        aybakEndCardActive
    ) {
        requestAnimationFrame(
            fitAybakEndCardWord
        );
    }
    else if (
        aybakResumeVideo &&
        !indexMode &&
        !projectAllMode
    ) {
        video
            .play()
            .catch(
                () => {}
            );
    }

    aybakWheelAccumulator =
        0;

}


window.addEventListener(
    "wheel",
    event => {

        if (
            Math.abs(
                event.deltaY
            ) <=
            Math.abs(
                event.deltaX
            )
        ) {
            return;
        }

        if (
            !aybakEndCardActive &&
            indexMode &&
            indexScroller.contains(
                event.target
            )
        ) {
            return;
        }

        event.preventDefault();

        clearTimeout(
            aybakWheelResetTimer
        );

        aybakWheelAccumulator +=
            event.deltaY;

        aybakWheelResetTimer =
            setTimeout(
                () => {
                    aybakWheelAccumulator =
                        0;
                },
                140
            );

        if (
            !aybakEndCardActive &&
            aybakWheelAccumulator >=
            AYBAK_WHEEL_THRESHOLD
        ) {
            setAybakEndCard(
                true
            );
            return;
        }

        if (
            aybakEndCardActive &&
            aybakWheelAccumulator <=
            -AYBAK_WHEEL_THRESHOLD
        ) {
            setAybakEndCard(
                false
            );
        }

    },
    {
        passive: false
    }
);


window.addEventListener(
    "touchstart",
    event => {

        if (
            !event.changedTouches.length
        ) {
            return;
        }

        const touch =
            event.changedTouches[0];

        aybakTouchStartX =
            touch.clientX;

        aybakTouchStartY =
            touch.clientY;

        aybakTouchStartedInIndexScroller =
            Boolean(
                indexMode &&
                indexScroller.contains(
                    event.target
                )
            );

    },
    {
        passive: true
    }
);


window.addEventListener(
    "touchend",
    event => {

        if (
            aybakTouchStartX === null ||
            aybakTouchStartY === null ||
            !event.changedTouches.length
        ) {
            return;
        }

        const touch =
            event.changedTouches[0];

        const deltaX =
            touch.clientX -
            aybakTouchStartX;

        const deltaY =
            touch.clientY -
            aybakTouchStartY;

        aybakTouchStartX =
            null;

        aybakTouchStartY =
            null;

        if (
            Math.abs(
                deltaY
            ) <=
            Math.abs(
                deltaX
            ) ||
            Math.abs(
                deltaY
            ) <
            AYBAK_SWIPE_THRESHOLD
        ) {
            return;
        }

        if (
            !aybakEndCardActive &&
            indexMode &&
            aybakTouchStartedInIndexScroller
        ) {
            aybakTouchStartedInIndexScroller =
                false;
            return;
        }

        aybakTouchStartedInIndexScroller =
            false;

        if (
            !aybakEndCardActive &&
            deltaY < 0
        ) {
            setAybakEndCard(
                true
            );
            return;
        }

        if (
            aybakEndCardActive &&
            deltaY > 0
        ) {
            setAybakEndCard(
                false
            );
        }

    },
    {
        passive: true
    }
);


aybakEndCard.addEventListener(
    "click",
    event => {
        event.stopPropagation();
    }
);


window.addEventListener(
    "resize",
    () => {
        updateResponsiveBodyClasses();
        fitAybakEndCardWord();
        if (

        ) {
            requestAnimationFrame(
                layoutTypographicIndex

    }

window.addEventListener(

                fitAybakEndCardWord();
                if (
                    indexMode
                ) {
                    layoutTypographicIndex();
                }
            },
            80
        );
    }
);


if (
    document.fonts &&
    document.fonts.ready
) {
    document.fonts.ready.then(
        fitAybakEndCardWord
    );
}

/*
    First opened project is light.
    The project theme flips ONLY when the project changes,
    never when another film inside the same project is shown.
*/
let projectThemeDark =
    false;

let themedProjectIndex =
    null;

let surfaceThemeDark =
    false;


function setSurfaceTheme(
    dark
) {

    /* Main Film surface is permanently white. */
    surfaceThemeDark =
        false;


    body.classList.toggle(
        "surface-dark",
        surfaceThemeDark
    );


    document.documentElement.classList.toggle(
        "surface-dark",
        surfaceThemeDark
    );

}


function isCurrentSurfaceDark() {

    return surfaceThemeDark;

}


function syncProjectThemeForCurrentProject() {

    if (
        themedProjectIndex ===
        null
    ) {

        /* First opened project: white background / black copy. */
        themedProjectIndex =
            currentProjectIndex;


        projectThemeDark =
            false;

    }

    else if (
        themedProjectIndex !==
        currentProjectIndex
    ) {

        projectThemeDark =
            !projectThemeDark;


        themedProjectIndex =
            currentProjectIndex;

    }


    /*
        While INDEX is visible it owns the surface theme.
        loadCurrentVideo() may run behind INDEX before opening a project.
    */
    if (
        !indexMode
    ) {

        setSurfaceTheme(
            projectThemeDark
        );

    }

}


function forceProjectThemeOppositeIndex() {

    /*
        A project opened from INDEX always takes the inverse of the
        currently visible INDEX surface.
    */
    projectThemeDark =
        !surfaceThemeDark;


    themedProjectIndex =
        currentProjectIndex;

}

    Opening a project from INDEX or selecting a video from VIEW ALL

    finishes, normal max-2 rotation resumes.
*/

/*
    The main slide is poster-first as well.

    Mobile Safari / Chrome can take a noticeable moment before MP4
    metadata exposes videoWidth/videoHeight. The JPG poster already
    contains that information, so we use its ratio to size the slide
    immediately instead of leaving a white hole while the movie starts.
*/
let currentPosterRatio =

/*
    One tiny navigation warmup for slide mode.

    We only retain one next-video preload element at a time;
    there is no global video cache that could explode mobile
    memory usage.
*/

let nextVideoWarmup =
    null;


function clearNextVideoWarmup() {

    if (
        !nextVideoWarmup
    ) {

        return;

    }


    nextVideoWarmup.removeAttribute(
        "src"
    );


    nextVideoWarmup.load();


    nextVideoWarmup =
        null;

}


function getNextFilename() {

    if (
        !projects.length
    ) {

        return null;

    }


    const project =
        currentProject();


    if (
        currentVideoIndex <
        project.videos.length - 1
    ) {

        return project.videos[
            currentVideoIndex + 1
        ];

    }


    const nextProjectIndex =
        normalizeProjectIndex(
            currentProjectIndex + 1
        );


    return projects[
        nextProjectIndex
    ].videos[0];

}


function warmNextSlideVideo() {

    clearNextVideoWarmup();


    const filename =
        getNextFilename();


    if (
        !filename
    ) {

        return;

    }


    const warmup =
        document.createElement(
            "video"
        );


    warmup.muted =
        true;


    warmup.preload =
        isPhoneLayout()
            ? "metadata"
            : "auto";


    warmup.src =
        videoUrl(
            filename
        );


    warmup.load();


    nextVideoWarmup =
        warmup;

}

function isPhonePortrait() {

    return (
        window.innerWidth <= 600 &&
        window.innerHeight >=
        window.innerWidth
    );

}


function isPhoneLandscape() {

    return (
        window.innerHeight <= 650 &&
        window.innerWidth >
        window.innerHeight &&
        window.innerWidth <= 1000
    );

}

    return (
        isPhonePortrait() ||
        isPhoneLandscape()

/* =====================================================
   PROJECT + VIDEO DEEP LINKS
   ===================================================== */

/*
    Stable URL structure:

        ?project=vogue-260113&video=2

    IMPORTANT:
    "video=2" refers to the video's ORIGINAL position in
    films.json, not its runtime position after random cover
    rotation.

    Example JSON order:
        1, 2, 3, 4

    Random runtime order:
        3, 4, 1, 2

    Deep link:
        video=2

    still opens the ORIGINAL second video.

    This keeps PDF / external links permanent even though
    the site's opening video changes randomly.
*/

function getDeepLinkRequest() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const projectId =
        params.get(
            "project"
        );


    const rawVideo =
        params.get(
            "video"
        );


    let videoNumber =
        null;


    if (
        rawVideo !==
        null
    ) {

        const parsed =
            Number.parseInt(
                rawVideo,
                10
            );


        if (
            Number.isFinite(
                parsed
            ) &&
            parsed >= 1
        ) {

            videoNumber =
                parsed;

        }

    }


    return {
        projectId,
        videoNumber
    };

}


function getProjectIdFromUrl() {

    return getDeepLinkRequest()
        .projectId;

}


function findProjectIndexById(
    projectId
) {

    if (
        !projectId
    ) {

        return -1;

    }


    return projects.findIndex(
        project =>
            project.id ===
            projectId
    );

}


function getOriginalVideos(
    project
) {

    if (
        !project
    ) {

        return [];

    }


    return Array.isArray(
        project.originalVideos
    )
        ? project.originalVideos
        : project.videos;

}


function getOriginalVideoNumber(
    project,
    runtimeVideoIndex =
        currentVideoIndex
) {

    if (
        !project ||
        !project.videos.length
    ) {

        return 1;

    }


    const filename =
        project.videos[
            runtimeVideoIndex
        ];


    const originalVideos =
        getOriginalVideos(
            project
        );


    const originalIndex =
        originalVideos.indexOf(
            filename
        );


    return originalIndex >= 0
        ? originalIndex + 1
        : 1;

}


function getRuntimeVideoIndexFromOriginalNumber(
    project,
    videoNumber
) {

    if (
        !project ||
        !Number.isFinite(
            videoNumber
        )
    ) {

        return -1;

    }


    const originalVideos =
        getOriginalVideos(
            project
        );


    const originalIndex =
        videoNumber - 1;


    if (
        originalIndex < 0 ||
        originalIndex >=
            originalVideos.length
    ) {

        return -1;

    }


    const filename =
        originalVideos[
            originalIndex
        ];


    return project.videos.indexOf(
        filename
    );

}

/* =====================================================
   RANDOM PROJECT START / COVER
   ===================================================== */

/*
    Film follows the same logic as Photography:

    We do NOT fully shuffle a project's videos.

    We choose one starting video and ROTATE the existing
    sequence around it.

    Example:
        1, 2, 3, 4

    random start = 3

        3, 4, 1, 2

    This preserves the relationship between neighbouring
    edits while removing the need to manually choose a
    cover / opening video.

    Optional JSON override:

        "coverOverride": "filename.mp4"

    When present, that video always becomes the first video
    of that project and therefore the moving INDEX cover.
*/

function rotateVideosFromIndex(
    videos,
    startIndex
) {

    if (
        videos.length <= 1 ||
        startIndex <= 0
    ) {

        return videos.slice();

    }


    return [
        ...videos.slice(
            startIndex
        ),
        ...videos.slice(
            0,
            startIndex
        )
    ];

}


function prepareProject(
    project
) {

    /*
        Normalize NU–LOOK typography everywhere.
    */
    project = {
        ...project,
        title:
            String(
                project.title || ""
            ).replace(
                /nu-look/gi,
                "nu–look"
            )
    };


    const originalVideos =
        project.videos.slice();


    let startIndex =
        0;


    if (
        project.coverOverride
    ) {

        const overrideIndex =
            originalVideos.indexOf(
                project.coverOverride
            );


        if (
            overrideIndex >= 0
        ) {

            startIndex =
                overrideIndex;

        }

        else {

            console.warn(
                `coverOverride "${project.coverOverride}" was not found in`,
                project.title
            );


            startIndex =
                Math.floor(
                    Math.random() *
                    originalVideos.length
                );

        }

    }

    else {

        startIndex =
            Math.floor(
                Math.random() *
                originalVideos.length
            );

    }


    return {
        ...project,

        /*
            Keep an immutable copy of films.json order for
            permanent deep-link numbering.
        */
        originalVideos:
            originalVideos.slice(),

        videos:
            rotateVideosFromIndex(
                originalVideos,
                startIndex
            )
    };

}

/* =====================================================
   TYPOGRAPHY
   ===================================================== */

function renderInteractiveTypography(
    element,
    text,
    activePositions =
        new Set()
) {

    const fragment =
        document.createDocumentFragment();


    Array.from(
        String(
            text
        )
    ).forEach(
        (
            character,
            index
        ) => {

            const span =
                document.createElement(
                    "span"
                );


            span.textContent =
                character;


            const isDigit =
                /[0-9]/.test(
                    character
                );


            const isActiveDigit =
                isDigit &&
                activePositions.has(
                    index
                );


            /*
                Keep Helvetica/Arial throughout.
                Active digits only gain spacing; no font swap.
            */
            if (
                isActiveDigit
            ) {

                span.style.letterSpacing =
                    "var(--active-number-tracking)";

            }


            fragment.appendChild(
                span
            );

        }
    );


    element.replaceChildren(
        fragment
    );

}


function renderBaseTypography(
    element,
    text
) {

    renderInteractiveTypography(
        element,
        text,
        new Set()
    );

}


function getMorphPositions(
    text
) {

    return Array.from(
        String(
            text
        )
    )
        .map(
            (
                character,
                index
            ) => {

                const isLetter =
                    character.toLowerCase() !==
                    character.toUpperCase();


                const isDigit =
                    /[0-9]/.test(
                        character
                    );


                return (
                    isLetter ||
                    isDigit
                )
                    ? index
                    : -1;

            }
        )
        .filter(
            index =>
                index >= 0
        );

}


function renderCaseFromActivePositions(
    baseText,
    activePositions
) {

    return String(
        baseText
    )
        .split(
            ""
        )
        .map(
            (
                character,
                index
            ) => {

                const isLetter =
                    character.toLowerCase() !==
                    character.toUpperCase();


                return (
                    isLetter &&
                    activePositions.has(
                        index
                    )
                )
                    ? character.toUpperCase()
                    : character.toLowerCase();

            }
        )
        .join(
            ""
        );

}


/* =====================================================
   LETTER HELPERS
   ===================================================== */

function getLetterPositions(
    text
) {

    const positions =
        [];


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const character =
            text[i];


        if (
            character.toLowerCase() !==
            character.toUpperCase()
        ) {

            positions.push(
                i
            );

        }

    }


    return positions;

}


function renderPrefixCase(
    baseText,
    upperCount
) {

    const positions =
        getLetterPositions(
            baseText
        );


    const uppercasePositions =
        new Set(
            positions.slice(
                0,
                upperCount
            )
        );


    return baseText
        .split("")
        .map(
            (
                character,
                index
            ) => {

                return uppercasePositions
                    .has(
                        index
                    )
                        ? character
                            .toUpperCase()
                        : character
                            .toLowerCase();

            }
        )
        .join("");

}


function currentUpperPrefixCount(
    element,
    baseText
) {

    const positions =
        getLetterPositions(
            baseText
        );


    const current =
        element.textContent;


    let count =
        0;


    for (
        const position
        of positions
    ) {

        const character =
            current[
                position
            ];


        if (
            character &&
            character ===
                character.toUpperCase() &&
            character !==
                character.toLowerCase()
        ) {

            count++;

        }

        else {

            break;

        }

    }


    return count;

}


/* =====================================================
   CASE ANIMATION
   ===================================================== */

function animateCase(
    element,
    baseText,
    toUpper,
    duration =
        CASE_DURATION
) {

    const base =
        String(
            baseText
        ).toLowerCase();


    const positions =
        getMorphPositions(
            base
        );


    const total =
        positions.length;


    let initial =
        0;


    const children =
        Array.from(
            element.children
        );


    if (
        children.length ===
        base.length
    ) {

        for (
            let i = 0;
            i < positions.length;
            i++
        ) {

            const position =
                positions[i];


            const character =
                base[
                    position
                ];


            const span =
                children[
                    position
                ];


            const isDigit =
                /[0-9]/.test(
                    character
                );


            const isLetter =
                character.toLowerCase() !==
                character.toUpperCase();


            const active =
                isDigit
                    ? (
                        span &&
                        !!span.style.letterSpacing
                    )
                    : (
                        isLetter &&
                        span &&
                        span.textContent ===
                            character.toUpperCase()
                    );


            if (
                active
            ) {

                initial++;

            }

            else {

                break;

            }

        }

    }

    else {

        const currentText =
            element.textContent;


        for (
            let i = 0;
            i < positions.length;
            i++
        ) {

            const position =
                positions[i];


            const character =
                base[
                    position
                ];


            const isLetter =
                character.toLowerCase() !==
                character.toUpperCase();


            if (
                isLetter &&
                currentText[
                    position
                ] ===
                    character.toUpperCase()
            ) {

                initial++;

            }

            else {

                break;

            }

        }

    }


    const target =
        toUpper
            ? total
            : 0;


    function renderState(
        state
    ) {

        const activePositions =
            new Set(
                positions.slice(
                    0,
                    state
                )
            );


        renderInteractiveTypography(
            element,
            renderCaseFromActivePositions(
                base,
                activePositions
            ),
            activePositions
        );

    }


    if (
        initial ===
        target
    ) {

        renderState(
            target
        );


        return Promise.resolve();

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const state =
                    Math.round(
                        initial +
                        (
                            target -
                            initial
                        ) *
                        progress
                    );


                renderState(
                    state
                );


                if (
                    progress <
                    1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    renderState(
                        target
                    );


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}


/* =====================================================
   SEQUENTIAL MORPH
   ===================================================== */

function morphSequential(
    element,
    nextText,
    duration =
        TEXT_MORPH_DURATION
) {

    const oldText =
        element.dataset.rawText !==
        undefined
            ? element.dataset.rawText
            : element.textContent;


    if (
        oldText ===
        nextText
    ) {

        renderBaseTypography(
            element,
            nextText
        );


        element.dataset.rawText =
            nextText;


        return Promise.resolve();

    }


    const length =
        Math.max(
            oldText.length,
            nextText.length
        );


    const from =
        oldText
            .padEnd(
                length,
                " "
            )
            .split("");


    const to =
        nextText
            .padEnd(
                length,
                " "
            )
            .split("");


    const changed =
        [];


    for (
        let i = 0;
        i < length;
        i++
    ) {

        if (
            from[i] !==
            to[i]
        ) {

            changed.push(
                i
            );

        }

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const completed =
                    Math.floor(
                        progress *
                        (
                            changed.length +
                            1
                        )
                    );


                const current =
                    from.slice();


                for (
                    let i = 0;
                    i < completed;
                    i++
                ) {

                    const position =
                        changed[
                            i
                        ];


                    if (
                        position !==
                        undefined
                    ) {

                        current[
                            position
                        ] =
                            to[
                                position
                            ];

                    }

                }


                renderBaseTypography(
                    element,
                    current
                        .join("")
                        .trimEnd()
                );


                if (
                    progress <
                    1
                ) {

function animateLogoTo(
    target
) {

    return new Promise(
        resolve => {

            logoTarget =
                target;


            if (
                logoTimer !==
                null
            ) {

                clearTimeout(
                    logoTimer
                );

            }


            function step() {

                if (
                    logoState ===
                    logoTarget
                ) {

                    logoTimer =
                        null;

                    resolve();

                    return;

                }


                setLogoState(
                    logoState <
                    logoTarget
                        ? logoState + 1
                        : logoState - 1
                );


                logoTimer =
                    setTimeout(
                        step,
                        LOGO_STEP_DURATION
                    );

            }


            step();

        }
    );

}
