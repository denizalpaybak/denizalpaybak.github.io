/* =====================================================
   LANDSCAPE CONTENT AREA
   ===================================================== */

/*
    Landscape is treated as a genuine two-zone layout:

    left  = identity/contact
    right = film / index / view-all

    This removes every overlap visible in the supplied
    landscape screenshots.
*/

function getPhoneLandscapeArea() {

    /*
        Photography landscape reference:

        The media field lives BETWEEN the real contact block
        and the photography switch. This puts the artwork
        visually farther right than the old full-viewport
        centering while preserving the left identity block.
    */

    const infoRect =
        info.getBoundingClientRect();


    const switchRect =
        sectionSwitch.getBoundingClientRect();


    const indexRect =
        indexButton.getBoundingClientRect();


    const left =
        Math.max(
            24,
            infoRect.right + 24
        );


    const right =
        Math.min(
            window.innerWidth - 24,
            switchRect.left - 24
        );


    const top =
        14;


    const bottom =
        Math.min(
            window.innerHeight - 12,
            indexRect.top - 16
        );


    return {

        left,

        right,

        top,

        bottom,

        width:
            Math.max(
                1,
                right - left
            ),

        height:
            Math.max(
                1,
                bottom - top
            )

    };

}


/* =====================================================
   INDEX / SOUND EXACT ALIGNMENT
   ===================================================== */

/*
    INDEX must share the exact visual center of SOUND ON/OFF.

    Measuring the SOUND button itself is more reliable than deriving
    the center from #video-block: the block can shift/resize across
    desktop, laptop, portrait and landscape responsive geometries.
*/
function syncIndexToSoundCenter() {

    requestAnimationFrame(
        () => {

            const rect =
                soundButton.getBoundingClientRect();


            if (
                !rect.width
            ) {

                return;

            }


            const centerX =
                rect.left +
                rect.width / 2;


            document
                .documentElement
                .style
                .setProperty(
                    "--index-center-x",
                    `${centerX}px`
                );

        }
    );

}


/* =====================================================
   FIT MAIN VIDEO
   ===================================================== */

function fitMainVideo() {

    const ratio =
        (
            video.videoWidth &&
            video.videoHeight
        )
            ? video.videoWidth /
                video.videoHeight
            : currentPosterRatio;


    if (
        !ratio ||
        !Number.isFinite(
            ratio
        )
    ) {

        return;

    }


    const rootStyle =
        getComputedStyle(
            document.documentElement
        );


    const vw =
        window.innerWidth;


    const vh =
        window.innerHeight;


    const side =
        parseFloat(
            rootStyle.getPropertyValue(
                "--side"
            )
        ) || 48;


    const fontSize =
        parseFloat(
            rootStyle.getPropertyValue(
                "--font-size"
            )
        ) || 15;


    const lineHeight =
        parseFloat(
            rootStyle.getPropertyValue(
                "--line-height"
            )
        ) || 1.15;


    const lineGap =
        fontSize *
        lineHeight;


    const logoRect =
        logo.getBoundingClientRect();


    const metaRect =
        projectMeta.getBoundingClientRect();


    const controlsHeight =
        Math.max(
            controls.getBoundingClientRect().height,
            lineGap
        );


    /*
        The MEDIA itself — not the video+controls group — is centered
        vertically on the viewport.

        The only hard relationships are:
        - video stays clear of the top identity
        - controls sit exactly one line below the video
        - controls never collide with the fixed lower metadata
    */
    const centerY =
        vh / 2;


    const topBoundary =
        logoRect.bottom +
        lineGap;


    const videoBottomLimit =
        metaRect.top -
        lineGap -
        controlsHeight -
        lineGap;


    const topHalfRoom =
        Math.max(
            20,
            centerY -
            topBoundary
        );


    const bottomHalfRoom =
        Math.max(
            20,
            videoBottomLimit -
            centerY
        );


    const maxCenteredHeight =
        Math.max(
            40,
            2 *
            Math.min(
                topHalfRoom,
                bottomHalfRoom
            )
        );


    const maxMediaWidth =
        isPhoneLayout()
            ? Math.max(
                80,
                vw -
                side * 2
            )
            : Math.max(
                120,
                Math.min(
                    vw * 0.76,
                    vw -
                    side * 2
                )
            );


    let mediaWidth =
        maxMediaWidth;


    let mediaHeight =
        mediaWidth /
        ratio;


    if (
        mediaHeight >
        maxCenteredHeight
    ) {

        mediaHeight =
            maxCenteredHeight;


        mediaWidth =
            mediaHeight *
            ratio;

    }


    if (
        mediaWidth >
        maxMediaWidth
    ) {

        mediaWidth =
            maxMediaWidth;


        mediaHeight =
            mediaWidth /
            ratio;

    }


    videoBlock.style.height =
        "";


    videoBlock.style.width =
        `${mediaWidth}px`;


    mediaHolder.style.position =
        "";


    mediaHolder.style.left =
        "";


    mediaHolder.style.right =
        "";


    mediaHolder.style.top =
        "";


    mediaHolder.style.bottom =
        "";


    mediaHolder.style.width =
        `${mediaWidth}px`;


    mediaHolder.style.height =
        `${mediaHeight}px`;


    video.style.width =
        `${mediaWidth}px`;


    video.style.height =
        `${mediaHeight}px`;


    controls.style.width =
        `${mediaWidth}px`;


    /*
        Exact viewport centering of the VIDEO.
        #video-block starts at the video's top edge; controls follow
        normally underneath it.
    */
    videoBlock.style.left =
        "50%";


    videoBlock.style.top =
        `${Math.round(
            centerY -
            mediaHeight / 2
        )}px`;


    videoBlock.style.transform =
        "translateX(-50%)";


    requestAnimationFrame(
        syncIndexToSoundCenter
    );

}

/* =====================================================
   LOAD MAIN VIDEO
   ===================================================== */


function syncMainVideoLoopMode() {

    /*
        Slide view always loops the currently shown film.
        View All / Index do not need the main player to loop.
    */
    video.loop =
        !projectAllMode &&
        !indexMode;

}


async function loadCurrentVideo(
    autoplay =
        true
) {

    const filename =
        currentFilename();


    if (
        !filename
    ) {

        return;

    }


    syncProjectThemeForCurrentProject();


    syncMainVideoLoopMode();


    video.pause();


    /*
        Put the poster on screen BEFORE asking the browser to decode
        the master MP4. This guarantees a real visual fallback on
        slow mobile connections instead of a blank white stage.
    */
    const posterUrl =
        posterVideoUrl(
            filename
        );


    const posterToken =
        ++currentPosterRequestToken;


    currentPosterRatio =
        null;


    video.poster =
        posterUrl;


    const posterImage =
        new Image();


    posterImage.decoding =
        "async";


    posterImage.addEventListener(
        "load",
        () => {

            if (
                posterToken !==
                currentPosterRequestToken
            ) {

                return;

            }


            if (
                posterImage.naturalWidth &&
                posterImage.naturalHeight
            ) {

                currentPosterRatio =
                    posterImage.naturalWidth /
                    posterImage.naturalHeight;


                fitMainVideo();

            }

        },
        {
            once: true
        }
    );


    posterImage.src =
        posterUrl;


    video.src =
        videoUrl(
            filename
        );


    video.load();


    video.muted =
        !soundEnabled;


    await updateMetadata(
        currentProjectIndex,
        currentVideoIndex
    );


    const fit =
        () => {

            fitMainVideo();

        };


    if (
        video.readyState >=
        1
    ) {

        fit();

    }

    else {

        video.addEventListener(
            "loadedmetadata",
            fit,
            {
                once: true
            }
        );

    }


    if (
        autoplay
    ) {

        const play =
            () => {

                video
                    .play()
                    .catch(
                        () => {}
                    );


                /*
                    Wait until the important current movie is
                    already playable before spending bandwidth
                    on the next slide.
                */

                if (
                    "requestIdleCallback" in window
                ) {

                    requestIdleCallback(
                        warmNextSlideVideo,
                        {
                            timeout:
                                1200
                        }
                    );

                }

                else {

                    setTimeout(
                        warmNextSlideVideo,
                        450
                    );

                }

            };


        if (
            video.readyState >=
            2
        ) {

            play();

        }

        else {

            video.addEventListener(
                "canplay",
                play,
                {
                    once: true
                }
            );

        }

    }

}


/* =====================================================
   NORMAL MAX-2 PROJECT ROTATION
   ===================================================== */

function ensureSeenNormalVideos() {

    if (
        seenNormalVideos.length !==
        projects.length
    ) {

        seenNormalVideos =
            projects.map(
                project =>
                    new Set()
            );

    }

}


function buildNormalProjectSequence(
    projectIndex,
    {
        includeVideo =
            null
    } = {}
) {

    ensureSeenNormalVideos();


    const normalized =
        normalizeProjectIndex(
            projectIndex
        );


    const project =
        projects[
            normalized
        ];


    const total =
        project.videos.length;


    const limit =
        Math.min(
            NORMAL_PROJECT_VIDEO_LIMIT,
            total
        );


    const seen =
        seenNormalVideos[
            normalized
        ];


    const unseen =
        [];


    const alreadySeen =
        [];


    for (
        let i = 0;
        i < total;
        i++
    ) {

        if (
            seen.has(
                i
            )
        ) {

            alreadySeen.push(
                i
            );

        }

        else {

            unseen.push(
                i
            );

        }

    }


    function shuffled(
        values
    ) {

        const copy =
            values.slice();


        for (
            let i =
                copy.length - 1;
            i > 0;
            i--
        ) {

            const j =
                Math.floor(
                    Math.random() *
                    (
                        i + 1
                    )
                );


            [
                copy[i],
                copy[j]
            ] =
                [
                    copy[j],
                    copy[i]
                ];

        }


        return copy;

    }


    let selected =
        [];


    if (
        includeVideo !==
            null &&
        includeVideo >= 0 &&
        includeVideo < total
    ) {

        selected.push(
            includeVideo
        );

    }


    const unseenPool =
        shuffled(
            unseen.filter(
                index =>
                    !selected.includes(
                        index
                    )
            )
        );


    while (
        selected.length <
            limit &&
        unseenPool.length
    ) {

        selected.push(
            unseenPool.shift()
        );

    }


    const seenPool =
        shuffled(
            alreadySeen.filter(
                index =>
                    !selected.includes(
                        index
                    )
            )
        );


    while (
        selected.length <
            limit &&
        seenPool.length
    ) {

        selected.push(
            seenPool.shift()
        );

    }


    if (
        selected.length <
        limit
    ) {

        const anyPool =
            shuffled(
                Array.from(
                    {
                        length:
                            total
                    },
                    (
                        _,
                        index
                    ) =>
                        index
                ).filter(
                    index =>
                        !selected.includes(
                            index
                        )
                )
            );


        while (
            selected.length <
                limit &&
            anyPool.length
        ) {

            selected.push(
                anyPool.shift()
            );

        }

    }


    /*
        Selection is random; playback order is not.
        Example: chosen 05 + 02 -> shown 02 + 05.
    */
    selected.sort(
        (
            a,
            b
        ) =>
            a - b
    );


    normalSequenceProjectIndex =
        normalized;


    normalSequenceVideos =
        selected;


    normalSequencePosition =
        includeVideo !== null
            ? normalSequenceVideos.indexOf(
                includeVideo
            )
            : -1;

}


function markNormalVideoSeen(
    projectIndex,
    videoIndex
) {

    ensureSeenNormalVideos();


    seenNormalVideos[
        normalizeProjectIndex(
            projectIndex
        )
    ].add(
        videoIndex
    );

}


/* =====================================================
   NEXT / PREVIOUS
   ===================================================== */

function nextFilm() {

    if (
        projectAllMode ||
        indexMode ||
        !projects.length
    ) {

        return;

    }


    /*
        INDEX / VIEW ALL opens a full-project run.
        Keep walking that project's remaining videos in order.
    */
    if (
        fullProjectMode
    ) {

        const project =
            currentProject();


        if (
            currentVideoIndex <
            fullProjectEndIndex
        ) {

            currentVideoIndex++;

        }

        else {

            fullProjectMode =
                false;


            fullProjectEndIndex =
                null;


            currentProjectIndex =
                normalizeProjectIndex(
                    currentProjectIndex + 1
                );


            buildNormalProjectSequence(
                currentProjectIndex
            );


            normalSequencePosition =
                0;


            currentVideoIndex =
                normalSequenceVideos[0];


            markNormalVideoSeen(
                currentProjectIndex,
                currentVideoIndex
            );

        }

    }

    else {

        if (
            normalSequenceProjectIndex !==
                currentProjectIndex ||
            !normalSequenceVideos.length ||
            normalSequencePosition < 0
        ) {

            buildNormalProjectSequence(
                currentProjectIndex,
                {
                    includeVideo:
                        currentVideoIndex
                }
            );

        }


        if (
            normalSequencePosition <
            normalSequenceVideos.length - 1
        ) {

            normalSequencePosition++;


            currentVideoIndex =
                normalSequenceVideos[
                    normalSequencePosition
                ];


            markNormalVideoSeen(
                currentProjectIndex,
                currentVideoIndex
            );

        }

        else {

            currentProjectIndex =
                normalizeProjectIndex(
                    currentProjectIndex + 1
                );


            buildNormalProjectSequence(
                currentProjectIndex
            );


            normalSequencePosition =
                0;


            currentVideoIndex =
                normalSequenceVideos[0];


            markNormalVideoSeen(
                currentProjectIndex,
                currentVideoIndex
            );

        }

    }


    syncProjectThemeForCurrentProject();


    syncProjectUrl(
        "push"
    );


    loadCurrentVideo(
        true
    );

}


function previousFilm() {

    if (
        projectAllMode ||
        indexMode ||
        !projects.length
    ) {

        return;

    }


    if (
        fullProjectMode
    ) {

        if (
            currentVideoIndex >
            0
        ) {

            currentVideoIndex--;

        }

        else {

            fullProjectMode =
                false;


            fullProjectEndIndex =
                null;


            currentProjectIndex =
                normalizeProjectIndex(
                    currentProjectIndex - 1
                );


            buildNormalProjectSequence(
                currentProjectIndex
            );


            normalSequencePosition =
                0;


            currentVideoIndex =
                normalSequenceVideos[0];


            markNormalVideoSeen(
                currentProjectIndex,
                currentVideoIndex
            );

        }

    }

    else {

        currentProjectIndex =
            normalizeProjectIndex(
                currentProjectIndex - 1
            );


        buildNormalProjectSequence(
            currentProjectIndex
        );


        normalSequencePosition =
            0;


        currentVideoIndex =
            normalSequenceVideos[0];


        markNormalVideoSeen(
            currentProjectIndex,
            currentVideoIndex
        );

    }


    syncProjectThemeForCurrentProject();


    syncProjectUrl(
        "push"
    );


    loadCurrentVideo(
        true
    );

}

/* =====================================================
   PREVIEW VIDEO
   ===================================================== */

function createPreviewVideo(
    filename,
    {
        eagerMetadata =
            false
    } = {}
) {

    const preview =
        document.createElement(
            "video"
        );


    preview.dataset.masterSrc =
        videoUrl(
            filename
        );


    preview.dataset.src =
        previewVideoUrl(
            filename
        );


    /*
        Poster-first loading:

        The JPG appears immediately, before MP4 metadata or
        decoded video frames are ready. The browser keeps the
        poster visible until the preview has a drawable frame.
    */

    preview.poster =
        posterVideoUrl(
            filename
        );


    preview.dataset.usingFallback =
        "0";


    preview.muted =
        true;


    preview.defaultMuted =
        true;


    preview.playsInline =
        true;


    /*
        The files in /film-previews/ are already six-second
        web previews, so native loop is both simpler and
        smoother than seeking currentTime back to zero from
        a timeupdate handler.
    */

    preview.loop =
        true;


    preview.preload =
        eagerMetadata
            ? "metadata"
            : "none";


    preview.disablePictureInPicture =
        true;


    preview.setAttribute(
        "aria-hidden",
        "true"
    );


    /*
        Safety fallback:

        If one preview was accidentally not uploaded or was
        named differently, that one tile can still fall back
        to the original master instead of remaining blank.

        This should normally never run.
    */

    preview.addEventListener(
        "error",
        () => {

            if (
                preview.dataset.usingFallback ===
                "1"
            ) {

                return;

            }


            preview.dataset.usingFallback =
                "1";


            preview.dataset.src =
                preview.dataset.masterSrc;


            preview.dataset.previewReady =
                "0";


            preview.dataset.previewQueued =
                "0";


            preview.removeAttribute(
                "src"
            );


            preview.load();


            if (
                preview.dataset.previewWanted ===
                "1"
            ) {

                activatePreview(
                    preview
                );

            }

        }
    );


    if (
        eagerMetadata
    ) {

        preview.src =
            preview.dataset.src;


        preview.load();

    }


    return preview;

}


/* =====================================================
   POSTER PRELOAD
   ===================================================== */

const posterWarmCache =
    new Set();


function warmPoster(
    filename
) {

    const url =
        posterVideoUrl(
            filename
        );


    if (
        posterWarmCache.has(
            url
        )
    ) {

        return;

    }


    posterWarmCache.add(
        url
    );


    const image =
        new Image();


    image.decoding =
        "async";


    image.src =
        url;

}


function warmVisibleIndexPosters() {

    if (
        !projects.length
    ) {

        return;

    }


    const visibleCount =
        isPhoneLayout()
            ? 4
            : 7;


    getChronologicalProjects()
        .slice(
            0,
            visibleCount
        )
        .forEach(
            ({ project }) => {

                warmPoster(
                    project.videos[0]
                );

            }
        );

}


/* =====================================================
   PREVIEW ACTIVATION MANAGER
   ===================================================== */

/*
    The old site could ask many full-resolution MP4 files
    to initialise at the same moment.

    That is particularly expensive on mobile Safari:
    network range requests, metadata parsing and video
    decoder startup all compete with each other.

    We now limit only the EXPENSIVE INITIALISATION step.

    Once a preview is ready it can keep playing, but new
    previews enter through a small queue.
*/

const PREVIEW_INIT_CONCURRENCY =
    isPhoneLayout()
        ? 3
        : 6;


let previewInitActive =
    0;


const previewInitQueue =
    [];


function releasePreviewInitSlot() {

    previewInitActive =
        Math.max(
            0,
            previewInitActive - 1
        );


    processPreviewInitQueue();

}


function processPreviewInitQueue() {

    while (
        previewInitActive <
            PREVIEW_INIT_CONCURRENCY &&
        previewInitQueue.length
    ) {

        const preview =
            previewInitQueue.shift();


        if (
            preview
        ) {

            preview.dataset.previewQueued =
                "0";

        }


        if (
            !preview ||
            preview.dataset.previewWanted !==
                "1"
        ) {

            continue;

        }


        if (
            preview.dataset.previewReady ===
            "1"
        ) {

            preview
                .play()
                .catch(
                    () => {}
                );


            continue;

        }


        previewInitActive++;


        let released =
            false;


        const release =
            () => {

                if (
                    released
                ) {

                    return;

                }


                released =
                    true;


                preview.dataset.previewReady =
                    "1";


                releasePreviewInitSlot();

            };


        const onReady =
            () => {

                release();


                if (
                    preview.dataset.previewWanted ===
                    "1"
                ) {

                    preview
                        .play()
                        .catch(
                            () => {}
                        );

                }

            };


        const onError =
            () => {

                release();

            };


        preview.addEventListener(
            "canplay",
            onReady,
            {
                once: true
            }
        );


        preview.addEventListener(
            "error",
            onError,
            {
                once: true
            }
        );


        if (
            !preview.getAttribute(
                "src"
            )
        ) {

            preview.src =
                preview.dataset.src;

        }


        /*
            "auto" matters here.

            On the previous mobile implementation we often
            switched an intersecting preview only to
            preload="metadata" and immediately called play().
            Some browsers then took a long time before enough
            media bytes were fetched to actually display motion.
        */

        preview.preload =
            "auto";


        preview.load();


        /*
            Avoid a blocked queue forever on an unusually slow
            / failed media request.
        */

        setTimeout(
            release,
            isPhoneLayout()
                ? 2200
                : 1600
        );

    }

}


function activatePreview(
    preview
) {

    preview.dataset.previewWanted =
        "1";


    if (
        preview.dataset.previewReady ===
        "1"
    ) {

        preview
            .play()
            .catch(
                () => {}
            );


        return;

    }


    if (
        preview.dataset.previewQueued ===
        "1"
    ) {

        return;

    }


    preview.dataset.previewQueued =
        "1";


    previewInitQueue.push(
        preview
    );


    processPreviewInitQueue();

}


function deactivatePreview(
    preview
) {

    preview.dataset.previewWanted =
        "0";


    preview.pause();

}


function activatePreviewsIn(
    container
) {

    container
        .querySelectorAll(
            "video[data-src]"
        )
        .forEach(
            activatePreview
        );

}


function stopAllPreviews() {

    document
        .querySelectorAll(
            "#index-view video, #project-all-view video"
        )
        .forEach(
            deactivatePreview
        );

}


/* =====================================================
   PREVIEW OBSERVER
   ===================================================== */

const previewObserver =
    new IntersectionObserver(
        entries => {

            entries.forEach(
                entry => {

                    const preview =
                        entry.target;


                    const allowed =
                        (
                            indexMode &&
                            indexView.contains(
                                preview
                            )
                        ) ||
                        (
                            projectAllMode &&
                            projectAllView.contains(
                                preview
                            )
                        );


                    if (
                        entry.isIntersecting &&
                        allowed
                    ) {

                        activatePreview(
                            preview
                        );

                    }

                    else {

                        deactivatePreview(
                            preview
                        );

                    }

                }
            );

        },
        {
            /*
                Wake only near-visible videos.

                Desktop gets a little more look-ahead;
                phones keep this tight to save bandwidth.
            */
            rootMargin:
                isPhoneLayout()
                    ? "80px"
                    : "260px"
        }
    );


function observePreview(
    preview
) {

    previewObserver.observe(
        preview
    );

}


/* =====================================================
   VIEW ALL BOUNDS
   ===================================================== */

function syncProjectAllBounds() {

    if (
        !projectAllMode
    ) {

        return;

    }


    const rootStyle =
        getComputedStyle(
            document.documentElement
        );


    const side =
        parseFloat(
            rootStyle.getPropertyValue(
                "--side"
            )
        ) || 48;


    const fontSize =
        parseFloat(
            rootStyle.getPropertyValue(
                "--font-size"
            )
        ) || 15;


    const lineHeight =
        parseFloat(
            rootStyle.getPropertyValue(
                "--line-height"
            )
        ) || 1.15;


    const lineGap =
        fontSize *
        lineHeight;


    const logoRect =
        logo.getBoundingClientRect();


    const metaRect =
        projectMeta.getBoundingClientRect();


    const top =
        Math.ceil(
            logoRect.bottom +
            lineGap
        );


    const bottom =
        Math.floor(
            metaRect.top -
            lineGap
        );


    projectAllView.style.left =
        `${side}px`;


    projectAllView.style.right =
        `${side}px`;


    projectAllView.style.top =
        `${top}px`;


    projectAllView.style.height =
        `${Math.max(
            80,
            bottom -
            top
        )}px`;

}

/* =====================================================
   VIEW ALL RATIOS
   ===================================================== */

function getProjectAllRatios() {

    return [
        ...projectAllGrid
            .querySelectorAll(
                "video"
            )
    ].map(
        preview => {

            const storedRatio =
                Number.parseFloat(
                    preview.dataset.ratio ||
                    ""
                );


            if (
                Number.isFinite(
                    storedRatio
                ) &&
                storedRatio > 0
            ) {

                return storedRatio;

            }


            if (
                preview.videoWidth &&
                preview.videoHeight
            ) {

                return (
                    preview.videoWidth /
                    preview.videoHeight
                );

            }


            return 16 / 9;

        }
    );

}


/* =====================================================
   SMART VIEW ALL LAYOUT
   ===================================================== */

/*
    VIEW ALL no longer uses equal-size CSS grid cells.

    Equal cells waste space when the viewport shape and the films'
    aspect ratios do not match. We therefore test both horizontal-strip
    and vertical-strip packings while preserving film order.

    A three-film project can now become either:

        [ large ]
        [ small ][ small ]

    or:

        [ large ][ small ]
                 [ small ]

    depending on which arrangement uses more of the actual View All field.

    The chosen arrangement is always the candidate with the greatest
    total visible video area for the current viewport.
*/

function getProjectAllGap() {

    return isPhoneLayout()
        ? 5
        : 7;

}


function getContiguousRowPartitions(
    count
) {

    if (
        count <= 0
    ) {

        return [];

    }


    const partitions =
        [];


    const breakCount =
        count - 1;


    const combinations =
        1 << breakCount;


    for (
        let mask = 0;
        mask < combinations;
        mask++
    ) {

        const rows =
            [];


        let start =
            0;


        for (
            let i = 0;
            i < breakCount;
            i++
        ) {

            if (
                mask &
                (1 << i)
            ) {

                rows.push(
                    [
                        start,
                        i + 1
                    ]
                );


                start =
                    i + 1;

            }

        }


        rows.push(
            [
                start,
                count
            ]
        );


        partitions.push(
            rows
        );

    }


    return partitions;

}


function calculateProjectAllRowCandidate(
    rect,
    ratios,
    partitions,
    gap
) {

    let best =
        null;


    partitions.forEach(
        rows => {

            const rowData =
                rows.map(
                    ([start, end]) => {

                        const rowRatios =
                            ratios.slice(
                                start,
                                end
                            );


                        const horizontalGaps =
                            gap *
                            Math.max(
                                0,
                                rowRatios.length - 1
                            );


                        const availableRowWidth =
                            Math.max(
                                1,
                                rect.width -
                                horizontalGaps
                            );


                        const ratioSum =
                            rowRatios.reduce(
                                (
                                    sum,
                                    ratio
                                ) =>
                                    sum + ratio,
                                0
                            );


                        return {
                            start,
                            end,
                            ratios:
                                rowRatios,
                            horizontalGaps,
                            fullWidthHeight:
                                availableRowWidth /
                                ratioSum
                        };

                    }
                );


            const verticalGaps =
                gap *
                Math.max(
                    0,
                    rowData.length - 1
                );


            const availableHeight =
                Math.max(
                    1,
                    rect.height -
                    verticalGaps
                );


            const naturalHeight =
                rowData.reduce(
                    (
                        sum,
                        row
                    ) =>
                        sum +
                        row.fullWidthHeight,
                    0
                );


            const scale =
                Math.min(
                    1,
                    availableHeight /
                    naturalHeight
                );


            let occupiedArea =
                0;


            let smallestSide =
                Infinity;


            rowData.forEach(
                row => {

                    const height =
                        row.fullWidthHeight *
                        scale;


                    row.ratios.forEach(
                        ratio => {

                            const width =
                                ratio *
                                height;


                            occupiedArea +=
                                width *
                                height;


                            smallestSide =
                                Math.min(
                                    smallestSide,
                                    width,
                                    height
                                );

                        }
                    );

                }
            );


            const score =
                occupiedArea +
                smallestSide *
                0.01;


            if (
                !best ||
                score >
                    best.score
            ) {

                best = {
                    mode:
                        "rows",
                    rows:
                        rowData,
                    scale,
                    gap,
                    score,
                    verticalGaps
                };

            }

        }
    );


    if (
        !best
    ) {

        return null;

    }


    const usedHeight =
        best.rows.reduce(
            (
                sum,
                row
            ) =>
                sum +
                row.fullWidthHeight *
                best.scale,
            0
        ) +
        best.verticalGaps;


    let y =
        Math.max(
            0,
            (
                rect.height -
                usedHeight
            ) / 2
        );


    const items =
        new Array(
            ratios.length
        );


    best.rows.forEach(
        row => {

            const height =
                row.fullWidthHeight *
                best.scale;


            const widths =
                row.ratios.map(
                    ratio =>
                        ratio *
                        height
                );


            const rowWidth =
                widths.reduce(
                    (
                        sum,
                        width
                    ) =>
                        sum + width,
                    0
                ) +
                row.horizontalGaps;


            let x =
                Math.max(
                    0,
                    (
                        rect.width -
                        rowWidth
                    ) / 2
                );


            widths.forEach(
                (
                    width,
                    localIndex
                ) => {

                    const index =
                        row.start +
                        localIndex;


                    items[index] = {
                        left:
                            x,
                        top:
                            y,
                        width,
                        height
                    };


                    x +=
                        width +
                        best.gap;

                }
            );


            y +=
                height +
                best.gap;

        }
    );


    return {
        items,
        score:
            best.score,
        mode:
            best.mode
    };

}


function calculateProjectAllColumnCandidate(
    rect,
    ratios,
    partitions,
    gap
) {

    let best =
        null;


    partitions.forEach(
        columns => {

            const columnData =
                columns.map(
                    ([start, end]) => {

                        const columnRatios =
                            ratios.slice(
                                start,
                                end
                            );


                        const verticalGaps =
                            gap *
                            Math.max(
                                0,
                                columnRatios.length - 1
                            );


                        const availableColumnHeight =
                            Math.max(
                                1,
                                rect.height -
                                verticalGaps
                            );


                        const inverseRatioSum =
                            columnRatios.reduce(
                                (
                                    sum,
                                    ratio
                                ) =>
                                    sum +
                                    1 / ratio,
                                0
                            );


                        return {
                            start,
                            end,
                            ratios:
                                columnRatios,
                            verticalGaps,
                            fullHeightWidth:
                                availableColumnHeight /
                                inverseRatioSum
                        };

                    }
                );


            const horizontalGaps =
                gap *
                Math.max(
                    0,
                    columnData.length - 1
                );


            const availableWidth =
                Math.max(
                    1,
                    rect.width -
                    horizontalGaps
                );


            const naturalWidth =
                columnData.reduce(
                    (
                        sum,
                        column
                    ) =>
                        sum +
                        column.fullHeightWidth,
                    0
                );


            const scale =
                Math.min(
                    1,
                    availableWidth /
                    naturalWidth
                );


            let occupiedArea =
                0;


            let smallestSide =
                Infinity;


            columnData.forEach(
                column => {

                    const width =
                        column.fullHeightWidth *
                        scale;


                    column.ratios.forEach(
                        ratio => {

                            const height =
                                width /
                                ratio;


                            occupiedArea +=
                                width *
                                height;


                            smallestSide =
                                Math.min(
                                    smallestSide,
                                    width,
                                    height
                                );

                        }
                    );

                }
            );


            const score =
                occupiedArea +
                smallestSide *
                0.01;


            if (
                !best ||
                score >
                    best.score
            ) {

                best = {
                    mode:
                        "columns",
                    columns:
                        columnData,
                    scale,
                    gap,
                    score,
                    horizontalGaps
                };

            }

        }
    );


    if (
        !best
    ) {

        return null;

    }


    const usedWidth =
        best.columns.reduce(
            (
                sum,
                column
            ) =>
                sum +
                column.fullHeightWidth *
                best.scale,
            0
        ) +
        best.horizontalGaps;


    let x =
        Math.max(
            0,
            (
                rect.width -
                usedWidth
            ) / 2
        );


    const items =
        new Array(
            ratios.length
        );


    best.columns.forEach(
        column => {

            const width =
                column.fullHeightWidth *
                best.scale;


            const heights =
                column.ratios.map(
                    ratio =>
                        width /
                        ratio
                );


            const columnHeight =
                heights.reduce(
                    (
                        sum,
                        height
                    ) =>
                        sum + height,
                    0
                ) +
                column.verticalGaps;


            let y =
                Math.max(
                    0,
                    (
                        rect.height -
                        columnHeight
                    ) / 2
                );


            heights.forEach(
                (
                    height,
                    localIndex
                ) => {

                    const index =
                        column.start +
                        localIndex;


                    items[index] = {
                        left:
                            x,
                        top:
                            y,
                        width,
                        height
                    };


                    y +=
                        height +
                        best.gap;

                }
            );


            x +=
                width +
                best.gap;

        }
    );


    return {
        items,
        score:
            best.score,
        mode:
            best.mode
    };

}


function calculateProjectAllLayout() {

    const rect =
        projectAllView
            .getBoundingClientRect();


    const ratios =
        getProjectAllRatios();


    const count =
        ratios.length;


    if (
        !count ||
        rect.width <= 0 ||
        rect.height <= 0
    ) {

        return null;

    }


    const gap =
        getProjectAllGap();


    /*
        For normal portfolio-sized projects we exhaustively test every
        contiguous grouping in BOTH directions while preserving film order.

        Rows can produce:
            [ large ]
            [ small ][ small ]

        Columns can produce:
            [ large ][ small ]
                     [ small ]

        The arrangement with the greatest actually visible video area wins.
        This makes View All respond to the real viewport shape rather than
        committing to a row-only contact sheet.
    */
    const partitions =
        count <= 12
            ? getContiguousRowPartitions(
                count
            )
            : [
                Array.from(
                    {
                        length:
                            Math.ceil(
                                count / 3
                            )
                    },
                    (_, groupIndex) => [
                        groupIndex * 3,
                        Math.min(
                            count,
                            groupIndex * 3 + 3
                        )
                    ]
                )
            ];


    const rowCandidate =
        calculateProjectAllRowCandidate(
            rect,
            ratios,
            partitions,
            gap
        );


    const columnCandidate =
        calculateProjectAllColumnCandidate(
            rect,
            ratios,
            partitions,
            gap
        );


    if (
        !rowCandidate
    ) {

        return columnCandidate;

    }


    if (
        !columnCandidate
    ) {

        return rowCandidate;

    }


    return columnCandidate.score >
        rowCandidate.score
            ? columnCandidate
            : rowCandidate;

}


/* =====================================================
   APPLY VIEW ALL
   ===================================================== */

function layoutProjectAllGrid() {

    syncProjectAllBounds();


    const layout =
        calculateProjectAllLayout();


    if (
        !layout
    ) {

        return;

    }


    const thumbs =
        [
            ...projectAllGrid
                .querySelectorAll(
                    ".project-all-thumb"
                )
        ];


    thumbs.forEach(
        (
            thumb,
            index
        ) => {

            const item =
                layout.items[
                    index
                ];


            if (
                !item
            ) {

                return;

            }


            thumb.style.left =
                `${item.left}px`;


            thumb.style.top =
                `${item.top}px`;


            thumb.style.width =
                `${item.width}px`;


            thumb.style.height =
                `${item.height}px`;

        }
    );

}


/* =====================================================
   BUILD VIEW ALL
   ===================================================== */

function buildProjectAllGrid() {

    const project =
        currentProject();


    projectAllGrid.innerHTML =
        "";


    project.videos.forEach(
        (
            filename,
            index
        ) => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "project-all-thumb";


            const preview =
                createPreviewVideo(
                    filename,
                    {
                        /*
                            These are now lightweight /film-previews/
                            files. Resolve metadata immediately so View
                            All knows the real aspect ratios before it
                            chooses its grid.
                        */
                        eagerMetadata:
                            true
                    }
                );


            const posterProbe =
                new Image();


            posterProbe.decoding =
                "async";


            posterProbe.addEventListener(
                "load",
                () => {

                    if (
                        posterProbe.naturalWidth &&
                        posterProbe.naturalHeight
                    ) {

                        preview.dataset.ratio =
                            String(
                                posterProbe.naturalWidth /
                                posterProbe.naturalHeight
                            );


                        if (
                            projectAllMode
                        ) {

                            layoutProjectAllGrid();

                        }

                    }

                },
                {
                    once: true
                }
            );


            posterProbe.src =
                preview.poster;


            preview.addEventListener(
                "loadedmetadata",
                () => {

                    if (
                        preview.videoWidth &&
                        preview.videoHeight
                    ) {

                        preview.dataset.ratio =
                            String(
                                preview.videoWidth /
                                preview.videoHeight
                            );

                    }

                    if (
                        projectAllMode
                    ) {

                        layoutProjectAllGrid();

                    }

                }
            );


            button.appendChild(
                preview
            );


            button.addEventListener(
                "click",
                async event => {

                    event.stopPropagation();


                    await leaveProjectAll(
                        {
                            selectedIndex:
                                index,

                            resume:
                                false
                        }
                    );


                    loadCurrentVideo(
                        true
                    );

                }
            );


            projectAllGrid.appendChild(
                button
            );


            observePreview(
                preview
            );

        }
    );

}

            ),

    projectCounter.removeAttribute(

    );

    );


    projectAllGrid.innerHTML =
        "";


    projectViewAnimating =
        false;


    const changedProject =
        projectAllProjectChanged;


    projectAllProjectChanged =
        false;


    projectAllEntryProjectIndex =
        null;


    if (
        selectedIndex !== null
    ) {

        projectAllOpenedFromIndex =
            false;

        indexSelectionBeforeProjectAll =
            null;

    if (
        projectAllOpenedFromIndex &&
        selectedIndex === null

        projectAllOpenedFromIndex =
            false;

        await enterIndex(
            {
                preserveSelection: true,
                preserveAutoplayState: true

        return;

    if (
        selectedIndex ===
            null &&
        changedProject
    ) {

        await loadCurrentVideo(
            resume &&
            autoplayBeforeProjectAll
        );


        return;

    }


    if (

        autoplayBeforeProjectAll
    ) {

            .play()
            .catch(

            );

    }

/* =====================================================
   INDEX ORDER
   ===================================================== */

function getChronologicalProjects() {

    return projects
        .map(
            (
                project,
                originalIndex
            ) => ({
                project,
                originalIndex
            })
        )
        .sort(
            (
                a,
                b
            ) => {

                const orderA =
                    Number.isFinite(
                        a.project.indexOrder
                    )
                        ? a.project.indexOrder
                        : 999;

                const orderB =
                    Number.isFinite(
                        b.project.indexOrder
                    )
                        ? b.project.indexOrder
                        : 999;

                return (
                    orderA -
                    orderB
                ) || (
                    a.originalIndex -
                    b.originalIndex
                );

            }
        );

}

/* =====================================================
   PASSIVE PROJECT ADVANCE
   ===================================================== */

/*
    Desktop View All no longer changes project after a blind six-second
    timeout. Different preview files may become playable at different
    moments, so a fixed timer could skip a project before slower previews
    had even started.

    The project now advances after EVERY preview in the current View All
    has completed its first playback cycle. The preview videos may keep
    looping normally; we simply record the first completed cycle of each.

    A generous fallback exists only for a genuinely broken media request,
    so one failed file cannot freeze passive navigation forever.
*/

const DESKTOP_PROJECT_PREVIEW_FAILSAFE =
    30000;


let passiveProjectAdvanceEnabled =
    true;


let desktopProjectAdvanceTimer =
    null;


let desktopProjectAdvanceWatchToken =
    0;


function clearDesktopProjectAdvance() {

    desktopProjectAdvanceWatchToken++;


    if (
        desktopProjectAdvanceTimer !==
        null
    ) {

        clearTimeout(
            desktopProjectAdvanceTimer
        );


        desktopProjectAdvanceTimer =
            null;

    }

}


function noteUiInteraction() {

    passiveProjectAdvanceEnabled =
        false;


    clearDesktopProjectAdvance();

}


/*
    Keyboard interaction must cancel passive project advance BEFORE any
    focused control handles the same key event. Capture phase guarantees it.
*/
window.addEventListener(
    "keydown",
    event => {
        if (
            [
                "ArrowLeft",
                "ArrowRight",
                "ArrowUp",
                "ArrowDown",
                "PageUp",
                "PageDown",
                "Home",
                "End",
                "Space",
                "Enter",
                "Escape"
            ].includes(
                event.code
            )
        ) {
            noteUiInteraction();
        }
    },
    true
);


function scheduleDesktopProjectAdvance() {

    clearDesktopProjectAdvance();


    if (
        !passiveProjectAdvanceEnabled ||
        !isDesktop() ||
        !projectAllMode ||
        indexMode ||
        aybakEndCardActive
    ) {

        return;

    }


    const token =
        desktopProjectAdvanceWatchToken;


    const previews =
        [
            ...projectAllGrid
                .querySelectorAll(
                    ".project-all-thumb video"
                )
        ];


    if (
        !previews.length
    ) {

        return;

    }


    const completed =
        new Set();


    let advanceStarted =
        false;


    const advance =
        async () => {

            if (
                advanceStarted ||
                token !==
                    desktopProjectAdvanceWatchToken ||
                !passiveProjectAdvanceEnabled ||
                !isDesktop() ||
                !projectAllMode ||
                indexMode ||
                aybakEndCardActive ||
                projectViewAnimating
            ) {

                return;

            }


            advanceStarted =
                true;


            if (
                desktopProjectAdvanceTimer !==
                null
            ) {

                clearTimeout(
                    desktopProjectAdvanceTimer
                );


                desktopProjectAdvanceTimer =
                    null;

            }


            await switchProjectAllProject(
                1,
                {
                    passive: true
                }
            );

        };


    const markComplete =
        preview => {

            if (
                token !==
                    desktopProjectAdvanceWatchToken ||
                completed.has(
                    preview
                )
            ) {

                return;

            }


            completed.add(
                preview
            );


            if (
                completed.size >=
                previews.length
            ) {

                advance();

            }

        };


    previews.forEach(
        preview => {

            let lastTime =
                Number.isFinite(
                    preview.currentTime
                )
                    ? preview.currentTime
                    : 0;


            const checkProgress =
                () => {

                    if (
                        token !==
                            desktopProjectAdvanceWatchToken
                    ) {

                        return;

                    }


                    const duration =
                        preview.duration;


                    const current =
                        preview.currentTime;


                    if (
                        !Number.isFinite(
                            duration
                        ) ||
                        duration <= 0 ||
                        !Number.isFinite(
                            current
                        )
                    ) {

                        return;

                    }


                    const nearEndThreshold =
                        Math.max(
                            0.25,
                            duration -
                            Math.min(
                                0.55,
                                duration * 0.1
                            )
                        );


                    /*
                        Native loop can jump back to zero without reliably
                        dispatching "ended", so detect either the final part
                        of the clip OR the loop wrap itself.
                    */
                    if (
                        current >=
                            nearEndThreshold ||
                        (
                            lastTime >
                                duration * 0.55 &&
                            current <
                                lastTime - 0.35
                        )
                    ) {

                        markComplete(
                            preview
                        );

                    }


                    lastTime =
                        current;

                };


            preview.addEventListener(
                "timeupdate",
                checkProgress
            );


            preview.addEventListener(
                "ended",
                () => {

                    markComplete(
                        preview
                    );

                }
            );


            /*
                Ensure every tile participates even when its observer was
                slightly late to activate after a layout rebuild.
            */
            activatePreview(
                preview
            );


            checkProgress();

        }
    );


    desktopProjectAdvanceTimer =
        setTimeout(
            () => {

                /*
                    Failsafe only: normal navigation is driven by preview
                    completion, not this timeout.
                */
                advance();

            },
            DESKTOP_PROJECT_PREVIEW_FAILSAFE
        );

}

/* =====================================================
   INDEX CASE CONTROLLER
   ===================================================== */

function createCaseController(
    element,
    baseText
) {

    const base =
        String(
            baseText
        ).toLowerCase();

    const positions =
        getMorphPositions(
            base
        );

    const total =
        positions.length;

    let state =
        0;

    let frameId =
        null;

    function render() {

        const activePositions =
            new Set(
                positions.slice(
                    0,
                    state
                )
            );

        renderInteractiveTypography(
            element,
            renderCaseFromActivePositions(
                base,
                activePositions
            ),
            activePositions
        );

    }

    function animateTo(
        target
    ) {

        if (
            frameId !== null
        ) {

            cancelAnimationFrame(
                frameId
            );

        }

        const startState =
            state;

        if (
            startState === target
        ) {

            render();
            return Promise.resolve();

        }

        const start =
            performance.now();

        return new Promise(
            resolve => {

                function frame(
                    now
                ) {

                    const progress =
                        Math.min(
                            1,
                            (
                                now -
                                start
                            ) /
                            CASE_DURATION
                        );

                    state =
                        Math.round(
                            startState +
                            (
                                target -
                                startState
                            ) *
                            progress
                        );

                    render();

                    if (
                        progress < 1
                    ) {

                        frameId =
                            requestAnimationFrame(
                                frame
                            );

                    }

                    else {

                        state =
                            target;

                        render();

                        frameId =
                            null;

                        resolve();

                    }

                }

                frameId =
                    requestAnimationFrame(
                        frame
                    );

            }
        );

    }

    render();

    return {
        upper() {
            return animateTo(
                total
            );
        },
        lower() {
            return animateTo(
                0
            );
        }
    };

}

function stopIndexPreview() {

    ) {
        return;
    }

    indexPreviewVideo.pause();
    indexPreviewVideo.removeAttribute(
        "src"
    );
    indexPreviewVideo.removeAttribute(
        "poster"
    );
    indexPreviewVideo.load();

}


function resetIndexSelection() {

    selectedIndexProject =
        null;

    indexProjectRows.forEach(
        rowState => {
            rowState.titleCase.lower();
            rowState.dateCase.lower();
        }
    );

    indexPreview.classList.remove(
        "visible"
    );

    indexPreview.setAttribute(
        "aria-hidden",
        "true"
    );

    indexProjectAction.classList.remove(
        "visible"
    );

    indexProjectAction.setAttribute(
        "aria-hidden",
        "true"
    );

    stopIndexPreview();

    indexProjectCount.textContent =
        "";

    indexProjectCount.dataset.rawText =
        "";

    if (
        indexViewAllCase
    ) {
        animateCase(
        indexProjectViewAll,
        getIndexViewAllLabelText(),
        false
    );
    }

}


function selectIndexProject(
    rowState
) {

    if (
        !rowState
    ) {
        return;
    }

    const previousSelection =
        selectedIndexProject;

    

    selectedIndexProject =
        rowState;

    indexProjectRows.forEach(
        state => {

            if (
                state === rowState
            ) {
                state.titleCase.upper();
                state.dateCase.upper();
            }
            else {
                state.titleCase.lower();
                state.dateCase.lower();
            }

        }
    );

    const project =
        rowState.project;

    const filename =
        project.videos[0];

    const nextPreviewSrc =
        previewVideoUrl(
            filename
        );

    const nextPoster =
        posterVideoUrl(
            filename
        );

    if (
        indexPreviewVideo.dataset.masterFilename !==
        filename
    ) {

        indexPreviewVideo.pause();
        indexPreviewVideo.dataset.masterFilename =
            filename;
        indexPreviewVideo.poster =
            nextPoster;
        indexPreviewVideo.src =
            nextPreviewSrc;
        indexPreviewVideo.muted =
            true;
        indexPreviewVideo.loop =
            true;
        indexPreviewVideo.load();

    }

    indexPreviewVideo
        .play()
        .catch(
            () => {}
        );

    indexPreview.classList.add(
        "visible"
    );

    indexPreview.setAttribute(
        "aria-hidden",
        "false"
    );

    const nextCountText =
        getFilmCountText(
            project.videos.length
        );

    if (
        previousSelection &&
        previousSelection !== rowState &&
        indexProjectCount.textContent
    ) {

        morphSequential(
            indexProjectCount,
            nextCountText,
            STATE_MORPH_DURATION
        ).catch(
            () => {}
        );

    }
    else {

        renderBaseTypography(
            indexProjectCount,
            nextCountText
        );

        indexProjectCount.dataset.rawText =
            nextCountText;

    }

    indexProjectAction.classList.add(
        "visible"
    );

    indexProjectAction.setAttribute(
        "aria-hidden",
        "false"
    );

    if (
        indexViewAllCase
    ) {
        animateCase(
        indexProjectViewAll,
        getIndexViewAllLabelText(),
        false
    );
    }

}


/* =====================================================
   INDEX LAYOUT
   Desktop: no scrolling, add columns as needed.
   Phones: one column, responsive gaps, vertical scroll only
   when the minimum one-line gap no longer fits.
   ===================================================== */

function layoutTypographicIndex() {

    if (
        !indexGrid ||
        !indexScroller
    ) {
        return;
    }

    updateResponsiveBodyClasses();

    const total =
        indexProjectRows.length;

    if (
        total === 0
    ) {
        return;
    }

    const computed =
        getComputedStyle(
            document.documentElement
        );

    const fontSize =
        parseFloat(
            computed.getPropertyValue(
                "--font-size"
            )
        ) || 13;

    const lineHeightMultiplier =
        parseFloat(
            computed.getPropertyValue(
                "--line-height"
            )
        ) || 1.15;

    const lineHeight =
        fontSize *
        lineHeightMultiplier;

    const minimumGap =
        lineHeight;

    const edgeGap =
        lineHeight;

    indexProjectRows.forEach(
        state => {
            state.row.style.removeProperty(
                "grid-column"
            );
            state.row.style.removeProperty(
                "grid-row"
            );
        }
    );

    body.classList.remove(
        "index-needs-scroll"
    );

    if (
        isPhoneLayout()
    ) {

        const availableHeight =
            Math.max(
                1,
                indexScroller.clientHeight -
                edgeGap * 2
            );

        const rowHeights =
            indexProjectRows.map(
                state =>
                    Math.max(
                        state.row.scrollHeight,
                        lineHeight * 2
                    )
            );

        const occupiedHeight =
            rowHeights.reduce(
                (
                    sum,
                    value
                ) =>
                    sum + value,
                0
            );

        const gapCount =
            Math.max(
                0,
                total - 1
            );

        const idealGap =
            gapCount
                ? (
                    availableHeight -
                    occupiedHeight
                ) /
                gapCount
                : 0;

        const needsScroll =
            gapCount > 0 &&
            idealGap <
            minimumGap;

        const rowGap =
            gapCount
                ? (
                    needsScroll
                        ? minimumGap
                        : Math.max(
                            minimumGap,
                            idealGap
                        )
                )
                : 0;

        indexGrid.style.setProperty(
            "--index-row-gap",
            `${rowGap}px`
        );

        body.classList.toggle(
            "index-needs-scroll",
            needsScroll
        );

        requestAnimationFrame(
            placeIndexScrollHintInLastVisibleSlot
        );

        indexScroller.scrollTop =
            Math.min(
                indexScroller.scrollTop,
                Math.max(
                    0,
                    indexScroller.scrollHeight -
                    indexScroller.clientHeight
                )
            );

        return;

    }

    /* Desktop/tablet: never scroll. Increase columns instead. */
    const availableHeight =
        Math.max(
            1,
            indexScroller.clientHeight -
            edgeGap * 2
        );

    const itemHeight =
        lineHeight * 2;

    const maxRowsByHeight =
        Math.max(
            1,
            Math.floor(
                (
                    availableHeight +
                    minimumGap
                ) /
                (
                    itemHeight +
                    minimumGap
                )
            )
        );

    /*
        Desktop/tablet: keep the text field visually connected to the
        right-side preview. With the current project count, target at
        least three columns instead of collapsing to two.
    */
    const minimumDesktopColumns =
        total >= 3
            ? 3
            : Math.max(
                1,
                total
            );

    const maxRowsForMinimumColumns =
        Math.max(
            1,
            Math.ceil(
                total /
                minimumDesktopColumns
            )
        );

    const rowCount =
        Math.max(
            1,
            Math.min(
                total,
                maxRowsByHeight,
                maxRowsForMinimumColumns
            )
        );

    const columnCount =
        Math.ceil(
            total /
            rowCount
        );

    const gapCount =
        Math.max(
            0,
            rowCount - 1
        );

    const occupiedHeight =
        rowCount *
        itemHeight;

    const rowGap =
        gapCount
            ? Math.max(
                minimumGap,
                (
                    availableHeight -
                    occupiedHeight
                ) /
                gapCount
            )
            : 0;

    const columnGap =
        Math.max(
            26,
            Math.min(
                72,
                indexScroller.clientWidth *
                0.06
            )
        );

    indexGrid.style.setProperty(
        "--index-row-count",
        String(
            rowCount
        )
    );

    indexGrid.style.setProperty(
        "--index-column-count",
        String(
            columnCount
        )
    );

    indexGrid.style.setProperty(
        "--index-row-gap",
        `${rowGap}px`
    );

    indexGrid.style.setProperty(
        "--index-column-gap",
        `${columnGap}px`
    );

    indexProjectRows.forEach(
        (
            state,
            itemIndex
        ) => {

            const columnIndex =
                Math.floor(
                    itemIndex /
                    rowCount
                );

            const localRow =
                itemIndex %
                rowCount;

            state.row.style.gridColumn =
                String(
                    columnIndex + 1
                );

            state.row.style.gridRow =
                String(
                    localRow + 1
                );

        }
    );

}

   ===================================================== */

function resizeIndexCards() {
