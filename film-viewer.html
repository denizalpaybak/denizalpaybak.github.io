function buildIndex() {

    indexGrid.innerHTML =
        "";

    indexProjectRows =
        [];

    resetIndexSelection();

    getChronologicalProjects()
        .forEach(
            item => {

                const project =
                    item.project;

                const originalIndex =
                    item.originalIndex;

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "index-project-row";

                const titleButton =
                    document.createElement(
                        "button"
                    );

                titleButton.type =
                    "button";

                titleButton.className =
                    "index-project-title";

                const titleBase =
                    project.title
                        .toLowerCase();

                renderBaseTypography(
                    titleButton,
                    titleBase
                );

                const dateButton =
                    document.createElement(
                        "button"
                    );

                dateButton.type =
                    "button";

                dateButton.className =
                    "index-project-date";

                const dateBase =
                    (
                        project.date ||
                        ""
                    ).toLowerCase();

                renderBaseTypography(
                    dateButton,
                    dateBase
                );

                const rowState =
                    {
                        row,
                        project,
                        originalIndex,
                        titleButton,
                        dateButton,
                        titleCase:
                            createCaseController(
                                titleButton,
                                titleBase
                            ),
                        dateCase:
                            createCaseController(
                                dateButton,
                                dateBase
                            )
                    };

                indexProjectRows.push(
                    rowState
                );

                [
                    titleButton,
                    dateButton
                ].forEach(
                    button => {

                        button.addEventListener(
                            "mouseenter",
                            () => {

                                if (
                                    !hasHover()
                                ) {
                                    return;
                                }

                                selectIndexProject(
                                    rowState
                                );

                            }
                        );

                        button.addEventListener(
                            "focus",
                            () => {

                                if (
                                    !hasHover()
                                ) {
                                    return;
                                }

                                selectIndexProject(
                                    rowState
                                );

                            }
                        );

                        button.addEventListener(
                            "click",
                            async event => {

                                event.stopPropagation();

                                /* Desktop: one click. Phones: first tap
                                   selects/previews; second tap opens View All. */
                                if (
                                    !isPhoneLayout()
                                ) {

                                    selectIndexProject(
                                        rowState
                                    );

                                    await new Promise(
                                        resolve =>
                                            requestAnimationFrame(
                                                resolve
                                            )
                                    );

                                    await openSelectedIndexProjectAll();

                                }
                                else if (
                                    selectedIndexProject ===
                                    rowState
                                ) {

                                    await openSelectedIndexProjectAll();

                                }
                                else {

                                    selectIndexProject(
                                        rowState
                                    );

                                }

                            }
                        );

                    }
                );

                row.append(
                    titleButton,
                    dateButton
                );

                indexGrid.appendChild(
                    row
                );

            }
        );

    requestAnimationFrame(
        layoutTypographicIndex
    );

}


/* =====================================================
   INDEX WORD
   ===================================================== */

function renderIndexWord(
    state
) {

    indexWordState =
        state;

    const positions =
        getMorphPositions(
            indexWord
        );

    const activePositions =
        new Set(
            positions.slice(
                0,
                state
            )
        );

    renderInteractiveTypography(
        indexButton,
        renderCaseFromActivePositions(
            indexWord,
            activePositions
        ),
        activePositions
    );

}


function morphIndexTo(
    target
) {

    if (
        indexWordFrame !== null
    ) {
        cancelAnimationFrame(
            indexWordFrame
        );
    }

    const initial =
        indexWordState;

    if (
        initial === target
    ) {
        renderIndexWord(
            target
        );
        return Promise.resolve();
    }

    const start =
        performance.now();

    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        INDEX_TRANSITION_DURATION
                    );

                const state =
                    Math.round(
                        initial +
                        (
                            target -
                            initial
                        ) *
                        progress
                    );

                renderIndexWord(
                    state
                );

                if (
                    progress < 1
                ) {
                    indexWordFrame =
                        requestAnimationFrame(
                            frame
                        );
                }
                else {
                    renderIndexWord(
                        target
                    );
                    indexWordFrame =
                        null;
                    resolve();
                }

            }

            indexWordFrame =
                requestAnimationFrame(
                    frame
                );

        }
    );

}

/* =====================================================
   ENTER / RETURN INDEX
   ===================================================== */

async function enterIndex(
    {
        preserveSelection = false,
        preserveAutoplayState = false
    } = {}
) {

    if (
        indexMode ||
        interfaceAnimating
    ) {
        return;
    }

    interfaceAnimating =
        true;

    if (
        !preserveAutoplayState
    ) {
        autoplayBeforeIndex =
            !video.paused;
    }

    video.pause();

    if (
        projectAllMode
    ) {

        projectAllOpenedFromIndex =
            false;

        await leaveProjectAll(
            {
                resume: false
            }
        );

    }

    updateResponsiveBodyClasses();

    indexMode =
        true;

    resetIndexScrollHint();

    body.classList.add(
        "index-mode"
    );


    video.loop =
        false;


    /*
        INDEX is always the inverse of the current project.
    */
    setSurfaceTheme(
        !projectThemeDark
    );


    indexView.classList.add(
        "visible"
    );

    restoreIndexPosition();

    requestAnimationFrame(
        layoutTypographicIndex
    );

    if (
        !preserveSelection
    ) {
        resetIndexSelection();
    }
    else if (
        indexSelectionBeforeProjectAll
    ) {

        const preserved =
            indexProjectRows.find(
                state =>
                    state.originalIndex ===
                    indexSelectionBeforeProjectAll.originalIndex
            );

        if (
            preserved
        ) {
            selectIndexProject(
                preserved
            );
        }

    }

    morphIndexTo(
        indexWord.length
    );

    indexScroller.focus(
        {
            preventScroll: true
        }
    );

    interfaceAnimating =
        false;

}


async function returnFromIndex() {

    if (
        !indexMode ||
        interfaceAnimating
    ) {
        return;
    }

    interfaceAnimating =
        true;

    saveIndexPosition();

    resetIndexSelection();

    await morphIndexTo(
        0
    );

    indexView.classList.remove(
        "visible"
    );

    indexMode =
        false;

    body.classList.remove(
        "index-mode"
    );


    syncMainVideoLoopMode();


    setSurfaceTheme(
        projectThemeDark
    );


    if (
        autoplayBeforeIndex
    ) {
        video
            .play()
            .catch(
                () => {}
            );
    }

    interfaceAnimating =
        false;

}


/* =====================================================
   INDEX -> VIEW ALL
   ===================================================== */

async function openSelectedIndexProjectAll() {

    if (
        !indexMode ||
        !selectedIndexProject ||
        interfaceAnimating ||
        projectViewAnimating
    ) {
        return;
    }

    interfaceAnimating =
        true;

    saveIndexPosition();

    indexSelectionBeforeProjectAll =

    currentProjectIndex =

        );

    currentVideoIndex =
        0;

    renderedProjectIndex =
        null;

    syncProjectUrl(

    );

    await loadCurrentVideo(
        false
    );

    stopIndexPreview();

    await morphIndexTo(
        0
    );

    indexView.classList.remove(
        "visible"
    );

    indexMode =
        false;

    body.classList.remove(
        "index-mode"
    );


    setSurfaceTheme(
        projectThemeDark
    );


    interfaceAnimating =
        false;

    await enterProjectAll();

}

/* =====================================================

   No textual hint and no row clipping. The list remains a completely native
   scroll surface from the first touch. CSS supplies the bottom fade while
   more projects remain; the existing scroll listener dismisses it at the end.
   ===================================================== */

function clearIndexScrollHintHost() {
    /* intentionally empty: never mutate rows during a touch gesture */
}

function placeIndexScrollHintInLastVisibleSlot() {
    /* intentionally empty: continuation is represented only by the fade */
}

function resetIndexScrollHint() {
    body.classList.remove("index-scroll-hint-dismissed");
}

/* =====================================================
   INDEX SCROLL / AYBAK BOUNDARY
   ===================================================== */

const INDEX_BOUNDARY_WHEEL_THRESHOLD =
    48;

const INDEX_NEW_GESTURE_GAP =
    190;


function indexCanScrollVertically() {

    return (
        indexScroller.scrollHeight -
        indexScroller.clientHeight
    ) > 2;

}


function indexIsAtBottom() {

    return (
        indexScroller.scrollTop +
        indexScroller.clientHeight
    ) >= (
        indexScroller.scrollHeight -
        2
    );

}


indexScroller.addEventListener(
    "wheel",
    event => {

        if (
            !indexMode ||
            aybakEndCardActive
        ) {
            return;
        }

        if (
            Math.abs(
                event.deltaY
            ) <=
            Math.abs(
                event.deltaX
            )
        ) {
            return;
        }

        event.preventDefault();

        clearIndexScrollHintHost();

        const now =
            performance.now();

        const newGesture =
            (
                now -
                indexLastWheelTime
            ) >
            INDEX_NEW_GESTURE_GAP;

        indexLastWheelTime =
            now;

        const canScroll =
            indexCanScrollVertically();

        const atBottomBefore =
            indexIsAtBottom();

        if (
            canScroll &&
            (
                event.deltaY < 0 ||
                !atBottomBefore
            )
        ) {

            indexScroller.scrollTop +=
                event.deltaY;

            indexBoundaryWheelAccumulator =
                0;

            return;

        }

        if (
            event.deltaY <= 0
        ) {
            indexBoundaryWheelAccumulator =
                0;
            return;
        }

        if (
            canScroll &&
            !newGesture
        ) {
            return;
        }

        clearTimeout(
            indexBoundaryWheelResetTimer
        );

        indexBoundaryWheelAccumulator +=
            event.deltaY;

        indexBoundaryWheelResetTimer =
            setTimeout(
                () => {
                    indexBoundaryWheelAccumulator =
                        0;
                },
                150
            );

        if (
            indexBoundaryWheelAccumulator >=
            INDEX_BOUNDARY_WHEEL_THRESHOLD
        ) {

            indexBoundaryWheelAccumulator =
                0;

            setAybakEndCard(
                true
            );

        }

    },
    {
        passive: false
    }
);




indexScroller.addEventListener(
    "touchstart",
    event => {

        if (
            !indexMode ||
            !event.changedTouches.length
        ) {
            return;
        }

        indexTouchStartY =
            event.changedTouches[0].clientY;

        indexTouchLastY =
            indexTouchStartY;


        indexTouchStartedAtBottom =
            !indexCanScrollVertically() ||
            indexIsAtBottom();

    },
    {
        passive: true
    }
);


indexScroller.addEventListener(
    "touchmove",
    event => {
        if (
            !indexMode ||
            aybakEndCardActive ||
            !event.changedTouches.length
        ) {
            return;
        }

        /* Native overflow scrolling owns the gesture. Never preventDefault here. */
        indexTouchLastY = event.changedTouches[0].clientY;
    },
    {
        passive: true
    }
);


indexScroller.addEventListener(
    "touchend",
    event => {

        if (
            !indexMode ||
            indexTouchStartY === null ||
            !event.changedTouches.length
        ) {
            return;
        }

        const endY =
            event.changedTouches[0].clientY;

        const deltaY =
            endY -
            indexTouchStartY;

        indexTouchStartY =
            null;

        indexTouchLastY =
            null;

        if (
            indexTouchStartedAtBottom &&
            deltaY < -52
        ) {
            setAybakEndCard(
                true
            );
        }

    },
    {
        passive: true
    }
);


indexScroller.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "ArrowDown" ||
            event.key === "PageDown" ||
            event.key === "End"
        ) {

            event.preventDefault();
            setAybakEndCard(
                true
            );

        }

    }
);


indexScroller.addEventListener(
    "scroll",
    () => {

        /* The hint remains visible while projects are still below.
           Once native scrolling has actually begun, reveal the rows that were
           hidden only to keep the initial composition free of partial entries. */
        if (
            indexMode &&
            indexScroller.scrollTop > 1
        ) {
            clearIndexScrollHintHost();
        }

        if (
            indexMode &&
            indexIsAtBottom()
        ) {
            dismissIndexScrollHint();
        }
        else if (
            indexMode &&
            body.classList.contains("index-needs-scroll")
        ) {
            /* The continuation cue comes back as soon as there are projects
               below again. Reaching the end is not a permanent dismissal. */
            body.classList.remove("index-scroll-hint-dismissed");
        }

        if (
            indexMode
        ) {
            savedIndexScrollTop =
                indexScroller.scrollTop;
        }

    },
    {
        passive: true
    }
);



/* =====================================================
   USER INTERACTION STOPS PASSIVE ADVANCE
   ===================================================== */

document.addEventListener(
    "pointerdown",
    event => {
        const target =
            event.target;

        if (
            !target ||
            !target.closest
        ) {
            return;
        }

        const interactive =
            target.closest(
                [
                    "button",
                    "a",
                    "#project-title",
                    "#project-date",
                    "#film-video",
                    ".index-project-row",
                    ".project-all-item"
                ].join(",")
            );

        if (interactive) {
            noteUiInteraction();
        }
    },
    true
);

/* =====================================================
   GLOBAL KEYBOARD
   ===================================================== */

document.addEventListener(
    "keydown",
    event => {

        const target =
            event.target;

        if (
            [
                "ArrowLeft",
                "ArrowRight",
                "ArrowUp",
                "ArrowDown",
                "Space",
                "Enter",
                "Escape"
            ].includes(event.code)
        ) {
            noteUiInteraction();
        }


        if (
            target &&
            [
                "INPUT",
                "TEXTAREA",
                "SELECT"
            ].includes(
                target.tagName
            )
        ) {

            return;

        }


        if (
            aybakEndCardActive
        ) {

            if (
                event.code === "Escape" ||
                event.code === "ArrowUp" ||
                event.code === "PageUp" ||
                event.code === "Home"
            ) {
                event.preventDefault();
                setAybakEndCard(
                    false
                );
            }

            return;

        }


        if (
            event.code ===
            "ArrowDown"
        ) {
            event.preventDefault();

            setAybakEndCard(
                true
            );

            return;
        }


        if (
            event.code ===
            "Escape"
        ) {

            if (
                projectAllMode
            ) {

                event.preventDefault();


                leaveProjectAll(
                    {
                        resume:
                            true
                    }
                );


                return;

            }


            if (
                indexMode
            ) {

                event.preventDefault();


                returnFromIndex();


                return;

            }

        }


        if (
            projectAllMode
        ) {

            if (
                event.code ===
                "ArrowRight"
            ) {

                event.preventDefault();


                switchProjectAllProject(
                    1
                );

            }

            else if (
                event.code ===
                "ArrowLeft"
            ) {

                event.preventDefault();


                switchProjectAllProject(
                    -1
                );

            }


            return;

        }


        if (
            indexMode
        ) {

            return;

        }


        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            togglePlayback();

        }


        else if (
            event.code ===
            "ArrowRight"
        ) {

            event.preventDefault();

            nextFilm();

        }


        else if (
            event.code ===
            "ArrowLeft"
        ) {

            event.preventDefault();

            previousFilm();

        }

    }
);




/* =====================================================
   VIEW ALL — MOBILE PROJECT SWIPE
   ===================================================== */

projectAllView.addEventListener(
    "touchstart",
    event => {

        if (
            !projectAllMode ||
            event.touches.length !== 1
        ) {

            return;

        }


        const touch =
            event.touches[0];


        projectAllSwipeStartX =
            touch.clientX;


        projectAllSwipeStartY =
            touch.clientY;


        projectAllSwipeStartTime =
            performance.now();

    },
    {
        passive: true
    }
);


projectAllView.addEventListener(
    "touchend",
    event => {

        if (
            !projectAllMode ||
            projectAllSwipeStartX === null ||
            !event.changedTouches.length
        ) {

            return;

        }


        const touch =
            event.changedTouches[0];


        const dx =
            touch.clientX -
            projectAllSwipeStartX;


        const dy =
            touch.clientY -
            projectAllSwipeStartY;


        const elapsed =
            performance.now() -
            projectAllSwipeStartTime;


        projectAllSwipeStartX =
            null;


        projectAllSwipeStartY =
            null;


        const horizontalSwipe =
            Math.abs(
                dx
            ) >= 52 &&
            Math.abs(
                dx
            ) >
            Math.abs(
                dy
            ) * 1.25 &&
            elapsed < 750;


        if (
            !horizontalSwipe
        ) {

            return;

        }


        noteUiInteraction();


        if (
            dx < 0
        ) {

            switchProjectAllProject(
                1
            );

        }

        else {

            switchProjectAllProject(
                -1
            );

        }

    },
    {
        passive: true
    }
);


/* =====================================================
   MOBILE SWIPE
   ===================================================== */

video.addEventListener(
    "touchstart",
    event => {

        if (
            event.touches.length !==
            1
        ) {

            return;

        }


        const touch =
            event.touches[
                0
            ];


        touchStartX =
            touch.clientX;


        touchStartY =
            touch.clientY;


        touchStartTime =
            performance.now();


        touchMoved =
            false;

    },
    {
        passive:
            true
    }
);


video.addEventListener(
    "touchmove",
    event => {

        if (
            event.touches.length !==
            1
        ) {

            return;

        }


        const touch =
            event.touches[
                0
            ];


        if (
            Math.abs(
                touch.clientX -
                touchStartX
            ) >
            10 ||
            Math.abs(
                touch.clientY -
                touchStartY
            ) >
            10
        ) {

            touchMoved =
                true;

        }

    },
    {
        passive:
            true
    }
);


video.addEventListener(
    "touchend",
    event => {

        if (
            !event.changedTouches.length
        ) {

            return;

        }


        const touch =
            event.changedTouches[
                0
            ];


        const dx =
            touch.clientX -
            touchStartX;


        const dy =
            touch.clientY -
            touchStartY;


        const elapsed =
            performance.now() -
            touchStartTime;


        const swipe =
            Math.abs(
                dx
            ) >=
            50 &&
            Math.abs(
                dx
            ) >
            Math.abs(
                dy
            ) *
            1.25 &&
            elapsed <
            700;


        if (
            swipe
        ) {

            if (
                dx <
                0
            ) {

                nextFilm();

            }

            else {

                previousFilm();

            }


            setTimeout(
                () => {

                    touchMoved =
                        false;

                },
                150
            );


            return;

        }


        setTimeout(
            () => {

                touchMoved =
                    false;

            },
            150
        );

    },
    {
        passive:
            true
    }
);


/* =====================================================
   INDEX PREWARM
   ===================================================== */

async function warmIndexPreviews() {

    /*
        Never prewarm the whole index.

        The old desktop path could create requests for every
        project's preview before the user had even opened INDEX.
        On slower mobile connections this strategy is much worse.

        We only prepare metadata for the first one or two cards
        during idle time. Everything else is visibility-driven.
    */

    const previews =
        [
            ...indexGrid
                .querySelectorAll(
                    "video[data-src]"
                )
        ];


    const count =
        isPhoneLayout()
            ? 3
            : 5;


    for (
        let i = 0;
        i < Math.min(
            count,
            previews.length
        );
        i++
    ) {

        const preview =
            previews[i];


        if (
            !preview.getAttribute(
                "src"
            )
        ) {

            preview.src =
                preview.dataset.src;


            preview.preload =
                "metadata";


            preview.load();

        }


        await wait(
            80
        );

    }

}


/* =====================================================
   LOAD PROJECTS
   ===================================================== */

async function loadProjects() {

    try {

        const response =
            await fetch(
                FILMS_JSON,
                {
                    /*
                        Do not force a fresh network transfer on every
                        mobile visit. Normal HTTP cache semantics make
                        repeat opens substantially faster while still
                        respecting the server's cache headers.
                    */
                    cache:
                        "default"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "films.json could not be loaded"
            );

        }


        const data =
            await response.json();


        projects =
            data
                .filter(
                    project =>
                        project &&
                        typeof project.title ===
                            "string" &&
                        Array.isArray(
                            project.videos
                        ) &&
                        project.videos.length
                )
                .map(
                    prepareProject
                );


        if (
            !projects.length
        ) {

            return;

        }


        buildIndex();


        const deepLink =
            getDeepLinkRequest();


        const requestedProjectIndex =
            findProjectIndexById(
                deepLink.projectId
            );


        currentProjectIndex =
            requestedProjectIndex >= 0
                ? requestedProjectIndex
                : 0;


        const requestedProject =
            currentProject();


        const hasExactDeepLink =
            requestedProjectIndex >= 0 &&
            deepLink.videoNumber !== null;


        if (
            hasExactDeepLink
        ) {
            /* PDF / external frame links are explicit user navigation. */
            noteUiInteraction();
        }


        let requestedRuntimeVideoIndex =
            -1;


        if (
            requestedProjectIndex >= 0 &&
            deepLink.videoNumber !==
                null
        ) {

            requestedRuntimeVideoIndex =
                getRuntimeVideoIndexFromOriginalNumber(
                    requestedProject,
                    deepLink.videoNumber
                );

        }


        /*
            A valid project + valid video opens the exact
            original JSON video.

            A project-only URL keeps the site's random
            opening-video behaviour.

            Invalid video numbers safely fall back to the
            project's runtime first video.
        */

        currentVideoIndex =
            requestedRuntimeVideoIndex >= 0
                ? requestedRuntimeVideoIndex
                : 0;


        ensureSeenNormalVideos();


        if (
            requestedProjectIndex >= 0
        ) {

            /*
                External/deep project links are deliberate project opens:
                continue through the remaining videos, then return to max-2.
            */
            fullProjectMode =
                true;


            fullProjectEndIndex =
                currentProject().videos.length - 1;

        }

        else {

            buildNormalProjectSequence(
                currentProjectIndex
            );


            normalSequencePosition =
                0;


            currentVideoIndex =
                normalSequenceVideos[0];


            markNormalVideoSeen(
                currentProjectIndex,
                currentVideoIndex
            );

        }


        if (
            deepLink.projectId &&
            requestedProjectIndex < 0
        ) {

            const cleanUrl =
                new URL(
                    window.location.href
                );


            cleanUrl.searchParams.delete(
                "project"
            );


            cleanUrl.searchParams.delete(
                "video"
            );


            window.history.replaceState(
                {},
                "",
                cleanUrl
            );

        }


        else if (
            requestedProjectIndex >= 0
        ) {

            /*
                Normalize the URL.

                - project-only links gain the exact video
                  number chosen for this visit.
                - invalid video numbers are replaced with
                  the valid fallback video's number.
            */

            syncProjectUrl(
                "replace"
            );

        }


        setSoundLabelImmediately();


        await loadCurrentVideo(
            true
        );


        /*
            Phones keep the Slide landing.
            Desktop/tablet starts directly in View All.
        */
        if (
            isDesktop() &&
            !(
                hasExactDeepLink &&
                requestedRuntimeVideoIndex >= 0
            )
        ) {

            await enterProjectAll();

        }


        document.documentElement.classList.add(
            "initial-surface-ready"
        );


        /*
            Posters are cheap and should feel instant, so warm the
            first visible cluster immediately. Preview MP4 metadata
            remains an idle task.
        */

        warmVisibleIndexPosters();


        const warmIndexWhenIdle =
            () => {

                warmIndexPreviews();

            };


        if (
            "requestIdleCallback" in window
        ) {

            requestIdleCallback(
                warmIndexWhenIdle,
                {
                    timeout:
                        1800
                }
            );

        }

        else {

            setTimeout(
                warmIndexWhenIdle,
                700
            );

        }

    }

    catch (
        error
    ) {

        console.error(
            error
        );

    }

}


/* =====================================================
   BROWSER HISTORY / DEEP LINK NAVIGATION
   ===================================================== */

window.addEventListener(
    "popstate",
    async () => {

        if (
            !projects.length
        ) {

            return;

        }


        const deepLink =
            getDeepLinkRequest();


        const requestedProjectIndex =
            findProjectIndexById(
                deepLink.projectId
            );


        const targetProjectIndex =
            requestedProjectIndex >= 0
                ? requestedProjectIndex
                : 0;


        const targetProject =
            projects[
                targetProjectIndex
            ];


        if (
            requestedProjectIndex >= 0 &&
            deepLink.videoNumber !== null
        ) {
            noteUiInteraction();
        }


        let targetVideoIndex =
            0;


        if (
            requestedProjectIndex >= 0 &&
            deepLink.videoNumber !==
                null
        ) {

            const resolved =
                getRuntimeVideoIndexFromOriginalNumber(
                    targetProject,
                    deepLink.videoNumber
                );


            if (
                resolved >= 0
            ) {

                targetVideoIndex =
                    resolved;

            }

        }


        if (
            targetProjectIndex ===
                currentProjectIndex &&
            targetVideoIndex ===
                currentVideoIndex &&
            !indexMode &&
            !projectAllMode
        ) {

            return;

        }


        stopAllPreviews();


        indexMode =
            false;


        projectAllMode =
            false;


        body.classList.remove(
            "index-mode",
            "project-all-mode"
        );


        indexView.classList.remove(
            "visible"
        );


        currentProjectIndex =
            targetProjectIndex;


        currentVideoIndex =
            targetVideoIndex;


        renderedProjectIndex =
            null;


        await loadCurrentVideo(
            true
        );

    }
);


/* =====================================================
   RESIZE / ORIENTATION
   ===================================================== */

let resizeTimer =
    null;


window.addEventListener(
    "resize",
    () => {

        if (
            resizeTimer
        ) {

            clearTimeout(
                resizeTimer
            );

        }


        resizeTimer =
            setTimeout(
                () => {

                    fitMainVideo();


                    resizeIndexCards();


                    if (
                        projectAllMode
                    ) {

                        layoutProjectAllGrid();

                    }

                },
                120
            );

    }
);


/* =====================================================
   VISIBILITY
   ===================================================== */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.hidden
        ) {

            resumeAfterVisibility =
                !video.paused &&
                !video.ended &&
                !indexMode &&
                !projectAllMode;


            video.pause();


            stopAllPreviews();


            return;

        }


        if (
            resumeAfterVisibility &&
            !indexMode &&
            !projectAllMode
        ) {

            video
                .play()
                .catch(
                    () => {}
                );

        }


        resumeAfterVisibility =
            false;


        if (
            indexMode
        ) {

            activatePreviewsIn(
                indexGrid
            );

        }


        if (
            projectAllMode
        ) {

            activatePreviewsIn(
                projectAllGrid
            );

        }

    }
);


/* =====================================================
   INIT
   ===================================================== */

updateResponsiveBodyClasses();

fitAybakEndCardWord();

renderIndexWord(
    0
);


loadProjects();



window.addEventListener(
    "resize",
    () => {

        syncIndexToSoundCenter();

    }
);


window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            syncIndexToSoundCenter,
            80
        );

    }
);



window.setTimeout(
    () => {

        document.documentElement.classList.add(
            "initial-surface-ready"
        );

    },
    2000
);


/* UNIFIED EMBED BOOTSTRAP */
(function(){
    const unifiedParams = new URLSearchParams(window.location.search);
    if(unifiedParams.get("view") !== "all") return;
    const unifiedTarget = unifiedParams.get("project");
    let unifiedTries = 0;
    const unifiedBoot = () => {
        unifiedTries++;
        try {
            if(
                unifiedTarget &&
                projects.length &&
                typeof findProjectIndexById === "function" &&
                typeof enterProjectAll === "function"
            ){
                const i=findProjectIndexById(unifiedTarget);
                if(i>=0){
                    currentProjectIndex=i;
                    renderedProjectIndex=null;
                    if(typeof currentVideoIndex !== "undefined") currentVideoIndex=0;
                    if(typeof currentImageIndex !== "undefined") currentImageIndex=0;
                    Promise.resolve(enterProjectAll()).catch(()=>{});
                    return;
                }
            }
        }catch(error){console.error(error);}
        if(unifiedTries<100) window.setTimeout(unifiedBoot,100);
    };
    window.setTimeout(unifiedBoot,120);
})();

</script>
