<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
    }

    body {
        cursor: pointer;
    }


    /* LEFT INFORMATION */

    .info {
        position: fixed;
        top: 32px;
        left: 48px;
        z-index: 10;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 17px;
        font-weight: 400;
        line-height: 1.15;
    }


    /* NAME / LOGO */

    .logo {
        position: relative;
        display: block;

        width: max-content;
        height: 78px;

        margin: 0 0 14px 0;
        padding: 0;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 21px;
        font-weight: 500;
        line-height: 1.05;
        letter-spacing: 0;

        text-decoration: none;
        color: inherit;

        cursor: pointer;
    }

    .logo-text {
        position: absolute;

        top: 13px;
        left: 0;

        font-size: 21px;
        font-weight: 500;
        line-height: 1.05;

        transform-origin: left center;

        transition:
            font-size 0.12s ease,
            font-weight 0.12s ease,
            line-height 0.12s ease,
            top 0.12s ease;
    }

    /*
        Border stays in exactly the same position.
        It does not affect the layout or push anything below it.
    */

    .logo:hover::after {
        content: "";

        position: absolute;

        top: 0;
        bottom: 0;

        left: -12px;
        right: -48px;

        border: 4px solid #000;

        pointer-events: none;
    }

    /*
        On hover the name becomes the same
        typographic level as the information below.
        The logo container itself does NOT shrink.
    */

    .logo:hover .logo-text {
        top: 17px;

        font-size: 17px;
        font-weight: 400;
        line-height: 1.15;
    }


    /* CONTACT / SOCIAL */

    .contact {
        margin: 0;
        padding: 0;
    }

    .social {
        display: flex;
        flex-direction: column;
        gap: 0;

        margin: 0;
        padding: 0;
    }

    .info a {
        color: inherit;
        text-decoration: none;
        font-weight: 400;
    }

    .info a:hover {
        text-decoration: underline;
    }


    /* SLIDESHOW */

    #slideshow {
        position: fixed;
        inset: 0;

        width: 100vw;
        height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        pointer-events: none;
    }

    .slide {
        position: absolute;

        width: auto;
        height: auto;

        max-width: 70vw;
        max-height: 80vh;

        object-fit: contain;

        opacity: 0;
    }

    .slide.active {
        opacity: 1;
    }


    /* MOBILE */

    @media (max-width: 600px) {

        .info {
            top: 20px;
            left: 24px;
            font-size: 14px;
        }

        .logo {
            height: 62px;
            margin-bottom: 12px;
        }

        .logo-text {
            top: 11px;
            font-size: 18px;
            line-height: 1.05;
        }

        .logo:hover .logo-text {
            top: 14px;
            font-size: 14px;
            font-weight: 400;
            line-height: 1.15;
        }

        .logo:hover::after {
            left: -10px;
            right: -34px;
            border-width: 3px;
        }

        .slide {
            max-width: 84vw;
            max-height: 72vh;
        }
    }
</style>
</head>

<body>

<div class="info">

    <a
        class="logo"
        href="https://denizalpaybak.com/"
        target="_self"
    >
        <span class="logo-text">
            Denizalp<br>
            aybak
        </span>
    </a>

    <div class="contact">
        <a
            href="mailto:d@denizalpaybak.com"
            target="_blank"
            rel="noopener"
        >
            d@denizalpaybak.com
        </a>
    </div>

    <div class="social">

        <a
            href="https://www.instagram.com/denizalpaybak/"
            target="_blank"
            rel="noopener"
        >
            instagram @denizalpaybak
        </a>

        <a
            href="https://models.com/people/denizalp-aybak"
            target="_blank"
            rel="noopener"
        >
            models.com
        </a>

    </div>

</div>


<div id="slideshow">

    <img class="slide active" src="01.jpg">
    <img class="slide" src="02.jpg">
    <img class="slide" src="03.jpg">
    <img class="slide" src="04.jpg">

</div>


<script>

    const slides = document.querySelectorAll('.slide');

    let current = 0;
    let manualMode = false;

    function nextSlide() {

        slides[current].classList.remove('active');

        current = (current + 1) % slides.length;

        slides[current].classList.add('active');
    }


    /* Automatic slideshow: every 3 seconds */

    const autoplay = setInterval(() => {

        if (!manualMode) {
            nextSlide();
        }

    }, 3000);


    /*
        First click stops autoplay.
        The first click does not change the image.
    */

    document.body.addEventListener('click', (event) => {

        /*
            Links are handled normally.
            They do not control the slideshow.
        */

        if (event.target.closest('a')) {
            return;
        }

        if (!manualMode) {

            manualMode = true;

            return;
        }

        nextSlide();

    });

</script>

</body>
</html>
