<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
    }

    body {
        cursor: pointer;
    }


    /* LEFT INFORMATION */

    .info {
        position: fixed;
        top: 32px;
        left: 48px;
        z-index: 10;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.15;
    }


    /* NAME / LOGO */

    .logo {
        position: relative;
        display: block;

        width: 190px;
        height: 70px;

        margin: 0 0 14px 0;
        padding: 0;

        color: inherit;
        text-decoration: none;

        cursor: pointer;
    }


    /* NAME TEXT */

    .logo-text {
        position: absolute;

        top: 18px;
        left: 0;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.15;
        letter-spacing: 0;

        white-space: nowrap;

        transform-origin: left center;
        transform: scale(1);
    }


    /* DESKTOP HOVER BORDER */

    .logo:hover::after {
        content: "";

        position: absolute;

        top: 0;
        left: -12px;

        width: 190px;
        height: 70px;

        border: 6px solid #000;

        pointer-events: none;
    }


    /* DESKTOP HOVER TEXT */

    .logo:hover .logo-text {
        transform: scale(1.4);
        font-weight: 500;
    }


    /* CONTACT / SOCIAL */

    .contact {
        margin: 0;
        padding: 0;
    }

    .social {
        display: flex;
        flex-direction: column;
        gap: 0;

        margin: 0;
        padding: 0;
    }

    .info a {
        color: inherit;
        text-decoration: none;
        font-weight: 400;
    }

    .info a:hover {
        text-decoration: underline;
    }


    /* SLIDESHOW */

    #slideshow {
        position: fixed;
        inset: 0;

        width: 100vw;
        height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        pointer-events: none;
    }

    .slide {
        position: absolute;

        width: auto;
        height: auto;

        max-width: 70vw;
        max-height: 80vh;

        object-fit: contain;

        opacity: 0;
    }

    .slide.active {
        opacity: 1;
    }


    /* MOBILE */

    @media (max-width: 600px) {

        .info {
            top: 20px;
            left: 24px;
            font-size: 13px;
        }

        .logo {
            width: 160px;
            height: 58px;
            margin-bottom: 12px;
        }

        .logo-text {
            top: 15px;
            font-size: 13px;
        }

        /*
            Mobile intro is instantaneous.
            No transition / no animation.
        */

        .logo.intro .logo-text {
            transform: scale(1.4);
            font-weight: 500;
        }

        .logo.intro::after {
            content: "";

            position: absolute;

            top: 0;
            left: -10px;

            width: 160px;
            height: 58px;

            border: 5px solid #000;

            pointer-events: none;
        }

        .slide {
            max-width: 84vw;
            max-height: 72vh;
        }
    }

</style>
</head>

<body>

<div class="info">

    <a
        class="logo"
        href="https://denizalpaybak.com/"
        target="_self"
    >
        <span class="logo-text">
            Denizalp<br>
            aybak
        </span>
    </a>

    <div class="contact">
        <a
            href="mailto:d@denizalpaybak.com"
            target="_blank"
            rel="noopener"
        >
            d@denizalpaybak.com
        </a>
    </div>

    <div class="social">

        <a
            href="https://www.instagram.com/denizalpaybak/"
            target="_blank"
            rel="noopener"
        >
            instagram @denizalpaybak
        </a>

        <a
            href="https://models.com/people/denizalp-aybak"
            target="_blank"
            rel="noopener"
        >
            models.com
        </a>

    </div>

</div>


<div id="slideshow">

    <img class="slide active" src="01.jpg">
    <img class="slide" src="02.jpg">
    <img class="slide" src="03.jpg">
    <img class="slide" src="04.jpg">

</div>


<script>

    const slides = document.querySelectorAll('.slide');

    let current = 0;
    let manualMode = false;


    /* SLIDESHOW */

    function nextSlide() {

        slides[current].classList.remove('active');

        current = (current + 1) % slides.length;

        slides[current].classList.add('active');
    }


    /* Automatic slideshow: every 3 seconds */

    const autoplay = setInterval(() => {

        if (!manualMode) {
            nextSlide();
        }

    }, 3000);


    /*
        First click stops autoplay.
        The first click does not change the image.
    */

    document.body.addEventListener('click', (event) => {

        if (event.target.closest('a')) {
            return;
        }

        if (!manualMode) {

            manualMode = true;

            return;
        }

        nextSlide();

    });


    /*
        MOBILE INTRO

        The logo starts large with its border.
        After 3 seconds it instantly returns
        to its normal state.

        No animation.
        No transition.
    */

    if (window.matchMedia('(max-width: 600px)').matches) {

        const logo = document.querySelector('.logo');

        logo.classList.add('intro');

        setTimeout(() => {
            logo.classList.remove('intro');
        }, 3000);

    }

</script>

</body>
</html>
