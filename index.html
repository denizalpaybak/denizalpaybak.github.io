<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
    }

    body {
        cursor: pointer;
    }


    /* LEFT INFORMATION */

    .info {
        position: fixed;
        top: 32px;
        left: 48px;
        z-index: 10;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.15;
    }


    /* NAME / LOGO */

    .logo {
        position: relative;
        display: block;

        width: 190px;
        height: 70px;

        margin: 0 0 14px 0;
        padding: 0;

        color: inherit;
        text-decoration: none;

        cursor: pointer;
    }


    /* NORMAL NAME */

    .logo-text {
        position: absolute;

        top: 18px;
        left: 0;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.15;
        letter-spacing: 0;

        white-space: nowrap;
    }


    /* HOVER / AYBAK */

    .logo-wordmark {
        position: absolute;

        top: 18px;
        left: 0;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 500;
        line-height: 1.15;
        letter-spacing: 0.08em;

        white-space: nowrap;

        display: none;
    }


    /* SHOW AYBAK ON HOVER */

    .logo:hover .logo-wordmark {
        display: block;
    }

    .logo:hover .logo-text {
        display: none;
    }


    /*
        LETTER-BY-LETTER TRANSITION

        AYBAK -> aybak
    */

    .logo-transition {
        position: absolute;

        top: 0;
        left: 0;

        width: 190px;
        height: 70px;

        display: none;

        font-family: Arial, Helvetica, sans-serif;
    }

    .logo-transition .denizalp {
        position: absolute;

        top: 0;
        left: 0;

        font-size: 15px;
        font-weight: 400;
        line-height: 1.15;

        opacity: 0;
    }

    .logo-transition .aybak {
        position: absolute;

        top: 18px;
        left: 0;

        display: flex;

        font-size: 15px;
        font-weight: 500;
        line-height: 1.15;

        letter-spacing: 0.08em;
    }

    .logo-transition .letter {
        display: inline-block;
    }


    /* CONTACT / SOCIAL */

    .contact {
        margin: 0;
        padding: 0;
    }

    .social {
        display: flex;
        flex-direction: column;
        gap: 0;

        margin: 0;
        padding: 0;
    }

    .info a {
        color: inherit;
        text-decoration: none;
        font-weight: 400;
    }

    .info a:hover {
        text-decoration: underline;
    }


    /* SLIDESHOW */

    #slideshow {
        position: fixed;
        inset: 0;

        width: 100vw;
        height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        pointer-events: none;
    }

    .slide {
        position: absolute;

        width: auto;
        height: auto;

        max-width: 70vw;
        max-height: 80vh;

        object-fit: contain;

        opacity: 0;
    }

    .slide.active {
        opacity: 1;
    }


    /* MOBILE */

    @media (max-width: 600px) {

        .info {
            top: 20px;
            left: 24px;
            font-size: 13px;
        }

        .logo {
            width: 160px;
            height: 58px;
            margin-bottom: 12px;
        }

        .logo-text {
            top: 15px;
            font-size: 13px;
        }

        .logo-wordmark {
            top: 15px;
            font-size: 13px;
        }

        .logo-transition {
            width: 160px;
            height: 58px;
        }

        .logo-transition .denizalp {
            font-size: 13px;
        }

        .logo-transition .aybak {
            top: 15px;
            font-size: 13px;
        }

        .slide {
            max-width: 84vw;
            max-height: 72vh;
        }
    }

</style>
</head>

<body>

<div class="info">

    <a
        class="logo"
        href="https://denizalpaybak.com/"
        target="_self"
    >

        <!-- NORMAL -->

        <span class="logo-text">
            Denizalp<br>
            aybak
        </span>


        <!-- HOVER -->

        <span class="logo-wordmark">
            AYBAK
        </span>


        <!-- TRANSITION -->

        <span class="logo-transition">

            <span class="denizalp">
                Denizalp
            </span>

            <span class="aybak">

                <span class="letter">A</span>
                <span class="letter">Y</span>
                <span class="letter">B</span>
                <span class="letter">A</span>
                <span class="letter">K</span>

            </span>

        </span>

    </a>


    <div class="contact">

        <a
            href="mailto:d@denizalpaybak.com"
            target="_blank"
            rel="noopener"
        >
            d@denizalpaybak.com
        </a>

    </div>


    <div class="social">

        <a
            href="https://www.instagram.com/denizalpaybak/"
            target="_blank"
            rel="noopener"
        >
            instagram @denizalpaybak
        </a>

        <a
            href="https://models.com/people/denizalp-aybak"
            target="_blank"
            rel="noopener"
        >
            models.com
        </a>

    </div>

</div>


<div id="slideshow">

    <img class="slide active" src="01.jpg">
    <img class="slide" src="02.jpg">
    <img class="slide" src="03.jpg">
    <img class="slide" src="04.jpg">

</div>


<script>

    const slides = document.querySelectorAll('.slide');

    let current = 0;
    let manualMode = false;


    /* SLIDESHOW */

    function nextSlide() {

        slides[current].classList.remove('active');

        current = (current + 1) % slides.length;

        slides[current].classList.add('active');
    }


    /* Automatic slideshow: every 3 seconds */

    const autoplay = setInterval(() => {

        if (!manualMode) {
            nextSlide();
        }

    }, 3000);


    /*
        First click stops autoplay.
        The first click does not change the image.
    */

    document.body.addEventListener('click', (event) => {

        if (event.target.closest('a')) {
            return;
        }

        if (!manualMode) {

            manualMode = true;

            return;
        }

        nextSlide();

    });


    /*

        LOGO TRANSITION

        AYBAK
        aYBAK
        ayBAK
        aybAK
        aybaK
        aybak

        Then Denizalp appears above it.

    */

    const logo = document.querySelector('.logo');
    const wordmark = document.querySelector('.logo-wordmark');
    const normalLogo = document.querySelector('.logo-text');
    const transition = document.querySelector('.logo-transition');
    const denizalp = document.querySelector('.denizalp');
    const letters = document.querySelectorAll('.logo-transition .letter');

    let transitionRunning = false;


    function runLogoTransition() {

        if (transitionRunning) {
            return;
        }

        transitionRunning = true;

        wordmark.style.display = 'none';
        normalLogo.style.display = 'none';

        transition.style.display = 'block';

        denizalp.style.opacity = '0';

        letters.forEach((letter) => {
            letter.style.transform = 'scale(1)';
        });


        /*
            Each letter becomes lowercase one after another.
        */

        letters[0].textContent = 'a';

        setTimeout(() => {
            letters[1].textContent = 'y';
        }, 180);

        setTimeout(() => {
            letters[2].textContent = 'b';
        }, 360);

        setTimeout(() => {
            letters[3].textContent = 'a';
        }, 540);

        setTimeout(() => {
            letters[4].textContent = 'k';
        }, 720);


        /*
            Denizalp appears after the lowercase
            transformation has finished.
        */

        setTimeout(() => {
            denizalp.style.opacity = '1';
        }, 900);


        /*
            Return to the normal logo.
        */

        setTimeout(() => {

            transition.style.display = 'none';

            normalLogo.style.display = 'block';

            denizalp.style.opacity = '0';

            letters[0].textContent = 'A';
            letters[1].textContent = 'Y';
            letters[2].textContent = 'B';
            letters[3].textContent = 'A';
            letters[4].textContent = 'K';

            transitionRunning = false;

        }, 1500);

    }


    /*
        DESKTOP

        When leaving the AYBAK hover state,
        play the transformation.
    */

    logo.addEventListener('mouseleave', () => {

        if (window.matchMedia('(min-width: 601px)').matches) {
            runLogoTransition();
        }

    });


    /*
        MOBILE

        Mobile starts in the AYBAK state.
        After the first 3 seconds, the same
        transition runs automatically.
    */

    if (window.matchMedia('(max-width: 600px)').matches) {

        normalLogo.style.display = 'none';
        transition.style.display = 'block';

        letters[0].textContent = 'A';
        letters[1].textContent = 'Y';
        letters[2].textContent = 'B';
        letters[3].textContent = 'A';
        letters[4].textContent = 'K';

        denizalp.style.opacity = '0';

        setTimeout(() => {

            runLogoTransition();

        }, 3000);

    }

</script>

</body>
</html>
