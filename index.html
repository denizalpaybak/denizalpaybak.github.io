<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        cursor: pointer;
    }

    #slideshow {
        width: 100%;
        height: 100%;
        position: relative;
    }

    .slide {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
        pointer-events: none;
    }

    .slide.active {
        opacity: 1;
    }
</style>
</head>

<body>

<div id="slideshow">

    <img class="slide active" src="01.jpg">
    <img class="slide" src="02.jpg">
    <img class="slide" src="03.jpg">
    <img class="slide" src="04.jpg">

</div>

<script>
    const slides = document.querySelectorAll('.slide');
    let current = 0;
    let manualMode = false;

    function nextSlide() {
        slides[current].classList.remove('active');

        current = (current + 1) % slides.length;

        slides[current].classList.add('active');
    }

    // Automatic slideshow: every 3 seconds
    const autoplay = setInterval(() => {
        if (!manualMode) {
            nextSlide();
        }
    }, 3000);

    // First click switches permanently to manual mode
document.body.addEventListener('click', () => {
    if (!manualMode) {
        manualMode = true;
        return;
    }

    nextSlide();
});
</script>

</body>
</html>
