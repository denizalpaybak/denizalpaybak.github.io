<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
    }

    body {
        cursor: pointer;
    }


    /* LEFT INFORMATION */

    .info {
        position: fixed;
        top: 32px;
        left: 32px;
        z-index: 10;

        font-family: Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: 500;
        line-height: 1.2;
    }

.logo {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: 0;

    display: inline-block;

    margin-left: 0;
    margin-bottom: 10px;

    padding: 8px 36px 8px 0;

    position: relative;
}

.logo:hover::after {
    content: "";
    position: absolute;

    top: 0;
    bottom: 0;
    left: -12px;
    right: -36px;

    border: 4px solid #000;

    pointer-events: none;
}
    .contact {
        margin-bottom: 0;
    }

    .social {
        display: flex;
        flex-direction: column;
        gap: 0;
    }

    .info a {
        color: inherit;
        text-decoration: none;
    }

    .info a:hover {
        text-decoration: underline;
    }


    /* SLIDESHOW */

    #slideshow {
        position: fixed;
        inset: 0;

        width: 100vw;
        height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        pointer-events: none;
    }

    .slide {
        position: absolute;

        width: auto;
        height: auto;

        max-width: 70vw;
        max-height: 80vh;

        object-fit: contain;

        opacity: 0;
    }

    .slide.active {
        opacity: 1;
    }


    /* MOBILE */

    @media (max-width: 600px) {

        .info {
            top: 20px;
            left: 20px;
            font-size: 14px;
        }

        .logo {
            font-size: 14px;
            margin-left: -8px;
            margin-bottom: 16px;
            padding: 7px 20px 7px 8px;
            border-width: 3px;
        }

        .slide {
            max-width: 84vw;
            max-height: 72vh;
        }
    }
</style>
</head>

<body>

<div class="info">

    <div class="logo">
        Denizalp<br>
        aybak
    </div>

    <div class="contact">
        <a href="mailto:d@denizalpaybak.com"
           target="_blank"
           rel="noopener">
            d@denizalpaybak.com
        </a>
    </div>

    <div class="social">

        <a href="https://www.instagram.com/denizalpaybak/"
           target="_blank"
           rel="noopener">
            instagram @denizalpaybak
        </a>

        <a href="https://models.com/people/denizalp-aybak"
           target="_blank"
           rel="noopener">
            models.com
        </a>

    </div>

</div>


<div id="slideshow">

    <img class="slide active" src="01.jpg">
    <img class="slide" src="02.jpg">
    <img class="slide" src="03.jpg">
    <img class="slide" src="04.jpg">

</div>


<script>

    const slides = document.querySelectorAll('.slide');

    let current = 0;
    let manualMode = false;

    function nextSlide() {

        slides[current].classList.remove('active');

        current = (current + 1) % slides.length;

        slides[current].classList.add('active');
    }


    // Automatic slideshow: every 3 seconds

    const autoplay = setInterval(() => {

        if (!manualMode) {
            nextSlide();
        }

    }, 3000);


    // First click switches permanently to manual mode.
    // The first click does NOT change the image.

    document.body.addEventListener('click', (event) => {

        // Clicking links does not control the slideshow.
        if (event.target.closest('a')) {
            return;
        }

        if (!manualMode) {

            manualMode = true;

            return;
        }

        nextSlide();

    });

</script>

</body>
</html>
