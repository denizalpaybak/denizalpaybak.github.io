<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Denizalp Aybak</title>
<link href="https://use.typekit.net/rmn7qgm.css" rel="stylesheet"/>
<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #fff;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

body {
    color: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =====================================================
   VARIABLES
   ===================================================== */

:root {

    --page-x: 48px;
    --page-top: 32px;
    --page-bottom: 48px;

    --font-size: 15px;
    --line-height: 1.15;

    --major-gap: 17px;
    --column-gap: 48px;

}


/* =====================================================
   PAGE
   ===================================================== */

.page {
    position: relative;

    width: 100%;

    height: 100vh;
    height: 100dvh;

    padding:
        var(--page-top)
        var(--page-x)
        var(--page-bottom)
        var(--page-x);

    overflow: hidden;
}


/* =====================================================
   MAIN GRID
   ===================================================== */

.landing-grid {
    position: relative;

    z-index: 2;

    display: grid;

    grid-template-columns:
        minmax(0, 530px)
        minmax(0, 1fr);

    grid-template-rows:
        auto
        auto
        auto
        auto
        minmax(0, 1fr);

    column-gap:
        var(--column-gap);

    row-gap:
        var(--major-gap);

    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    pointer-events: none;
}

.logo,
.navigation,
.contact,
.biography,
.opening {
    pointer-events: auto;
}


/* =====================================================
   LOGO
   ===================================================== */

.logo {
    position: relative;

    grid-column: 1;
    grid-row: 1;

    display: block;

    width: max-content;
    height: 34px;

    margin: 0;
    padding: 0;

    border: 0;

    appearance: none;
    -webkit-appearance: none;

    background: transparent;

    color: #000;

    cursor: pointer;

    font-family: inherit;
    font-size: var(--font-size);
    font-weight: 400;
    line-height: var(--line-height);

    text-align: left;

    -webkit-tap-highlight-color: transparent;
}

.logo-name {
    position: absolute;

    top: 0;
    left: 0;

    white-space: nowrap;
}

.logo-aybak {
    position: absolute;

    top: 17px;
    left: 0;

    white-space: nowrap;
}


/* =====================================================
   OPENING
   ===================================================== */

.opening {
    grid-column: 1;
    grid-row: 2;

    margin: 0;
    padding: 0;

    font-size: var(--font-size);
    font-weight: 400;
    line-height: var(--line-height);

    text-wrap: pretty;
}


/* =====================================================
   NAVIGATION
   ===================================================== */

.navigation {
    grid-column: 1;
    grid-row: 3;

    display: flex;
    flex-direction: column;

    margin: 0;
    padding: 0;
}

.navigation a {
    display: inline-flex;
    align-items: center;
    gap: 0.30em;

    width: max-content;

    color: #000;
    text-decoration: none;

    font-size: var(--font-size);
    font-weight: 400;
    line-height: var(--line-height);

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   CONTACT
   ===================================================== */

.contact {
    grid-column: 1;
    grid-row: 4;

    display: flex;
    flex-direction: column;

    margin: 0;
    padding: 0;
}

.contact a {
    color: #000;
    text-decoration: none;

    font-size: var(--font-size);
    font-weight: 400;
    line-height: var(--line-height);
}

.contact a:hover {
    text-decoration: underline;
}


/* =====================================================
   BIOGRAPHY
   ===================================================== */

.biography {
    grid-column: 1;
    grid-row: 5;

    align-self: start;

    width: 100%;
    max-width: 530px;

    margin: 0;
    padding: 0;

    font-size: var(--font-size);
    font-weight: 400;
    line-height: var(--line-height);
}

.biography p {
    margin:
        0
        0
        var(--major-gap)
        0;

    padding: 0;

    font-size: inherit;
    font-weight: inherit;
    line-height: inherit;

    text-wrap: pretty;
}

.biography p:last-child {
    margin-bottom: 0;
}

.biography span {
    font-size: inherit;
    font-weight: inherit;
    line-height: inherit;
}


.portfolio-download a {
    color: inherit;
    text-decoration: none;

    font-size: inherit;
    font-weight: inherit;
    line-height: inherit;

    -webkit-tap-highlight-color: transparent;
}

.portfolio-download a:hover {
    text-decoration: underline;
}

/*
   Compact Helvetica-compatible arrow family.
   Both glyphs share one optical cell and one stroke weight, but their
   internal geometry is tuned separately so down/external arrows feel
   equal rather than merely measuring equal.
*/
.site-arrow {
    display: inline-block;
    flex: 0 0 auto;
    width: 0.66em;
    height: 0.66em;
    overflow: visible;
    color: currentColor;
    pointer-events: none;
    vertical-align: -0.055em;
}

.site-arrow path {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.02;
    stroke-linecap: square;
    stroke-linejoin: miter;
}

.site-arrow--down,
.site-arrow--external {
    transform: none;
}

/* Keep every text + arrow pair on the same typographic baseline. */
.navigation a,
.portfolio-download a {
    display: inline-flex;
    align-items: center;
    gap: 0.30em;
}


.item {
    white-space: nowrap;
}

.bio-ending {
    white-space: nowrap;
}


/*
    Hidden everywhere by default.

    On portrait mobile this becomes a real line break
    before Peugeot, creating a deliberate 3 + 3 split.
*/

.mobile-client-break {
    display: none;
}


/* =====================================================
   MEDIA FIELD
   ===================================================== */

.media-field {
    position: relative;

    grid-column: 2;
    grid-row: 1 / -1;

    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    pointer-events: none;
}


/* =====================================================
   PHOTOGRAPHY FIELD
   ===================================================== */

.photography-field {
    position: fixed;

    z-index: 1;

    top: var(--page-top);
    right: var(--page-x);
    bottom: var(--page-bottom);
    left: var(--page-x);

    visibility: hidden;

    overflow: hidden;

    pointer-events: none;

    contain:
        layout
        paint;
}

.photography-field.active {
    visibility: visible;
}


/* =====================================================
   PHOTOGRAPHY STAGE
   ===================================================== */

#scattered-stage {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    pointer-events: none;
}


/* =====================================================
   PROJECT GROUP
   ===================================================== */

.photo-group {
    position: absolute;

    top: 0;
    left: 0;

    width:
        var(
            --group-width,
            100px
        );

    height:
        var(
            --group-height,
            100px
        );

    visibility: hidden;

    pointer-events: none;

    transform:
        translate3d(
            var(--group-x, 0px),
            var(--group-y, 0px),
            0
        );

    backface-visibility: hidden;

    contain:
        layout
        paint;
}

.photo-group.visible {
    visibility: visible;
}


/* =====================================================
   INDIVIDUAL PHOTOS
   ===================================================== */

.project-photo {
    position: absolute;

    display: block;

    width: auto;

    height:
        var(
            --photo-height,
            100px
        );

    top:
        var(
            --photo-y,
            0px
        );

    left:
        var(
            --photo-x,
            0px
        );

    object-fit: contain;

    pointer-events: none;

    backface-visibility: hidden;

    transform: translateZ(0);
}


/* =====================================================
   FILM FIELD
   ===================================================== */

.film-field {
    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    visibility: hidden;

    pointer-events: none;
}

.film-field.active {
    visibility: visible;

    pointer-events: auto;
}


/* =====================================================
   FILM
   ===================================================== */

.film-link {
    display: block;

    width: 100%;

    max-width:
        calc(
            (
                100vh -
                var(--page-top) -
                var(--page-bottom)
            ) *
            16 / 9
        );

    aspect-ratio: 16 / 9;

    color: inherit;
    text-decoration: none;

    overflow: hidden;

    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
}

#film-video {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center center;

    pointer-events: none;

    backface-visibility: hidden;

    transform: translateZ(0);
}


/* =====================================================
   MOBILE PORTRAIT
   ===================================================== */

@media
    (max-width: 600px)
    and (orientation: portrait) {

    html,
    body {
        overflow: hidden;
    }

    :root {

        --page-x: 24px;
        --page-top: 20px;
        --page-bottom: 32px;

        --font-size: 13px;
        --line-height: 1.15;

        --major-gap: 15px;

    }

    .landing-grid {
        grid-template-columns:
            minmax(0, 1fr);

        grid-template-rows:
            auto
            auto
            auto
            auto
            auto
            minmax(0, 1fr);

        column-gap: 0;

        row-gap:
            var(--major-gap);
    }

    .logo {
        grid-column: 1;
        grid-row: 1;

        height: 30px;
    }

    .logo-aybak {
        top: 15px;
    }

    .opening {
        grid-column: 1;
        grid-row: 2;
    }

    .navigation {
        grid-column: 1;
        grid-row: 3;
    }

    .contact {
        grid-column: 1;
        grid-row: 4;
    }

    .biography {
        grid-column: 1;
        grid-row: 5;

        max-width: none;
    }

    .media-field {
        grid-column: 1;
        grid-row: 6;

        min-height: 0;
    }

    .photography-field {
        position: absolute;

        inset: 0;

        z-index: auto;

        width: 100%;
        height: 100%;
    }

    .bio-ending {
        white-space: normal;
    }

    /*
        Portrait mobile only:

        vakko, bee goddess, zeynep arcay,
        peugeot, skechers, lc waikiki
    */

    .mobile-client-break {
        display: inline;
    }

    .film-link {
        max-width: 100%;
    }

}


/* =====================================================
   MOBILE LANDSCAPE
   ===================================================== */

@media
    (orientation: landscape)
    and (max-height: 650px)
    and (max-width: 1000px) {

    :root {

        --page-x: 24px;
        --page-top: 14px;
        --page-bottom: 14px;

        --font-size: 13px;
        --line-height: 1.15;

        --major-gap: 8px;
        --column-gap: 24px;

    }

    .landing-grid {
        grid-template-columns:
            minmax(0, 2fr)
            minmax(0, 1fr);
    }

    .logo {
        height: 30px;
    }

    .logo-aybak {
        top: 15px;
    }

    .opening,
    .biography {
        max-width: none;
    }

    .opening,
    .biography p {
        text-wrap: pretty;
    }

    .biography p {
        margin-bottom:
            var(--major-gap);
    }

    .photography-field {
        position: absolute;

        inset: 0;

        z-index: auto;

        width: 100%;
        height: 100%;
    }

    .bio-ending {
        white-space: normal;
    }

    .film-link {
        max-width: 100%;
    }

}


/* =====================================================
   SHORT DESKTOP
   ===================================================== */

@media
    (orientation: landscape)
    and (min-width: 1001px)
    and (max-height: 700px) {

    :root {

        --page-x: 24px;
        --page-top: 20px;
        --page-bottom: 20px;

        --font-size: 13px;
        --line-height: 1.15;

        --major-gap: 9px;
        --column-gap: 32px;

    }

    .landing-grid {
        grid-template-columns:
            minmax(0, 470px)
            minmax(0, 1fr);
    }

    .logo {
        height: 30px;
    }

    .logo-aybak {
        top: 15px;
    }

}



/* =====================================================
   LANDING V2 — REPOSITIONED INFORMATION
   ===================================================== */

html,
body,
.page {
    transition:
        background-color 400ms cubic-bezier(.22,.61,.36,1),
        color 400ms cubic-bezier(.22,.61,.36,1);
}

.landing-grid {
    grid-template-rows: auto auto auto minmax(0, 1fr);
}

.opening {
    grid-column: 1;
    grid-row: 2;
}

.biography {
    grid-column: 1;
    grid-row: 3;
    align-self: start;
}

.navigation {
    position: fixed;
    z-index: 20;
    top: var(--page-top);
    right: var(--page-x);
    display: flex;
    align-items: flex-end;
    text-align: right;
}

.navigation a {
    width: max-content;
    text-align: right;
    transition: color 400ms cubic-bezier(.22,.61,.36,1);
}

.contact {
    position: fixed;
    z-index: 20;
    left: var(--page-x);
    bottom: var(--page-bottom);
    text-align: left;
}

.portfolio-download {
    position: fixed;
    z-index: 20;
    right: var(--page-x);
    bottom: var(--page-bottom);
    margin: 0 !important;
    text-align: right;
}

.logo,
.opening,
.biography,
.contact,
.portfolio-download,
.navigation a {
    transition: color 400ms cubic-bezier(.22,.61,.36,1);
}

/* =====================================================
   BLACK PREVIEW SURFACE
   ===================================================== */

body.preview-active,
body.preview-active .page {
    background: #000;
}

body.preview-active .logo,
body.preview-active .opening,
body.preview-active .biography,
body.preview-active .contact,
body.preview-active .contact a,
body.preview-active .portfolio-download,
body.preview-active .navigation a {
    color: transparent;
}

body.preview-photography .navigation #photography-link,
body.preview-film .navigation #film-link {
    color: #fff;
}

/* Keep only the navigation itself interactive while the preview is open. */
body.preview-active .logo,
body.preview-active .opening,
body.preview-active .biography,
body.preview-active .contact,
body.preview-active .portfolio-download {
    pointer-events: none;
}

/* =====================================================
   CENTERED FILM PREVIEW
   ===================================================== */

.film-field {
    position: fixed;
    z-index: 10;
    inset: 0;
    padding:
        var(--page-top)
        var(--page-x)
        var(--page-bottom);
    align-items: center;
    justify-content: center;
}

.film-link {
    width: min(
        calc(100vw - 2 * var(--page-x)),
        calc((100vh - var(--page-top) - var(--page-bottom)) * 16 / 9)
    );
    max-width: none;
    aspect-ratio: 16 / 9;
}

/* =====================================================
   SINGLE RANDOM PHOTOGRAPHY PREVIEW
   ===================================================== */

.photography-field {
    z-index: 10;
}

#scattered-stage.single-photo-mode .photo-group {
    visibility: hidden !important;
}

#scattered-stage.single-photo-mode .photo-group.single-photo-group {
    visibility: visible !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    transform: none !important;
    contain: none !important;
}

#scattered-stage.single-photo-mode .project-photo {
    display: none !important;
}

#scattered-stage.single-photo-mode .project-photo.single-photo-visible {
    position: absolute !important;
    display: block !important;
    top: 50% !important;
    left: 50% !important;
    width: auto !important;
    height: auto !important;
    max-width: min(72vw, calc(100vw - 2 * var(--page-x))) !important;
    max-height: min(76vh, calc(100vh - var(--page-top) - var(--page-bottom))) !important;
    object-fit: contain !important;
    transform: translate(-50%, -50%) !important;
}

/* =====================================================
   AYBAK END CARD — ONLY THE WORD
   ===================================================== */

#landing-aybak-end-card {
    position: fixed;
    inset: 0;
    z-index: 10000;
    overflow: hidden;
    visibility: hidden;
    pointer-events: none;
    background: rgba(0,0,0,0);
    transition:
        background-color 460ms cubic-bezier(.22,.61,.36,1),
        visibility 0s linear 460ms;
    touch-action: none;
}

body.landing-aybak-active #landing-aybak-end-card {
    visibility: visible;
    pointer-events: auto;
    transition:
        background-color 460ms cubic-bezier(.22,.61,.36,1),
        visibility 0s linear 0s;
}

html.landing-aybak-active:not(.landing-aybak-light),
body.landing-aybak-active:not(.landing-aybak-light),
body.landing-aybak-active:not(.landing-aybak-light) #landing-aybak-end-card {
    background: #000;
}

html.landing-aybak-active.landing-aybak-light,
body.landing-aybak-active.landing-aybak-light,
body.landing-aybak-active.landing-aybak-light #landing-aybak-end-card {
    background: #fff;
}

#landing-aybak-word {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 170ms ease;
    pointer-events: none;
}

body.landing-aybak-active #landing-aybak-word {
    opacity: 1;
    transition-delay: 255ms;
}

@media (max-width: 600px) and (orientation: portrait) {
    .landing-grid {
        grid-template-columns: minmax(0,1fr);
        grid-template-rows: auto auto auto minmax(0,1fr);
    }

    .biography {
        max-width: min(100%, 530px);
    }

    .film-field {
        padding:
            var(--page-top)
            var(--page-x)
            var(--page-bottom);
    }

    .film-link {
        width: min(
            calc(100vw - 2 * var(--page-x)),
            calc((100vh - var(--page-top) - var(--page-bottom)) * 16 / 9)
        );
    }

    #scattered-stage.single-photo-mode .project-photo.single-photo-visible {
        max-width: calc(100vw - 2 * var(--page-x)) !important;
        max-height: 62vh !important;
    }
}



/* =====================================================
   FIXED PHOTOGRAPHY PREVIEW
   ===================================================== */

#fixed-photo-preview {
    position: absolute;

    z-index: 2;

    top: 50%;
    left: 50%;

    display: block;

    width: auto;
    height: auto;

    max-width:
        min(
            72vw,
            calc(
                100vw -
                2 * var(--page-x)
            )
        );

    max-height:
        min(
            76vh,
            calc(
                100vh -
                var(--page-top) -
                var(--page-bottom)
            )
        );

    object-fit: contain;

    opacity: 0;

    visibility: hidden;

    transform:
        translate(
            -50%,
            -50%
        );

    pointer-events: none;
}

#fixed-photo-preview.visible {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    cursor: pointer;
}




/* =====================================================
   LANDING V6 — WHITE-SURFACE PREVIEW ZONES
   ===================================================== */

/*
    Photography / Film previews now live inside the unused white area
    of the landing page. No black preview state and no text hiding.
*/
body.preview-active,
body.preview-active .page,
body.preview-photography,
body.preview-film {
    background: #fff !important;
    color: #000 !important;
}

body.preview-active .logo,
body.preview-active .opening,
body.preview-active .biography,
body.preview-active .contact,
body.preview-active .contact a,
body.preview-active .portfolio-download,
body.preview-active .navigation a,
body.preview-photography .navigation #photography-link,
body.preview-film .navigation #film-link {
    color: #000 !important;
}

body.preview-active .logo,
body.preview-active .opening,
body.preview-active .biography,
body.preview-active .contact,
body.preview-active .portfolio-download {
    pointer-events: auto !important;
}

/*
    The fields themselves are positioned by JS into the largest safe
    rectangle that does not overlap the biography, navigation, contact
    or portfolio download.
*/
.photography-field,
.film-field {
    position: fixed !important;
    z-index: 10 !important;
    top: var(--preview-zone-top, 50%) !important;
    left: var(--preview-zone-left, 50%) !important;
    right: auto !important;
    bottom: auto !important;
    width: var(--preview-zone-width, 0px) !important;
    height: var(--preview-zone-height, 0px) !important;
    padding: 0 !important;
    overflow: hidden !important;
}

.film-field {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
}

.film-link {
    width: 100% !important;
    height: 100% !important;
    max-width: none !important;
    aspect-ratio: auto !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    overflow: hidden !important;
}

#film-video {
    width: 100% !important;
    height: 100% !important;
    object-fit: contain !important;
    object-position: center center !important;
}

#fixed-photo-preview {
    top: 50% !important;
    left: 50% !important;
    max-width: 100% !important;
    max-height: 100% !important;
    transform: translate(-50%, -50%) !important;
}

/*
    Avoid the old mobile rules remounting photography into media-field
    geometry. It remains a viewport-fixed preview zone on every platform.
*/
@media (max-width: 1000px) {
    .photography-field,
    .film-field {
        position: fixed !important;
    }
}




/* =====================================================
   FINAL TYPOGRAPHIC LINK / ARROW SYSTEM
   ===================================================== */

/* Section links stay purely typographic: no external-link glyphs. */
.navigation a {
    display: block;
    width: max-content;
}

/* The only directional glyph left is Helvetica/Arial's own down arrow. */
.native-down-arrow {
    display: inline-block;
    margin-left: 0.18em;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 1em;
    font-weight: 400;
    line-height: 1;
    vertical-align: 0.10em;
    transform: none;
}

.portfolio-download a {
    display: inline-block;
}

/* AYBAK is always the black landing end-card with the specified warm word colour. */
html.landing-aybak-active,
body.landing-aybak-active,
body.landing-aybak-active #landing-aybak-end-card,
html.landing-aybak-active.landing-aybak-light,
body.landing-aybak-active.landing-aybak-light,
body.landing-aybak-active.landing-aybak-light #landing-aybak-end-card {
    background: #000 !important;

    const word = document.getElementById("landing-aybak-aybak");

    if (!card || !logo || !name || !word) {
        return;
    }

    const letters = Array.from(
        word.querySelectorAll(".landing-aybak-letter")
    );

    const lower = ["a", "y", "b", "a", "k"];
    const upper = ["A", "Y", "B", "A", "K"];

    let state = 0;
    let target = 0;
    let timer = null;
    let finishTimer = null;
    let pointerInside = false;
    let finishing = false;

    function isDesktopPointer() {
        return window.matchMedia(
            "(hover: hover) and (pointer: fine)"
        ).matches;
    }

    function active() {
        return document.body.classList.contains(
            "landing-aybak-active"
        );
    }

    function render(next) {
        state = Math.max(0, Math.min(5, next));
        name.textContent = state === 0 ? "Denizalp" : "denizalp";

        letters.forEach((letter, index) => {
            letter.textContent = index < state
                ? upper[index]
                : lower[index];
        });
    }

    function animate(next) {
        target = Math.max(0, Math.min(5, next));

        if (timer !== null) {
            clearTimeout(timer);
            timer = null;
        }

        const step = () => {
            if (state === target) {
                timer = null;
                return;
            }

            render(state < target ? state + 1 : state - 1);
            timer = setTimeout(step, 80);
        };

        step();
    }

    function rectContains(x, y) {
        const rect = logo.getBoundingClientRect();
        return (
            x >= rect.left &&
            x <= rect.right &&
            y >= rect.top &&
            y <= rect.bottom
        );
    }

    function finish() {
        if (finishing) return;
        finishing = true;

        if (timer !== null) {
            clearTimeout(timer);
            timer = null;
        }

        if (finishTimer !== null) {
            clearTimeout(finishTimer);
            finishTimer = null;
        }

        /* End the logical black state immediately; fade is only visual. */
        document.body.classList.remove("landing-aybak-active");
        document.documentElement.classList.remove("landing-aybak-active");
        document.body.classList.add("landing-aybak-leaving");
        document.documentElement.classList.add("landing-aybak-leaving");
        card.setAttribute("aria-hidden", "true");

        finishTimer = setTimeout(() => {
            document.body.classList.remove("landing-aybak-leaving");
            document.documentElement.classList.remove("landing-aybak-leaving");
            render(0);
            finishing = false;
            finishTimer = null;
        }, 620);
    }

    logo.addEventListener("pointerenter", () => {
        pointerInside = true;
        if (active() && !finishing && isDesktopPointer()) {
            animate(5);
        }
    });

    logo.addEventListener("pointerleave", () => {
        pointerInside = false;
        if (active() && !finishing && isDesktopPointer()) {
            animate(0);
        }
    });

    logo.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();

        if (!active() || finishing) return;

        animate(5);
        if (finishTimer !== null) {
            clearTimeout(finishTimer);
        }
        finishTimer = setTimeout(finish, 520);
    });

    document.addEventListener("pointermove", event => {
        if (!active() || finishing || !isDesktopPointer()) return;

        const inside = rectContains(event.clientX, event.clientY);

        if (inside === pointerInside) return;
        pointerInside = inside;

        animate(inside ? 5 : 0);
    }, true);

    document.addEventListener("click", event => {
        if (!active() || finishing || event.target === logo) return;
        if (!rectContains(event.clientX, event.clientY)) return;

        event.preventDefault();
        event.stopPropagation();
        animate(5);
        if (finishTimer !== null) {
            clearTimeout(finishTimer);
        }
        finishTimer = setTimeout(finish, 520);
    }, true);

    /* Main landing navigation can re-enter the black state while the white
       fade is still running. Cancel this fallback's pending exit instantly. */
    document.addEventListener("landing-aybak-force-enter", () => {
        if (finishTimer !== null) {
            clearTimeout(finishTimer);
            finishTimer = null;
        }

        if (timer !== null) {
            clearTimeout(timer);
            timer = null;
        }

        finishing = false;
        document.body.classList.remove("landing-aybak-leaving");
        document.documentElement.classList.remove("landing-aybak-leaving");
    });

    render(0);
})();

let biographyFlowMeasure = null;

function getBiographyMeasureElement() {
    if (biographyFlowMeasure) {
        return biographyFlowMeasure;
    }

    const probe = document.createElement("span");
    probe.style.position = "fixed";
    probe.style.left = "-100000px";
    probe.style.top = "-100000px";
    probe.style.visibility = "hidden";
    probe.style.pointerEvents = "none";
    probe.style.whiteSpace = "nowrap";
    probe.style.fontFamily = "inherit";
    probe.style.fontSize = getComputedStyle(biography).fontSize;
    probe.style.fontWeight = getComputedStyle(biography).fontWeight;
    probe.style.lineHeight = getComputedStyle(biography).lineHeight;
    probe.style.letterSpacing = getComputedStyle(biography).letterSpacing;
    probe.style.wordSpacing = getComputedStyle(biography).wordSpacing;
    document.body.appendChild(probe);
    biographyFlowMeasure = probe;
    return probe;
}

function measureBioText(text) {
    const probe = getBiographyMeasureElement();
    probe.textContent = text;
    return probe.getBoundingClientRect().width;
}

function splitWordsToBalancedLines(text, maxWidth) {
    const words = text.trim().split(/\s+/).filter(Boolean);
    if (!words.length) return [];

    if (measureBioText(text) <= maxWidth) {
        return [text.trim()];
    }

    /*
       Find the fewest lines that fit, then choose the most balanced
       partition for that line count. This prevents a short tail such as
       “sabanci university,” from being stranded on its own while still
       respecting the real measured width of the typography.
    */
    const n = words.length;
    const rangeWidth = Array.from({ length: n }, () => Array(n).fill(0));

    for (let i = 0; i < n; i += 1) {
        let value = "";
        for (let j = i; j < n; j += 1) {
            value = value ? `${value} ${words[j]}` : words[j];
            rangeWidth[i][j] = measureBioText(value);
        }
    }

    const memo = new Map();

    function bestFrom(start, linesLeft) {
        const key = `${start}|${linesLeft}`;
        if (memo.has(key)) return memo.get(key);

        if (start === n) {
            const empty = linesLeft === 0 ? { score: 0, lines: [] } : null;
            memo.set(key, empty);
            return empty;
        }

        if (linesLeft <= 0 || n - start < linesLeft) {
            memo.set(key, null);
            return null;
        }

        let best = null;

        for (let end = start; end < n; end += 1) {
            const width = rangeWidth[start][end];
            if (width > maxWidth) break;

            const tail = bestFrom(end + 1, linesLeft - 1);
            if (!tail) continue;

            const lineText = words.slice(start, end + 1).join(" ");
            const wordCount = end - start + 1;
            /* Never strand a two-word tail when a longer balanced tail is possible. */
            if (
                end === n - 1 &&
                wordCount <= 2 &&
                start > 0
            ) {
                continue;
            }

            const shortLinePenalty = wordCount === 1 ? 2500 : 0;
            const shortTailPenalty = (end === n - 1 && wordCount <= 2) ? 4500 : 0;

            const score =
                (maxWidth - width) * (maxWidth - width) * 0.015 +
                shortLinePenalty +
                shortTailPenalty +
                tail.score;

            const candidate = {
                score,
                lines: [lineText, ...tail.lines],
                widths: [width, ...(tail.widths || [])]
            };

            if (!best || candidate.score < best.score) {
                best = candidate;
            }
        }

        memo.set(key, best);
        return best;
    }

    for (let lineCount = 2; lineCount <= n; lineCount += 1) {
        memo.clear();
        const result = bestFrom(0, lineCount);
        if (result) return result.lines;
    }

    return [text.trim()];
}

function alignmentClass(lineIndex) {
    return lineIndex % 2 === 0
        ? "align-left"
        : "align-right";
}

function applyBioLineAlignment(line, alignment) {
    line.classList.remove("align-left", "align-right", "align-center");
    line.classList.add(alignment === "right" ? "align-right" : "align-left");
    line.style.setProperty(
        "justify-content",
        alignment === "right" ? "flex-end" : "flex-start",
        "important"
    );
}

function appendMeasuredLine(container, lineText, alignment) {
    const line = document.createElement("div");
    line.className = `bio-flow-line ${alignment === "right" ? "align-right" : "align-left"}`;
    applyBioLineAlignment(line, alignment);

    const textNode = document.createElement("span");
    textNode.className = "bio-flow-text";
    textNode.textContent = lineText;
    line.appendChild(textNode);

    container.appendChild(line);
    return line;
}

function appendBioParagraph(container, lines, alignment) {
    let lastLine = null;

    for (const requestedLine of lines) {
        const width = Math.max(1, biography.clientWidth);
        const measuredLines = splitWordsToBalancedLines(requestedLine, width);

        /*
           Every physical line created from this paragraph keeps the
           paragraph's alignment. Extra mobile wrapping never toggles
           left/right on its own.
        */
        for (const lineText of measuredLines) {
            lastLine = appendMeasuredLine(container, lineText, alignment);
        }
    }

    /* Keep a full line of breathing room after every paragraph. */
    if (lastLine) {
        lastLine.classList.add("bio-paragraph-gap");
    }
}

function appendClientLines(container, names, groupSize, alignment) {
    const width = Math.max(1, biography.clientWidth);
    const full = names.join(", ");

    /* One complete client line stays one line when it fits. */
    if (measureBioText(full) <= width) {
        appendMeasuredLine(container, full, alignment);
        return;
    }

    /* Requested balanced client grouping: editorial 2+2, brand 3+3. */
    const groups = [];
    for (let i = 0; i < names.length; i += groupSize) {
        groups.push(names.slice(i, i + groupSize).join(", "));
    }

    for (const group of groups) {
        /* Client names are atomic and every resulting line keeps the same paragraph alignment. */
        appendMeasuredLine(container, group, alignment);
    }
}

function buildBiographyFlow() {
    if (!biography) return;

    const flow = document.getElementById("biography-flow");
    if (!flow) return;

    const measure = getBiographyMeasureElement();
    measure.style.fontSize = getComputedStyle(biography).fontSize;
    measure.style.fontWeight = getComputedStyle(biography).fontWeight;
    measure.style.lineHeight = getComputedStyle(biography).lineHeight;
    measure.style.letterSpacing = getComputedStyle(biography).letterSpacing;
    measure.style.wordSpacing = getComputedStyle(biography).wordSpacing;

    flow.innerHTML = "";

    for (const segment of BIO_FLOW_SEGMENTS) {
        if (segment.type === "paragraph") {
            appendBioParagraph(flow, segment.lines, segment.align);
        } else {
            appendClientLines(flow, segment.names, segment.groupSize, segment.align);
        }
    }
}

/* =====================================================

   ===================================================== */

function setPreviewZoneRect(
    rect
) {

    const width =
        Math.max(
            0,
            rect.width
        );

    const height =
        Math.max(
            0,
            rect.height
        );


    document.documentElement.style.setProperty(
        "--preview-zone-left",
        `${Math.round(rect.left)}px`
    );

    document.documentElement.style.setProperty(
        "--preview-zone-top",
        `${Math.round(rect.top)}px`
    );

    document.documentElement.style.setProperty(
        "--preview-zone-width",
        `${Math.round(width)}px`
    );

    document.documentElement.style.setProperty(
        "--preview-zone-height",
        `${Math.round(height)}px`
    );

}


function calculatePreviewZone() {

    const viewportWidth =
        window.innerWidth;

    const viewportHeight =
        window.innerHeight;


    const pageStyles =
        getComputedStyle(
            document.documentElement
        );


    const pageX =
        parseFloat(
            pageStyles.getPropertyValue(
                "--page-x"
            )
        ) || 24;


    const pageTop =
        parseFloat(
            pageStyles.getPropertyValue(
                "--page-top"
            )
        ) || 20;


    const pageBottom =
        parseFloat(
            pageStyles.getPropertyValue(
                "--page-bottom"
            )
        ) || 24;


    const gap =
        Math.max(
            18,
            parseFloat(
                pageStyles.getPropertyValue(
                    "--major-gap"
                )
            ) || 16
        );


    const bioRect =
        biography
            .getBoundingClientRect();


    const navigationRect =
        document.querySelector(
            ".navigation"
        )
            .getBoundingClientRect();


    const contactRect =
        document.querySelector(
            ".contact"
        )
            .getBoundingClientRect();


    const portfolioRect =
        document.querySelector(
            ".portfolio-download"
        )
            .getBoundingClientRect();


    const portrait =
        viewportHeight >
        viewportWidth;


    let rect;


    if (
        portrait
    ) {

        /*
            Portrait:
            use the whitespace between the biography and the footer.
        */
        const top =
            Math.max(
                bioRect.bottom + gap,
                navigationRect.bottom + gap
            );


        const footerTop =
            Math.min(
                contactRect.top,
                portfolioRect.top
            );


        const bottom =
            Math.max(
                top,
                footerTop - gap
            );


        rect = {
            left:
                pageX,
            top,
            width:
                Math.max(
                    0,
                    viewportWidth -
                    pageX * 2
                ),
            height:
                Math.max(
                    0,
                    bottom - top
                )
        };

    }

    else {

        /*
            Landscape / desktop:
            use the whitespace to the right of the biography.
        */
        const left =
            Math.max(
                bioRect.right + gap,
                viewportWidth * 0.46
            );


        const top =
            Math.max(
                pageTop,
                navigationRect.bottom + gap
            );


        const footerTop =
            Math.min(
                contactRect.top,
                portfolioRect.top
            );


        const right =
            viewportWidth -
            pageX;


        const bottom =
            Math.max(
                top,
                footerTop - gap
            );


        rect = {
            left,
            top,
            width:
                Math.max(
                    0,
                    right - left
                ),
            height:
                Math.max(
                    0,
                    bottom - top
                )
        };

    }


    /*
        Safety fallback for unusually short viewports:
        keep a usable centered zone without touching the fixed footer.
    */
    if (
        rect.width < 140 ||
        rect.height < 110
    ) {

        const top =
            Math.max(
                bioRect.bottom + gap,
                navigationRect.bottom + gap
            );


        const footerTop =
            Math.min(
                contactRect.top,
                portfolioRect.top
            );


        rect = {
            left:
                pageX,
            top,
            width:
                Math.max(
                    0,
                    viewportWidth -
                    pageX * 2
                ),
            height:
                Math.max(
                    0,
                    footerTop -
                    gap -
                    top
                )
        };

    }


    setPreviewZoneRect(
        rect
    );

}

/* =====================================================

function looksLikeImage(
    value
) {

    if (
        typeof value !==
        "string"
    ) {

        return false;

    }

    return /\.(jpe?g|png|webp|avif)$/i
        .test(
            value
                .split("?")[0]
                .split("#")[0]
        );

}


function resolvePhotoUrl(
    value
) {

    if (
        typeof value !==
        "string"
    ) {

        return null;

    }

    const trimmed =
        value.trim();

    if (
        !trimmed
    ) {

        return null;

    }

    if (
        /^https?:\/\//i
            .test(
                trimmed
            )
    ) {

        return trimmed;

    }

    let path =
        trimmed
            .replace(
                /^\/+/,
                ""
            )
            .replace(
                /^photos\//i,
                ""
            );

    return (
        R2_PHOTOS_BASE +
        path
            .split("/")
            .map(
                encodeURIComponent
            )
            .join("/")
    );

}


function normalizeUrl(
    url
) {

    return url
        .split("?")[0]
        .split("#")[0];

}


function uniqueUrls(
    urls
) {

    const seen =
        new Set();

    return urls.filter(
        url => {

            const key =
                normalizeUrl(
                    url
                );

            if (
                seen.has(
                    key
                )
            ) {

                return false;

            }

            seen.add(
                key
            );

            return true;

        }
    );

}
