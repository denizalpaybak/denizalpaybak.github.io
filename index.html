<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
    }

    body {
        cursor: pointer;
    }


    /* =========================
       LEFT INFORMATION
       ========================= */

    .info {
        position: fixed;
        top: 32px;
        left: 48px;
        z-index: 10;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.15;
    }


    /* =========================
       LOGO
       ========================= */

    .logo {
        position: relative;
        display: block;

        width: 190px;
        height: 70px;

        margin: 0 0 0 0;
        padding: 0;

        color: inherit;
        text-decoration: none;

        cursor: pointer;
    }


    /* NAME */

    .logo-name {
        position: absolute;

        top: 0;
        left: 0;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.15;

        white-space: nowrap;
    }


    /* AYBAK */

    .logo-aybak {
        position: absolute;

        top: 17px;
        left: 0;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.15;
        letter-spacing: 0;

        white-space: nowrap;
    }


    /*
        Each letter is independent.
        This lets us change them one by one.
    */

    .logo-aybak span {
        display: inline-block;
    }


    /* =========================
       CONTACT / SOCIAL
       ========================= */

    .contact {
        margin: 0;
        padding: 0;
    }

    .social {
        display: flex;
        flex-direction: column;
        gap: 0;

        margin: 0;
        padding: 0;
    }

    .info a {
        color: inherit;
        text-decoration: none;
        font-weight: 400;
    }

    .info a:hover {
        text-decoration: underline;
    }


    /* =========================
       SLIDESHOW
       ========================= */

    #slideshow {
        position: fixed;
        inset: 0;

        width: 100vw;
        height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        pointer-events: none;
    }

    .slide {
        position: absolute;

        width: auto;
        height: auto;

        max-width: 70vw;
        max-height: 80vh;

        object-fit: contain;

        opacity: 0;
    }

    .slide.active {
        opacity: 1;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

        .info {
            top: 20px;
            left: 24px;
            font-size: 13px;
        }

        .logo {
            width: 160px;
            height: 58px;
            margin-bottom: 0;
        }

        .logo-name {
            font-size: 13px;
        }

        .logo-aybak {
            top: 15px;
            font-size: 13px;
        }

        .slide {
            max-width: 84vw;
            max-height: 72vh;
        }

    }

</style>
</head>

<body>


<div class="info">

    <a
        class="logo"
        href="https://denizalpaybak.com/"
        target="_self"
    >

        <span class="logo-name" id="logo-name">
            Denizalp
        </span>

        <span class="logo-aybak">

            <span id="letter-a">a</span><span id="letter-y">y</span><span id="letter-b">b</span><span id="letter-a2">a</span><span id="letter-k">k</span>

        </span>

    </a>


    <div class="contact">

        <a
            href="mailto:d@denizalpaybak.com"
            target="_blank"
            rel="noopener"
        >
            d@denizalpaybak.com
        </a>

    </div>


    <div class="social">

        <a
            href="https://www.instagram.com/denizalpaybak/"
            target="_blank"
            rel="noopener"
        >
            instagram @denizalpaybak
        </a>

        <a
            href="https://models.com/people/denizalp-aybak"
            target="_blank"
            rel="noopener"
        >
            models.com
        </a>

    </div>

</div>


<div id="slideshow">

    <img class="slide active" src="01.jpg">
    <img class="slide" src="02.jpg">
    <img class="slide" src="03.jpg">
    <img class="slide" src="04.jpg">

</div>


<script>


    /* =====================================================
       SLIDESHOW
       ===================================================== */

    const slides = document.querySelectorAll('.slide');

    let current = 0;
    let manualMode = false;


    function nextSlide() {

        slides[current].classList.remove('active');

        current = (current + 1) % slides.length;

        slides[current].classList.add('active');

    }


    /*
        Automatic slideshow.
        Completely independent from the logo animation.
    */

    setInterval(() => {

        if (!manualMode) {
            nextSlide();
        }

    }, 3000);


    /*
        First click stops autoplay.
        It does not change the current image.
    */

    document.body.addEventListener('click', (event) => {

        if (event.target.closest('a')) {
            return;
        }

        if (!manualMode) {

            manualMode = true;

            return;
        }

        nextSlide();

    });


    /* =====================================================
       LOGO
       ===================================================== */

    const logo = document.querySelector('.logo');

    const logoName = document.getElementById('logo-name');

    const letters = [

        document.getElementById('letter-a'),
        document.getElementById('letter-y'),
        document.getElementById('letter-b'),
        document.getElementById('letter-a2'),
        document.getElementById('letter-k')

    ];


    const lowercase = ['a', 'y', 'b', 'a', 'k'];

    const uppercase = ['A', 'Y', 'B', 'A', 'K'];


    let logoAnimating = false;


    /*
        State:

        0 = Denizalp / aybak
        1 = denizalp / Aybak
        2 = denizalp / AYbak
        3 = denizalp / AYBak
        4 = denizalp / AYBAk
        5 = denizalp / AYBAK
    */

    function setLogoState(state) {

        /*
            The first state is special:
            the D is uppercase.
        */

        if (state === 0) {

            logoName.textContent = 'Denizalp';

        } else {

            logoName.textContent = 'denizalp';

        }


        /*
            Change AYBAK letters one by one.
        */

        for (let i = 0; i < letters.length; i++) {

            if (i < state) {

                letters[i].textContent = uppercase[i];

            } else {

                letters[i].textContent = lowercase[i];

            }

        }

    }


    /*
        FORWARD

        Denizalp
        aybak

            ↓

        denizalp
        aybak

            ↓

        denizalp
        Aybak

            ↓

        denizalp
        AYbak

            ↓

        denizalp
        AYBak

            ↓

        denizalp
        AYBAk

            ↓

        denizalp
        AYBAK
    */

    function animateForward() {

        if (logoAnimating) {
            return;
        }

        logoAnimating = true;


        setLogoState(0);


        setTimeout(() => {
            setLogoState(1);
        }, 120);


        setTimeout(() => {
            setLogoState(2);
        }, 240);


        setTimeout(() => {
            setLogoState(3);
        }, 360);


        setTimeout(() => {
            setLogoState(4);
        }, 480);


        setTimeout(() => {
            setLogoState(5);
        }, 600);


        setTimeout(() => {
            logoAnimating = false;
        }, 720);

    }


    /*
        REVERSE

        denizalp
        AYBAK

            ↓

        denizalp
        AYBAk

            ↓

        denizalp
        AYBak

            ↓

        denizalp
        AYbak

            ↓

        denizalp
        Aybak

            ↓

        Denizalp
        aybak
    */

    function animateReverse() {

        if (logoAnimating) {
            return;
        }

        logoAnimating = true;


        setLogoState(5);


        setTimeout(() => {
            setLogoState(4);
        }, 120);


        setTimeout(() => {
            setLogoState(3);
        }, 240);


        setTimeout(() => {
            setLogoState(2);
        }, 360);


        setTimeout(() => {
            setLogoState(1);
        }, 480);


        /*
            Final step:
            the D becomes uppercase and
            the A becomes lowercase.
        */

        setTimeout(() => {
            setLogoState(0);
        }, 600);


        setTimeout(() => {
            logoAnimating = false;
        }, 720);

    }


    /* =====================================================
       DESKTOP
       ===================================================== */

    /*
        When the mouse enters the logo,
        animate toward AYBAK.
    */

    logo.addEventListener('mouseenter', () => {

        if (
            window.matchMedia('(min-width: 601px)').matches &&
            !logoAnimating
        ) {

            animateForward();

        }

    });


    /*
        When the mouse leaves the logo,
        return to the original state.
    */

    logo.addEventListener('mouseleave', () => {

        if (
            window.matchMedia('(min-width: 601px)').matches &&
            !logoAnimating
        ) {

            animateReverse();

        }

    });


    /* =====================================================
       MOBILE
       ===================================================== */

    /*
        IMPORTANT:

        Mobile starts as:

        denizalp
        AYBAK

        NOT:

        Denizalp
        AYBAK
    */

    if (window.matchMedia('(max-width: 600px)').matches) {


        /* Lowercase D */

        logoName.textContent = 'denizalp';


        /* Uppercase AYBAK */

        for (let i = 0; i < letters.length; i++) {

            letters[i].textContent = uppercase[i];

        }


        /*
            Start the reverse animation
            1 second after the page loads.

            This is independent of the slideshow.
        */

        setTimeout(() => {

            animateReverse();

        }, 1000);

    }


</script>

</body>
</html>
