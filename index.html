<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Denizalp Aybak</title>
<link href="https://use.typekit.net/rmn7qgm.css" rel="stylesheet"/>
<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
    overscroll-behavior: none;

    background: #fff;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

body {
    color: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =====================================================
   VARIABLES
   ===================================================== */

:root {

    --page-x: 48px;
    --page-top: 32px;
    --page-bottom: 48px;

    --font-size: 15px;
    --line-height: 1.15;

    --major-gap: 17px;
    --column-gap: 48px;

}


/* =====================================================
   PAGE
   ===================================================== */

.page {
    position: relative;

    width: 100%;

    height: 100vh;
    height: 100dvh;

    padding:
        var(--page-top)
        var(--page-x)
        var(--page-bottom)
        var(--page-x);

    overflow: hidden;
}


/* =====================================================
   MAIN GRID
   ===================================================== */

.landing-grid {
    position: relative;

    z-index: 2;

    display: grid;

    grid-template-columns:
        minmax(0, 530px)
        minmax(0, 1fr);

    grid-template-rows:
        auto
        auto
        auto
        auto
        minmax(0, 1fr);

    column-gap:
        var(--column-gap);

    row-gap:
        var(--major-gap);

    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    pointer-events: none;
}

.logo,
.navigation,
.contact,
.biography,
.opening {
    pointer-events: auto;
}


/* =====================================================
   LOGO
   ===================================================== */

.logo {
    position: relative;

    grid-column: 1;
    grid-row: 1;

    display: block;

    width: max-content;
    height: 34px;

    margin: 0;
    padding: 0;

    border: 0;

    appearance: none;
    -webkit-appearance: none;

    background: transparent;

    color: #000;

    cursor: pointer;

    font-family: inherit;
    font-size: var(--font-size);
    font-weight: 400;
    line-height: var(--line-height);

    text-align: left;

    -webkit-tap-highlight-color: transparent;
}

.logo-name {
    position: absolute;

    top: 0;
    left: 0;

    white-space: nowrap;
}

.logo-aybak {
    position: absolute;

    top: 17px;
    left: 0;

    white-space: nowrap;
}


/* =====================================================
   OPENING
   ===================================================== */

.opening {
    grid-column: 1;
    grid-row: 2;

    margin: 0;
    padding: 0;

    font-size: var(--font-size);
    font-weight: 400;
    line-height: var(--line-height);

    text-wrap: pretty;
}


/* =====================================================
   NAVIGATION
   ===================================================== */

.navigation {
    grid-column: 1;
    grid-row: 3;

    display: flex;
    flex-direction: column;

    margin: 0;
    padding: 0;
}

.navigation a {
    display: inline-flex;
    align-items: center;
    gap: 0.30em;

    width: max-content;

    color: #000;
    text-decoration: none;

    font-size: var(--font-size);
    font-weight: 400;
    line-height: var(--line-height);

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   CONTACT
   ===================================================== */

.contact {
    grid-column: 1;
    grid-row: 4;

    display: flex;
    flex-direction: column;

    margin: 0;
    padding: 0;
}

.contact a {
    color: #000;
    text-decoration: none;

    font-size: var(--font-size);
    font-weight: 400;
    line-height: var(--line-height);
}

.contact a:hover {
    text-decoration: underline;
}


/* =====================================================
   BIOGRAPHY
   ===================================================== */

.biography {
    grid-column: 1;
    grid-row: 5;

    align-self: start;

    width: 100%;
    max-width: 530px;

    margin: 0;
    padding: 0;

    font-size: var(--font-size);
    font-weight: 400;
    line-height: var(--line-height);
}

.biography p {
    margin:
        0
        0
        var(--major-gap)
        0;

    padding: 0;

    font-size: inherit;
    font-weight: inherit;
    line-height: inherit;

    text-wrap: pretty;
}

.biography p:last-child {
    margin-bottom: 0;
}

.biography span {
    font-size: inherit;
    font-weight: inherit;
    line-height: inherit;
}


.portfolio-download a {
    color: inherit;
    text-decoration: none;

    font-size: inherit;
    font-weight: inherit;
    line-height: inherit;

    -webkit-tap-highlight-color: transparent;
}

.portfolio-download a:hover {
    text-decoration: underline;
}

.site-arrow {
    display: inline-block;
    flex: 0 0 auto;
    width: 0.66em;
    height: 0.66em;
    overflow: visible;
    color: currentColor;
    pointer-events: none;
    vertical-align: -0.055em;
}

.site-arrow path {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.02;
    stroke-linecap: square;
    stroke-linejoin: miter;
}

.site-arrow--down,
.site-arrow--external {
    transform: none;
}

.navigation a,
.portfolio-download a {
    display: inline-flex;
    align-items: center;
    gap: 0.30em;
}

.item {
    white-space: nowrap;
}

.bio-ending {
    white-space: nowrap;
}

.mobile-client-break {
    display: none;
}


/* =====================================================
   MEDIA FIELD
   ===================================================== */

.media-field {
    position: relative;

    grid-column: 2;
    grid-row: 1 / -1;

    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    pointer-events: none;
}


/* =====================================================
   PHOTOGRAPHY FIELD
   ===================================================== */

.photography-field {
    position: fixed;

    z-index: 1;

    top: var(--page-top);
    right: var(--page-x);
    bottom: var(--page-bottom);
    left: var(--page-x);

    visibility: hidden;

    overflow: hidden;

    pointer-events: none;

    contain:
        layout
        paint;
}

.photography-field.active {
    visibility: visible;
}


/* =====================================================
   PHOTOGRAPHY STAGE
   ===================================================== */

#scattered-stage {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    pointer-events: none;
}


/* =====================================================
   PROJECT GROUP
   ===================================================== */

.photo-group {
    position: absolute;

    top: 0;
    left: 0;

    width:
        var(
            --group-width,
            100px
        );

    height:
        var(
            --group-height,
            100px
        );

    visibility: hidden;

    pointer-events: none;

    transform:
        translate3d(
            var(--group-x, 0px),
            var(--group-y, 0px),
            0
        );

    backface-visibility: hidden;

    contain:
        layout
        paint;
}

.photo-group.visible {
    visibility: visible;
}


/* =====================================================
   INDIVIDUAL PHOTOS
   ===================================================== */

.project-photo {
    position: absolute;

    display: block;

    width: auto;

    height:
        var(
            --photo-height,
            100px
        );

    top:
        var(
            --photo-y,
            0px
        );

    left:
        var(
            --photo-x,
            0px
        );

    object-fit: contain;

    pointer-events: none;

    backface-visibility: hidden;

    transform: translateZ(0);
}


/* =====================================================
   FILM FIELD
   ===================================================== */

.film-field {
    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    visibility: hidden;

    pointer-events: none;
}

.film-field.active {
    visibility: visible;

    pointer-events: auto;
}


/* =====================================================
   FILM
   ===================================================== */

.film-link {
    display: block;

    width: 100%;

    max-width:
        calc(
            (
                100vh -
                var(--page-top) -
                var(--page-bottom)
            ) *
            16 / 9
        );

    aspect-ratio: 16 / 9;

    color: inherit;
    text-decoration: none;

    overflow: hidden;

    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
}

#film-video {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center center;

    pointer-events: none;

    backface-visibility: hidden;

    transform: translateZ(0);
}


/* =====================================================
   MOBILE PORTRAIT
   ===================================================== */

@media
    (max-width: 600px)
    and (orientation: portrait) {

    html,
    body {
        overflow: hidden;
    }

    :root {

        --page-x: 24px;
        --page-top: 20px;
        --page-bottom: 32px;

        --font-size: 13px;
        --line-height: 1.15;

        --major-gap: 15px;

    }

    .landing-grid {
        grid-template-columns:
            minmax(0, 1fr);

        grid-template-rows:
            auto
            auto
            auto
            auto
            auto
            minmax(0, 1fr);

        column-gap: 0;

        row-gap:
            var(--major-gap);
    }

    .logo {
        grid-column: 1;
        grid-row: 1;

        height: 30px;
    }

    .logo-aybak {
        top: 15px;
    }

    .opening {
        grid-column: 1;
        grid-row: 2;
    }

    .navigation {
        grid-column: 1;
        grid-row: 3;
    }

    .contact {
        grid-column: 1;
        grid-row: 4;
    }

    .biography {
        grid-column: 1;
        grid-row: 5;

        max-width: none;
    }

    .media-field {
        grid-column: 1;
        grid-row: 6;

        min-height: 0;
    }

    .photography-field {
        position: absolute;

        inset: 0;

        z-index: auto;

        width: 100%;
        height: 100%;
    }

    .bio-ending {
        white-space: normal;
    }

    .mobile-client-break {
        display: inline;
    }

    .film-link {
        max-width: 100%;
    }

}


/* =====================================================
   MOBILE LANDSCAPE
   ===================================================== */

@media
    (orientation: landscape)
    and (max-height: 650px)
    and (max-width: 1000px) {

    :root {

        --page-x: 24px;
        --page-top: 14px;
        --page-bottom: 14px;

        --font-size: 13px;
        --line-height: 1.15;

        --major-gap: 8px;
        --column-gap: 24px;

    }

    .landing-grid {
        grid-template-columns:
            minmax(0, 2fr)
            minmax(0, 1fr);
    }

    .logo {
        height: 30px;
    }

    .logo-aybak {
        top: 15px;
    }

    .opening,
    .biography {
        max-width: none;
    }

    .opening,
    .biography p {
        text-wrap: pretty;
    }

    .biography p {
        margin-bottom:
            var(--major-gap);
    }

    .photography-field {
        position: absolute;

        inset: 0;

        z-index: auto;

        width: 100%;
        height: 100%;
    }

    .bio-ending {
        white-space: normal;
    }

    .film-link {
        max-width: 100%;
    }

}


/* =====================================================
   SHORT DESKTOP
   ===================================================== */

@media
    (orientation: landscape)
    and (min-width: 1001px)
    and (max-height: 700px) {

    :root {

        --page-x: 24px;
        --page-top: 20px;
        --page-bottom: 20px;

        --font-size: 13px;
        --line-height: 1.15;

        --major-gap: 9px;
        --column-gap: 32px;

    }

    .landing-grid {
        grid-template-columns:
            minmax(0, 470px)
            minmax(0, 1fr);
    }

    .logo {
        height: 30px;
    }

    .logo-aybak {
        top: 15px;
    }

}

/* =====================================================
   LANDING V2 — REPOSITIONED INFORMATION
   ===================================================== */

html,
body,
.page {
    transition:
        background-color 400ms cubic-bezier(.22,.61,.36,1),
        color 400ms cubic-bezier(.22,.61,.36,1);
}

.landing-grid {
    grid-template-rows: auto auto auto minmax(0, 1fr);
}

.opening {
    grid-column: 1;
    grid-row: 2;
}

.biography {
    grid-column: 1;
    grid-row: 3;
    align-self: start;
}

.navigation {
    position: fixed;
    z-index: 20;
    top: var(--page-top);
    right: var(--page-x);
    display: flex;
    align-items: flex-end;
    text-align: right;
}

.navigation a {
    width: max-content;
    text-align: right;
    transition: color 400ms cubic-bezier(.22,.61,.36,1);
}

.contact {
    position: fixed;
    z-index: 20;
    left: var(--page-x);
    bottom: var(--page-bottom);
    text-align: left;
}

.portfolio-download {
    position: fixed;
    z-index: 20;
    right: var(--page-x);
    bottom: var(--page-bottom);
    margin: 0 !important;
    text-align: right;
}

.logo,
.opening,
.biography,
.contact,
.portfolio-download,
.navigation a {
    transition: color 400ms cubic-bezier(.22,.61,.36,1);
}

/* =====================================================
   BLACK PREVIEW SURFACE
   ===================================================== */

body.preview-active,
body.preview-active .page {
    background: #000;
}

body.preview-active .logo,
body.preview-active .opening,
body.preview-active .biography,
body.preview-active .contact,
body.preview-active .contact a,
body.preview-active .portfolio-download,
body.preview-active .navigation a {
    color: transparent;
}

body.preview-photography .navigation #photography-link,
body.preview-film .navigation #film-link {
    color: #fff;
}

body.preview-active .logo,
body.preview-active .opening,
body.preview-active .biography,
body.preview-active .contact,
body.preview-active .portfolio-download {
    pointer-events: none;
}

/* =====================================================
   CENTERED FILM PREVIEW
   ===================================================== */

.film-field {
    position: fixed;
    z-index: 10;
    inset: 0;
    padding:
        var(--page-top)
        var(--page-x)
        var(--page-bottom);
    align-items: center;
    justify-content: center;
}

.film-link {
    width: min(
        calc(100vw - 2 * var(--page-x)),
        calc((100vh - var(--page-top) - var(--page-bottom)) * 16 / 9)
    );
    max-width: none;
    aspect-ratio: 16 / 9;
}

/* =====================================================
   SINGLE RANDOM PHOTOGRAPHY PREVIEW
   ===================================================== */

.photography-field {
    z-index: 10;
}

#scattered-stage.single-photo-mode .photo-group {
    visibility: hidden !important;
}

#scattered-stage.single-photo-mode .photo-group.single-photo-group {
    visibility: visible !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    transform: none !important;
    contain: none !important;
}

#scattered-stage.single-photo-mode .project-photo {
    display: none !important;
}

#scattered-stage.single-photo-mode .project-photo.single-photo-visible {
    position: absolute !important;
    display: block !important;
    top: 50% !important;
    left: 50% !important;
    width: auto !important;
    height: auto !important;
    max-width: min(72vw, calc(100vw - 2 * var(--page-x))) !important;
    max-height: min(76vh, calc(100vh - var(--page-top) - var(--page-bottom))) !important;
    object-fit: contain !important;
    transform: translate(-50%, -50%) !important;
}

/* =====================================================
   AYBAK END CARD — ONLY THE WORD
   ===================================================== */

#landing-aybak-end-card {
    position: fixed;
    inset: 0;
    z-index: 10000;
    overflow: hidden;
    visibility: hidden;
    pointer-events: none;
    background: rgba(0,0,0,0);
    transition:
        background-color 460ms cubic-bezier(.22,.61,.36,1),
        visibility 0s linear 460ms;
    touch-action: none;
}

body.landing-aybak-active #landing-aybak-end-card {
    visibility: visible;
    pointer-events: auto;
    transition:
        background-color 460ms cubic-bezier(.22,.61,.36,1),
        visibility 0s linear 0s;
}

html.landing-aybak-active:not(.landing-aybak-light),
body.landing-aybak-active:not(.landing-aybak-light),
body.landing-aybak-active:not(.landing-aybak-light) #landing-aybak-end-card {
    background: #000;
}

html.landing-aybak-active.landing-aybak-light,
body.landing-aybak-active.landing-aybak-light,
body.landing-aybak-active.landing-aybak-light #landing-aybak-end-card {
    background: #fff;
}

#landing-aybak-word {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 170ms ease;
    pointer-events: none;
}

body.landing-aybak-active #landing-aybak-word {
    opacity: 1;
    transition-delay: 255ms;
}

@media (max-width: 600px) and (orientation: portrait) {
    .landing-grid {
        grid-template-columns: minmax(0,1fr);
        grid-template-rows: auto auto auto minmax(0,1fr);
    }

    .biography {
        max-width: min(100%, 530px);
    }

    .film-field {
        padding:
            var(--page-top)
            var(--page-x)
            var(--page-bottom);
    }

    .film-link {
        width: min(
            calc(100vw - 2 * var(--page-x)),
            calc((100vh - var(--page-top) - var(--page-bottom)) * 16 / 9)
        );
    }

    #scattered-stage.single-photo-mode .project-photo.single-photo-visible {
        max-width: calc(100vw - 2 * var(--page-x)) !important;
        max-height: 62vh !important;
    }
}

/* =====================================================
   FIXED PHOTOGRAPHY PREVIEW
   ===================================================== */

#fixed-photo-preview {
    position: absolute;
    z-index: 2;
    top: 50%;
    left: 50%;
    display: block;
    width: auto;
    height: auto;
    max-width: min(72vw, calc(100vw - 2 * var(--page-x)));
    max-height: min(76vh, calc(100vh - var(--page-top) - var(--page-bottom)));
    object-fit: contain;
    opacity: 0;
    visibility: hidden;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

#fixed-photo-preview.visible {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    cursor: pointer;
}

/* =====================================================
   LANDING V6 — WHITE-SURFACE PREVIEW ZONES
   ===================================================== */

body.preview-active,
body.preview-active .page,
body.preview-photography,
body.preview-film {
    background: #fff !important;
    color: #000 !important;
}

body.preview-active .logo,
body.preview-active .opening,
body.preview-active .biography,
body.preview-active .contact,
body.preview-active .contact a,
body.preview-active .portfolio-download,
body.preview-active .navigation a,
body.preview-photography .navigation #photography-link,
body.preview-film .navigation #film-link {
    color: #000 !important;
}

body.preview-active .logo,
body.preview-active .opening,
body.preview-active .biography,
body.preview-active .contact,
body.preview-active .portfolio-download {
    pointer-events: auto !important;
}

.photography-field,
.film-field {
    position: fixed !important;
    z-index: 10 !important;
    top: var(--preview-zone-top, 50%) !important;
    left: var(--preview-zone-left, 50%) !important;
    right: auto !important;
    bottom: auto !important;
    width: var(--preview-zone-width, 0px) !important;
    height: var(--preview-zone-height, 0px) !important;
    padding: 0 !important;
    overflow: hidden !important;
}

.film-field {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
}

.film-link {
    width: 100% !important;
    height: 100% !important;
    max-width: none !important;
    aspect-ratio: auto !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    overflow: hidden !important;
}

#film-video {
    width: 100% !important;
    height: 100% !important;
    object-fit: contain !important;
    object-position: center center !important;
}

#fixed-photo-preview {
    top: 50% !important;
    left: 50% !important;
    max-width: 100% !important;
    max-height: 100% !important;
    transform: translate(-50%, -50%) !important;
}

@media (max-width: 1000px) {
    .photography-field,
    .film-field {
        position: fixed !important;
    }
}

/* =====================================================
   FINAL TYPOGRAPHIC LINK / ARROW SYSTEM
   ===================================================== */

.navigation a {
    display: block;
    width: max-content;
}

.native-down-arrow {
    display: inline-block;
    margin-left: 0.18em;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 1em;
    font-weight: 400;
    line-height: 1;
    vertical-align: 0.10em;
    transform: none;
}

.portfolio-download a {
    display: inline-block;
}

html.landing-aybak-active,
body.landing-aybak-active,
body.landing-aybak-active #landing-aybak-end-card,
html.landing-aybak-active.landing-aybak-light,
body.landing-aybak-active.landing-aybak-light,
body.landing-aybak-active.landing-aybak-light #landing-aybak-end-card {
    background: #000 !important;
}
</style>

<script>
/* =====================================================
   AYBAK END-CARD FALLBACK INTERACTION
   ===================================================== */
(() => {
    const card = document.getElementById("landing-aybak-end-card");
    const logo = document.getElementById("landing-aybak-logo");
    const name = document.getElementById("landing-aybak-name");
    const word = document.getElementById("landing-aybak-aybak");

    if (!card || !logo || !name || !word) {
        return;
    }

    const letters = Array.from(
        word.querySelectorAll(".landing-aybak-letter")
    );

    const lower = ["a", "y", "b", "a", "k"];
    const upper = ["A", "Y", "B", "A", "K"];

    let state = 0;
    let target = 0;
    let timer = null;
    let finishTimer = null;
    let pointerInside = false;
    let finishing = false;

    function isDesktopPointer() {
        return window.matchMedia(
            "(hover: hover) and (pointer: fine)"
        ).matches;
    }

    function active() {
        return document.body.classList.contains(
            "landing-aybak-active"
        );
    }

    function render(next) {
        state = Math.max(0, Math.min(5, next));
        name.textContent = state === 0 ? "Denizalp" : "denizalp";

        letters.forEach((letter, index) => {
            letter.textContent = index < state
                ? upper[index]
                : lower[index];
        });
    }

    function animate(next) {
        target = Math.max(0, Math.min(5, next));

        if (timer !== null) {
            clearTimeout(timer);
            timer = null;
        }

        const step = () => {
            if (state === target) {
                timer = null;
                return;
            }

            render(state < target ? state + 1 : state - 1);
            timer = setTimeout(step, 80);
        };

        step();
    }

    function rectContains(x, y) {
        const rect = logo.getBoundingClientRect();
        return (
            x >= rect.left &&
            x <= rect.right &&
            y >= rect.top &&
            y <= rect.bottom
        );
    }

    function finish() {
        if (finishing) return;
        finishing = true;

        if (timer !== null) {
            clearTimeout(timer);
            timer = null;
        }

        if (finishTimer !== null) {
            clearTimeout(finishTimer);
            finishTimer = null;
        }

        document.body.classList.remove("landing-aybak-active");
        document.documentElement.classList.remove("landing-aybak-active");
        document.body.classList.add("landing-aybak-leaving");
        document.documentElement.classList.add("landing-aybak-leaving");
        card.setAttribute("aria-hidden", "true");

        finishTimer = setTimeout(() => {
            document.body.classList.remove("landing-aybak-leaving");
            document.documentElement.classList.remove("landing-aybak-leaving");
            render(0);
            finishing = false;
            finishTimer = null;
        }, 620);
    }

    logo.addEventListener("pointerenter", () => {
        pointerInside = true;
        if (active() && !finishing && isDesktopPointer()) {
            animate(5);
        }
    });

    logo.addEventListener("pointerleave", () => {
        pointerInside = false;
        if (active() && !finishing && isDesktopPointer()) {
            animate(0);
        }
    });

    logo.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();

        if (!active() || finishing) return;

        animate(5);
        if (finishTimer !== null) {
            clearTimeout(finishTimer);
        }
        finishTimer = setTimeout(finish, 520);
    });

    document.addEventListener("pointermove", event => {
        if (!active() || finishing || !isDesktopPointer()) return;

        const inside = rectContains(event.clientX, event.clientY);

        if (inside === pointerInside) return;
        pointerInside = inside;

        animate(inside ? 5 : 0);
    }, true);

    document.addEventListener("click", event => {
        if (!active() || finishing || event.target === logo) return;
        if (!rectContains(event.clientX, event.clientY)) return;

        event.preventDefault();
        event.stopPropagation();
        animate(5);
        if (finishTimer !== null) {
            clearTimeout(finishTimer);
        }
        finishTimer = setTimeout(finish, 520);
    }, true);

    document.addEventListener("landing-aybak-force-enter", () => {
        if (finishTimer !== null) {
            clearTimeout(finishTimer);
            finishTimer = null;
        }

        if (timer !== null) {
            clearTimeout(timer);
            timer = null;
        }

        finishing = false;
        document.body.classList.remove("landing-aybak-leaving");
        document.documentElement.classList.remove("landing-aybak-leaving");
    });

    render(0);
})();

const BIO_FLOW_SEGMENTS = [

let biographyFlowMeasure = null;

function getBiographyMeasureElement() {
    if (biographyFlowMeasure) return biographyFlowMeasure;
    const probe = document.createElement("span");
    probe.style.position = "fixed";
    probe.style.left = "-100000px";
    probe.style.top = "-100000px";

    document.body.appendChild(probe);
    biographyFlowMeasure = probe;
    return probe;
}

function measureBioText(text) {
    const probe = getBiographyMeasureElement();
    probe.textContent = text;
    return probe.getBoundingClientRect().width;
}

function splitWordsToBalancedLines(text, maxWidth) {
    const words = text.trim().split(/\s+/).filter(Boolean);
    if (!words.length) return [];
    if (measureBioText(text) <= maxWidth) return [text.trim()];

    const n = words.length;
    const rangeWidth = Array.from({ length: n }, () => Array(n).fill(0));
    for (let i = 0; i < n; i += 1) {
        let value = "";
        for (let j = i; j < n; j += 1) {
            value = value ? `${value} ${words[j]}` : words[j];
            rangeWidth[i][j] = measureBioText(value);
        }
    }

    const memo = new Map();
    function bestFrom(start, linesLeft) {
        const key = `${start}|${linesLeft}`;
        if (memo.has(key)) return memo.get(key);
        if (start === n) {
            const empty = linesLeft === 0 ? { score: 0, lines: [] } : null;
            memo.set(key, empty);
            return empty;
        }
        if (linesLeft <= 0 || n - start < linesLeft) {
            memo.set(key, null);
            return null;
        }
        let best = null;
        for (let end = start; end < n; end += 1) {
            const width = rangeWidth[start][end];
            if (width > maxWidth) break;
            const tail = bestFrom(end + 1, linesLeft - 1);
            if (!tail) continue;
            const lineText = words.slice(start, end + 1).join(" ");
            const wordCount = end - start + 1;
            if (end === n - 1 && wordCount <= 2 && start > 0) continue;
            const shortLinePenalty = wordCount === 1 ? 2500 : 0;
            const shortTailPenalty = (end === n - 1 && wordCount <= 2) ? 4500 : 0;
            const score = (maxWidth - width) * (maxWidth - width) * 0.015 + shortLinePenalty + shortTailPenalty + tail.score;
            const candidate = { score, lines: [lineText, ...tail.lines], widths: [width, ...(tail.widths || [])] };
            if (!best || candidate.score < best.score) best = candidate;
        }
        memo.set(key, best);
        return best;
    }

    for (let lineCount = 2; lineCount <= n; lineCount += 1) {
        memo.clear();
        const result = bestFrom(0, lineCount);
        if (result) return result.lines;
    }
    return [text.trim()];
}

function applyBioLineAlignment(line, alignment) {
    line.classList.remove("align-left", "align-right", "align-center");
    line.classList.add(alignment === "right" ? "align-right" : "align-left");
    line.style.setProperty("justify-content", alignment === "right" ? "flex-end" : "flex-start", "important");
}

function appendMeasuredLine(container, lineText, alignment) {
    const line = document.createElement("div");
    line.className = `bio-flow-line ${alignment === "right" ? "align-right" : "align-left"}`;
    applyBioLineAlignment(line, alignment);
    const textNode = document.createElement("span");
    textNode.className = "bio-flow-text";
    textNode.textContent = lineText;
    line.appendChild(textNode);
    container.appendChild(line);
    return line;
}

function appendBioParagraph(container, lines, alignment) {
    let lastLine = null;
    for (const requestedLine of lines) {
        const width = Math.max(1, biography.clientWidth);
        const measuredLines = splitWordsToBalancedLines(requestedLine, width);
        for (const lineText of measuredLines) {
            lastLine = appendMeasuredLine(container, lineText, alignment);
        }
    }
    if (lastLine) lastLine.classList.add("bio-paragraph-gap");
}

function appendClientLines(container, names, groupSize, alignment) {
    const width = Math.max(1, biography.clientWidth);
    const full = names.join(", ");
    if (measureBioText(full) <= width) {
        appendMeasuredLine(container, full, alignment);
        return;
    }
    const groups = [];
    for (let i = 0; i < names.length; i += groupSize) {
        groups.push(names.slice(i, i + groupSize).join(", "));
    }
    for (const group of groups) {
        appendMeasuredLine(container, group, alignment);
    }
}

function buildBiographyFlow() {
    if (!biography) return;
    const flow = document.getElementById("biography-flow");
    if (!flow) return;
    const measure = getBiographyMeasureElement();
    measure.style.fontSize = getComputedStyle(biography).fontSize;
    measure.style.fontWeight = getComputedStyle(biography).fontWeight;
    measure.style.lineHeight = getComputedStyle(biography).lineHeight;
    measure.style.letterSpacing = getComputedStyle(biography).letterSpacing;
    measure.style.wordSpacing = getComputedStyle(biography).wordSpacing;
    flow.innerHTML = "";
    for (const segment of BIO_FLOW_SEGMENTS) {
        if (segment.type === "paragraph") {
            appendBioParagraph(flow, segment.lines, segment.align);
        } else {
            appendClientLines(flow, segment.names, segment.groupSize, segment.align);
        }
    }
}
buildBiographyFlow();

<script>
const mediaField = document.getElementById("media-field");
const photographyField = document.getElementById("photography-field");
const filmField = document.getElementById("film-field");

const filmLink = document.getElementById("film-link");
const photographyText = document.getElementById("photography-text");
const filmText = document.getElementById("film-text");
const filmVideo = document.getElementById("film-video");

function setPreviewZoneRect(rect) {
    const width = Math.max(0, rect.width);
    const height = Math.max(0, rect.height);
    document.documentElement.style.setProperty("--preview-zone-left", `${Math.round(rect.left)}px`);
    document.documentElement.style.setProperty("--preview-zone-top", `${Math.round(rect.top)}px`);
    document.documentElement.style.setProperty("--preview-zone-width", `${Math.round(width)}px`);
    document.documentElement.style.setProperty("--preview-zone-height", `${Math.round(height)}px`);
}

function calculatePreviewZone() {
    const viewportWidth = window.innerWidth;
    const viewportHeight = window.innerHeight;
    const pageStyles = getComputedStyle(document.documentElement);
    const pageX = parseFloat(pageStyles.getPropertyValue("--page-x")) || 24;
    const pageTop = parseFloat(pageStyles.getPropertyValue("--page-top")) || 20;
    const gap = Math.max(18, parseFloat(pageStyles.getPropertyValue("--major-gap")) || 16);
    const bioRect = biography.getBoundingClientRect();
    const navigationRect = document.querySelector(".navigation").getBoundingClientRect();
    const contactRect = document.querySelector(".contact").getBoundingClientRect();
    const portfolioRect = document.querySelector(".portfolio-download").getBoundingClientRect();
    const portrait = viewportHeight > viewportWidth;
    let rect;

    if (portrait) {
        const top = Math.max(bioRect.bottom + gap, navigationRect.bottom + gap);
        const footerTop = Math.min(contactRect.top, portfolioRect.top);
        const bottom = Math.max(top, footerTop - gap);
        rect = { left: pageX, top, width: Math.max(0, viewportWidth - pageX * 2), height: Math.max(0, bottom - top) };
    } else {
        const left = Math.max(bioRect.right + gap, viewportWidth * 0.46);
        const top = Math.max(pageTop, navigationRect.bottom + gap);
        const footerTop = Math.min(contactRect.top, portfolioRect.top);
        const right = viewportWidth - pageX;
        const bottom = Math.max(top, footerTop - gap);
        rect = { left, top, width: Math.max(0, right - left), height: Math.max(0, bottom - top) };
    }

    if (rect.width < 140 || rect.height < 110) {
        const top = Math.max(bioRect.bottom + gap, navigationRect.bottom + gap);
        const footerTop = Math.min(contactRect.top, portfolioRect.top);
        rect = { left: pageX, top, width: Math.max(0, viewportWidth - pageX * 2), height: Math.max(0, footerTop - gap - top) };
    }
    setPreviewZoneRect(rect);
}

function isMobileLayout() {
    return window.matchMedia("(max-width: 1000px)").matches;
}

function mountPhotographyField() {
    if (photographyField.parentElement !== page) {
        page.prepend(photographyField);
    }
    calculatePreviewZone();
}

let projectRecords = [];
let desktopProjectVisualGroups = [];
let projectVisualGroups = [];
let groupElements = [];
let photographyInitialReady = false;
let supplementalAnalysisFinished = false;
let photographyLoadPromise = null;
let renderedMobileMode = null;
let introStarted = false;
let introFinished = false;
let introCancelled = false;
let introTimer = null;
let introLogoCompleted = false;
let introBootScheduled = false;
let filmPlaybackMode = "auto";
let filmAutoCloseFrame = null;
let filmAutoCloseStarted = false;

function looksLikeImage(value) {
    if (typeof value !== "string") return false;
    return /\.(jpe?g|png|webp|avif)$/i.test(value.split("?")[0].split("#")[0]);
}

function resolvePhotoUrl(value) {
    if (typeof value !== "string") return null;
    const trimmed = value.trim();
    if (!trimmed) return null;
    if (/^https?:\/\//i.test(trimmed)) return trimmed;
    let path = trimmed.replace(/^\/+/, "").replace(/^photos\//i, "");
    return R2_PHOTOS_BASE + path.split("/").map(encodeURIComponent).join("/");
}

function normalizeUrl(url) {
    return url.split("?")[0].split("#")[0];
}

function uniqueUrls(urls) {
    const seen = new Set();
    return urls.filter(url => {
        const key = normalizeUrl(url);
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
    });
}

function afterTwoPaints(callback) {
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            if (typeof callback === "function") callback();
        });
    });
}

function clearIntroTimer() {
    if (introTimer !== null) {
        clearTimeout(introTimer);
        introTimer = null;
    }
}

function introWait(duration, callback) {
    clearIntroTimer();
    introTimer = setTimeout(() => {
        introTimer = null;
        if (introCancelled) return;
        callback();
    }, duration);
}

function cancelFilmAutoClose() {
    filmAutoCloseStarted = false;
    if (filmAutoCloseFrame !== null) {
        cancelAnimationFrame(filmAutoCloseFrame);
        filmAutoCloseFrame = null;
    }
}

function scheduleAutomaticFilmClose() {
    cancelFilmAutoClose();
    function checkFilmPosition() {
        if (activeMode !== "film" || filmPlaybackMode !== "auto" || introCancelled) {
            filmAutoCloseFrame = null;
            return;
        }
        let duration = FILM_EXACT_DURATION;
        if (Number.isFinite(filmVideo.duration) && filmVideo.duration > 0) {
            duration = filmVideo.duration;
        }
        const closeAt = Math.max(0, duration - FILM_AUTO_CLOSE_LEAD);
        if (filmVideo.currentTime >= closeAt && !filmAutoCloseStarted) {
            filmAutoCloseStarted = true;
            filmAutoCloseFrame = null;
            clearPreviewTheme();
            animateTitlesTo(null, () => {
                filmVideo.pause();
                filmField.classList.remove("active");
                activeMode = null;
                filmAutoCloseStarted = false;
                if (!introCancelled) introFinished = true;
            });
            return;
        }
        filmAutoCloseFrame = requestAnimationFrame(checkFilmPosition);
    }
    filmAutoCloseFrame = requestAnimationFrame(checkFilmPosition);
}

function findFirstImage(value) {
    if (value === null || value === undefined) return null;
    if (typeof value === "string") return looksLikeImage(value) ? value : null;
    if (Array.isArray(value)) {
        for (const item of value) {
            const result = findFirstImage(item);
            if (result) return result;
        }
        return null;
    }
    if (typeof value === "object") {
        for (const child of Object.values(value)) {
            const result = findFirstImage(child);
            if (result) return result;
        }
    }
    return null;
}

function getProjectImageValues(project) {
    if (!project || !Array.isArray(project.images)) return [];
    return project.images.filter(value => looksLikeImage(value));
}

function getProjectCover(project) {
    if (project && looksLikeImage(project.coverOverride)) {
        const overrideUrl = resolvePhotoUrl(project.coverOverride);
        if (overrideUrl) return overrideUrl;
    }
    const images = getProjectImageValues(project);
    if (!images.length) {
        const fallback = findFirstImage(project);
        return fallback ? resolvePhotoUrl(fallback) : null;
    }
    const randomIndex = Math.floor(Math.random() * images.length);
    return resolvePhotoUrl(images[randomIndex]);
}

function getProjectsArray(data) {
    if (Array.isArray(data)) return data;
    if (data && Array.isArray(data.projects)) return data.projects;
    if (data && typeof data === "object") {
        return Object.values(data).filter(value => value && typeof value === "object");
    }
    return [];
}

function loadImageMetadata(url) {
    return new Promise(resolve => {
        const image = new Image();
        image.decoding = "async";
        image.fetchPriority = "low";
        image.onload = () => {
            if (!image.naturalWidth || !image.naturalHeight) {
                resolve(null);
                return;
            }
            resolve({
                url, width: image.naturalWidth, height: image.naturalHeight,
                ratio: image.naturalWidth / image.naturalHeight
            });
        };
        image.onerror = () => resolve(null);
        image.src = url;
    });
}

function updateActiveVisualGroups() {
    const mobile = isMobileLayout();
    if (mobile) {
        projectVisualGroups = desktopProjectVisualGroups.map(group => {
            return {
                projectIndex: group.projectIndex,
                photos: group.photos.length ? [group.photos[0]] : []
            };
        }).filter(group => group.photos.length);
    } else {
        projectVisualGroups = desktopProjectVisualGroups.map(group => {
            return {
                projectIndex: group.projectIndex,
                photos: group.photos.slice(0, 2)
            };
        });
    }
    renderedMobileMode = mobile;
}

async function loadInitialPhotography() {
    if (photographyLoadPromise) return photographyLoadPromise;
    photographyLoadPromise = (async () => {
        const response = await fetch(PROJECTS_JSON_URL, { cache: "no-store" });
        if (!response.ok) throw new Error(`projects.json could not be loaded: ${response.status}`);
        const data = await response.json();
        const projects = getProjectsArray(data);
        
        projectRecords = projects.map((project, projectIndex) => {
            const coverUrl = getProjectCover(project);
            const allUrls = getProjectImageValues(project).map(resolvePhotoUrl).filter(Boolean);
            if (project.coverOverride) {
                const overrideUrl = resolvePhotoUrl(project.coverOverride);
                if (overrideUrl) allUrls.unshift(overrideUrl);
            }
            return { projectIndex, project, coverUrl, allUrls: uniqueUrls(allUrls) };
        }).filter(record => record.coverUrl);

        const initialGroups = await Promise.all(
            projectRecords.map(async record => {
                const cover = await loadImageMetadata(record.coverUrl);
                if (!cover) return null;
                return { projectIndex: record.projectIndex, photos: [cover] };
            })
        );
        
        desktopProjectVisualGroups = initialGroups.filter(Boolean);
        updateActiveVisualGroups();
        buildPhotographyDOM();
        randomizePhotographyLayout();
        photographyInitialReady = true;
        stabilizeLandingLayout();

        const startSupplementalAnalysis = () => { analyzeSupplementalImagesInBackground(); };
        if ("requestIdleCallback" in window) requestIdleCallback(startSupplementalAnalysis, { timeout: 1800 });
        else setTimeout(startSupplementalAnalysis, 700);
    })();
    return photographyLoadPromise;
}

async function analyzeSupplementalImagesInBackground() {
    try {
        const completed = await Promise.all(
            projectRecords.map(async record => {
                const current = desktopProjectVisualGroups.find(group => group.projectIndex === record.projectIndex);
                if (!current) return null;
                const cover = current.photos[0];
                const coverKey = normalizeUrl(record.coverUrl);
                const otherUrls = record.allUrls.filter(url => normalizeUrl(url) !== coverKey);
                const metadata = (await Promise.all(otherUrls.map(loadImageMetadata))).filter(Boolean);
                const landscape = metadata.filter(photo => photo.ratio > 1.05).sort((a, b) => b.ratio - a.ratio)[0] || null;
                return { projectIndex: record.projectIndex, photos: landscape ? [cover, landscape] : [cover] };
            })
        );
        desktopProjectVisualGroups = completed.filter(Boolean);
        supplementalAnalysisFinished = true;
        if (activeMode !== "photography") {
            updateActiveVisualGroups();
            buildPhotographyDOM();
            randomizePhotographyLayout();
        }
    } catch (error) {
        console.error("Background photography analysis failed:", error);
    }
}

function buildPhotographyDOM() {
    scatteredStage.innerHTML = "";
    groupElements = [];
    const fragment = document.createDocumentFragment();
    projectVisualGroups.forEach((group, groupIndex) => {
        const element = document.createElement("div");
        element.className = "photo-group";
        element.dataset.groupIndex = groupIndex;
        group.photos.forEach((photo, photoIndex) => {
            const image = document.createElement("img");
            image.className = "project-photo";
            image.src = photo.url;
            image.alt = "";
            image.decoding = "async";
            image.loading = "eager";
            image.fetchPriority = "low";
            image.dataset.photoIndex = photoIndex;
            element.appendChild(image);
        });
        fragment.appendChild(element);
        groupElements.push(element);
    });
    scatteredStage.appendChild(fragment);
}

function randomBetween(min, max) { return min + Math.random() * (max - min); }
function randomSign() { return Math.random() < 0.5 ? -1 : 1; }

function createProjectGeometry(group, baseHeight) {
    const mobile = isMobileLayout();
    const firstScale = mobile ? randomBetween(0.68, 1.46) : randomBetween(0.64, 1.38);
    const firstHeight = baseHeight * firstScale;
    const first = { photo: group.photos[0], height: firstHeight, width: firstHeight * group.photos[0].ratio, x: 0, y: 0 };
    if (group.photos.length === 1) return { photos: [first], width: first.width, height: first.height };

    const secondPhoto = group.photos[1];
    const secondHeight = baseHeight * randomBetween(0.55, 1.34);
    const secondWidth = secondHeight * secondPhoto.ratio;
    const horizontalGap = randomBetween(DESKTOP_PAIR_DISTANCE_MIN, DESKTOP_PAIR_DISTANCE_MAX);
    const secondX = first.width + horizontalGap;
    const verticalOffset = baseHeight * randomBetween(0.12, 0.62) * randomSign();
    const minY = Math.min(0, verticalOffset);
    first.y = -minY;

    const second = { photo: secondPhoto, height: secondHeight, width: secondWidth, x: secondX, y: verticalOffset - minY };
    return { photos: [first, second], width: second.x + second.width, height: Math.max(first.y + first.height, second.y + second.height) };
}

function createAllProjectGeometries(baseHeight) {
    const mobile = isMobileLayout();
    const gapMin = mobile ? MOBILE_PROJECT_GAP_MIN : DESKTOP_PROJECT_GAP_MIN;
    const gapMax = mobile ? MOBILE_PROJECT_GAP_MAX : DESKTOP_PROJECT_GAP_MAX;
    return projectVisualGroups.map((group, index) => {
        return { index, ...createProjectGeometry(group, baseHeight), gapAfter: randomBetween(gapMin, gapMax) };
    });
}

function getDesktopExclusionZone() {
    if (isMobileLayout()) return null;
    const stageRect = photographyField.getBoundingClientRect();
    const bioRect = biography.getBoundingClientRect();
    const gridRect = landingGrid.getBoundingClientRect();
    const right = Math.min(stageRect.width, (gridRect.left - stageRect.left) + 530 + DESKTOP_TEXT_CLEARANCE_X);
    const bottom = Math.min(stageRect.height, (bioRect.bottom - stageRect.top) + DESKTOP_TEXT_CLEARANCE_Y);
    return { left: 0, top: 0, right, bottom, width: right, height: bottom };
}

function packRegion(geometries, regionWidth, regionHeight, gapMin, gapMax) {
    if (!geometries.length) return { rows: [], totalHeight: 0 };
    const rows = [];
    let row = [];
    let rowWidth = 0;
    let rowHeight = 0;

    for (const geometry of geometries) {
        const gap = row.length ? randomBetween(gapMin, gapMax) : 0;
        if (row.length && rowWidth + gap + geometry.width > regionWidth) {
            rows.push({ items: row, width: rowWidth, height: rowHeight });
            row = []; rowWidth = 0; rowHeight = 0;
        }
        const actualGap = row.length ? randomBetween(gapMin, gapMax) : 0;
        row.push({ geometry, gapBefore: actualGap });
        rowWidth += actualGap + geometry.width;
        rowHeight = Math.max(rowHeight, geometry.height);
    }
    if (row.length) rows.push({ items: row, width: rowWidth, height: rowHeight });

    let totalHeight = 0;
    rows.forEach((current, index) => {
        totalHeight += current.height;
        if (index < rows.length - 1) totalHeight += randomBetween(gapMin, gapMax);
    });
    if (totalHeight > regionHeight) return null;
    return { rows, totalHeight };
}

function createDesktopComposition(fieldWidth, fieldHeight, baseHeight) {
    const geometries = createAllProjectGeometries(baseHeight);
    const exclusion = getDesktopExclusionZone();
    if (!exclusion) return null;

    const upperX = exclusion.right;
    const upperWidth = Math.max(0, fieldWidth - upperX);
    const upperHeight = Math.max(0, exclusion.bottom);
    const lowerY = exclusion.bottom;
    const lowerHeight = Math.max(0, fieldHeight - lowerY);
    let best = null;

    for (let split = 0; split <= geometries.length; split++) {
        const upperItems = geometries.slice(0, split);
        const lowerItems = geometries.slice(split);
        const upper = packRegion(upperItems, upperWidth, upperHeight, DESKTOP_PROJECT_GAP_MIN, DESKTOP_PROJECT_GAP_MAX);
        if (!upper) continue;
        const lower = packRegion(lowerItems, fieldWidth, lowerHeight, DESKTOP_PROJECT_GAP_MIN, DESKTOP_PROJECT_GAP_MAX);
        if (!lower) continue;

        const upperFill = upperHeight > 0 ? upper.totalHeight / upperHeight : 0;
        const lowerFill = lowerHeight > 0 ? lower.totalHeight / lowerHeight : 0;
        const score = upperFill * 0.45 + lowerFill * 0.55;

        if (!best || score > best.score) {
            best = { score, upper, lower, upperX, upperWidth, upperHeight, lowerY, lowerHeight, geometries };
        }
    }
    return best;
}

function packMobileProjects(geometries, fieldWidth, fieldHeight) {
    const rows = [];
    let currentRow = [];
    let currentWidth = 0;
    let rowHeight = 0;

    geometries.forEach(geometry => {
        const rowLimit = fieldWidth * randomBetween(0.94, 1);
        const addition = currentRow.length ? (currentRow[currentRow.length - 1].gapAfter + geometry.width) : geometry.width;
        if (currentRow.length && currentWidth + addition > rowLimit) {
            rows.push({ items: currentRow, width: currentWidth, height: rowHeight });
            currentRow = []; currentWidth = 0; rowHeight = 0;
        }
        if (currentRow.length) currentWidth += currentRow[currentRow.length - 1].gapAfter;
        currentRow.push(geometry);
        currentWidth += geometry.width;
        rowHeight = Math.max(rowHeight, geometry.height);
    });
    if (currentRow.length) rows.push({ items: currentRow, width: currentWidth, height: rowHeight });

    const rowGaps = [];
    for (let i = 0; i < rows.length - 1; i++) rowGaps.push(randomBetween(8, 22));

    const totalHeight = rows.reduce((total, row) => total + row.height, 0) + rowGaps.reduce((total, gap) => total + gap, 0);
    if (totalHeight > fieldHeight || rows.some(row => row.width > fieldWidth)) return null;
    return { rows, rowGaps, totalHeight };
}

function createPhotographyComposition(fieldWidth, fieldHeight) {
    if (!projectVisualGroups.length) return null;
    const mobile = isMobileLayout();
    let low = mobile ? Math.max(38, fieldHeight * 0.11) : Math.max(34, fieldHeight * 0.075);
    let high = mobile ? Math.min(fieldHeight * 0.42, fieldWidth * 0.34) : Math.min(fieldHeight * 0.32, fieldWidth * 0.18);
    let best = null;

    for (let iteration = 0; iteration < 8; iteration++) {
        const mid = (low + high) / 2;
        let candidate = null;
        for (let test = 0; test < 6; test++) {
            if (mobile) {
                const geometries = createAllProjectGeometries(mid);
                const packed = packMobileProjects(geometries, fieldWidth, fieldHeight);
                if (packed) { candidate = { type: "mobile", geometries, packed }; break; }
            } else {
                const desktop = createDesktopComposition(fieldWidth, fieldHeight, mid);
                if (desktop) { candidate = { type: "desktop", ...desktop }; break; }
            }
        }
        if (candidate) { best = candidate; low = mid; } else { high = mid; }
    }
    return best;
}

function placeRegionRows(rows, regionX, regionY, regionWidth, regionHeight, placements) {
    if (!rows.length) return;
    const totalRowHeight = rows.reduce((total, row) => total + row.height, 0);
    const minimumGap = rows.length > 1 ? DESKTOP_PROJECT_GAP_MIN * (rows.length - 1) : 0;
    const spare = Math.max(0, regionHeight - totalRowHeight - minimumGap);
    let y = regionY + randomBetween(0, Math.min(spare * 0.35, 30));

    rows.forEach((row, rowIndex) => {
        const spareX = Math.max(0, regionWidth - row.width);
        let x = regionX + randomBetween(0, spareX);
        row.items.forEach(item => {
            x += item.gapBefore || 0;
            const geometry = item.geometry;
            const verticalFreedom = Math.max(0, row.height - geometry.height);
            placements.set(geometry.index, { x, y: y + randomBetween(0, verticalFreedom), geometry });
            x += geometry.width;
        });
        y += row.height;
        if (rowIndex < rows.length - 1) y += randomBetween(DESKTOP_PROJECT_GAP_MIN, DESKTOP_PROJECT_GAP_MAX);
    });
}

function applyDesktopComposition(composition, fieldWidth, fieldHeight) {
    const placements = new Map();
    placeRegionRows(composition.upper.rows, composition.upperX, 0, composition.upperWidth, composition.upperHeight, placements);
    placeRegionRows(composition.lower.rows, 0, composition.lowerY, fieldWidth, composition.lowerHeight, placements);
    applyPlacements(placements);
}

function applyMobileComposition(composition, fieldWidth, fieldHeight) {
    const { rows, rowGaps, totalHeight } = composition.packed;
    const spareVertical = Math.max(0, fieldHeight - totalHeight);
    let y = randomBetween(spareVertical * 0.02, spareVertical * 0.22);
    const placements = new Map();

    rows.forEach((row, rowIndex) => {
        const spareHorizontal = Math.max(0, fieldWidth - row.width);
        let x = randomBetween(0, Math.min(spareHorizontal, fieldWidth * 0.10));
        row.items.forEach((geometry, index) => {
            const verticalFreedom = Math.max(0, row.height - geometry.height);
            placements.set(geometry.index, { x, y: y + randomBetween(0, verticalFreedom), geometry });
            x += geometry.width;
            if (index < row.items.length - 1) x += geometry.gapAfter;
        });
        y += row.height;
        if (rowIndex < rowGaps.length) y += rowGaps[rowIndex];
    });
    applyPlacements(placements);
}

function applyPlacements(placements) {
    groupElements.forEach((element, index) => {
        const placement = placements.get(index);
        if (!placement) return;
        const geometry = placement.geometry;
        element.style.setProperty("--group-x", `${placement.x}px`);
        element.style.setProperty("--group-y", `${placement.y}px`);
        element.style.setProperty("--group-width", `${geometry.width}px`);
        element.style.setProperty("--group-height", `${geometry.height}px`);
        const images = element.querySelectorAll(".project-photo");
        geometry.photos.forEach((photo, photoIndex) => {
            const image = images[photoIndex];
            if (!image) return;
            image.style.setProperty("--photo-height", `${photo.height}px`);
            image.style.setProperty("--photo-x", `${photo.x}px`);
            image.style.setProperty("--photo-y", `${photo.y}px`);
        });
    });
}

function randomizePhotographyLayout() {
    const rect = photographyField.getBoundingClientRect();
    if (rect.width <= 0 || rect.height <= 0 || !groupElements.length) return;
    const composition = createPhotographyComposition(rect.width, rect.height);
    if (!composition) return;
    if (composition.type === "mobile") applyMobileComposition(composition, rect.width, rect.height);
    else applyDesktopComposition(composition, rect.width, rect.height);
}

let photoSequenceFrame = null;
let photoSequenceToken = 0;

function cancelPhotoSequence() {
    photoSequenceToken++;
    if (photoSequenceFrame !== null) {
        cancelAnimationFrame(photoSequenceFrame);
        photoSequenceFrame = null;
    }
}

function setVisiblePhotoGroupCount(count) {
    const normalized = Math.max(0, Math.min(groupElements.length, count));
    groupElements.forEach((group, index) => {
        group.classList.toggle("visible", index < normalized);
    });
}

function animatePhotoGroups(targetCount, onComplete = null) {
    cancelPhotoSequence();
    const token = photoSequenceToken;
    const currentCount = groupElements.filter(group => group.classList.contains("visible")).length;
    const target = Math.max(0, Math.min(groupElements.length, targetCount));
    if (currentCount === target) {
        if (typeof onComplete === "function") onComplete();
        return;
    }
    const started = performance.now();
    function frame(now) {
        if (token !== photoSequenceToken) return;
        const progress = Math.min(1, (now - started) / PHOTO_SEQUENCE_DURATION);
        const raw = currentCount + (target - currentCount) * progress;
        const count = target > currentCount ? Math.floor(raw + 0.0001) : Math.ceil(raw - 0.0001);
        setVisiblePhotoGroupCount(count);
        if (progress < 1) {
            photoSequenceFrame = requestAnimationFrame(frame);
            return;
        }
        setVisiblePhotoGroupCount(target);
        photoSequenceFrame = null;
        if (typeof onComplete === "function") requestAnimationFrame(onComplete);
    }
    photoSequenceFrame = requestAnimationFrame(frame);
}

const navItems = {
    photography: { desktopWord: "photography.denizalpaybak.com", mobileWord: "photography.", word: "photography.denizalpaybak.com", caseLength: "photography.".length, baseCount: 0, element: photographyText, count: 0 },
    film: { desktopWord: "film.denizalpaybak.com", mobileWord: "film.", word: "film.denizalpaybak.com", caseLength: "film.".length, baseCount: 0, element: filmText, count: 0 }
};

function isPortraitNavigation() {
    return window.matchMedia("(max-width: 600px) and (orientation: portrait)").matches;
}

function syncNavigationWords() {
    const portrait = isPortraitNavigation();
    [navItems.photography, navItems.film].forEach(item => {
        item.word = portrait ? item.mobileWord : item.desktopWord;
        item.caseLength = item.mobileWord === item.word ? item.word.length : item.mobileWord.length;
        item.baseCount = 0;
        item.count = Math.min(item.count, item.caseLength);
        item.element.textContent = item.word;
    });
}

function renderCaseWord(item, count) {
    const normalized = Math.max(0, Math.min(item.caseLength, Math.round(count)));
    const prefix = item.word.slice(0, item.caseLength);
    const suffix = item.word.slice(item.caseLength);
    return prefix.slice(0, normalized).toUpperCase() + prefix.slice(normalized) + suffix;
}

function setWordCount(item, count) {
    item.count = Math.max(0, Math.min(item.word.length, Math.round(count)));
    item.element.textContent = renderCaseWord(item, item.count);
}

let titleFrame = null;
let titleToken = 0;

function animateTitlesTo(mode, onComplete = null) {
    titleToken++;
    const token = titleToken;
    if (titleFrame !== null) { cancelAnimationFrame(titleFrame); titleFrame = null; }
    const photography = navItems.photography;
    const film = navItems.film;
    const photoStart = photography.count;
    const filmStart = film.count;
    const photoTarget = mode === "photography" ? photography.caseLength : photography.baseCount;
    const filmTarget = mode === "film" ? film.caseLength : film.baseCount;
    const started = performance.now();

    function frame(now) {
        if (token !== titleToken) return;
        const progress = Math.min(1, (now - started) / WORD_TRANSITION_DURATION);
        const photoRaw = photoStart + (photoTarget - photoStart) * progress;
        const filmRaw = filmStart + (filmTarget - filmStart) * progress;
        setWordCount(photography, photoTarget >= photoStart ? Math.floor(photoRaw + 0.0001) : Math.ceil(photoRaw - 0.0001));
        setWordCount(film, filmTarget >= filmStart ? Math.floor(filmRaw + 0.0001) : Math.ceil(filmRaw - 0.0001));
        if (progress < 1) { titleFrame = requestAnimationFrame(frame); return; }
        setWordCount(photography, photoTarget);
        setWordCount(film, filmTarget);
        titleFrame = null;
        if (typeof onComplete === "function") requestAnimationFrame(onComplete);
    }
    titleFrame = requestAnimationFrame(frame);
}

let lastRandomPhotographyImage = null;

}

let mobileSectionNavigationInProgress = false;

}

async function switchToFilmLayer() {
    photographyField.classList.remove("active");

}

function hideFilmWithTitle(onComplete = null) {

function refreshPhotographyDOMIfNeeded() {
    const currentMobileMode = isMobileLayout();
    if (renderedMobileMode !== currentMobileMode) {
        updateActiveVisualGroups();
        buildPhotographyDOM();
        return;
    }
    if (!supplementalAnalysisFinished) return;
    updateActiveVisualGroups();
    const expectedImages = projectVisualGroups.reduce((total, group) => total + group.photos.length, 0);
    const currentImages = scatteredStage.querySelectorAll(".project-photo").length;

}

function enterIdle(onComplete = null) {
    clearPreviewTheme();
    cancelPhotoSequence();
    cancelFilmAutoClose();
    filmPlaybackMode = "auto";
    if (photographyField.classList.contains("active")) {
        clearSinglePhotographyPreview();
        animateTitlesTo(null, () => {
            photographyField.classList.remove("active");
            setVisiblePhotoGroupCount(0);
            activeMode = null;
            if (typeof onComplete === "function") onComplete();
        });
        return;
    }
    if (filmField.classList.contains("active")) {
        hideFilmWithTitle(onComplete);
        return;
    }
    filmVideo.pause();
    clearSinglePhotographyPreview();
    setVisiblePhotoGroupCount(0);
    photographyField.classList.remove("active");
    filmField.classList.remove("active");
    activeMode = null;
    animateTitlesTo(null, onComplete);
}

function clearSinglePhotographyPreview() {
    fixedPhotoPreview.classList.remove("visible");

    scatteredStage.querySelectorAll(".single-photo-visible").forEach(element => element.classList.remove("single-photo-visible"));
}

function showRandomPhotographyImage(onReady = null) {
    clearSinglePhotographyPreview();
    setVisiblePhotoGroupCount(0);
    scatteredStage.classList.add("single-photo-mode");
    fixedPhotoPreview.classList.add("visible");
    const ready = () => { if (typeof onReady === "function") onReady(); };
    if (fixedPhotoPreview.complete && fixedPhotoPreview.naturalWidth > 0) ready();
    else {
        fixedPhotoPreview.addEventListener("load", ready, { once: true });
        fixedPhotoPreview.addEventListener("error", ready, { once: true });

fixedPhotoPreview.addEventListener("click", event => {
    if (!fixedPhotoPreview.classList.contains("visible") || !photographyField.classList.contains("active")) return;

    cancelAutomaticIntroForInteraction();
    clearIntroTimer();
    cancelFilmAutoClose();

});

function startPhotography(onReady = null) {
    if (!photographyInitialReady) { setTimeout(() => { startPhotography(onReady); }, 100); return; }
    activeMode = "photography";
    setPreviewTheme("photography");
    filmPlaybackMode = "auto";
    cancelFilmAutoClose();
    cancelPhotoSequence();
    filmVideo.pause();
    filmField.classList.remove("active");
    refreshPhotographyDOMIfNeeded();
    photographyField.classList.add("active");

function startFilm(onReady = null, playbackMode = "auto") {
    cancelPhotoSequence();
    cancelFilmAutoClose();
    activeMode = "film";
    setPreviewTheme("film");
    filmPlaybackMode = playbackMode;
    const photographyVisible = photographyField.classList.contains("active");
    const revealFilm = () => {
        if (activeMode !== "film") return;
        photographyField.classList.remove("active");
        switchToFilmLayer().then(() => {
            if (playbackMode === "auto") scheduleAutomaticFilmClose();
            if (typeof onReady === "function") onReady();
        });
    };
    if (photographyVisible && playbackMode === "hover") {
        cancelPhotoSequence();
        clearSinglePhotographyPreview();
        setVisiblePhotoGroupCount(0);
        photographyField.classList.remove("active");
        filmField.classList.add("active");
        playFilmFromBeginning();
        animateTitlesTo("film");
        if (typeof onReady === "function") requestAnimationFrame(onReady);
        return;
    }
    if (photographyVisible) {
        animatePhotoGroups(0);
        animateTitlesTo("film", revealFilm);
        return;
    }
    animateTitlesTo("film", revealFilm);
}

function scheduleAutomaticIntroBoot() {
    if (introBootScheduled) return;
    introBootScheduled = true;
    const boot = () => {
        if (introCancelled || introStarted || introFinished) return;
        afterTwoPaints(() => {
            if (introCancelled || introStarted || introFinished) return;
            scheduleAutomaticIntroBoot();
        });
    };
    if (document.readyState === "complete") boot();
    else window.addEventListener("load", boot, { once: true });
}

function startAutomaticIntro() {
    if (introStarted || introFinished) return;
    introStarted = true;
    introCancelled = false;
    introLogoCompleted = false;
    introWait(INTRO_INITIAL_DELAY, introLogo);
}

function cancelAutomaticIntroForInteraction() {
    if (introFinished) return;
    introCancelled = true;
    introFinished = true;
    clearIntroTimer();
    cancelFilmAutoClose();
}

filmVideo.addEventListener("ended", async () => {
    if (activeMode !== "film") return;
    if (filmPlaybackMode === "hover" && canHover() && hoverMode === "film") {
        await playFilmFromBeginning();
        return;
    }
    if (filmPlaybackMode === "auto" && filmAutoCloseStarted) {
        filmField.classList.remove("active");
        clearPreviewTheme();
        return;
    }
    if (filmPlaybackMode === "auto") {
        cancelFilmAutoClose();
        filmField.classList.remove("active");
        clearPreviewTheme();
        animateTitlesTo(null, () => {
            activeMode = null;
            if (!introCancelled) introFinished = true;
        });
    }
});

function canHover() {
    return window.matchMedia("(hover: hover) and (pointer: fine)").matches;
}

photographyLink.addEventListener("mouseenter", () => {
    if (!canHover()) return;
    cancelAutomaticIntroForInteraction();
    hoverMode = "photography";
    animateTitlesTo("photography");
});

photographyLink.addEventListener("mouseleave", () => {
    if (!canHover()) return;
    setTimeout(() => {
        if (photographyLink.matches(":hover") || filmLink.matches(":hover")) return;
        if (hoverMode !== "photography") return;
        hoverMode = null;
        animateTitlesTo(null);
    }, 0);
});

filmLink.addEventListener("mouseenter", () => {
    if (!canHover()) return;
    cancelAutomaticIntroForInteraction();
    hoverMode = "film";
    animateTitlesTo("film");
});

filmLink.addEventListener("mouseleave", () => {
    if (!canHover()) return;
    setTimeout(() => {
        if (filmLink.matches(":hover") || photographyLink.matches(":hover")) return;
        if (hoverMode !== "film") return;
        hoverMode = null;
        animateTitlesTo(null);
    }, 0);
});

function waitForMobileSectionNavigation(duration) {
    return new Promise(resolve => { setTimeout(resolve, duration); });
}

function animateTitlesToPromise(mode) {
    return new Promise(resolve => { animateTitlesTo(mode, resolve); });
}

function animateLogoToPromise(target) {
    return new Promise(resolve => { animateLogoTo(target, resolve); });
}

function closePhotographyForMobileNavigation() {
    return new Promise(resolve => {
        cancelPhotoSequence();
        if (photographyField.classList.contains("active")) {
            animatePhotoGroups(0, () => {
                photographyField.classList.remove("active");
                setVisiblePhotoGroupCount(0);
                resolve();
            });
            return;
        }
        setVisiblePhotoGroupCount(0);
        photographyField.classList.remove("active");
        resolve();
    });
}

async function navigateFromMobileSection(targetMode, destination) {
    if (canHover() || mobileSectionNavigationInProgress) return;
    mobileSectionNavigationInProgress = true;
    clearPreviewTheme();
    cancelAutomaticIntroForInteraction();
    clearIntroTimer();
    cancelFilmAutoClose();
    cancelPhotoSequence();
    hoverMode = null;
    filmPlaybackMode = "auto";
    filmVideo.pause();
    filmField.classList.remove("active");
    const photographyClosing = closePhotographyForMobileNavigation();
    const logoReset = animateLogoToPromise(0);
    const titleTransition = animateTitlesToPromise(targetMode);
    await Promise.all([photographyClosing, logoReset, titleTransition]);
    activeMode = null;
    await waitForMobileSectionNavigation(MOBILE_SECTION_NAV_HOLD);
    window.location.href = destination;
}

photographyLink.addEventListener("click", event => {
    if (canHover()) return;
    event.preventDefault();
    navigateFromMobileSection("photography", photographyLink.href);
});

filmLink.addEventListener("click", event => {
    if (canHover()) return;
    event.preventDefault();
    navigateFromMobileSection("film", filmLink.href);
});
</script>
