<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
    }

    body {
        cursor: pointer;
    }


    /* =========================
       LEFT INFORMATION
       ========================= */

    .info {
        position: fixed;
        top: 32px;
        left: 48px;
        z-index: 10;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.15;
    }


    /* =========================
       LOGO
       ========================= */

    .logo {
        position: relative;
        display: block;

        width: 190px;

        /*
            Two text lines + exactly one
            additional line of breathing room.
        */
        height: 52px;

        margin: 0;
        padding: 0;

        color: inherit;
        text-decoration: none;

        cursor: pointer;
    }


    /* NAME */

    .logo-name {
        position: absolute;

        top: 0;
        left: 0;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.15;

        white-space: nowrap;
    }


    /* AYBAK */

    .logo-aybak {
        position: absolute;

        top: 17px;
        left: 0;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.15;
        letter-spacing: 0;

        white-space: nowrap;
    }


    .logo-aybak span {
        display: inline-block;
    }


    /* =========================
       CONTACT / SOCIAL
       ========================= */

    .contact {
        margin: 0;
        padding: 0;
    }

    .social {
        display: flex;
        flex-direction: column;
        gap: 0;

        margin: 0;
        padding: 0;
    }

    .info a {
        color: inherit;
        text-decoration: none;
        font-weight: 400;
    }

    .info a:hover {
        text-decoration: underline;
    }


    /* =========================
       SLIDESHOW
       ========================= */

    #slideshow {
        position: fixed;
        inset: 0;

        width: 100vw;
        height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        pointer-events: none;
    }

    .slide {
        position: absolute;

        width: auto;
        height: auto;

        max-width: 70vw;
        max-height: 80vh;

        object-fit: contain;

        opacity: 0;
    }

    .slide.active {
        opacity: 1;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

        .info {
            top: 20px;
            left: 24px;
            font-size: 13px;
        }

        .logo {
            width: 160px;

            /*
                2 lines + exactly one line
                of breathing room on mobile.
            */
            height: 45px;

            margin-bottom: 0;
        }

        .logo-name {
            font-size: 13px;
        }

        .logo-aybak {
            top: 15px;
            font-size: 13px;
        }

        .slide {
            max-width: 84vw;
            max-height: 72vh;
        }

    }

</style>
</head>

<body>


<div class="info">

    <a
        class="logo"
        href="https://denizalpaybak.com/"
        target="_self"
    >

        <span class="logo-name" id="logo-name">
            Denizalp
        </span>

        <span class="logo-aybak">

            <span id="letter-a">a</span><span id="letter-y">y</span><span id="letter-b">b</span><span id="letter-a2">a</span><span id="letter-k">k</span>

        </span>

    </a>


    <div class="contact">

        <a
            href="mailto:d@denizalpaybak.com"
            target="_blank"
            rel="noopener"
        >
            d@denizalpaybak.com
        </a>

    </div>


    <div class="social">

        <a
            href="https://www.instagram.com/denizalpaybak/"
            target="_blank"
            rel="noopener"
        >
            instagram @denizalpaybak
        </a>

        <a
            href="https://models.com/people/denizalp-aybak"
            target="_blank"
            rel="noopener"
        >
            models.com
        </a>

    </div>

</div>


<div id="slideshow">

    <img class="slide active" src="01.jpg">
    <img class="slide" src="02.jpg">
    <img class="slide" src="03.jpg">
    <img class="slide" src="04.jpg">

</div>


<script>


    /* =====================================================
       SLIDESHOW
       ===================================================== */

    const slides = document.querySelectorAll('.slide');

    let current = 0;
    let manualMode = false;


    function nextSlide() {

        slides[current].classList.remove('active');

        current = (current + 1) % slides.length;

        slides[current].classList.add('active');

    }


    setInterval(() => {

        if (!manualMode) {
            nextSlide();
        }

    }, 3000);


    document.body.addEventListener('click', (event) => {

        if (event.target.closest('a')) {
            return;
        }

        if (!manualMode) {

            manualMode = true;

            return;
        }

        nextSlide();

    });


    /* =====================================================
       LOGO
       ===================================================== */

    const logo = document.querySelector('.logo');

    const logoName = document.getElementById('logo-name');

    const letters = [

        document.getElementById('letter-a'),
        document.getElementById('letter-y'),
        document.getElementById('letter-b'),
        document.getElementById('letter-a2'),
        document.getElementById('letter-k')

    ];


    const lowercase = ['a', 'y', 'b', 'a', 'k'];

    const uppercase = ['A', 'Y', 'B', 'A', 'K'];


    /*
        Logo state:

        0 = Denizalp
            aybak

        1 = denizalp
            Aybak

        2 = denizalp
            AYbak

        3 = denizalp
            AYBak

        4 = denizalp
            AYBAk

        5 = denizalp
            AYBAK
    */

    let logoState = 0;

    let logoTarget = 0;

    let logoTimer = null;

    let mobileCycleTimer = null;


    function setLogoState(state) {

        logoState = state;


        /*
            D is uppercase only in state 0.
        */

        if (state === 0) {

            logoName.textContent = 'Denizalp';

        } else {

            logoName.textContent = 'denizalp';

        }


        /*
            Uppercase letters according to state.
        */

        for (let i = 0; i < letters.length; i++) {

            if (i < state) {

                letters[i].textContent = uppercase[i];

            } else {

                letters[i].textContent = lowercase[i];

            }

        }

    }


    /*
        Cancel whatever logo movement is currently happening.
    */

    function cancelLogoAnimation() {

        if (logoTimer !== null) {

            clearTimeout(logoTimer);

            logoTimer = null;

        }

    }


    /*
        Move one step toward the target.

        Because this checks the target every 120ms,
        changing direction mid-animation works correctly.
    */

    function moveLogo() {

        if (logoState === logoTarget) {

            logoTimer = null;

            return;

        }


        if (logoState < logoTarget) {

            setLogoState(logoState + 1);

        } else {

            setLogoState(logoState - 1);

        }


        logoTimer = setTimeout(moveLogo, 120);

    }


    /*
        Tell the logo where it should go.
    */

    function animateTo(target) {

        logoTarget = target;

        cancelLogoAnimation();

        moveLogo();

    }


    /* =====================================================
       DESKTOP
       ===================================================== */

    /*
        Mouse enters:

        Denizalp
        aybak

            ↓

        denizalp
        aybak

            ↓

        denizalp
        Aybak

            ↓

        denizalp
        AYbak

            ↓

        denizalp
        AYBak

            ↓

        denizalp
        AYBAk

            ↓

        denizalp
        AYBAK
    */

    logo.addEventListener('mouseenter', () => {

        if (window.matchMedia('(min-width: 601px)').matches) {

            animateTo(5);

        }

    });


    /*
        Mouse leaves:

        Wherever the animation currently is,
        immediately start moving back toward:

        Denizalp
        aybak
    */

    logo.addEventListener('mouseleave', () => {

        if (window.matchMedia('(min-width: 601px)').matches) {

            animateTo(0);

        }

    });


    /* =====================================================
       MOBILE
       ===================================================== */

    /*
        Mobile animation:

        START

        Denizalp
        aybak

        wait 2 seconds

            ↓

        denizalp
        aybak

            ↓

        denizalp
        Aybak

            ↓

        denizalp
        AYbak

            ↓

        denizalp
        AYBak

            ↓

        denizalp
        AYBAk

            ↓

        denizalp
        AYBAK

        wait 2 seconds

            ↓

        reverse

        wait 2 seconds

        repeat forever.
    */

    function startMobileCycle() {


        /*
            Wait in the current state.
        */

        mobileCycleTimer = setTimeout(() => {


            /*
                Forward to AYBAK.
            */

            animateTo(5);


            /*
                The animation takes:

                5 × 120ms = 600ms

                Then wait 2 seconds.
            */

            mobileCycleTimer = setTimeout(() => {


                /*
                    Reverse back to the beginning.
                */

                animateTo(0);


                /*
                    Again:

                    600ms animation
                    + 2 second pause
                */

                mobileCycleTimer = setTimeout(() => {

                    startMobileCycle();

                }, 600 + 2000);

            }, 600 + 2000);

        }, 2000);

    }


    if (window.matchMedia('(max-width: 600px)').matches) {


        /*
            EXACT mobile opening state:

            Denizalp
            aybak
        */

        setLogoState(0);


        /*
            Start the infinite cycle after
            the initial 2-second pause.
        */

        startMobileCycle();

    }


</script>

</body>
</html>
