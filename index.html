/* =====================================================
   AYBAK END CARD — TEXT STATE + FAST FADE
   ===================================================== */

const landingAybakEndCard =
    document.getElementById(
        "landing-aybak-end-card"
    );

const landingAybakLogo =
    document.getElementById(
        "landing-aybak-logo"
    );

const landingAybakName =
    document.getElementById(
        "landing-aybak-name"
    );

const landingAybakAybak =
    document.getElementById(
        "landing-aybak-aybak"
    );

let landingAybakActive =
    false;

let landingAybakLeaving =
    false;

let landingAybakLogoState =
    0;

let landingAybakLogoTarget =
    0;

let landingAybakLogoTimer =
    null;

let landingAybakLeaveTimer =
    null;

let landingAybakTouchStartX =
    null;

let landingAybakTouchStartY =
    null;

let landingAybakWheelAccumulator =
    0;

let landingAybakWheelTimer =
    null;

const LANDING_AYBAK_WHEEL_THRESHOLD =
    48;

const LANDING_AYBAK_SWIPE_THRESHOLD =
    52;

const LANDING_AYBAK_FADE_DURATION =
    420;

const LANDING_AYBAK_PRELEAVE_HOLD =
    120;

const LANDING_AYBAK_MOBILE_HOLD =
    520;

function setLandingAybakLogoState(
    state
) {

    landingAybakLogoState =
        Math.max(0, Math.min(5, state));

    landingAybakName.textContent =
        landingAybakLogoState === 0
            ? "Denizalp"
            : "denizalp";

    const lowercase = ["a", "y", "b", "a", "k"];
    const uppercase = ["A", "Y", "B", "A", "K"];

    landingAybakAybak
        .querySelectorAll(".landing-aybak-letter")
        .forEach((letter, index) => {
            letter.textContent =
                index < landingAybakLogoState
                    ? uppercase[index]
                    : lowercase[index];
        });
}

function animateLandingAybakLogoTo(
    target,
    callback = null
) {

    landingAybakLogoTarget =
        target;

    if (
        landingAybakLogoTimer !==
        null
    ) {

        clearTimeout(
            landingAybakLogoTimer
        );

        landingAybakLogoTimer =
            null;

    }

    function step() {

        if (
            landingAybakLogoState ===
            landingAybakLogoTarget
        ) {

            landingAybakLogoTimer =
                null;

            if (
                typeof callback ===
                "function"
            ) {

                callback();
            }

            return;
        }

        landingAybakLogoState +=
            landingAybakLogoState <
            landingAybakLogoTarget
                ? 1
                : -1;

        setLandingAybakLogoState(
            landingAybakLogoState
        );

        landingAybakLogoTimer =
            setTimeout(
                step,
                LOGO_STEP_DURATION
            );
    }

    step();
}

function finishLandingAybakLeave() {

    if (
        landingAybakLeaveTimer !==
        null
    ) {

        clearTimeout(
            landingAybakLeaveTimer
        );

        landingAybakLeaveTimer =
            null;
    }

    /*
       The logical black state ends immediately. The CSS fade continues
       independently, which means a new gesture/click can reopen the card
       without waiting for the outgoing animation to finish.
    */
    landingAybakActive = false;

    document.body.classList.remove(
        "landing-aybak-active"
    );

    document.documentElement.classList.remove(
        "landing-aybak-active"
    );

    landingAybakEndCard.setAttribute(
        "aria-hidden",
        "true"
    );

    document.body.classList.add(
        "landing-aybak-leaving"
    );

    document.documentElement.classList.add(
        "landing-aybak-leaving"
    );

    landingAybakLeaveTimer =
        setTimeout(
            () => {

                landingAybakLeaveTimer =
                    null;

                document.body.classList.remove(
                    "landing-aybak-leaving"
                );

                document.documentElement.classList.remove(
                    "landing-aybak-leaving"
                );

                /* Reset only after the visual fade has completed. */
                setLandingAybakLogoState(0);

                landingAybakLeaving =
                    false;

            },
            LANDING_AYBAK_FADE_DURATION
        );
}

function leaveLandingAybak(prepareUppercase = true) {

    if (
        !landingAybakActive ||
        landingAybakLeaving
    ) {
        return;
    }

    landingAybakLeaving =
        true;

    if (
        prepareUppercase &&
        landingAybakLogoState < 5
    ) {

        animateLandingAybakLogoTo(
            5,
            () => {

                landingAybakLeaveTimer =
                    setTimeout(
                        finishLandingAybakLeave,
                        canHover()
                            ? LANDING_AYBAK_PRELEAVE_HOLD
                            : LANDING_AYBAK_MOBILE_HOLD
                    );

            }
        );

        return;
    }

    landingAybakLeaveTimer =
        setTimeout(
            finishLandingAybakLeave,
            prepareUppercase
                ? (canHover()
                    ? LANDING_AYBAK_PRELEAVE_HOLD
                    : LANDING_AYBAK_MOBILE_HOLD)
                : 0
        );
}

function setLandingAybakEndCard(
    active
) {

    const next =
        Boolean(
            active
        );

    /* Re-entering the black card must be immediate. Cancel every pending
       white-transition timer/flag before evaluating the current state. */
    if (next) {
        if (landingAybakLeaveTimer !== null) {
            clearTimeout(landingAybakLeaveTimer);
            landingAybakLeaveTimer = null;
        }

        landingAybakLeaving = false;

        document.body.classList.remove("landing-aybak-leaving");
        document.documentElement.classList.remove("landing-aybak-leaving");

        document.dispatchEvent(
            new CustomEvent("landing-aybak-force-enter")
        );
    }

    if (
        next ===
        landingAybakActive
    ) {
        return;
    }

    if (
        !next
    ) {
        leaveLandingAybak(false);
        return;
    }

    cancelAutomaticIntroForInteraction();
    clearIntroTimer();
    cancelFilmAutoClose();

    landingAybakLeaving =
        false;

    if (
        landingAybakLeaveTimer !==
        null
    ) {
        clearTimeout(
            landingAybakLeaveTimer
        );
        landingAybakLeaveTimer =
            null;
    }

    document.body.classList.remove(
        "landing-aybak-leaving"
    );

    document.documentElement.classList.remove(
        "landing-aybak-leaving"
    );

    setLandingAybakLogoState(0);

    landingAybakActive =
        true;

    document.body.classList.add(
        "landing-aybak-active"
    );

    document.documentElement.classList.add(
        "landing-aybak-active"
    );

    landingAybakEndCard.setAttribute(
        "aria-hidden",
        "false"
    );
}

/* Desktop: the end-card itself has the same uppercase hover gesture. */
landingAybakLogo.addEventListener(
    "mouseenter",
    () => {

        if (
            !canHover() ||
            landingAybakLeaving
        ) {
            return;
        }

        animateLandingAybakLogoTo(5);
    }
);

landingAybakLogo.addEventListener(
    "mouseleave",
    () => {

        if (
            !canHover() ||
            landingAybakLeaving
        ) {
            return;
        }

        animateLandingAybakLogoTo(0);
    }
);

/* Clicking always allows the uppercase state to complete before white. */
landingAybakLogo.addEventListener(
    "click",
    event => {

        event.preventDefault();
        event.stopPropagation();

        leaveLandingAybak(true);
    }
);

window.addEventListener(
    "wheel",
    event => {

        if (
            event.ctrlKey
        ) {
            return;
        }

        landingAybakWheelAccumulator +=
            event.deltaY;

        if (
            landingAybakWheelTimer !==
            null
        ) {
            clearTimeout(
                landingAybakWheelTimer
            );
        }

        landingAybakWheelTimer =
            setTimeout(
                () => {
                    landingAybakWheelAccumulator = 0;
                    landingAybakWheelTimer = null;
                },
                140
            );

        if (
            !landingAybakActive &&
            landingAybakWheelAccumulator >
                LANDING_AYBAK_WHEEL_THRESHOLD
        ) {
            event.preventDefault();
            landingAybakWheelAccumulator = 0;
            setLandingAybakEndCard(
                true
            );
        }
        else if (
            landingAybakActive &&
            landingAybakWheelAccumulator <
                -LANDING_AYBAK_WHEEL_THRESHOLD
        ) {
            event.preventDefault();
            landingAybakWheelAccumulator = 0;
            setLandingAybakEndCard(
                false
            );
        }

    },
    { passive: false }
);


window.addEventListener(
    "touchstart",
    event => {
        const touch =
            event.touches[0];
        landingAybakTouchStartX =
            touch ? touch.clientX : null;
        landingAybakTouchStartY =
            touch ? touch.clientY : null;
    },
    { passive: true }
);


window.addEventListener(
    "touchend",
    event => {

        if (
            landingAybakTouchStartX === null ||
            landingAybakTouchStartY === null
        ) {
            return;
        }

        const touch =
            event.changedTouches[0];

        if (
            !touch
        ) {
            return;
        }

        const dx =
            touch.clientX -
            landingAybakTouchStartX;
        const dy =
            touch.clientY -
            landingAybakTouchStartY;

        landingAybakTouchStartX = null;
        landingAybakTouchStartY = null;

        if (
            Math.abs(dy) <=
            Math.abs(dx) ||
            Math.abs(dy) <
            LANDING_AYBAK_SWIPE_THRESHOLD
        ) {
            return;
        }

        if (
            !landingAybakActive &&
            dy < 0
        ) {
            setLandingAybakEndCard(
                true
            );
        }
        else if (
            landingAybakActive &&
            dy > 0
        ) {
            setLandingAybakEndCard(
                false
            );
        }

    },
    { passive: true }
);


window.addEventListener(
    "keydown",
    event => {
        if (
            !landingAybakActive &&
            event.code === "ArrowDown"
        ) {
            event.preventDefault();
            setLandingAybakEndCard(true);
        }
        else if (
            landingAybakActive &&
            (
                event.code === "ArrowUp" ||
                event.code === "Escape"
            )
        ) {
            event.preventDefault();
            setLandingAybakEndCard(false);
        }
    }
);



/* =====================================================
   SCOPED INTERACTION CANCEL

   Blank white space on mobile is deliberately inert: tapping it must not
   cancel the automatic landing sequence. Only actual navigation/contact
   actions stop automation. AYBAK entry is handled in setLandingAybakEndCard().
   ===================================================== */

function cancelLandingAutomationFromUi() {
    cancelAutomaticIntroForInteraction();
    clearIntroTimer();
    cancelFilmAutoClose();
}

function landingTargetStopsAutomation(target) {
    return Boolean(
        target &&
        target.closest &&
        target.closest(
            "#photography-link, #film-link, #portfolio-download, .contact a, .film-link"
        )
    );
}

window.addEventListener(
    "pointerdown",
    event => {
        if (landingTargetStopsAutomation(event.target)) {
            cancelLandingAutomationFromUi();
        }
    },
    true
);

window.addEventListener(
    "touchstart",
    event => {
        if (landingTargetStopsAutomation(event.target)) {
            cancelLandingAutomationFromUi();
        }
    },
    {
        capture: true,
        passive: true
    }
);

/* Keyboard navigation is always explicit user interaction. */
window.addEventListener(
    "keydown",
    event => {
        if (
            event.target &&
            event.target.closest &&
            event.target.closest(
                "#photography-link, #film-link, #portfolio-download, .contact a, .film-link"
            )
        ) {
            cancelLandingAutomationFromUi();
        }
    },
    true
);


/* =====================================================
   RESIZE / ORIENTATION
   ===================================================== */

let resizeTimer =
    null;


window.addEventListener(
    "resize",
    () => {

        syncNavigationWords();

        if (
            resizeTimer !==
            null
        ){

            clearTimeout(
                resizeTimer
            );

        }

        resizeTimer =
            setTimeout(
                () => {

                    mountPhotographyField();

                    if (
                        !photographyInitialReady
                    ) {

                        return;

                    }

                    const modeChanged =
                        renderedMobileMode !==
                        isMobileLayout();

                    if (
                        modeChanged
                    ) {

                        const wasVisible =
                            activeMode ===
                            "photography";

                        updateActiveVisualGroups();

                        buildPhotographyDOM();

                        randomizePhotographyLayout();

                        if (
                            wasVisible
                        ) {

                            setVisiblePhotoGroupCount(
                                groupElements.length
                            );

                        }

                    }

                    else if (
                        activeMode ===
                        "photography"
                    ) {

                        randomizePhotographyLayout();

                    }

                },
                120
            );

    }
);


/* =====================================================
   VISIBILITY
   ===================================================== */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.hidden
        ) {

            filmVideo.pause();

            return;

        }

        if (
            hoverMode ===
            "photography"
        ) {

            startPhotography();

            return;

        }

        if (
            hoverMode ===
            "film"
        ) {

            startFilm(
                null,
                "hover"
            );

            return;

        }

        if (
            activeMode ===
            "film" &&
            filmField.classList.contains(
                "active"
            )
        ) {

            try {

                filmVideo.play();

            }

            catch (
                error
            ) {}

        }

    }
);



/* =====================================================
   FIRST-LOAD LAYOUT STABILIZATION
   ===================================================== */

let landingLayoutStabilizeScheduled = false;
let landingLayoutStabilized = false;

function stabilizeLandingLayout() {
    if (landingLayoutStabilized || landingLayoutStabilizeScheduled) {
        return;
    }

    landingLayoutStabilizeScheduled = true;

    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            landingLayoutStabilizeScheduled = false;

            if (landingLayoutStabilized) {
                return;
            }

            landingLayoutStabilized = true;

            mountPhotographyField();
            calculatePreviewZone();

            if (photographyInitialReady) {
                randomizePhotographyLayout();
            }
        });
    });
}

if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(stabilizeLandingLayout);
}

/* One load-time fallback only. visualViewport resize is intentionally not
   observed here: mobile browser chrome can fire it repeatedly and the old
   handler was re-randomizing the photography layout during normal browsing. */
window.addEventListener(
    "load",
    stabilizeLandingLayout,
    { once: true }
);

/* =====================================================
   INIT
   ===================================================== */

function init() {

    clearPreviewTheme();

    mountPhotographyField();

    setLogoState(
        0
    );

    syncNavigationWords();

    setWordCount(
        navItems.photography,
        navItems.photography.baseCount
    );

    setWordCount(
        navItems.film,
        navItems.film.baseCount
    );

    setVisiblePhotoGroupCount(
        0
    );

    photographyField
        .classList
        .remove(
            "active"
        );

    filmField
        .classList
        .remove(
            "active"
        );

    loadInitialPhotography()
        .catch(
            error => {

                console.error(
                    "Photography preparation failed:",
                    error
                );

            }
        );
    stabilizeLandingLayout();


    startAutomaticIntro();

}


init();



window.addEventListener(
    "load",
    () => {

        stabilizeLandingLayout();

    },
    {
        once: true
    }
);



window.addEventListener("resize", () => {
    clearTimeout(window.__bioFlowResizeTimer);
    window.__bioFlowResizeTimer = setTimeout(() => {
        buildBiographyFlow();
    }, 80);
});

</script>

    function createCaseMorph(element, initial = "", mirrorElement = null) {
        const base = String(initial).toLowerCase();
        const positions = Array.from(base).map((character, index) => {
            const isLetter = character.toLowerCase() !== character.toUpperCase();
            return isLetter ? index : -1;
        }).filter(index => index >= 0);

        let state = 0;
        let target = 0;
        let frame = null;

        function render() {
            const active = new Set(positions.slice(0, state));
            const text = Array.from(base).map((character, index) =>
                active.has(index) ? character.toUpperCase() : character.toLowerCase()
            ).join("");
            element.textContent = text;
            if (mirrorElement) {
                mirrorElement.textContent = text;
            }

        function animate(nextTarget, duration) {
            target = Math.max(0, Math.min(positions.length, nextTarget));
            if (frame !== null) cancelAnimationFrame(frame);

            const startState = state;
            if (startState === target) {

                return;

            const started = performance.now();

            function tick(now) {

                state = Math.round(startState + (target - startState) * progress);
                render();
                if (progress < 1) {

                } else {
                    state = target;
                    frame = null;
                    render();
                }
            }

            frame = requestAnimationFrame(tick);

            lower() { animate(0, ROW_MORPH_DURATION); },
            setUpper(duration = SECTION_MORPH_DURATION) { animate(positions.length, duration); },

        row.className = "landing-index-row";
        row.dataset.id = record.id;
        row.dataset.field = record.field;
        row.tabIndex = 0;
        row.setAttribute("role", "link");
        row.setAttribute("aria-label", `${record.title}, ${record.date}, ${record.field}, ${record.use}`);

        const values = [record.title, record.date, getDisplayField(record), record.use];
        const cases = [];
        const differenceSpans = [];

        values.forEach(value => {
            const cell = document.createElement("div");
            cell.className = "landing-index-cell";

            const span = document.createElement("span");
            span.className = "landing-index-text";

            const difference = document.createElement("span");
            difference.className = "landing-index-difference-text";
            difference.setAttribute("aria-hidden", "true");

            cell.appendChild(span);
            cell.appendChild(difference);
            row.appendChild(cell);

            cases.push(createCaseMorph(span, value, difference));
            differenceSpans.push(difference);
        });

        const state = { row, record, cases, differenceSpans };
        rowStates.push(state);

        const enter = () => {
            row.classList.add("is-focus");
            activePreviewRow = state;
            cases.forEach(controller => controller.upper());
            selectPreview(record);
            queueDifferenceLayerUpdate();
        };

        const leave = () => {
            row.classList.remove("is-focus");
            cases.forEach(controller => controller.lower());
            if (previewRecord === record) clearPreview();
        };

        row.addEventListener("mouseenter", enter);
        row.addEventListener("mouseleave", leave);
        row.addEventListener("focus", enter);
        row.addEventListener("blur", leave);

        row.addEventListener("click", event => {
            event.preventDefault();
            openRecord(record);
        });

        row.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                openRecord(record);
            }
        });

        return row;
    }

    function renderRows() {
        rowStates = [];
        indexGrid.querySelectorAll(".landing-index-row, .landing-index-empty").forEach(node => node.remove());

        const records = sortedRecords();
        if (!records.length) {
            const empty = document.createElement("div");
            empty.className = "landing-index-empty";
            empty.textContent = "index unavailable";
            indexGrid.appendChild(empty);
            return;
        }

        const fragment = document.createDocumentFragment();
        records.forEach(record => fragment.appendChild(createRow(record)));
        indexGrid.appendChild(fragment);
    }

    function syncHeaderState(duration = SECTION_MORPH_DURATION) {
        headerButtons.forEach(button => {
            const key = button.dataset.sortKey;
            const span = button.querySelector("span");
            if (!span) return;

            const active = key === sortKey;
            const controller = button.__caseController;
            if (controller) {
                active ? controller.setUpper(duration) : controller.setLower(duration);
            }

            button.setAttribute("aria-sort", active
                ? (sortDirection === "asc" ? "ascending" : "descending")
                : "none"
            );
        });
    }

    function handleSort(key) {
        if (key === sortKey) {
            sortDirection = sortDirection === "asc" ? "desc" : "asc";
        } else {
            sortKey = key;
            sortDirection = "asc";
        }
        clearPreview();
        syncHeaderState();
        renderRows();
    }

    function openRecord(record) {
        clearPreview();
        const encodedId = encodeURIComponent(record.id);
        const base = record.field === "FILM"
            ? "https://film.denizalpaybak.com/"
            : "https://photography.denizalpaybak.com/";
        window.location.href = `${base}?project=${encodedId}&view=all`;
    }

    headerButtons.forEach(button => {
        const span = button.querySelector("span");
        button.__caseController = createCaseMorph(span, button.dataset.sortKey);
        button.addEventListener("click", () => handleSort(button.dataset.sortKey));
    });

    /* =====================================================
       SECTION SWITCH
       ===================================================== */

    function setSectionMode(nextMode, animate = true) {
        if (nextMode === sectionMode && animate) return;

        sectionMode = nextMode;

        if (nextMode === "info") {
            infoButton.setAttribute("aria-pressed", "true");
            indexButton.setAttribute("aria-pressed", "false");
            clearPreview();
            infoMorph.setUpper(animate ? SECTION_MORPH_DURATION : 0);
            indexMorph.setLower(animate ? SECTION_MORPH_DURATION : 0);
            body.classList.remove("landing-index-mode");
            body.classList.add("landing-info-mode");
            document.documentElement.classList.remove("landing-index-mode");
            document.documentElement.classList.add("landing-info-mode");
            return;
        }

        infoButton.setAttribute("aria-pressed", "false");
        indexButton.setAttribute("aria-pressed", "true");
        infoMorph.setLower(animate ? SECTION_MORPH_DURATION : 0);
        indexMorph.setUpper(animate ? SECTION_MORPH_DURATION : 0);
        body.classList.remove("landing-info-mode");
        body.classList.add("landing-index-mode");
        document.documentElement.classList.remove("landing-info-mode");
        document.documentElement.classList.add("landing-index-mode");
    }

    indexButton.addEventListener("click", () => setSectionMode("index", true));
    infoButton.addEventListener("click", () => setSectionMode("info", true));

    /* =====================================================
       PREVENT THE OLD LANDING GESTURES FROM STEALING INDEX SCROLL
       ===================================================== */

    [indexScroll].forEach(element => {
        ["wheel", "touchstart", "touchmove", "touchend", "pointerdown"].forEach(type => {
            element.addEventListener(type, event => {
                event.stopPropagation();
            }, { passive: type === "wheel" ? false : true });
        });
    });

    /* =====================================================
       LOAD DATA
       ===================================================== */

    async function fetchJson(url) {
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error(`${url}: ${response.status}`);
        return response.json();
    }

    async function loadData() {
        const [metaResult, photoResult, filmResult] = await Promise.allSettled([
            fetchJson(LANDING_INDEX_JSON_URL),
            fetchJson(PHOTOGRAPHY_JSON_URL),
            fetchJson(FILM_JSON_URL)
        ]);

        if (metaResult.status === "fulfilled") {
            const nextMeta = arrayData(metaResult.value);
            if (nextMeta.length) metadata = nextMeta;
        }

        if (photoResult.status === "fulfilled") {
            const nextPhotos = photoMap(photoResult.value);
            if (nextPhotos.size) photoProjects = nextPhotos;
        }

        if (filmResult.status === "fulfilled") {
            const nextFilms = filmMap(filmResult.value);
            if (nextFilms.size) filmProjects = nextFilms;
        }

        allRecords = buildRecords();
        syncHeaderState(0);
        renderRows();
        requestAnimationFrame(() => applyLandingIndexResponsiveLayout(false));
    }

    /* =====================================================
       INITIAL STATE / DISABLE THE OLD PREVIEW AUTOMATION
       ===================================================== */

    try {
        if (typeof cancelAutomaticIntroForInteraction === "function") {
            cancelAutomaticIntroForInteraction();
        }
        if (typeof clearIntroTimer === "function") {
            clearIntroTimer();
        }
        if (typeof cancelFilmAutoClose === "function") {
            cancelFilmAutoClose();
        }
        if (typeof cancelPhotoSequence === "function") {
            cancelPhotoSequence();
        }
        if (typeof clearPreviewTheme === "function") {
            clearPreviewTheme();
        }
        if (typeof clearSinglePhotographyPreview === "function") {
            clearSinglePhotographyPreview();
        }
        if (typeof filmVideo !== "undefined" && filmVideo) {
            filmVideo.pause();
        }
        if (typeof photographyField !== "undefined" && photographyField) {
            photographyField.classList.remove("active");
        }
        if (typeof filmField !== "undefined" && filmField) {
            filmField.classList.remove("active");
        }
    } catch (error) {
        console.warn("Landing preview cleanup skipped:", error);
    }

    body.classList.add("landing-index-mode");
    document.documentElement.classList.add("landing-index-mode");
    body.classList.remove("landing-info-mode");
    document.documentElement.classList.remove("landing-info-mode");

    indexMorph.setUpper(0);
    infoMorph.setLower(0);

    allRecords = buildRecords();
    syncHeaderState(0);
    renderRows();
    updateLandingIndexSideSpace();
    requestAnimationFrame(() => applyLandingIndexResponsiveLayout(false));
    loadData().catch(error => {
        console.error("Landing INDEX data load failed:", error);
    });

    function queueLandingIndexResponsiveLayout() {
        clearTimeout(indexResponsiveTimer);
        indexResponsiveTimer = setTimeout(() => {
            if (sectionMode !== "index") return;
            applyLandingIndexResponsiveLayout(true);
        }, 80);
    }

    window.addEventListener(
        "resize",
        () => {
            updateLandingIndexSideSpace();
            queueLandingIndexResponsiveLayout();
            queueDifferenceLayerUpdate();
        },
        { passive: true }
    );

    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
            updateLandingIndexSideSpace();
            queueDifferenceLayerUpdate();
        });
    }

    window.addEventListener(
        "orientationchange",
        () => {
            setTimeout(
                () => {
                    updateLandingIndexSideSpace();
                    queueLandingIndexResponsiveLayout();
                    queueDifferenceLayerUpdate();
                },
                100
            );
        },
        { passive: true }
    );
})();
</script>

</body>
</html>
