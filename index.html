<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
    }

    body {
        cursor: pointer;
    }


    /* LEFT INFORMATION */

    .info {
        position: fixed;
        top: 32px;
        left: 48px;
        z-index: 10;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.15;
    }


    /* LOGO */

    .logo {
        position: relative;
        display: block;

        width: 190px;
        height: 70px;

        margin: 0 0 14px 0;
        padding: 0;

        color: inherit;
        text-decoration: none;

        cursor: pointer;
    }


    /* LOGO TEXT */

    .logo-name {
        position: absolute;

        top: 0;
        left: 0;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.15;

        white-space: nowrap;
    }

    .logo-aybak {
        position: absolute;

        top: 17px;
        left: 0;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.15;
        letter-spacing: 0;

        white-space: nowrap;
    }


    /*
        Each letter is an independent inline-block.
        This lets the uppercase transformation happen
        one letter at a time without moving the layout.
    */

    .logo-aybak span {
        display: inline-block;
        width: auto;
    }


    /* CONTACT / SOCIAL */

    .contact {
        margin: 0;
        padding: 0;
    }

    .social {
        display: flex;
        flex-direction: column;
        gap: 0;

        margin: 0;
        padding: 0;
    }

    .info a {
        color: inherit;
        text-decoration: none;
        font-weight: 400;
    }

    .info a:hover {
        text-decoration: underline;
    }


    /* SLIDESHOW */

    #slideshow {
        position: fixed;
        inset: 0;

        width: 100vw;
        height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        pointer-events: none;
    }

    .slide {
        position: absolute;

        width: auto;
        height: auto;

        max-width: 70vw;
        max-height: 80vh;

        object-fit: contain;

        opacity: 0;
    }

    .slide.active {
        opacity: 1;
    }


    /* MOBILE */

    @media (max-width: 600px) {

        .info {
            top: 20px;
            left: 24px;
            font-size: 13px;
        }

        .logo {
            width: 160px;
            height: 58px;
            margin-bottom: 12px;
        }

        .logo-name {
            font-size: 13px;
        }

        .logo-aybak {
            top: 15px;
            font-size: 13px;
        }

        .slide {
            max-width: 84vw;
            max-height: 72vh;
        }
    }

</style>
</head>

<body>


<div class="info">

    <a
        class="logo"
        href="https://denizalpaybak.com/"
        target="_self"
    >

        <span class="logo-name">
            Denizalp
        </span>

        <span class="logo-aybak">
            <span id="letter-a">a</span><span id="letter-y">y</span><span id="letter-b">b</span><span id="letter-a2">a</span><span id="letter-k">k</span>
        </span>

    </a>


    <div class="contact">

        <a
            href="mailto:d@denizalpaybak.com"
            target="_blank"
            rel="noopener"
        >
            d@denizalpaybak.com
        </a>

    </div>


    <div class="social">

        <a
            href="https://www.instagram.com/denizalpaybak/"
            target="_blank"
            rel="noopener"
        >
            instagram @denizalpaybak
        </a>

        <a
            href="https://models.com/people/denizalp-aybak"
            target="_blank"
            rel="noopener"
        >
            models.com
        </a>

    </div>

</div>


<div id="slideshow">

    <img class="slide active" src="01.jpg">
    <img class="slide" src="02.jpg">
    <img class="slide" src="03.jpg">
    <img class="slide" src="04.jpg">

</div>


<script>

    /* =====================================================
       SLIDESHOW
       ===================================================== */

    const slides = document.querySelectorAll('.slide');

    let current = 0;
    let manualMode = false;


    function nextSlide() {

        slides[current].classList.remove('active');

        current = (current + 1) % slides.length;

        slides[current].classList.add('active');
    }


    /* Automatic slideshow: every 3 seconds */

    setInterval(() => {

        if (!manualMode) {
            nextSlide();
        }

    }, 3000);


    /*
        First click stops autoplay.
        The first click does not change the image.
    */

    document.body.addEventListener('click', (event) => {

        if (event.target.closest('a')) {
            return;
        }

        if (!manualMode) {

            manualMode = true;

            return;
        }

        nextSlide();

    });


    /* =====================================================
       LOGO
       ===================================================== */

    const logo = document.querySelector('.logo');

    const letters = [
        document.getElementById('letter-a'),
        document.getElementById('letter-y'),
        document.getElementById('letter-b'),
        document.getElementById('letter-a2'),
        document.getElementById('letter-k')
    ];


    const lowercase = ['a', 'y', 'b', 'a', 'k'];
    const uppercase = ['A', 'Y', 'B', 'A', 'K'];


    let logoAnimating = false;


    /*
        Set the logo to a specific state.

        0 = aybak
        1 = Aybak
        2 = AYbak
        3 = AYBak
        4 = AYBAk
        5 = AYBAK
    */

    function setLogoState(state) {

        for (let i = 0; i < letters.length; i++) {

            if (i < state) {
                letters[i].textContent = uppercase[i];
            } else {
                letters[i].textContent = lowercase[i];
            }

        }

    }


    /*
        FORWARD

        aybak
        Aybak
        AYbak
        AYBak
        AYBAk
        AYBAK
    */

    function animateForward() {

        if (logoAnimating) {
            return;
        }

        logoAnimating = true;

        setLogoState(0);

        setTimeout(() => {
            setLogoState(1);
        }, 120);

        setTimeout(() => {
            setLogoState(2);
        }, 240);

        setTimeout(() => {
            setLogoState(3);
        }, 360);

        setTimeout(() => {
            setLogoState(4);
        }, 480);

        setTimeout(() => {
            setLogoState(5);
        }, 600);

        setTimeout(() => {
            logoAnimating = false;
        }, 720);

    }


    /*
        REVERSE

        AYBAK
        AYBAk
        AYBak
        AYbak
        Aybak
        aybak
    */

    function animateReverse() {

        if (logoAnimating) {
            return;
        }

        logoAnimating = true;

        setLogoState(5);

        setTimeout(() => {
            setLogoState(4);
        }, 120);

        setTimeout(() => {
            setLogoState(3);
        }, 240);

        setTimeout(() => {
            setLogoState(2);
        }, 360);

        setTimeout(() => {
            setLogoState(1);
        }, 480);

        setTimeout(() => {
            setLogoState(0);
        }, 600);

        setTimeout(() => {
            logoAnimating = false;
        }, 720);

    }


    /*
        DESKTOP

        Normal state:
        Denizalp
        aybak

        On hover:
        aybak -> AYBAK
    */

    logo.addEventListener('mouseenter', () => {

        if (
            window.matchMedia('(min-width: 601px)').matches &&
            !logoAnimating
        ) {

            animateForward();

        }

    });


    /*
        MOBILE

        Starts as:

        denizalp
        AYBAK

        After 3 seconds it reverses to:

        Denizalp
        aybak
    */

    if (window.matchMedia('(max-width: 600px)').matches) {

        /*
            Mobile starts uppercase.
        */

        setLogoState(5);


        /*
            Wait 3 seconds, matching the
            first slideshow interval.
        */

        setTimeout(() => {

            animateReverse();

        }, 3000);

    }


</script>

</body>
</html>
