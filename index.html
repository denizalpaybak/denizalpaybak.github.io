<style>
/* =====================================================
   RESET
   ===================================================== */
* { box-sizing: border-box; }
html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    overscroll-behavior: none; /* Rubber-banding engellendi */
    background: #fff;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
}
body { color: #000; font-family: Arial, Helvetica, sans-serif; }

/* =====================================================
   VARIABLES
   ===================================================== */
:root {
    --page-x: 48px; --page-top: 32px; --page-bottom: 48px;
    --font-size: 15px; --line-height: 1.15;
    --major-gap: 17px; --column-gap: 48px;
}

/* =====================================================
   PAGE
   ===================================================== */
.page {
    position: relative; width: 100%; height: 100vh; height: 100dvh;
    padding: var(--page-top) var(--page-x) var(--page-bottom) var(--page-x);
    overflow: hidden;
    transition: background-color 400ms cubic-bezier(.22,.61,.36,1), color 400ms cubic-bezier(.22,.61,.36,1);
}

/* =====================================================
   MAIN GRID
   ===================================================== */
.landing-grid {
    position: relative; z-index: 2; display: grid;
    grid-template-columns: minmax(0, 530px) minmax(0, 1fr);
    grid-template-rows: auto auto auto minmax(0, 1fr);
    column-gap: var(--column-gap); row-gap: var(--major-gap);
    width: 100%; height: 100%; min-width: 0; min-height: 0;
    pointer-events: none;
}
.logo, .navigation, .contact, .biography, .opening { pointer-events: auto; }

/* =====================================================
   OPENING & BIOGRAPHY
   ===================================================== */
.opening { grid-column: 1; grid-row: 2; margin: 0; padding: 0; font-size: var(--font-size); font-weight: 400; line-height: var(--line-height); text-wrap: pretty; transition: color 400ms cubic-bezier(.22,.61,.36,1); }
.biography { grid-column: 1; grid-row: 3; align-self: start; transition: color 400ms cubic-bezier(.22,.61,.36,1); }
.biography p { margin: 0 0 var(--major-gap) 0; padding: 0; font-size: inherit; font-weight: inherit; line-height: inherit; text-wrap: pretty; }
.biography p:last-child { margin-bottom: 0; }

/* =====================================================
   FIXED UI ELEMENTS
   ===================================================== */
.navigation {
    position: fixed; z-index: 20000; top: var(--page-top); right: var(--page-x);
    display: flex; align-items: flex-end; text-align: right;
    pointer-events: none;
}
.navigation a {
    width: max-content; text-align: right; transition: color 400ms cubic-bezier(.22,.61,.36,1);
    color: #000; text-decoration: none; font-size: var(--font-size); font-weight: 400; line-height: var(--line-height); pointer-events: auto;
}
.contact {
    position: fixed; z-index: 20000; left: var(--page-x); bottom: var(--page-bottom); text-align: left;
    display: flex; flex-direction: column; margin: 0; padding: 0; pointer-events: none;
}
.contact a {
    color: #000; text-decoration: none; font-size: var(--font-size); font-weight: 400; line-height: var(--line-height); transition: color 400ms cubic-bezier(.22,.61,.36,1); pointer-events: auto;
}
.contact a:hover { text-decoration: underline; }

.portfolio-download {
    position: fixed; z-index: 20000; right: var(--page-x); bottom: var(--page-bottom); margin: 0 !important; text-align: right; pointer-events: none;
}
.portfolio-download a {
    color: #000; text-decoration: none; font-size: var(--font-size); font-weight: 400; line-height: var(--line-height); transition: color 400ms cubic-bezier(.22,.61,.36,1); pointer-events: auto;
}
.portfolio-download a:hover { text-decoration: underline; }

/* =====================================================
   MEDIA FIELD & PREVIEW ZONES
   ===================================================== */
.media-field { position: relative; grid-column: 2; grid-row: 1 / -1; width: 100%; height: 100%; min-width: 0; min-height: 0; pointer-events: none; }
.photography-field, .film-field {
    position: fixed !important; z-index: 10 !important; top: var(--preview-zone-top, 50%) !important; left: var(--preview-zone-left, 50%) !important; right: auto !important; bottom: auto !important;
    width: var(--preview-zone-width, 0px) !important; height: var(--preview-zone-height, 0px) !important; padding: 0 !important; overflow: hidden !important; visibility: hidden; pointer-events: none;
}
.photography-field.active, .film-field.active { visibility: visible; }
.film-field { display: flex !important; align-items: center !important; justify-content: center !important; }
.film-link {
    width: 100% !important; height: 100% !important; max-width: none !important; aspect-ratio: auto !important; display: flex !important; align-items: center !important; justify-content: center !important; overflow: hidden !important; pointer-events: auto;
}
#film-video { width: 100% !important; height: 100% !important; object-fit: contain !important; object-position: center center !important; pointer-events: none; }

#scattered-stage { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; }
.photo-group { position: absolute; top: 0; left: 0; width: var(--group-width, 100px); height: var(--group-height, 100px); visibility: hidden; pointer-events: none; transform: translate3d(var(--group-x, 0px), var(--group-y, 0px), 0); backface-visibility: hidden; contain: layout paint; }
.photo-group.visible { visibility: visible; }
.project-photo { position: absolute; display: block; width: auto; height: var(--photo-height, 100px); top: var(--photo-y, 0px); left: var(--photo-x, 0px); object-fit: contain; pointer-events: none; backface-visibility: hidden; transform: translateZ(0); }

#fixed-photo-preview { position: absolute; z-index: 2; top: 50% !important; left: 50% !important; display: block; width: auto; height: auto; max-width: 100% !important; max-height: 100% !important; object-fit: contain; opacity: 0; visibility: hidden; transform: translate(-50%, -50%) !important; pointer-events: none; }
#fixed-photo-preview.visible { opacity: 1; visibility: visible; pointer-events: auto; cursor: pointer; }

/* =====================================================
   CLEAN INDEX SYSTEM (DIFFERENCE BLEND & FULL WIDTH)
   ===================================================== */
:root {
  --ci-font: 15px; --ci-line: 1.15; --ci-top: 32px; --ci-side: 48px; --ci-bottom: 24px; --ci-gap: 4px;
}
#clean-index-shell {
  position: fixed; inset: 0; z-index: 9000; background: #fff;
  font-family: Arial, Helvetica, sans-serif; font-size: var(--ci-font); line-height: var(--ci-line); overflow: hidden;
  transition: opacity 400ms ease;
}
#clean-index-shell *, #clean-index-shell *::before, #clean-index-shell *::after { box-sizing: border-box; }

/* PREVIEW LAYER (Ekranın Tam Merkezi - Çok Büyük Boyut) */
#ci-preview-layer {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 1; pointer-events: none;
}
.ci-preview-item {
  position: absolute; max-width: 65vw; max-height: 75vh; object-fit: contain; opacity: 0; transform: scale(0.98); transition: opacity 240ms ease, transform 240ms ease;
}
.ci-preview-item.visible { opacity: 1; transform: scale(1); }

/* UI LAYER (Difference Blend Mode - Negatif Yazı Efekti) */
#ci-ui-layer {
  position: absolute; inset: 0; z-index: 2; mix-blend-mode: difference; color: #fff; pointer-events: none;
}
.clean-index-topbar, .clean-index-footer, .clean-index-table-wrap, .clean-index-filters, .clean-index-info-scroll { pointer-events: auto; }

.clean-index-topbar { position: absolute; top: var(--ci-top); left: var(--ci-side); right: var(--ci-side); display: flex; justify-content: space-between; align-items: flex-start; }
.clean-index-topbutton, .clean-index-headerbutton {
  appearance: none; border: 0; outline: 0; padding: 0; margin: 0; background: transparent; color: inherit; font: inherit; line-height: inherit; cursor: pointer; user-select: none; white-space: nowrap;
}
.clean-index-headerbutton { transition: text-decoration 200ms ease; }
.clean-index-headerbutton.active-sort { text-decoration: underline; }

.clean-index-view { position: absolute; inset: 0; visibility: hidden; opacity: 0; pointer-events: none; }
.clean-index-view.active { visibility: visible; opacity: 1; pointer-events: none; }

/* YENİ FİLTRE MENÜSÜ */
.clean-index-filters { margin-bottom: 32px; display: flex; flex-direction: column; gap: 8px; }
.ci-filter-row { display: flex; align-items: baseline; gap: 0.4em; }
.ci-filter-label { margin-right: 0.5em; opacity: 1; }
.ci-filter-btn { appearance: none; border: 0; background: transparent; color: inherit; padding: 0; margin: 0; cursor: pointer; font: inherit; opacity: 1; }
.ci-filter-btn:hover { text-decoration: underline; }
.ci-filter-btn.active { text-decoration: underline; pointer-events: none; }

/* TABLO (Tam Genişlik, Sola ve Sağa Dayalı) */
.clean-index-table-wrap {
  position: absolute; left: var(--ci-side); right: var(--ci-side); top: 50%; transform: translateY(-50%); max-height: calc(100vh - 150px); overflow: auto; scrollbar-width: none; overscroll-behavior: none;
}
.clean-index-table-wrap::-webkit-scrollbar { display: none; }
.clean-index-table { width: 100%; }
.clean-index-header, .clean-index-row { display: flex; justify-content: space-between; align-items: baseline; width: 100%; }
.clean-index-header { margin-bottom: 24px; }
.clean-index-row { min-height: calc(var(--ci-font)*var(--ci-line)); margin-bottom: var(--ci-gap); position: relative; }
.clean-index-cell { min-width: 0; position: relative; }
.clean-index-cell:nth-child(2) { text-align: right; }
.clean-index-cell-content { display: inline-flex; position: relative; z-index: 2; pointer-events: none; }
.clean-index-char { display: inline-block; white-space: pre; }
.clean-index-row-hit { position: absolute; inset: 0; z-index: 3; appearance: none; border: 0; background: transparent; cursor: pointer; padding: 0; margin: 0; }

.clean-index-footer { position: absolute; left: var(--ci-side); right: var(--ci-side); bottom: var(--ci-bottom); display: flex; justify-content: space-between; align-items: flex-end; }
.clean-index-footer-left { display: flex; flex-direction: column; align-items: flex-start; }
.clean-index-footer-right { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
.clean-index-footer a { color: inherit; text-decoration: none; white-space: nowrap; }
.clean-index-footer a:hover { text-decoration: underline; }

/* INFO SECTION (Sol %50 Sınırı) */
.clean-index-info-scroll { position: absolute; left: var(--ci-side); right: var(--ci-side); top: 50%; transform: translateY(-50%); max-height: calc(100vh - 150px); overflow: auto; scrollbar-width: none; }
.clean-index-info-scroll::-webkit-scrollbar { display: none; }
.clean-index-info-content { width: 100%; max-width: 50%; margin-left: 0; font: inherit; line-height: inherit; }
.clean-index-info-block { width: 100%; margin: 0 0 24px; }
.clean-index-info-block.left { text-align: left; }
.clean-index-info-block.right { text-align: right; }
.clean-index-info-block .line { display: block; white-space: nowrap; }

/* RESPONSIVE & MOBILE */
@media (max-width: 900px) {
  :root { --ci-side: 24px; --ci-top: 20px; --ci-bottom: 18px; --ci-font: 13px; }
  .ci-preview-item { max-width: 85vw; max-height: 45vh; }
  .clean-index-filters { margin-bottom: 24px; }
  .ci-filter-row { flex-wrap: wrap; }
  .clean-index-info-content { max-width: 100%; }
}

html.clean-index-live .page { visibility: hidden !important; }

    margin: 0 !important; padding: 12px 20px !important; cursor: pointer !important; pointer-events: auto !important; touch-action: manipulation !important; color: #fff !important; appearance: none !important; -webkit-appearance: none !important; background: transparent !important; border: 0 !important; outline: 0 !important; font-family: inherit !important; font-size: var(--font-size) !important; font-weight: 400 !important; line-height: var(--line-height) !important;
}

.landing-aybak-letter { display: inline-block !important; margin: 0 !important; padding: 0 !important; border: 0 !important; width: auto !important; min-width: 0 !important; letter-spacing: 0 !important; word-spacing: 0 !important; transition: none !important; }
body.landing-aybak-active #landing-aybak-logo, body.landing-aybak-active #landing-aybak-logo * { pointer-events: auto !important; cursor: pointer !important; }
html.landing-aybak-active, body.landing-aybak-active { background: #000 !important; }
body.landing-aybak-active:not(.landing-aybak-leaving) .navigation, body.landing-aybak-active:not(.landing-aybak-leaving) .contact, body.landing-aybak-active:not(.landing-aybak-leaving) .portfolio-download { position: fixed !important; z-index: 2147483646 !important; visibility: visible !important; opacity: 1 !important; }
body.landing-aybak-active:not(.landing-aybak-leaving) .navigation a, body.landing-aybak-active:not(.landing-aybak-leaving) .contact a, body.landing-aybak-active:not(.landing-aybak-leaving) .portfolio-download a { color: #fff !important; opacity: 1 !important; visibility: visible !important; }

/* CENTRAL BIO */
.biography#biography {
    position: fixed !important; left: 50% !important; top: 50% !important; transform: translate(-50%, -50%) !important;
    width: min(560px, 70vw) !important; max-width: calc(100vw - (2 * var(--page-x))) !important; margin: 0 !important; padding: 0 !important;
    z-index: 5 !important; display: block !important; color: #000 !important; font-family: inherit !important; font-size: var(--font-size) !important; font-weight: 400 !important; line-height: var(--line-height) !important;
}
#biography-flow { display: block !important; width: 100% !important; margin: 0 !important; padding: 0 !important; text-align: initial !important; }
.bio-flow-line { display: flex !important; width: 100% !important; min-width: 100% !important; margin: 0 !important; padding: 0 !important; white-space: nowrap !important; text-align: initial !important; }
.bio-flow-line > .bio-flow-text { display: inline-block !important; width: max-content !important; flex: 0 0 auto !important; margin: 0 !important; padding: 0 !important; }
.bio-flow-line.align-left { justify-content: flex-start !important; }

html.clean-index-boot .page, html.clean-index-boot .navigation, html.clean-index-boot .contact, html.clean-index-boot .portfolio-download { visibility: hidden !important; }

/* =====================================================
   CLEAN INDEX BOOT
   ===================================================== */
</style>

<script>
/* =====================================================
   ORİJİNAL İŞLEVLER (BİYO VE END-CARD YEDEĞİ)
   ===================================================== */
(() => {
    const card = document.getElementById("landing-aybak-end-card");
    const logo = document.getElementById("landing-aybak-logo");
    const name = document.getElementById("landing-aybak-name");
    const word = document.getElementById("landing-aybak-aybak");

    if (!card || !logo || !name || !word) return;

    const letters = Array.from(word.querySelectorAll(".landing-aybak-letter"));
    const lower = ["a", "y", "b", "a", "k"];
    const upper = ["A", "Y", "B", "A", "K"];

    let state = 0, target = 0, timer = null, finishTimer = null, pointerInside = false, finishing = false;

    function isDesktopPointer() { return window.matchMedia("(hover: hover) and (pointer: fine)").matches; }
    function active() { return document.body.classList.contains("landing-aybak-active"); }

    function render(next) {
        state = Math.max(0, Math.min(5, next));
        name.textContent = state === 0 ? "Denizalp" : "denizalp";
        letters.forEach((letter, index) => { letter.textContent = index < state ? upper[index] : lower[index]; });
    }

    function animate(next) {
        target = Math.max(0, Math.min(5, next));
        if (timer !== null) { clearTimeout(timer); timer = null; }
        const step = () => {
            if (state === target) { timer = null; return; }
            render(state < target ? state + 1 : state - 1);
            timer = setTimeout(step, 80);
        };
        step();
    }

    function rectContains(x, y) {
        const rect = logo.getBoundingClientRect();
        return (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom);
    }

    function finish() {
        if (finishing) return;
        finishing = true;
        if (timer !== null) { clearTimeout(timer); timer = null; }
        if (finishTimer !== null) { clearTimeout(finishTimer); finishTimer = null; }

        document.body.classList.remove("landing-aybak-active");
        document.documentElement.classList.remove("landing-aybak-active");
        document.body.classList.add("landing-aybak-leaving");
        document.documentElement.classList.add("landing-aybak-leaving");
        card.setAttribute("aria-hidden", "true");

        finishTimer = setTimeout(() => {
            document.body.classList.remove("landing-aybak-leaving");
            document.documentElement.classList.remove("landing-aybak-leaving");
            render(0);
            finishing = false;
            finishTimer = null;
        }, 620);
    }

    logo.addEventListener("pointerenter", () => { pointerInside = true; if (active() && !finishing && isDesktopPointer()) animate(5); });
    logo.addEventListener("pointerleave", () => { pointerInside = false; if (active() && !finishing && isDesktopPointer()) animate(0); });
    logo.addEventListener("click", event => { event.preventDefault(); event.stopPropagation(); if (!active() || finishing) return; animate(5); if (finishTimer !== null) clearTimeout(finishTimer); finishTimer = setTimeout(finish, 520); });
    document.addEventListener("pointermove", event => { if (!active() || finishing || !isDesktopPointer()) return; const inside = rectContains(event.clientX, event.clientY); if (inside === pointerInside) return; pointerInside = inside; animate(inside ? 5 : 0); }, true);
    document.addEventListener("click", event => { if (!active() || finishing || event.target === logo) return; if (!rectContains(event.clientX, event.clientY)) return; event.preventDefault(); event.stopPropagation(); animate(5); if (finishTimer !== null) clearTimeout(finishTimer); finishTimer = setTimeout(finish, 520); }, true);
    document.addEventListener("landing-aybak-force-enter", () => { if (finishTimer !== null) { clearTimeout(finishTimer); finishTimer = null; } if (timer !== null) { clearTimeout(timer); timer = null; } finishing = false; document.body.classList.remove("landing-aybak-leaving"); document.documentElement.classList.remove("landing-aybak-leaving"); });

    render(0);
})();

const biography = document.getElementById("biography");
const BIO_FLOW_SEGMENTS = [
    { type: "paragraph", align: "left", lines: ["denizalp aybak (b. 1997) is a photographer and filmmaker,", "based in istanbul and available internationally."] },
    { type: "paragraph", align: "right", lines: ["having graduated top of his class in management at sabanci university,", "he brings a strategic approach to image-making,", "considering both the work itself and the world it belongs to."] },
    { type: "paragraph", align: "left", lines: ["his work creates atmosphere through contrast:", "light that feels dark,", "beauty that appears distant,", "stillness that carries tension,", "and precision that emerges from spontaneity."] },
    { type: "paragraph", align: "right", lines: ["editorial collaborators include:", "vogue türkiye, harper’s bazaar türkiye, elle türkiye, l’officiel türkiye"] },
    { type: "paragraph", align: "left", lines: ["brand collaborators include:", "vakko, bee goddess, zeynep arcay, peugeot, skechers, lc waikiki"] }
];

let biographyFlowMeasure = null;

function getBiographyMeasureElement() {
    if (biographyFlowMeasure) return biographyFlowMeasure;
    const probe = document.createElement("span");
    probe.style.position = "fixed"; probe.style.left = "-100000px"; probe.style.top = "-100000px"; probe.style.visibility = "hidden"; probe.style.pointerEvents = "none"; probe.style.whiteSpace = "nowrap"; probe.style.fontFamily = "inherit"; probe.style.fontSize = getComputedStyle(biography).fontSize; probe.style.fontWeight = getComputedStyle(biography).fontWeight; probe.style.lineHeight = getComputedStyle(biography).lineHeight; probe.style.letterSpacing = getComputedStyle(biography).letterSpacing; probe.style.wordSpacing = getComputedStyle(biography).wordSpacing;
    document.body.appendChild(probe);
    biographyFlowMeasure = probe;
    return probe;
}

function measureBioText(text) {
    const probe = getBiographyMeasureElement();
    probe.textContent = text;
    return probe.getBoundingClientRect().width;
}

function splitWordsToBalancedLines(text, maxWidth) {
    const words = text.trim().split(/\s+/).filter(Boolean);
    if (!words.length) return [];
    if (measureBioText(text) <= maxWidth) return [text.trim()];

    const n = words.length;
    const rangeWidth = Array.from({ length: n }, () => Array(n).fill(0));
    for (let i = 0; i < n; i += 1) {
        let value = "";
        for (let j = i; j < n; j += 1) {
            value = value ? `${value} ${words[j]}` : words[j];
            rangeWidth[i][j] = measureBioText(value);
        }
    }

    const memo = new Map();
    function bestFrom(start, linesLeft) {
        const key = `${start}|${linesLeft}`;
        if (memo.has(key)) return memo.get(key);
        if (start === n) {
            const empty = linesLeft === 0 ? { score: 0, lines: [] } : null;
            memo.set(key, empty);
            return empty;
        }
        if (linesLeft <= 0 || n - start < linesLeft) { memo.set(key, null); return null; }
        let best = null;
        for (let end = start; end < n; end += 1) {
            const width = rangeWidth[start][end];
            if (width > maxWidth) break;
            const tail = bestFrom(end + 1, linesLeft - 1);
            if (!tail) continue;
            const lineText = words.slice(start, end + 1).join(" ");
            const wordCount = end - start + 1;
            if (end === n - 1 && wordCount <= 2 && start > 0) continue;
            const shortLinePenalty = wordCount === 1 ? 2500 : 0;
            const shortTailPenalty = (end === n - 1 && wordCount <= 2) ? 4500 : 0;
            const score = (maxWidth - width) * (maxWidth - width) * 0.015 + shortLinePenalty + shortTailPenalty + tail.score;
            const candidate = { score, lines: [lineText, ...tail.lines], widths: [width, ...(tail.widths || [])] };
            if (!best || candidate.score < best.score) best = candidate;
        }
        memo.set(key, best);
        return best;
    }

    for (let lineCount = 2; lineCount <= n; lineCount += 1) {
        memo.clear();
        const result = bestFrom(0, lineCount);
        if (result) return result.lines;
    }
    return [text.trim()];
}

function applyBioLineAlignment(line, alignment) {
    line.classList.remove("align-left", "align-right", "align-center");
    line.classList.add(alignment === "right" ? "align-right" : "align-left");
    line.style.setProperty("justify-content", alignment === "right" ? "flex-end" : "flex-start", "important");
}

function appendMeasuredLine(container, lineText, alignment) {
    const line = document.createElement("div");
    line.className = `bio-flow-line ${alignment === "right" ? "align-right" : "align-left"}`;
    applyBioLineAlignment(line, alignment);
    const textNode = document.createElement("span");
    textNode.className = "bio-flow-text";
    textNode.textContent = lineText;
    line.appendChild(textNode);
    container.appendChild(line);
    return line;
}

function appendBioParagraph(container, lines, alignment) {
    let lastLine = null;
    for (const requestedLine of lines) {
        const width = Math.max(1, biography.clientWidth);
        const measuredLines = splitWordsToBalancedLines(requestedLine, width);
        for (const lineText of measuredLines) { lastLine = appendMeasuredLine(container, lineText, alignment); }
    }
    if (lastLine) lastLine.classList.add("bio-paragraph-gap");
}

function appendClientLines(container, names, groupSize, alignment) {
    const width = Math.max(1, biography.clientWidth);
    const full = names.join(", ");
    if (measureBioText(full) <= width) { appendMeasuredLine(container, full, alignment); return; }
    const groups = [];
    for (let i = 0; i < names.length; i += groupSize) { groups.push(names.slice(i, i + groupSize).join(", ")); }
    for (const group of groups) { appendMeasuredLine(container, group, alignment); }
}

function buildBiographyFlow() {
    if (!biography) return;
    const flow = document.getElementById("biography-flow");
    if (!flow) return;
    const measure = getBiographyMeasureElement();
    measure.style.fontSize = getComputedStyle(biography).fontSize; measure.style.fontWeight = getComputedStyle(biography).fontWeight; measure.style.lineHeight = getComputedStyle(biography).lineHeight; measure.style.letterSpacing = getComputedStyle(biography).letterSpacing; measure.style.wordSpacing = getComputedStyle(biography).wordSpacing;
    flow.innerHTML = "";
    for (const segment of BIO_FLOW_SEGMENTS) {
        if (segment.type === "paragraph") { appendBioParagraph(flow, segment.lines, segment.align); } 
        else { appendClientLines(flow, segment.names, segment.groupSize, segment.align); }
    }
}
buildBiographyFlow();
window.addEventListener("resize", () => { clearTimeout(window.__bioFlowResizeTimer); window.__bioFlowResizeTimer = setTimeout(() => { buildBiographyFlow(); }, 80); });
</script>

<script id="clean-index-script">
(async () => {
  "use strict";

  // Canlı GitHub RAW URL'leri (Veriler her zaman güncel kalacak)
  const LANDING_JSON_URL = "https://raw.githubusercontent.com/denizalpaybak/denizalpaybak.github.io/main/landing-index.json";
  const PHOTO_JSON_URL = "https://raw.githubusercontent.com/denizalpaybak/aybak-photography/main/projects.json";
  const FILM_JSON_URL = "https://raw.githubusercontent.com/denizalpaybak/aybak-film/main/films.json";

  const PHOTO_BASE = "https://library.denizalpaybak.com/photo-thumbnails/";
  const FILM_BASE = "https://library.denizalpaybak.com/film-previews/";
  const PHOTO_SITE = "https://photography.denizalpaybak.com/";
  const FILM_SITE = "https://film.denizalpaybak.com/";
  const MORPH_MS = 400;

  const shell = document.getElementById("clean-index-shell");
  const indexView = document.getElementById("clean-index-view");
  const infoView = document.getElementById("clean-info-view");
  const tableBody = document.getElementById("clean-index-body");
  const tableHeader = document.querySelector(".clean-index-header");
  const indexButton = document.getElementById("clean-index-button");
  const infoButton = document.getElementById("clean-info-button");
  const preview = document.getElementById("clean-index-preview");
  const infoContent = document.getElementById("clean-info-content");
  const filterBtns = document.querySelectorAll(".ci-filter-btn");

  if (!shell) return;
  document.documentElement.classList.remove("clean-index-boot");
  document.documentElement.classList.add("clean-index-live");

  // ================= CANLI JSON FETCH İŞLEMİ ================= //
  let DATA = [];
  try {
      const [landingRes, photoRes, filmRes] = await Promise.all([
          fetch(LANDING_JSON_URL, { cache: "no-store" }),
          fetch(PHOTO_JSON_URL, { cache: "no-store" }),
          fetch(FILM_JSON_URL, { cache: "no-store" })
      ]);
      const landingData = await landingRes.json();
      const photoData = await photoRes.json();
      const filmData = await filmRes.json();
      
      DATA = landingData.map((item, index) => {
          let isPhoto = item.field === "PHOTOGRAPHY";
          let mediaData = isPhoto ? photoData.find(p => p.id === item.id) : filmData.find(p => p.id === item.id);
          
          if (!mediaData) return null; // Eğer projeye ait data yoksa atla
          
          return {
              id: item.id,
              title: mediaData.title, // Canlı başlık
              date: mediaData.date,   // Canlı tarih (örn. digital cover sildiysen temiz hali gelir)
              type: isPhoto ? "photo" : "film",
              field: item.field,
              use: item.use,
              sortDate: item.sortDate,
              images: mediaData.images || null,
              videos: mediaData.videos || null,
              coverOverride: mediaData.coverOverride || null,
              _order: index
          };
      }).filter(Boolean);
      
      renderIndex(); // Veriler inince tabloyu oluştur
  } catch (err) {
      console.error("Data çekilemedi:", err);
  }

  const MORPH_STATES = new WeakMap();
  let activeView = "index";
  let activeField = "ALL";
  let activeUse = "ALL";
  let sortKey = "title"; // Varsayılan sıralama başlığı
  let sortDirection = 1;
  let currentRows = [];
  let previewRequest = 0;
  let infoBuilt = false;
  let indexPointerHover = false;
  let infoPointerHover = false;
  let lastTappedId = null;
  let tapTimer = null;

  const HEADER_LABELS = {title:"title", sortDate:"date"};
  const BIO_SEGMENTS = [{"align": "left", "lines": ["denizalp aybak (b. 1997) is a photographer and filmmaker,", "based in istanbul and available internationally."]}, {"align": "right", "lines": ["having graduated top of his class in management at sabanci university,", "he brings a strategic approach to image-making,", "considering both the work itself and the world it belongs to."]}, {"align": "left", "lines": ["his work creates atmosphere through contrast:", "light that feels dark,", "beauty that appears distant,", "stillness that carries tension,", "and precision that emerges from spontaneity."]}, {"align": "right", "lines": ["editorial collaborators include:", "vogue türkiye, harper’s bazaar türkiye, elle türkiye, l’officiel türkiye"]}, {"align": "left", "lines": ["brand collaborators include:", "vakko, bee goddess, zeynep arcay, peugeot, skechers, lc waikiki"]}];

  function letters(text) {
    const out=[];
    for(let i=0;i<text.length;i++) {
      const c=text[i];
      if(c.toLowerCase() !== c.toUpperCase()) out.push(i);
    }
    return out;
  }

  function initCharSpans(el, rawText) {
    const text=String(rawText).toLowerCase();
    const frag=document.createDocumentFragment();
    for(const ch of text) {
      const s=document.createElement("span");
      s.className="clean-index-char";
      s.textContent=ch;
      frag.appendChild(s);
    }
    const wrap=document.createElement("span");
    wrap.className="clean-index-cell-content";
    wrap.appendChild(frag);
    el.replaceChildren(wrap);
    el.__rawText=text;
    el.__charWrap=wrap;
    const count=letters(text).length;
    el.__morphState=0;
    MORPH_STATES.set(el, {state:0,target:0,frame:null,count});
  }

  function renderMorph(el, state) {
    const st=MORPH_STATES.get(el);
    if(!st || !el.__charWrap) return;
    const text=el.__rawText;
    const pos=letters(text);
    const active=new Set(pos.slice(0,state));
    Array.from(el.__charWrap.children).forEach((span,i)=>{
      const c=text[i];
      span.textContent=active.has(i) ? c.toUpperCase() : c.toLowerCase();
    });
    st.state=state;
  }

  function morphElement(el, toUpper, duration=MORPH_MS) {
    const st=MORPH_STATES.get(el);
    if(!st) return Promise.resolve();
    if(st.frame!==null) cancelAnimationFrame(st.frame);
    const target=toUpper ? st.count : 0;
    const startState=st.state;
    if(startState===target) { renderMorph(el,target); return Promise.resolve(); }
    const start=performance.now();
    return new Promise(resolve=>{
      const frame=now=>{
        const p=Math.min(1,(now-start)/duration);
        const eased=p < .5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
        const next=Math.round(startState+(target-startState)*eased);
        renderMorph(el,next);
        if(p<1) st.frame=requestAnimationFrame(frame);
        else { st.frame=null; renderMorph(el,target); resolve(); }
      };
      st.target=target;
      st.frame=requestAnimationFrame(frame);
    });
  }

  function setStaticCase(el, upper) {
    const st=MORPH_STATES.get(el); if(!st) return;
    if(st.frame!==null) cancelAnimationFrame(st.frame);
    renderMorph(el, upper ? st.count : 0);
    st.frame=null; st.target=upper?st.count:0;
  }

  function morphTopState() {
    const indexUpper = activeView === "index" || indexPointerHover;
    const infoUpper = activeView === "info" || infoPointerHover;
    morphElement(indexButton,indexUpper);
    morphElement(infoButton,infoUpper);
  }

  initCharSpans(indexButton,"index");
  initCharSpans(infoButton,"info");

  function ensureInfo() {
    if(infoBuilt) return;
    infoContent.innerHTML="";
    BIO_SEGMENTS.forEach(seg=>{
      const block=document.createElement("div");
      block.className="clean-index-info-block " + seg.align;
      seg.lines.forEach(line=>{
        const span=document.createElement("span");
        span.className="line";
        span.textContent=line;
        block.appendChild(span);
      });
      infoContent.appendChild(block);
    });
    infoBuilt=true;
  }

  function filteredAndSortedProjects() {
    let copy = DATA.filter(p => {
      const matchField = activeField === "ALL" || p.field === activeField;
      const matchUse = activeUse === "ALL" || p.use === activeUse;
      return matchField && matchUse;
    });
    
    copy.sort((a,b)=>{
      const av=String(a[sortKey]||"").toLowerCase();
      const bv=String(b[sortKey]||"").toLowerCase();
      const aa=sortKey==="sortDate" ? (av || "0000-00") : av;
      const bb=sortKey==="sortDate" ? (bv || "0000-00") : bv;
      const c=aa.localeCompare(bb,undefined,{sensitivity:"base"});
      return c!==0 ? c*sortDirection : a._order-b._order;
    });
    return copy;
  }

  function getRowCells(row) { return Array.from(row.querySelectorAll(".clean-index-morph-host")); }

  function triggerHoverIn(index) {
    if(!currentRows[index]) return;
    
    // Mobil için: Eski açık olanları temizle
    currentRows.forEach((r, i) => {
        if(i !== index && r.hover) triggerHoverOut(i);
    });

    const r = currentRows[index];
    const cells = getRowCells(r.el);
    r.hover = true;
    Promise.all(cells.map(c=>morphElement(c,true)));
    showPreview(r);
  }

  function triggerHoverOut(index) {
    if(!currentRows[index]) return;
    const r = currentRows[index];
    const cells = getRowCells(r.el);
    r.hover = false;
    Promise.all(cells.map(c=>morphElement(c,false)));
    hidePreview();
  }

  function goToProject(p) {
    const base = p.type === "photo" ? PHOTO_SITE : FILM_SITE;
    window.location.href = base + "?project=" + encodeURIComponent(p.id) + "&view=all";
  }

  function attachRow(row, p, index) {
    const hit = row.querySelector(".clean-index-row-hit");
    
    row.addEventListener("pointerenter", (e) => {
      if(window.innerWidth <= 900 && e.pointerType === "touch") return; 
      triggerHoverIn(index);
    });
    row.addEventListener("pointerleave", (e) => {
      if(window.innerWidth <= 900 && e.pointerType === "touch") return;
      triggerHoverOut(index);
    });

    hit.addEventListener("click", () => {
      const isMobile = window.innerWidth <= 900;
      if (isMobile) {
        if (lastTappedId === p.id) {
          goToProject(p); // 2. Tık
        } else {
          // 1. Tık: Hover yap
          lastTappedId = p.id;
          clearTimeout(tapTimer);
          tapTimer = setTimeout(() => { lastTappedId = null; }, 1500); 
          triggerHoverIn(index);
        }
      } else {
        goToProject(p); // Desktop
      }
    });
  }

  function renderTableData() {
    tableBody.innerHTML = "";
    const frag = document.createDocumentFragment();
    currentRows = [];
    
    filteredAndSortedProjects().forEach((p, index)=>{
      const row=document.createElement("div");
      row.className="clean-index-row";
      row.dataset.id=p.id;
      row.dataset.type=p.type;
      
      const values=[p.title, p.date];
      values.forEach(value=>{
        const cell=document.createElement("div");
        cell.className="clean-index-cell";
        const host=document.createElement("span");
        host.className="clean-index-morph-host";
        cell.appendChild(host);
        row.appendChild(cell);
        initCharSpans(host,value);
      });

      const hit=document.createElement("button");
      hit.className="clean-index-row-hit";
      hit.type="button";
      hit.setAttribute("aria-label",p.title);
      row.appendChild(hit);
      frag.appendChild(row);
      currentRows.push({el:row, p, index, hover:false});
      attachRow(row, p, index);
    });
    tableBody.appendChild(frag);
  }

  function renderHeaders() {
    tableHeader.querySelectorAll(".clean-index-headerbutton").forEach(btn=>{
      const key=btn.dataset.key;
      if(!btn.__ready) { initCharSpans(btn,HEADER_LABELS[key]); btn.__ready=true; }
      
      // Sıralama durumu "underline" (altı çizili) sınıfı ile kontrol edilir
      if(key === sortKey) {
         btn.classList.add("active-sort");
      } else {
         btn.classList.remove("active-sort");
      }
      setStaticCase(btn, false); // Uppercase iptal

      if(!btn.__bound) {
        btn.__bound=true;
        btn.addEventListener("click",()=>{
          if(sortKey===key) sortDirection*=-1;
          else { sortKey=key; sortDirection=key==="sortDate" ? -1 : 1; }
          renderIndex();
        });
      }
    });
  }

  // Filtreleme Butonları Dinleyicileri
  filterBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      const type = btn.dataset.type;
      const val = btn.dataset.val;
      
      document.querySelectorAll(`.ci-filter-btn[data-type="${type}"]`).forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      
      if(type === "field") activeField = val;
      if(type === "use") activeUse = val;
      
      renderIndex();
    });
  });

  function renderIndex() {
    previewRequest++;
    hidePreview();
    lastTappedId = null; 
    renderHeaders();
    renderTableData();
  }

  function mediaFor(project) {
    let media = null;
    if (project.coverOverride) {
        media = project.coverOverride;
    } else if (project.images && project.images.length > 0) {
        media = project.images[0];
    } else if (project.videos && project.videos.length > 0) {
        media = project.videos[0];
    }
    if(!media) return null;
    
    if(project.type === 'photo') return PHOTO_BASE + media.replace(/\.[^.]+$/i,'.webp');
    const dot = media.lastIndexOf('.');
    return FILM_BASE + (dot > 0 ? media.slice(0,dot) : media) + '_preview.mp4';
  }

  function showPreview(r) {
    previewRow = r;
    const request = ++previewRequest;
    preview.innerHTML = '';
    const src = mediaFor(r.p);
    if(!src) return;

    const el = r.p.type==='photo' ? document.createElement('img') : document.createElement('video');
    if(r.p.type==='photo') { el.src=src; el.alt=''; }
    else { el.src=src; el.muted=true; el.autoplay=true; el.loop=true; el.playsInline=true; el.preload='auto'; }
    
    preview.appendChild(el);
    preview.classList.add('visible');
  }

  function hidePreview() { 
    previewRow = null; 
    preview.classList.remove('visible'); 
    preview.innerHTML = ''; 
  }

  function switchView(target) {
    if(activeView===target) return;
    hidePreview();
    lastTappedId = null;
    if(target==='info') ensureInfo();
    activeView=target;
    
    morphTopState(); 
    
    indexView.classList.toggle('active',target==='index');
    infoView.classList.toggle('active',target==='info');
    indexView.setAttribute('aria-hidden',target!=='index');
    infoView.setAttribute('aria-hidden',target!=='info');
  }

  indexButton.addEventListener('mouseenter',()=>{ indexPointerHover=true; morphTopState(); });
  indexButton.addEventListener('mouseleave',()=>{ indexPointerHover=false; morphTopState(); });
  infoButton.addEventListener('mouseenter',()=>{ infoPointerHover=true; morphTopState(); });
  infoButton.addEventListener('mouseleave',()=>{ infoPointerHover=false; morphTopState(); });
  indexButton.addEventListener('click',()=>switchView('index'));
  infoButton.addEventListener('click',()=>switchView('info'));

  function openEndCard(show) {
    if(typeof window.setLandingAybakEndCard==='function') window.setLandingAybakEndCard(show);
  }

  let wheelAccumulator = 0;
  let wheelResetTimer = null;
  document.addEventListener('wheel', event => {
    const isBlackCard = document.body.classList.contains('landing-aybak-active');
    if(event.target.closest('.clean-index-footer')) return;

    if (!isBlackCard) {
      if (event.deltaY <= 0) {
          wheelAccumulator = 0;
          return;
      }
      const wrap = document.querySelector('.clean-index-table-wrap');
      if (wrap && activeView === "index") {
          const canScroll = wrap.scrollHeight > wrap.clientHeight;
          const atBottom = wrap.scrollTop + wrap.clientHeight >= wrap.scrollHeight - 2;
          if (canScroll && !atBottom) {
              wheelAccumulator = 0;
              return;
          }
      }
    } else {
      if (event.deltaY >= 0) {
          wheelAccumulator = 0;
          return;
      }
    }

    wheelAccumulator += event.deltaY;
    clearTimeout(wheelResetTimer);
    wheelResetTimer = setTimeout(() => wheelAccumulator = 0, 140);

    if (!isBlackCard && wheelAccumulator >= 48) {
      event.preventDefault(); 
      wheelAccumulator = 0;
      openEndCard(true);
    } else if (isBlackCard && wheelAccumulator <= -48) {
      event.preventDefault(); 
      wheelAccumulator = 0;
      openEndCard(false);
    }
  }, {passive: false});

  document.addEventListener('keydown',event=>{
    const isBlackCard = document.body.classList.contains('landing-aybak-active');
    if(!isBlackCard && (event.key==='ArrowDown' || event.key==='PageDown')) { event.preventDefault(); openEndCard(true); }
    if(isBlackCard && (event.key==='ArrowUp' || event.key==='PageUp')) { event.preventDefault(); openEndCard(false); }
  });

  let lastTouchY = null;
  document.addEventListener('touchstart',event=>{
    if(event.changedTouches && event.changedTouches[0]) lastTouchY=event.changedTouches[0].clientY;
  },{passive:true});

  document.addEventListener('touchend',event=>{
    const isBlackCard = document.body.classList.contains('landing-aybak-active');
    if(lastTouchY===null || !event.changedTouches || !event.changedTouches[0]) return;
    const dy = event.changedTouches[0].clientY - lastTouchY;
    lastTouchY = null;

    if (!isBlackCard && dy < -45) {
      const wrap = document.querySelector('.clean-index-table-wrap');
      if (wrap && activeView === "index") {
          const canScroll = wrap.scrollHeight > wrap.clientHeight;
          const atBottom = wrap.scrollTop + wrap.clientHeight >= wrap.scrollHeight - 2;
          if (canScroll && !atBottom) return;
      }
      openEndCard(true);
    } else if (isBlackCard && dy > 45) {
      openEndCard(false);
    }
  },{passive:true});

  setStaticCase(indexButton,true);
  setStaticCase(infoButton,false);
  morphTopState();

  const watcher=new MutationObserver(()=>{
    const active=document.body.classList.contains('landing-aybak-active');
    shell.style.opacity = active ? "0" : "1";
    shell.style.pointerEvents = active ? "none" : "auto";
  });
  watcher.observe(document.body,{attributes:true,attributeFilter:['class']});
})();
</script>
</body>
</html>
