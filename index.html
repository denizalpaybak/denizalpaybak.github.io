}


/*
    Automatic film closing is now split into TWO
    independent events:

    A)
    ~400 ms before the video ends:
    FILM -> film starts.

    B)
    When the video ACTUALLY ends:
    video layer disappears immediately.

    This prevents a frozen final frame.
*/

function scheduleAutomaticFilmClose() {

    cancelFilmAutoClose();

    function checkFilmPosition() {

        if (
            activeMode !==
            "film" ||
            filmPlaybackMode !==
            "auto" ||
            introCancelled
        ) {

            filmAutoCloseFrame =
                null;

            return;

        }


        let duration =
            FILM_EXACT_DURATION;


        if (
            Number.isFinite(
                filmVideo.duration
            ) &&
            filmVideo.duration >
            0
        ) {

            duration =
                filmVideo.duration;

        }


        const closeAt =
            Math.max(
                0,
                duration -
                FILM_AUTO_CLOSE_LEAD
            );


        if (
            filmVideo.currentTime >=
            closeAt &&
            !filmAutoCloseStarted
        ) {

            filmAutoCloseStarted =
                true;

            filmAutoCloseFrame =
                null;


            /*
                DO NOT pause the video.

                It continues playing underneath
                FILM -> film.
            */

            clearPreviewTheme();

            animateTitlesTo(
                null,
                () => {

                    /*
                        Usually the real "ended" event will
                        already have removed the layer by
                        this point.

                        This is just cleanup.
                    */

                    filmVideo.pause();

                    filmField
                        .classList
                        .remove(
                            "active"
                        );

                    activeMode =
                        null;

                    filmAutoCloseStarted =
                        false;

                    if (
                        !introCancelled
                    ) {

                        introFinished =
                            true;

                    }

                }
            );

            return;

        }


        filmAutoCloseFrame =
            requestAnimationFrame(
                checkFilmPosition
            );

    }


    filmAutoCloseFrame =
        requestAnimationFrame(
            checkFilmPosition
        );

}


/* =====================================================
   RECURSIVE IMAGE HELPERS
   ===================================================== */

function findFirstImage(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return null;

    }

    if (
        typeof value ===
        "string"
    ) {

        return looksLikeImage(
            value
        )
            ? value
            : null;

    }

    if (
        Array.isArray(
            value
        )
    ) {

        for (
            const item of value
        ) {

            const result =
                findFirstImage(
                    item
                );

            if (
                result
            ) {

                return result;

            }

        }

        return null;

    }

    if (
        typeof value ===
        "object"
    ) {

        for (
            const child of
            Object.values(
                value
            )
        ) {

            const result =
                findFirstImage(
                    child
                );

            if (
                result
            ) {

                return result;

            }

        }

    }

    return null;

}


function collectImages(
    value,
    output
) {

    if (
        value === null ||
        value === undefined
    ) {

        return;

    }

    if (
        typeof value ===
        "string"
    ) {

        if (
            looksLikeImage(
                value
            )
        ) {

            const url =
                resolvePhotoUrl(
                    value
                );

            if (
                url
            ) {

                output.push(
                    url
                );

            }

        }

        return;

    }

    if (
        Array.isArray(
            value
        )
    ) {

        value.forEach(
            item => {

                collectImages(
                    item,
                    output
                );

            }
        );

        return;

    }

    if (
        typeof value ===
        "object"
    ) {

        Object.values(
            value
        ).forEach(
            child => {

                collectImages(
                    child,
                    output
                );

            }
        );

    }

}


/* =====================================================
   RANDOM PROJECT COVER
   ===================================================== */

/*
    Landing-page cover logic now mirrors the photography
    site's new logic:

    - coverOverride always wins.
    - Otherwise one image is chosen randomly from images[].
    - The choice is made once when projectRecords are built,
      so relayouting the mosaic does not change the cover.
    - Legacy cover fields are intentionally ignored.
*/

function getProjectImageValues(
    project
) {

    if (
        !project ||
        !Array.isArray(
            project.images
        )
    ) {

        return [];

    }


    return project.images.filter(
        value =>
            looksLikeImage(
                value
            )
    );

}


function getProjectCover(
    project
) {

    if (
        project &&
        looksLikeImage(
            project.coverOverride
        )
    ) {

        const overrideUrl =
            resolvePhotoUrl(
                project.coverOverride
            );


        if (
            overrideUrl
        ) {

            return overrideUrl;

        }

    }


    const images =
        getProjectImageValues(
            project
        );


    if (
        !images.length
    ) {

        const fallback =
            findFirstImage(
                project
            );


        return fallback
            ? resolvePhotoUrl(
                fallback
            )
            : null;

    }


    const randomIndex =
        Math.floor(
            Math.random() *
            images.length
        );


    return resolvePhotoUrl(
        images[
            randomIndex
        ]
    );

}


/* =====================================================
   PROJECT ARRAY
   ===================================================== */

function getProjectsArray(
    data
) {

    if (
        Array.isArray(
            data
        )
    ) {

        return data;

    }

    if (
        data &&
        Array.isArray(
            data.projects
        )
    ) {

        return data.projects;

    }

    if (
        data &&
        typeof data ===
        "object"
    ) {

        return Object.values(
            data
        ).filter(
            value =>
                value &&
                typeof value ===
                "object"
        );

    }

    return [];

}


/* =====================================================
   IMAGE METADATA
   ===================================================== */

function loadImageMetadata(
    url
) {

    return new Promise(
        resolve => {

            const image =
                new Image();

            image.decoding =
                "async";


            /*
                Metadata probes are background work.
                Keeping them low-priority avoids competing
                with the landing UI and film preview.
            */

            image.fetchPriority =
                "low";

            image.onload =
                () => {

                    if (
                        !image.naturalWidth ||
                        !image.naturalHeight
                    ) {

                        resolve(
                            null
                        );

                        return;

                    }

                    resolve(
                        {
                            url,

                            width:
                                image.naturalWidth,

                            height:
                                image.naturalHeight,

                            ratio:
                                image.naturalWidth /
                                image.naturalHeight
                        }
                    );

                };

            image.onerror =
                () => {

                    resolve(
                        null
                    );

                };

            image.src =
                url;

        }
    );

}


/* =====================================================
   ACTIVE DATASET
   ===================================================== */

function updateActiveVisualGroups() {

    const mobile =
        isMobileLayout();

    if (
        mobile
    ) {

        projectVisualGroups =
            desktopProjectVisualGroups
                .map(
                    group => {

                        return {
                            projectIndex:
                                group.projectIndex,

                            photos:
                                group.photos.length
                                    ? [
                                        group.photos[0]
                                    ]
                                    : []
                        };

                    }
                )
                .filter(
                    group =>
                        group.photos.length
                );

    }

    else {

        projectVisualGroups =
            desktopProjectVisualGroups.map(
                group => {

                    return {
                        projectIndex:
                            group.projectIndex,

                        photos:
                            group.photos.slice(
                                0,
                                2
                            )
                    };

                }
            );

    }

    renderedMobileMode =
        mobile;

}


/* =====================================================
   INITIAL PHOTOGRAPHY LOAD
   ===================================================== */

async function loadInitialPhotography() {

    if (
        photographyLoadPromise
    ) {

        return photographyLoadPromise;

    }

    photographyLoadPromise =
        (
            async () => {

                const response =
                    await fetch(
                        PROJECTS_JSON_URL,
                        {
                            cache:
                                "no-store"
                        }
                    );

                if (
                    !response.ok
                ) {

                    throw new Error(
                        `projects.json could not be loaded: ${response.status}`
                    );

                }

                const data =
                    await response.json();

                const projects =
                    getProjectsArray(
                        data
                    );

                projectRecords =
                    projects
                        .map(
                            (
                                project,
                                projectIndex
                            ) => {

                                const coverUrl =
                                    getProjectCover(
                                        project
                                    );

                                const allUrls =
                                    getProjectImageValues(
                                        project
                                    )
                                        .map(
                                            resolvePhotoUrl
                                        )
                                        .filter(
                                            Boolean
                                        );


                                if (
                                    project.coverOverride
                                ) {

                                    const overrideUrl =
                                        resolvePhotoUrl(
                                            project.coverOverride
                                        );


                                    if (
                                        overrideUrl
                                    ) {

                                        allUrls.unshift(
                                            overrideUrl
                                        );

                                    }

                                }


                                return {
                                    projectIndex,
                                    project,
                                    coverUrl,

                                    allUrls:
                                        uniqueUrls(
                                            allUrls
                                        )
                                };

                            }
                        )
                        .filter(
                            record =>
                                record.coverUrl
                        );

                const initialGroups =
                    await Promise.all(

                        projectRecords.map(
                            async record => {

                                const cover =
                                    await loadImageMetadata(
                                        record.coverUrl
                                    );

                                if (
                                    !cover
                                ) {

                                    return null;

                                }

                                return {
                                    projectIndex:
                                        record.projectIndex,

                                    photos:
                                        [
                                            cover
                                        ]
                                };

                            }
                        )

                    );

                desktopProjectVisualGroups =
                    initialGroups.filter(
                        Boolean
                    );

                updateActiveVisualGroups();

                buildPhotographyDOM();

                randomizePhotographyLayout();

                photographyInitialReady =
                    true;

                stabilizeLandingLayout();


                /*
                    The first randomly selected image from
                    each project is enough for the initial
                    photography state.

                    Optional second / landscape images are
                    analyzed later so mobile does not start
                    downloading every full-resolution image
                    at once.
                */

                const startSupplementalAnalysis =
                    () => {

                        analyzeSupplementalImagesInBackground();

                    };


                if (
                    "requestIdleCallback" in window
                ) {

                    requestIdleCallback(
                        startSupplementalAnalysis,
                        {
                            timeout:
                                1800
                        }
                    );

                }

                else {

                    setTimeout(
                        startSupplementalAnalysis,
                        700
                    );

                }

            }
        )();

    return photographyLoadPromise;

}


/* =====================================================
   BACKGROUND LANDSCAPE ANALYSIS
   ===================================================== */

async function analyzeSupplementalImagesInBackground() {

    try {

        const completed =
            await Promise.all(

                projectRecords.map(
                    async record => {

                        const current =
                            desktopProjectVisualGroups.find(
                                group =>
                                    group.projectIndex ===
                                    record.projectIndex
                            );

                        if (
                            !current
                        ) {

                            return null;

                        }

                        const cover =
                            current.photos[0];

                        const coverKey =
                            normalizeUrl(
                                record.coverUrl
                            );

                        const otherUrls =
                            record.allUrls.filter(
                                url =>
                                    normalizeUrl(
                                        url
                                    ) !==
                                    coverKey
                            );

                        const metadata =
                            (
                                await Promise.all(
                                    otherUrls.map(
                                        loadImageMetadata
                                    )
                                )
                            ).filter(
                                Boolean
                            );

                        const landscape =
                            metadata
                                .filter(
                                    photo =>
                                        photo.ratio >
                                        1.05
                                )
                                .sort(
                                    (
                                        a,
                                        b
                                    ) =>
                                        b.ratio -
                                        a.ratio
                                )[0] ||
                            null;

                        return {
                            projectIndex:
                                record.projectIndex,

                            photos:
                                landscape
                                    ? [
                                        cover,
                                        landscape
                                    ]
                                    : [
                                        cover
                                    ]
                        };

                    }
                )

            );

        desktopProjectVisualGroups =
            completed.filter(
                Boolean
            );

        supplementalAnalysisFinished =
            true;

        if (
            activeMode !==
            "photography"
        ) {

            updateActiveVisualGroups();

            buildPhotographyDOM();

            randomizePhotographyLayout();

        }

    }

    catch (
        error
    ) {

        console.error(
            "Background photography analysis failed:",
            error
        );

    }

}


/* =====================================================
   PHOTOGRAPHY DOM
   ===================================================== */

function buildPhotographyDOM() {

    scatteredStage.innerHTML =
        "";

    groupElements =
        [];

    const fragment =
        document.createDocumentFragment();

    projectVisualGroups.forEach(
        (
            group,
            groupIndex
        ) => {

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "photo-group";

            element.dataset.groupIndex =
                groupIndex;

            group.photos.forEach(
                (
                    photo,
                    photoIndex
                ) => {

                    const image =
                        document.createElement(
                            "img"
                        );

                    image.className =
                        "project-photo";

                    image.src =
                        photo.url;

                    image.alt =
                        "";

                    image.decoding =
                        "async";


                    image.loading =
                        "eager";


                    image.fetchPriority =
                        "low";


                    image.dataset.photoIndex =
                        photoIndex;

                    element.appendChild(
                        image
                    );

                }
            );

            fragment.appendChild(
                element
            );

            groupElements.push(
                element
            );

        }
    );

    scatteredStage.appendChild(
        fragment
    );

}


/* =====================================================
   RANDOM HELPERS
   ===================================================== */

function randomBetween(
    min,
    max
) {

    return (
        min +
        Math.random() *
        (
            max -
            min
        )
    );

}


function randomSign() {

    return Math.random() <
        0.5
            ? -1
            : 1;

}


/* =====================================================
   PROJECT GEOMETRY
   ===================================================== */

function createProjectGeometry(
    group,
    baseHeight
) {

    const mobile =
        isMobileLayout();

    const firstScale =
        mobile
            ? randomBetween(
                0.68,
                1.46
            )
            : randomBetween(
                0.64,
                1.38
            );

    const firstHeight =
        baseHeight *
        firstScale;

    const first =
        {
            photo:
                group.photos[0],

            height:
                firstHeight,

            width:
                firstHeight *
                group.photos[0].ratio,

            x:
                0,

            y:
                0
        };

    if (
        group.photos.length ===
        1
    ) {

        return {
            photos:
                [
                    first
                ],

            width:
                first.width,

            height:
                first.height
        };

    }

    const secondPhoto =
        group.photos[1];

    const secondHeight =
        baseHeight *
        randomBetween(
            0.55,
            1.34
        );

    const secondWidth =
        secondHeight *
        secondPhoto.ratio;

    const horizontalGap =
        randomBetween(
            DESKTOP_PAIR_DISTANCE_MIN,
            DESKTOP_PAIR_DISTANCE_MAX
        );

    const secondX =
        first.width +
        horizontalGap;

    const verticalOffset =
        baseHeight *
        randomBetween(
            0.12,
            0.62
        ) *
        randomSign();

    const minY =
        Math.min(
            0,
            verticalOffset
        );

    first.y =
        -minY;

    const second =
        {
            photo:
                secondPhoto,

            height:
                secondHeight,

            width:
                secondWidth,

            x:
                secondX,

            y:
                verticalOffset -
                minY
        };

    return {
        photos:
            [
                first,
                second
            ],

        width:
            second.x +
            second.width,

        height:
            Math.max(
                first.y +
                first.height,

                second.y +
                second.height
            )
    };

}


/* =====================================================
   ALL PROJECT GEOMETRIES
   ===================================================== */

function createAllProjectGeometries(
    baseHeight
) {

    const mobile =
        isMobileLayout();

    const gapMin =
        mobile
            ? MOBILE_PROJECT_GAP_MIN
            : DESKTOP_PROJECT_GAP_MIN;

    const gapMax =
        mobile
            ? MOBILE_PROJECT_GAP_MAX
            : DESKTOP_PROJECT_GAP_MAX;

    return projectVisualGroups.map(
        (
            group,
            index
        ) => {

            return {
                index,

                ...createProjectGeometry(
                    group,
                    baseHeight
                ),

                gapAfter:
                    randomBetween(
                        gapMin,
                        gapMax
                    )
            };

        }
    );

}


/* =====================================================
   DESKTOP EXCLUSION ZONE
   ===================================================== */

function getDesktopExclusionZone() {

    if (
        isMobileLayout()
    ) {

        return null;

    }

    const stageRect =
        photographyField
            .getBoundingClientRect();

    const bioRect =
        biography
            .getBoundingClientRect();

    const gridRect =
        landingGrid
            .getBoundingClientRect();

    const right =
        Math.min(
            stageRect.width,

            (
                gridRect.left -
                stageRect.left
            ) +
            530 +
            DESKTOP_TEXT_CLEARANCE_X
        );

    const bottom =
        Math.min(
            stageRect.height,

            (
                bioRect.bottom -
                stageRect.top
            ) +
            DESKTOP_TEXT_CLEARANCE_Y
        );

    return {
        left:
            0,

        top:
            0,

        right,
        bottom,

        width:
            right,

        height:
            bottom
    };

}


/* =====================================================
   REGION PACKER
   ===================================================== */

function packRegion(
    geometries,
    regionWidth,
    regionHeight,
    gapMin,
    gapMax
) {

    if (
        !geometries.length
    ) {

        return {
            rows:
                [],

            totalHeight:
                0
        };

    }

    const rows =
        [];

    let row =
        [];

    let rowWidth =
        0;

    let rowHeight =
        0;

    for (
        const geometry of geometries
    ) {

        const gap =
            row.length
                ? randomBetween(
                    gapMin,
                    gapMax
                )
                : 0;

        if (
            row.length &&
            rowWidth +
            gap +
            geometry.width >
            regionWidth
        ) {

            rows.push(
                {
                    items:
                        row,

                    width:
                        rowWidth,

                    height:
                        rowHeight
                }
            );

            row =
                [];

            rowWidth =
                0;

            rowHeight =
                0;

        }

        const actualGap =
            row.length
                ? randomBetween(
                    gapMin,
                    gapMax
                )
                : 0;

        row.push(
            {
                geometry,

                gapBefore:
                    actualGap
            }
        );

        rowWidth +=
            actualGap +
            geometry.width;

        rowHeight =
            Math.max(
                rowHeight,
                geometry.height
            );

    }

    if (
        row.length
    ) {

        rows.push(
            {
                items:
                    row,

                width:
                    rowWidth,

                height:
                    rowHeight
            }
        );

    }

    let totalHeight =
        0;

    rows.forEach(
        (
            current,
            index
        ) => {

            totalHeight +=
                current.height;

            if (
                index <
                rows.length - 1
            ) {

                totalHeight +=
                    randomBetween(
                        gapMin,
                        gapMax
                    );

            }

        }
    );

    if (
        totalHeight >
        regionHeight
    ) {

        return null;

    }

    return {
        rows,
        totalHeight
    };

}


/* =====================================================
   DESKTOP L-SHAPE COMPOSITION
   ===================================================== */

function createDesktopComposition(
    fieldWidth,
    fieldHeight,
    baseHeight
) {

    const geometries =
        createAllProjectGeometries(
            baseHeight
        );

    const exclusion =
        getDesktopExclusionZone();

    if (
        !exclusion
    ) {

        return null;

    }

    const upperX =
        exclusion.right;

    const upperWidth =
        Math.max(
            0,
            fieldWidth -
            upperX
        );

    const upperHeight =
        Math.max(
            0,
            exclusion.bottom
        );

    const lowerY =
        exclusion.bottom;

    const lowerHeight =
        Math.max(
            0,
            fieldHeight -
            lowerY
        );

    let best =
        null;

    for (
        let split = 0;
        split <= geometries.length;
        split++
    ) {

        const upperItems =
            geometries.slice(
                0,
                split
            );

        const lowerItems =
            geometries.slice(
                split
            );

        const upper =
            packRegion(
                upperItems,
                upperWidth,
                upperHeight,
                DESKTOP_PROJECT_GAP_MIN,
                DESKTOP_PROJECT_GAP_MAX
            );

        if (
            !upper
        ) {

            continue;

        }

        const lower =
            packRegion(
                lowerItems,
                fieldWidth,
                lowerHeight,
                DESKTOP_PROJECT_GAP_MIN,
                DESKTOP_PROJECT_GAP_MAX
            );

        if (
            !lower
        ) {

            continue;

        }

        const upperFill =
            upperHeight > 0
                ? upper.totalHeight /
                  upperHeight
                : 0;

        const lowerFill =
            lowerHeight > 0
                ? lower.totalHeight /
                  lowerHeight
                : 0;

        const score =
            upperFill *
            0.45 +
            lowerFill *
            0.55;

        if (
            !best ||
            score >
            best.score
        ) {

            best =
                {
                    score,

                    upper,
                    lower,

                    upperX,
                    upperWidth,
                    upperHeight,

                    lowerY,
                    lowerHeight,

                    geometries
                };

        }

    }

    return best;

}


/* =====================================================
   MOBILE PACK
   ===================================================== */

function packMobileProjects(
    geometries,
    fieldWidth,
    fieldHeight
) {

    const rows =
        [];

    let currentRow =
        [];

    let currentWidth =
        0;

    let rowHeight =
        0;

    geometries.forEach(
        geometry => {

            const rowLimit =
                fieldWidth *
                randomBetween(
                    0.94,
                    1
                );

            const addition =
                currentRow.length
                    ? (
                        currentRow[
                            currentRow.length -
                            1
                        ].gapAfter +
                        geometry.width
                    )
                    : geometry.width;

            if (
                currentRow.length &&
                currentWidth +
                addition >
                rowLimit
            ) {

                rows.push(
                    {
                        items:
                            currentRow,

                        width:
                            currentWidth,

                        height:
                            rowHeight
                    }
                );

                currentRow =
                    [];

                currentWidth =
                    0;

                rowHeight =
                    0;

            }

            if (
                currentRow.length
            ) {

                currentWidth +=
                    currentRow[
                        currentRow.length -
                        1
                    ].gapAfter;

            }

            currentRow.push(
                geometry
            );

            currentWidth +=
                geometry.width;

            rowHeight =
                Math.max(
                    rowHeight,
                    geometry.height
                );

        }
    );

    if (
        currentRow.length
    ) {

        rows.push(
            {
                items:
                    currentRow,

                width:
                    currentWidth,

                height:
                    rowHeight
            }
        );

    }

    const rowGaps =
        [];

    for (
        let i = 0;
        i < rows.length - 1;
        i++
    ) {

        rowGaps.push(
            randomBetween(
                8,
                22
            )
        );

    }

    const totalHeight =
        rows.reduce(
            (
                total,
                row
            ) =>
                total +
                row.height,
            0
        ) +
        rowGaps.reduce(
            (
                total,
                gap
            ) =>
                total +
                gap,
            0
        );

    if (
        totalHeight >
        fieldHeight
    ) {

        return null;

    }

    if (
        rows.some(
            row =>
                row.width >
                fieldWidth
        )
    ) {

        return null;

    }

    return {
        rows,
        rowGaps,
        totalHeight
    };

}


/* =====================================================
   CREATE PHOTOGRAPHY COMPOSITION
   ===================================================== */

function createPhotographyComposition(
    fieldWidth,
    fieldHeight
) {

    if (
        !projectVisualGroups.length
    ) {

        return null;

    }

    const mobile =
        isMobileLayout();

    let low =
        mobile
            ? Math.max(
                38,
                fieldHeight *
                0.11
            )
            : Math.max(
                34,
                fieldHeight *
                0.075
            );

    let high =
        mobile
            ? Math.min(
                fieldHeight *
                0.42,
                fieldWidth *
                0.34
            )
            : Math.min(
                fieldHeight *
                0.32,
                fieldWidth *
                0.18
            );

    let best =
        null;

    for (
        let iteration = 0;
        iteration < 8;
        iteration++
    ) {

        const mid =
            (
                low +
                high
            ) /
            2;

        let candidate =
            null;

        for (
            let test = 0;
            test < 6;
            test++
        ) {

            if (
                mobile
            ) {

                const geometries =
                    createAllProjectGeometries(
                        mid
                    );

                const packed =
                    packMobileProjects(
                        geometries,
                        fieldWidth,
                        fieldHeight
                    );

                if (
                    packed
                ) {

                    candidate =
                        {
                            type:
                                "mobile",

                            geometries,
                            packed
                        };

                    break;

                }

            }

            else {

                const desktop =
                    createDesktopComposition(
                        fieldWidth,
                        fieldHeight,
                        mid
                    );

                if (
                    desktop
                ) {

                    candidate =
                        {
                            type:
                                "desktop",

                            ...desktop
                        };

                    break;

                }

            }

        }

        if (
            candidate
        ) {

            best =
                candidate;

            low =
                mid;

        }

        else {

            high =
                mid;

        }

    }

    return best;

}


/* =====================================================
   PLACE REGION ROWS
   ===================================================== */

function placeRegionRows(
    rows,
    regionX,
    regionY,
    regionWidth,
    regionHeight,
    placements
) {

    if (
        !rows.length
    ) {

        return;

    }

    const totalRowHeight =
        rows.reduce(
            (
                total,
                row
            ) =>
                total +
                row.height,
            0
        );

    const minimumGap =
        rows.length > 1
            ? DESKTOP_PROJECT_GAP_MIN *
              (
                  rows.length -
                  1
              )
            : 0;

    const spare =
        Math.max(
            0,
            regionHeight -
            totalRowHeight -
            minimumGap
        );

    let y =
        regionY +
        randomBetween(
            0,
            Math.min(
                spare *
                0.35,
                30
            )
        );

    rows.forEach(
        (
            row,
            rowIndex
        ) => {

            const spareX =
                Math.max(
                    0,
                    regionWidth -
                    row.width
                );

            let x =
                regionX +
                randomBetween(
                    0,
                    spareX
                );

            row.items.forEach(
                item => {

                    x +=
                        item.gapBefore ||
                        0;

                    const geometry =
                        item.geometry;

                    const verticalFreedom =
                        Math.max(
                            0,
                            row.height -
                            geometry.height
                        );

                    placements.set(
                        geometry.index,
                        {
                            x,

                            y:
                                y +
                                randomBetween(
                                    0,
                                    verticalFreedom
                                ),

                            geometry
                        }
                    );

                    x +=
                        geometry.width;

                }
            );

            y +=
                row.height;

            if (
                rowIndex <
                rows.length - 1
            ) {

                y +=
                    randomBetween(
                        DESKTOP_PROJECT_GAP_MIN,
                        DESKTOP_PROJECT_GAP_MAX
                    );

            }

        }
    );

}


/* =====================================================
   APPLY DESKTOP COMPOSITION
   ===================================================== */

function applyDesktopComposition(
    composition,
    fieldWidth,
    fieldHeight
) {

    const placements =
        new Map();

    placeRegionRows(
        composition.upper.rows,
        composition.upperX,
        0,
        composition.upperWidth,
        composition.upperHeight,
        placements
    );

    placeRegionRows(
        composition.lower.rows,
        0,
        composition.lowerY,
        fieldWidth,
        composition.lowerHeight,
        placements
    );

    applyPlacements(
        placements
    );

}


/* =====================================================
   APPLY MOBILE COMPOSITION
   ===================================================== */

function applyMobileComposition(
    composition,
    fieldWidth,
    fieldHeight
) {

    const {
        rows,
        rowGaps,
        totalHeight
    } =
        composition.packed;

    const spareVertical =
        Math.max(
            0,
            fieldHeight -
            totalHeight
        );

    let y =
        randomBetween(
            spareVertical *
            0.02,
            spareVertical *
            0.22
        );

    const placements =
        new Map();

    rows.forEach(
        (
            row,
            rowIndex
        ) => {

            const spareHorizontal =
                Math.max(
                    0,
                    fieldWidth -
                    row.width
                );

            let x =
                randomBetween(
                    0,
                    Math.min(
                        spareHorizontal,
                        fieldWidth *
                        0.10
                    )
                );

            row.items.forEach(
                (
                    geometry,
                    index
                ) => {

                    const verticalFreedom =
                        Math.max(
                            0,
                            row.height -
                            geometry.height
                        );

                    placements.set(
                        geometry.index,
                        {
                            x,

                            y:
                                y +
                                randomBetween(
                                    0,
                                    verticalFreedom
                                ),

                            geometry
                        }
                    );

                    x +=
                        geometry.width;

                    if (
                        index <
                        row.items.length - 1
                    ) {

                        x +=
                            geometry.gapAfter;

                    }

                }
            );

            y +=
                row.height;

            if (
                rowIndex <
                rowGaps.length
            ) {

                y +=
                    rowGaps[
                        rowIndex
                    ];

            }

        }
    );

    applyPlacements(
        placements
    );

}


/* =====================================================
   APPLY PLACEMENTS
   ===================================================== */

function applyPlacements(
    placements
) {

    groupElements.forEach(
        (
            element,
            index
        ) => {

            const placement =
                placements.get(
                    index
                );

            if (
                !placement
            ) {

                return;

            }

            const geometry =
                placement.geometry;

            element.style
                .setProperty(
                    "--group-x",
                    `${placement.x}px`
                );

            element.style
                .setProperty(
                    "--group-y",
                    `${placement.y}px`
                );

            element.style
                .setProperty(
                    "--group-width",
                    `${geometry.width}px`
                );

            element.style
                .setProperty(
                    "--group-height",
                    `${geometry.height}px`
                );

            const images =
                element.querySelectorAll(
                    ".project-photo"
                );

            geometry.photos.forEach(
                (
                    photo,
                    photoIndex
                ) => {

                    const image =
                        images[
                            photoIndex
                        ];

                    if (
                        !image
                    ) {

                        return;

                    }

                    image.style
                        .setProperty(
                            "--photo-height",
                            `${photo.height}px`
                        );

                    image.style
                        .setProperty(
                            "--photo-x",
                            `${photo.x}px`
                        );

                    image.style
                        .setProperty(
                            "--photo-y",
                            `${photo.y}px`
                        );

                }
            );

        }
    );

}


/* =====================================================
   RANDOMIZE PHOTOGRAPHY
   ===================================================== */

function randomizePhotographyLayout() {

    const rect =
        photographyField
            .getBoundingClientRect();

    if (
        rect.width <= 0 ||
        rect.height <= 0 ||
        !groupElements.length
    ) {

        return;

    }

    const composition =
        createPhotographyComposition(
            rect.width,
            rect.height
        );

    if (
        !composition
    ) {

        return;

    }

    if (
        composition.type ===
        "mobile"
    ) {

        applyMobileComposition(
            composition,
            rect.width,
            rect.height
        );

    }

    else {

        applyDesktopComposition(
            composition,
            rect.width,
            rect.height
        );

    }

}


/* =====================================================
   PHOTO SEQUENCE
   ===================================================== */

let photoSequenceFrame =
    null;

let photoSequenceToken =
    0;


function cancelPhotoSequence() {

    photoSequenceToken++;

    if (
        photoSequenceFrame !==
        null
    ) {

        cancelAnimationFrame(
            photoSequenceFrame
        );

        photoSequenceFrame =
            null;

    }

}


function setVisiblePhotoGroupCount(
    count
) {

    const normalized =
        Math.max(
            0,
            Math.min(
                groupElements.length,
                count
            )
        );

    groupElements.forEach(
        (
            group,
            index
        ) => {

            group.classList
                .toggle(
                    "visible",
                    index <
                    normalized
                );

        }
    );

}


/* =====================================================
   PHOTO ANIMATION
   ===================================================== */

function animatePhotoGroups(
    targetCount,
    onComplete =
        null
) {

    cancelPhotoSequence();

    const token =
        photoSequenceToken;

    const currentCount =
        groupElements.filter(
            group =>
                group.classList
                    .contains(
                        "visible"
                    )
        ).length;

    const target =
        Math.max(
            0,
            Math.min(
                groupElements.length,
                targetCount
            )
        );

    if (
        currentCount ===
        target
    ) {

        if (
            typeof onComplete ===
            "function"
        ) {

            onComplete();

        }

        return;

    }

    const started =
        performance.now();

    function frame(
        now
    ) {

        if (
            token !==
            photoSequenceToken
        ) {

            return;

        }

        const progress =
            Math.min(
                1,
                (
                    now -
                    started
                ) /
                PHOTO_SEQUENCE_DURATION
            );

        const raw =
            currentCount +
            (
                target -
                currentCount
            ) *
            progress;

        const count =
            target >
            currentCount
                ? Math.floor(
                    raw +
                    0.0001
                )
                : Math.ceil(
                    raw -
                    0.0001
                );

        setVisiblePhotoGroupCount(
            count
        );

        if (
            progress <
            1
        ) {

            photoSequenceFrame =
                requestAnimationFrame(
                    frame
                );

            return;

        }

        setVisiblePhotoGroupCount(
            target
        );

        photoSequenceFrame =
            null;

        if (
            typeof onComplete ===
            "function"
        ) {

            requestAnimationFrame(
                onComplete
            );

        }

    }

    photoSequenceFrame =
        requestAnimationFrame(
            frame
        );

}


/* =====================================================
   WORD STATE
   ===================================================== */

const navItems =
    {
        photography: {
            desktopWord: "photography.denizalpaybak.com",
            mobileWord: "photography.",
            word: "photography.denizalpaybak.com",
            caseLength: "photography.".length,
            baseCount: 0,
            element: photographyText,
            count: 0
        },

        film: {
            desktopWord: "film.denizalpaybak.com",
            mobileWord: "film.",
            word: "film.denizalpaybak.com",
            caseLength: "film.".length,
            baseCount: 0,
            element: filmText,
            count: 0
        }
    };


function isPortraitNavigation() {
    return window.matchMedia(
        "(max-width: 600px) and (orientation: portrait)"
    ).matches;
}


function syncNavigationWords() {
    const portrait = isPortraitNavigation();

    [navItems.photography, navItems.film].forEach(item => {
        item.word = portrait ? item.mobileWord : item.desktopWord;
        item.caseLength = item.mobileWord === item.word
            ? item.word.length
            : item.mobileWord.length;
        item.baseCount = 0;
        item.count = Math.min(item.count, item.caseLength);
        item.element.textContent = item.word;
    });
}


function renderCaseWord(
    item,
    count
) {
    const normalized =
        Math.max(
            0,
            Math.min(
                item.caseLength,
                Math.round(count)
            )
        );

    const prefix = item.word.slice(0, item.caseLength);
    const suffix = item.word.slice(item.caseLength);

    return (
        prefix.slice(0, normalized).toUpperCase() +
        prefix.slice(normalized) +
        suffix
    );
}


function setWordCount(
    item,
    count
) {

    item.count =
        Math.max(
            0,
            Math.min(
                item.word.length,
                Math.round(
                    count
                )
            )
        );

    item.element.textContent =
        renderCaseWord(
            item,
            item.count
        );

}


/* =====================================================
   TITLE MORPH
   ===================================================== */

let titleFrame =
    null;

let titleToken =
    0;


function animateTitlesTo(
    mode,
    onComplete =
        null
) {

    titleToken++;

    const token =
        titleToken;

    if (
        titleFrame !==
        null
    ) {

        cancelAnimationFrame(
            titleFrame
        );

        titleFrame =
            null;

    }

    const photography =
        navItems.photography;

    const film =
        navItems.film;

    const photoStart =
        photography.count;

    const filmStart =
        film.count;

    const photoTarget =
        mode ===
        "photography"
            ? photography.caseLength
            : photography.baseCount;

    const filmTarget =
        mode ===
        "film"
            ? film.caseLength
            : film.baseCount;

    const started =
        performance.now();

    function frame(
        now
    ) {

        if (
            token !==
            titleToken
        ) {

            return;

        }

        const progress =
            Math.min(
                1,
                (
                    now -
                    started
                ) /
                WORD_TRANSITION_DURATION
            );

        const photoRaw =
            photoStart +
            (
                photoTarget -
                photoStart
            ) *
            progress;

        const filmRaw =
            filmStart +
            (
                filmTarget -
                filmStart
            ) *
            progress;

        setWordCount(
            photography,

            photoTarget >=
            photoStart
                ? Math.floor(
                    photoRaw +
                    0.0001
                )
                : Math.ceil(
                    photoRaw -
                    0.0001
                )
        );

        setWordCount(
            film,

            filmTarget >=
            filmStart
                ? Math.floor(
                    filmRaw +
                    0.0001
                )
                : Math.ceil(
                    filmRaw -
                    0.0001
                )
        );

        if (
            progress <
            1
        ) {

            titleFrame =
                requestAnimationFrame(
                    frame
                );

            return;

        }

        setWordCount(
            photography,
            photoTarget
        );

        setWordCount(
            film,
            filmTarget
        );

        titleFrame =
            null;

        if (
            typeof onComplete ===
            "function"
        ) {

            requestAnimationFrame(
                onComplete
            );

        }

    }

    titleFrame =
        requestAnimationFrame(
            frame
        );

}

/* =====================================================
   REFRESH PHOTO DOM
   ===================================================== */

function refreshPhotographyDOMIfNeeded() {

    const currentMobileMode =
        isMobileLayout();

    if (
        renderedMobileMode !==
        currentMobileMode
    ) {

        updateActiveVisualGroups();

        buildPhotographyDOM();

        return;

    }

    if (
        !supplementalAnalysisFinished
    ) {

        return;

    }

    updateActiveVisualGroups();

    const expectedImages =
        projectVisualGroups.reduce(
            (
                total,
                group
            ) =>
                total +
                group.photos.length,
            0
        );

    const currentImages =
        scatteredStage
            .querySelectorAll(
                ".project-photo"
            )
            .length;

    if (
        expectedImages ===
        currentImages
    ) {

        return;

    }

    buildPhotographyDOM();

}


/* =====================================================
   IDLE
   ===================================================== */

function enterIdle(
    onComplete =
        null
) {

    clearPreviewTheme();

    cancelPhotoSequence();

    cancelFilmAutoClose();

    filmPlaybackMode =
        "auto";

    if (
        photographyField
            .classList
            .contains(
                "active"
            )
    ) {

        clearSinglePhotographyPreview();

        animateTitlesTo(
            null,
            () => {

                photographyField
                    .classList
                    .remove(
                        "active"
                    );

                setVisiblePhotoGroupCount(
                    0
                );

                activeMode =
                    null;

                if (
                    typeof onComplete ===
                    "function"
                ) {

                    onComplete();

                }

            }
        );

        return;

    }

    if (
        filmField
            .classList
            .contains(
                "active"
            )
    ) {

        hideFilmWithTitle(
            onComplete
        );

        return;

    }

    filmVideo.pause();

    clearSinglePhotographyPreview();

    setVisiblePhotoGroupCount(
        0
    );

    photographyField
        .classList
        .remove(
            "active"
        );

    filmField
        .classList
        .remove(
            "active"
        );

    activeMode =
        null;

    animateTitlesTo(
        null,
        onComplete
    );

}



function clearSinglePhotographyPreview() {

    fixedPhotoPreview.classList.remove(
        "visible"
    );


    scatteredStage.classList.remove(
        "single-photo-mode"
    );

    scatteredStage
        .querySelectorAll(
            ".single-photo-group"
        )
        .forEach(
            element =>
                element.classList.remove(
                    "single-photo-group"
                )
        );

    scatteredStage
        .querySelectorAll(
            ".single-photo-visible"
        )
        .forEach(
            element =>
                element.classList.remove(
                    "single-photo-visible"
                )
        );

}


function showRandomPhotographyImage(
    onReady = null
) {

    clearSinglePhotographyPreview();

    setVisiblePhotoGroupCount(
        0
    );


    scatteredStage.classList.add(
        "single-photo-mode"
    );


    fixedPhotoPreview.classList.add(
        "visible"
    );


    const ready =
        () => {

            if (
                typeof onReady ===
                    "function"
            ) {

                onReady();

            }

        };


    if (
        fixedPhotoPreview.complete &&
        fixedPhotoPreview.naturalWidth > 0
    ) {

        ready();

    }

    else {

        fixedPhotoPreview.addEventListener(
            "load",
            ready,
            {
                once: true
            }
        );


        fixedPhotoPreview.addEventListener(
            "error",
            ready,
            {
                once: true
            }
        );

    }

}

fixedPhotoPreview.addEventListener(

        ) {

/* =====================================================
   START PHOTOGRAPHY
   ===================================================== */

function startPhotography(
    onReady =
        null
) {

    if (
        !photographyInitialReady
    ) {

        setTimeout(
            () => {

                startPhotography(
                    onReady
                );

            },
            100
        );

        return;

    }

    activeMode =
        "photography";

    setPreviewTheme(
        "photography"
    );

    filmPlaybackMode =
        "auto";

    cancelFilmAutoClose();

    cancelPhotoSequence();

    filmVideo.pause();

    filmField
        .classList
        .remove(

        );

    refreshPhotographyDOMIfNeeded();

    photographyField
        .classList
        .add(

        );

    );

        "photography"
    );

/* =====================================================
   START FILM
   ===================================================== */

function startFilm(
    onReady =
        null,
    playbackMode =
        "auto"
) {

    cancelPhotoSequence();

    cancelFilmAutoClose();

    activeMode =
        "film";

    setPreviewTheme(
        "film"
    );

    filmPlaybackMode =
        playbackMode;

    const photographyVisible =
        photographyField
            .classList
            .contains(
                "active"
            );

    const revealFilm =
        () => {

            if (
                activeMode !==
                "film"
            ) {

                return;

            }

            photographyField
                .classList
                .remove(
                    "active"
                );

            switchToFilmLayer()
                .then(
                    () => {

                        if (
                            playbackMode ===
                            "auto"
                        ) {

                            scheduleAutomaticFilmClose();

                        }

                        if (
                            typeof onReady ===
                            "function"
                        ) {

                            onReady();

                        }

                    }
                );

        };

    if (
        photographyVisible &&
        playbackMode ===
            "hover"
    ) {

        /*
            Desktop hover handoff:
            switch the media layer immediately and let the
            title morph run at the same time. This prevents
            photography -> film from waiting for the full
            400 ms word animation before the video appears.
        */
        cancelPhotoSequence();

        clearSinglePhotographyPreview();

        setVisiblePhotoGroupCount(
            0
        );

        photographyField
            .classList
            .remove(
                "active"
            );

        filmField
            .classList
            .add(
                "active"
            );

        playFilmFromBeginning();

        animateTitlesTo(
            "film"
        );

        if (
            typeof onReady ===
                "function"
        ) {

            requestAnimationFrame(
                onReady
            );

        }

        return;

    }

    if (
        photographyVisible
    ) {

        animatePhotoGroups(
            0
        );

        animateTitlesTo(
            "film",
            revealFilm
        );

        return;

    }

    animateTitlesTo(
        "film",
        revealFilm
    );

}


/* =====================================================
   INTRO — LOGO

function introLogo() {

    if (
        introCancelled
    ) {

    introLogoCompleted =
        false;


    setLogoState(
        0
    );


    afterTwoPaints(
        () => {

            if (
                introCancelled
            ) {

                return;

            }


            animateLogoTo(
                5,
                () => {

                    if (
                        introCancelled
                    ) {

                        return;

                    }


                    introWait(
                        LOGO_INTRO_HOLD,
                        () => {

                            animateLogoTo(
                                0,
                                () => {

                                    if (
                                        introCancelled
                                    ) {

                                        return;

                                    }


                                    afterTwoPaints(
                                        () => {

                                            if (
                                                introCancelled
                                            ) {

                                                return;

                                            }


                                            introLogoCompleted =
                                                true;


                                            introWait(
                                                INTRO_AFTER_LOGO_DELAY,
                                                () => {
                                                    introFinished = true;
                                                }
                                            );

                                        }
                                    );

                                }
                            );

                        }
                    );

                }
            );

        }
    );

}

   INTRO — PHOTOGRAPHY

function introPhotography() {

    if (

/* =====================================================
   INTRO — FILM
   ===================================================== */

function introFilm() {

    if (
        introCancelled
    ) {

        return;

    }

    startFilm(
        null,
        "auto"
    );

}


function scheduleAutomaticIntroBoot() {

    if (
        introBootScheduled
    ) {

        return;

    }


    introBootScheduled =
        true;


    const boot =
        () => {

            if (
                introCancelled ||
                introStarted ||
                introFinished
            ) {

                return;

            }


            afterTwoPaints(
                () => {

                    if (
                        introCancelled ||
                        introStarted ||
                        introFinished
                    ) {

                        return;

                    }


                    scheduleAutomaticIntroBoot();

                }
            );

        };


    if (
        document.readyState ===
            "complete"
    ) {

        boot();

    }

    else {

        window.addEventListener(
            "load",
            boot,
            {
                once: true
            }
        );

    }

}


/* =====================================================
   INTRO START
   ===================================================== */

function startAutomaticIntro() {

    if (
        introStarted ||
        introFinished
    ) {

        return;

    }

    introStarted =
        true;

    introCancelled =
        false;

    introLogoCompleted =
        false;

    introWait(
        INTRO_INITIAL_DELAY,
        introLogo
    );

}


/* =====================================================
   CANCEL INTRO
   ===================================================== */

function cancelAutomaticIntroForInteraction() {

    if (
        introFinished
    ) {

        return;

    }

    introCancelled =
        true;

    introFinished =
        true;

    clearIntroTimer();

    cancelFilmAutoClose();

}


/* =====================================================
   VIDEO END
   ===================================================== */

filmVideo.addEventListener(
    "ended",
    async () => {

        if (
            activeMode !==
            "film"
        ) {

            return;

        }


        /*
            HOVER

            Hard cut back to beginning and keep playing.
        */

        if (
            filmPlaybackMode ===
            "hover" &&
            canHover() &&
            hoverMode ===
            "film"
        ) {

            await playFilmFromBeginning();

            return;

        }


        /*
            AUTOMATIC INTRO

            If the closing animation has already started,
            remove the video IMMEDIATELY when the actual
            clip reaches its end.

            This is the critical anti-freeze behaviour.

            The browser cannot leave its final frame
            sitting on screen while FILM -> film finishes.
        */

        if (
            filmPlaybackMode ===
            "auto" &&
            filmAutoCloseStarted
        ) {

            filmField
                .classList
                .remove(
                    "active"
                );

            clearPreviewTheme();

            return;

        }


        /*
            Safety fallback.

            If for some reason the rAF watcher never
            triggered the early title transition,
            close everything immediately.
        */

        if (
            filmPlaybackMode ===
            "auto"
        ) {

            cancelFilmAutoClose();

            filmField
                .classList
                .remove(
                    "active"
                );

            clearPreviewTheme();

            animateTitlesTo(
                null,
                () => {

                    activeMode =
                        null;

                    if (
                        !introCancelled
                    ) {

                        introFinished =
                            true;

                    }

                }
            );

        }

    }
);

function canHover() {

    return window
        .matchMedia(
            "(hover: hover) and (pointer: fine)"
        )
        .matches;

}

/* =====================================================
   MOBILE SECTION NAVIGATION

   Mobile only.

   Tapping "photography" or "film":

   1. cancels the automatic intro / hover state
   2. closes any visible or opening photography mosaic
   3. hides / pauses any visible film
   4. returns the Denizalp Aybak logo to its normal state
   5. morphs ONLY the tapped navigation word to uppercase
   6. holds that clean state briefly
   7. opens the corresponding section site

   No photography mosaic or film is opened as part of
   this tap gesture.
   ===================================================== */

function waitForMobileSectionNavigation(
    duration
) {

    return new Promise(
        resolve => {

            setTimeout(
                resolve,
                duration
            );

        }
    );

}


function animateTitlesToPromise(
    mode
) {

    return new Promise(
        resolve => {

            animateTitlesTo(
                mode,
                resolve
            );

        }
    );

}


function animateLogoToPromise(
    target
) {

    return new Promise(
        resolve => {

            animateLogoTo(
                target,
                resolve
            );

        }
    );

}


function closePhotographyForMobileNavigation() {

    return new Promise(
        resolve => {

            cancelPhotoSequence();

            if (
                photographyField
                    .classList
                    .contains(
                        "active"
                    )
            ) {

                animatePhotoGroups(
                    0,
                    () => {

                        photographyField
                            .classList
                            .remove(
                                "active"
                            );

                        setVisiblePhotoGroupCount(
                            0
                        );

                        resolve();

                    }
                );

                return;

            }

            setVisiblePhotoGroupCount(
                0
            );

            photographyField
                .classList
                .remove(
                    "active"
                );

            resolve();

        }
    );

}


async function navigateFromMobileSection(
    targetMode,
    destination
) {

    if (
        canHover() ||
        mobileSectionNavigationInProgress
    ) {

        return;

    }

    mobileSectionNavigationInProgress =
        true;

    clearPreviewTheme();

    /*
        Stop every automatic / interactive state first.
    */

    cancelAutomaticIntroForInteraction();

    clearIntroTimer();

    cancelFilmAutoClose();

    cancelPhotoSequence();

    hoverMode =
        null;

    filmPlaybackMode =
        "auto";

    /*
        The film must never remain visible during the
        navigation gesture, even when the user taps while
        it is opening or already playing.
    */

    filmVideo.pause();

    filmField
        .classList
        .remove(
            "active"
        );

    /*
        Resolve the visual states simultaneously:

        - mosaic closes
        - logo returns to normal
        - tapped word becomes uppercase
        - the other word returns to lowercase
    */

    const photographyClosing =
        closePhotographyForMobileNavigation();

    const logoReset =
        animateLogoToPromise(
            0
        );

    const titleTransition =
        animateTitlesToPromise(
            targetMode
        );

    await Promise.all(
        [
            photographyClosing,
            logoReset,
            titleTransition
        ]
    );

    activeMode =
        null;

    /*
        Give the user enough time to register the final
        uppercase state before navigation.
    */

    await waitForMobileSectionNavigation(
        MOBILE_SECTION_NAV_HOLD
    );

    window.location.href =
        destination;

}


photographyLink.addEventListener(
    "click",
    event => {

        if (
            canHover()
        ) {

            return;

        }

        event.preventDefault();

        navigateFromMobileSection(
            "photography",
            photographyLink.href
        );

    }
);


filmLink.addEventListener(

            filmLink.href
        );

    }
);


/* =====================================================
   LOGO
   ===================================================== */

const logo =
    document.getElementById(
        "logo"
    );

const logoName =
    document.getElementById(
        "logo-name"
    );

const logoLetters =
    [

        document.getElementById(
            "letter-a"
        ),

        document.getElementById(
            "letter-y"
        ),

        document.getElementById(
            "letter-b"
        ),

        document.getElementById(
            "letter-a2"
        ),

        document.getElementById(
            "letter-k"
        )

    ];

const logoLowercase =
    [
        "a",
        "y",
        "b",
        "a",
        "k"
    ];

const logoUppercase =
    [
        "A",
        "Y",
        "B",
        "A",
        "K"
    ];

let logoState =
    0;

let logoTarget =
    0;

let logoTimer =
    null;

let logoReturnTimer =
    null;


/* =====================================================
   LOGO STATE
   ===================================================== */

function setLogoState(
    state
) {

    logoState =
        Math.max(
            0,
            Math.min(
                5,
                state
            )
        );

    logoName.textContent =
        logoState ===
        0
            ? "Denizalp"
            : "denizalp";

    logoLetters.forEach(
        (
            letter,
            index
        ) => {

            letter.textContent =
                index <
                logoState
                    ? logoUppercase[
                        index
                    ]
                    : logoLowercase[
                        index
                    ];

        }
    );

}


/* =====================================================
   LOGO ANIMATION
   ===================================================== */

function animateLogoTo(
    target,
    callback =
        null
) {

    logoTarget =
        target;

    if (
        logoTimer !==
        null
    ) {

        clearTimeout(
            logoTimer
        );

        logoTimer =
            null;

    }

    function step() {

        if (
            logoState ===
            logoTarget
        ) {

            logoTimer =
                null;

            if (
                typeof callback ===
                "function"
            ) {

                callback();

            }

            return;

        }

        setLogoState(
            logoState <
            logoTarget
                ? logoState + 1
                : logoState - 1
        );

        logoTimer =
            setTimeout(
                step,
                LOGO_STEP_DURATION
            );

    }

    step();

}


/* =====================================================
   LOGO DESKTOP HOVER
   ===================================================== */

logo.addEventListener(

        );

);


logo.addEventListener(

        );

);
