    );

}


/* =====================================================
   PROJECT META HORIZONTAL
   ===================================================== */

function syncMetadataHorizontal() {

    /*
        Metadata no longer follows the rendered image width.
        The CSS outer grid is authoritative on every device:

        left  = Denizalp / contact axis (--side)
        right = FILM / INDEX axis (--side)

        Clear any legacy inline values that may have been written
        by an earlier render or responsive state.
    */
    projectMeta.style.left =
        "";


    projectMeta.style.right =
        "";


    projectMeta.style.width =
        "";

}


function syncMetadataAfterRender() {

    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                syncMetadataHorizontal
            );

        }
    );

}


/* =====================================================
   UPDATE METADATA
   ===================================================== */

async function updateMetadata(
    targetProjectIndex,
    targetFrameIndex
) {

    const project =
        projects[
            targetProjectIndex
        ];


    const projectChanged =
        renderedProjectIndex !==
        targetProjectIndex;


    renderBaseTypography(



        projectCounter,



        getProjectPhotoCountText(
            project.images.length
        )



    );


    projectCounter.dataset.rawText =
        projectCounter.textContent;


    if (
        projectChanged
    ) {

        await Promise.all(
            [

                morphSequential(
                    projectTitle,
                    project.title.toLowerCase(),
                    TEXT_MORPH_DURATION
                ),

                morphSequential(
                    projectDate,
                    (
                        project.date ||
                        ""
                    ).toLowerCase(),
                    TEXT_MORPH_DURATION
                )

            ]
        );

    }


    renderedProjectIndex =
        targetProjectIndex;

}


/* =====================================================
   PROJECT ROTATION HELPERS
   ===================================================== */

function shuffledCopy(
    values
) {

    const copy =
        values.slice();


    for (
        let i =
            copy.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }


    return copy;

}


function getSeenFrameSet(
    targetProjectIndex
) {

    const normalized =
        normalizeProjectIndex(
            targetProjectIndex
        );


    if (
        !seenFramesByProject.has(
            normalized
        )
    ) {

        seenFramesByProject.set(
            normalized,
            new Set()
        );

    }


    return seenFramesByProject.get(
        normalized
    );

}


function markFrameSeen(
    targetProjectIndex,
    targetFrameIndex
) {

    getSeenFrameSet(
        targetProjectIndex
    ).add(
        targetFrameIndex
    );

}


function buildNormalProjectSequence(
    targetProjectIndex,
    {
        includeFrame =
            null
    } = {}
) {

    const normalized =
        normalizeProjectIndex(
            targetProjectIndex
        );


    const project =
        projects[
            normalized
        ];


    const total =
        project.images.length;


    const limit =
        Math.min(
            NORMAL_PROJECT_FRAME_LIMIT,
            total
        );


    const seen =
        getSeenFrameSet(
            normalized
        );


    const selected =
        [];


    if (
        Number.isInteger(
            includeFrame
        ) &&
        includeFrame >= 0 &&
        includeFrame < total
    ) {

        selected.push(
            includeFrame
        );

    }


    const allFrames =
        Array.from(
            {
                length:
                    total
            },
            (
                _,
                index
            ) => index
        );


    /*
        First priority: frames this visitor has not seen yet.
        This guarantees that a leftover unseen frame is included
        on the next pass before any repeat is used.
    */
    const unseen =
        shuffledCopy(
            allFrames.filter(
                index =>
                    !seen.has(
                        index
                    ) &&
                    !selected.includes(
                        index
                    )
            )
        );


    while (
        selected.length < limit &&
        unseen.length
    ) {

        selected.push(
            unseen.shift()
        );

    }


    /*
        If fewer than 3 unseen frames remain, complete the pass with
        random repeats, without duplicating a frame inside one pass.
    */
    if (
        selected.length < limit
    ) {

        const repeats =
            shuffledCopy(
                allFrames.filter(
                    index =>
                        !selected.includes(
                            index
                        )
                )
            );


        while (
            selected.length < limit &&
            repeats.length
        ) {

            selected.push(
                repeats.shift()
            );

        }

    }


    /*
        The chosen frames are random, but their playback order follows
        the project's own frame order.

        Example:
            randomly chosen: 05, 07, 02
            playback:        02, 05, 07
    */
    selected.sort(
        (
            a,
            b
        ) =>
            a - b
    );


    normalSequenceProjectIndex =
        normalized;


    normalSequenceFrames =
        selected;


    normalSequencePosition =
        includeFrame !== null
            ? normalSequenceFrames.indexOf(
                includeFrame
            )
            : -1;


    return normalSequenceFrames;

}


function clearNormalSequence() {

    normalSequenceProjectIndex =
        null;


    normalSequenceFrames =
        [];


    normalSequencePosition =
        -1;

}


function enterFocusedProjectMode(
    targetProjectIndex
) {

    focusedProjectMode =
        true;


    focusedProjectIndex =
        normalizeProjectIndex(
            targetProjectIndex
        );


    clearNormalSequence();

}


function leaveFocusedProjectMode() {

    focusedProjectMode =
        false;


    focusedProjectIndex =
        null;


    clearNormalSequence();

}


/* =====================================================
   PRELOAD AHEAD
   ===================================================== */

function preloadAhead() {

    if (
        projects.length === 0
    ) {

        return;

    }


    const project =
        currentProject();


    for (
        let offset = 1;
        offset <= 4;
        offset++
    ) {

        const target =
            frameIndex +
            offset;


        if (
            target <
            project.images.length
        ) {

            preloadImage(
                project.images[
                    target
                ]
            ).catch(
                () => {}
            );

        }

    }


    const nextProject =
        projects[
            normalizeProjectIndex(
                projectIndex + 1
            )
        ];


    if (
        nextProject
    ) {

        preloadImage(
            nextProject.images[
                0
            ]
        ).catch(
            () => {}
        );

    }

}


/* =====================================================
   SHOW FRAME
   ===================================================== */

async function showFrame(
    targetProjectIndex,
    targetFrameIndex,
    urlMode =
        "push"
) {

    if (
        navigationAnimating
    ) {

        return false;

    }


    navigationAnimating =
        true;


    const normalizedProject =
        normalizeProjectIndex(
            targetProjectIndex
        );


    const project =
        projects[
            normalizedProject
        ];


    const normalizedFrame =
        Math.max(
            0,
            Math.min(
                targetFrameIndex,
                project.images.length - 1
            )
        );


    try {

        const loadedImage =
            await preloadImage(
                project.images[
                    normalizedFrame
                ]
            );


        projectIndex =
            normalizedProject;


        frameIndex =
            normalizedFrame;


        markFrameSeen(
            normalizedProject,
            normalizedFrame
        );


        syncProjectUrl(
            urlMode
        );


        renderImage(
            loadedImage
        );


        if (
            isPhoneLandscape()
        ) {

            updateLandscapeGeometry();

        }


        syncMetadataAfterRender();


        await updateMetadata(
            normalizedProject,
            normalizedFrame
        );


        preloadAhead();


        navigationAnimating =
            false;


        return true;

    }

    catch (error) {

        console.warn(
            error
        );


        navigationAnimating =
            false;


        return false;

    }

}


/* =====================================================
   NEXT
   ===================================================== */

async function nextFrame(
    urlMode =
        "push"
) {

    if (
        navigationAnimating ||
        projectAllMode
    ) {

        return;

    }


    const project =
        currentProject();


    /*
        INDEX / VIEW ALL focused mode:
        continue through every remaining frame in this project.
    */
    if (
        focusedProjectMode &&
        focusedProjectIndex ===
            projectIndex
    ) {

        if (
            frameIndex <
            project.images.length - 1
        ) {

            return showFrame(
                projectIndex,
                frameIndex + 1,
                urlMode
            );

        }


        /*
            The complete requested project is finished.
            The following project returns to normal max-3 rotation.
        */
        leaveFocusedProjectMode();


        const nextProjectIndex =
            normalizeProjectIndex(
                projectIndex + 1
            );


        const sequence =
            buildNormalProjectSequence(
                nextProjectIndex
            );


        normalSequencePosition =
            0;


        return showFrame(
            nextProjectIndex,
            sequence[0],
            urlMode
        );

    }


    /*
        Normal mode. If this is the first movement in the current
        project, build this pass around the frame already on screen.
    */
    if (
        normalSequenceProjectIndex !==
            projectIndex ||
        !normalSequenceFrames.includes(
            frameIndex
        )
    ) {

        buildNormalProjectSequence(
            projectIndex,
            {
                includeFrame:
                    frameIndex
            }
        );

    }


    normalSequencePosition =
        normalSequenceFrames.indexOf(
            frameIndex
        );


    if (
        normalSequencePosition >= 0 &&
        normalSequencePosition <
            normalSequenceFrames.length - 1
    ) {

        normalSequencePosition++;


        return showFrame(
            projectIndex,
            normalSequenceFrames[
                normalSequencePosition
            ],
            urlMode
        );

    }


    /*
        This project's maximum-three pass is complete.
        Build a fresh pass for the next project.
    */
    const nextProjectIndex =
        normalizeProjectIndex(
            projectIndex + 1
        );


    const nextSequence =
        buildNormalProjectSequence(
            nextProjectIndex
        );


    normalSequencePosition =
        0;


    return showFrame(
        nextProjectIndex,
        nextSequence[0],
        urlMode
    );

}


/* =====================================================
   PREVIOUS
   ===================================================== */

async function previousFrame(
    urlMode =
        "push"
) {

    if (
        navigationAnimating ||
        projectAllMode
    ) {

        return;

    }


    const project =
        currentProject();


    /*
        While a project was explicitly opened from INDEX / VIEW ALL,
        backwards navigation stays inside its full sequential run.
    */
    if (
        focusedProjectMode &&
        focusedProjectIndex ===
            projectIndex
    ) {

        if (
            frameIndex > 0
        ) {

            return showFrame(
                projectIndex,
                frameIndex - 1,
                urlMode
            );

        }


        leaveFocusedProjectMode();

    }


    if (
        normalSequenceProjectIndex ===
            projectIndex
    ) {

        const position =
            normalSequenceFrames.indexOf(
                frameIndex
            );


        if (
            position > 0
        ) {

            normalSequencePosition =
                position - 1;


            return showFrame(
                projectIndex,
                normalSequenceFrames[
                    normalSequencePosition
                ],
                urlMode
            );

        }

    }


    /*
        Crossing backwards into another project creates a normal
        max-3 pass there and lands on its last selected frame.
    */
    const previousProjectIndex =
        normalizeProjectIndex(
            projectIndex - 1
        );


    const sequence =
        buildNormalProjectSequence(
            previousProjectIndex
        );


    normalSequencePosition =
        sequence.length - 1;


    return showFrame(
        previousProjectIndex,
        sequence[
            normalSequencePosition
        ],
        urlMode
    );

}


/* =====================================================
   AUTOPLAY
   ===================================================== */

function scheduleNextSlide() {

    clearTimeout(
        slideTimer
    );


    if (
        autoplayPermanentlyDisabled ||
        manualMode ||
        indexMode ||
        projectAllMode
    ) {

        return;

    }


    slideTimer =
        setTimeout(
            async () => {

                await nextFrame(
                    "replace"
                );


                scheduleNextSlide();

            },
            SLIDE_DURATION
        );

}


function startAutoSlideshow() {

    if (
        autoplayPermanentlyDisabled
    ) {

        manualMode =
            true;


        clearTimeout(
            slideTimer
        );


        return;

    }


    manualMode =
        false;


    scheduleNextSlide();

}


function stopAutoSlideshow() {

    autoplayPermanentlyDisabled =
        true;


    manualMode =
        true;


    clearTimeout(
        slideTimer
    );

}


/* =====================================================
   PRIMARY ACTION
   ===================================================== */

async function performPrimarySlideAction() {

    if (
        indexMode ||
        projectAllMode ||
        interfaceAnimating ||
        navigationAnimating ||
        projectViewAnimating
    ) {

        return;

    }


    if (
        !manualMode
    ) {

        stopAutoSlideshow();


        return;

    }


    await nextFrame();

}


/* =====================================================
   VIEW ALL BOUNDS

   More aggressive use of the safe space.

   Still respects:
   - contact block
   - metadata
   - outer site margins
   ===================================================== */

function syncProjectAllBounds(
    force =
        false
) {

    if (
        !projectAllMode &&
        !force
    ) {

        return;

    }


    const infoRect =
        info.getBoundingClientRect();


    const metaRect =
        projectMeta.getBoundingClientRect();


    const rootStyle =
        getComputedStyle(
            document.documentElement
        );


    const side =
        parseFloat(
            rootStyle.getPropertyValue(
                "--side"
            )
        ) || 24;


    /*
        Smaller gaps than before.

        This gives the contact sheet substantially
        more usable area without allowing collisions.
    */

    let topGap =
        14;


    let bottomGap =
        14;


    if (
        isPhonePortrait()
    ) {

        topGap =
            10;


        bottomGap =
            10;

    }


    if (
        isPhoneLandscape()
    ) {

        /*
            Very short viewport:
            use almost the full safe window.
        */

        topGap =
            4;


        bottomGap =
            6;

    }


    const top =
        Math.ceil(
            infoRect.bottom +
            topGap
        );


    const bottom =
        Math.floor(
            metaRect.top -
            bottomGap
        );


    /*
        Also use the horizontal space slightly more
        aggressively.

        Still never crosses the site margins.
    */

    const horizontalInset =
        isPhoneLayout()
            ? 0
            : 0;


    projectAllView.style.left =
        `${side + horizontalInset}px`;


    projectAllView.style.right =
        `${side + horizontalInset}px`;


    projectAllView.style.top =
        `${top}px`;


    projectAllView.style.height =
        `${Math.max(
            80,
            bottom - top
        )}px`;

}


/* =====================================================
   VIEW ALL GRID LAYOUT

   Improved scoring:

   More emphasis on using available space.
   ===================================================== */

function calculateProjectAllLayout(
    count
) {

    const rect =
        projectAllView
            .getBoundingClientRect();

    const gap =
        isPhoneLandscape()
            ? 4
            : (
                isPhonePortrait()
                    ? 5
                    : 7
            );

    /*
        Score each possible grid by the ACTUAL visible image area,
        rather than by square-cell size. This makes small sets such as
        three portrait frames naturally choose a single horizontal row,
        while larger / mixed-orientation projects still choose the layout
        that uses the available viewport most efficiently.
    */
    const loadedRatios =
        Array.from(
            projectAllGrid.querySelectorAll("img")
        )
        .slice(0, count)
        .map(img =>
            (img.naturalWidth && img.naturalHeight)
                ? img.naturalWidth / img.naturalHeight
                : 0.8
        );

    let best = {
        columns: 1,
        rows: count,
        score: -Infinity
    };

    for (let columns = 1; columns <= count; columns++) {
        const rows = Math.ceil(count / columns);

        const usableWidth =
            rect.width - gap * (columns - 1);

        const usableHeight =
            rect.height - gap * (rows - 1);

        if (usableWidth <= 0 || usableHeight <= 0) {
            continue;
        }

        const cellWidth = usableWidth / columns;
        const cellHeight = usableHeight / rows;

        let visibleArea = 0;

        loadedRatios.forEach(ratio => {
            const displayWidth = Math.min(
                cellWidth,
                cellHeight * ratio
            );

            const displayHeight =
                displayWidth / ratio;

            visibleArea +=
                displayWidth * displayHeight;
        });

        /*
            A tiny orphan-cell penalty breaks near-ties in favour of
            balanced grids without overpowering the actual image area.
        */
        const emptyCells =
            rows * columns - count;

        const score =
            visibleArea * Math.pow(0.985, emptyCells);

        if (score > best.score) {
            best = { columns, rows, score };
        }
    }

    return best;
}


function layoutProjectAllGrid(
    force =
        false
) {

    if (
        !projectAllMode &&
        !force
    ) {

        return;

    }


    syncProjectAllBounds(
        force
    );


    const layout =
        calculateProjectAllLayout(
            currentProject()
                .images
                .length
        );


    projectAllGrid.style.gridTemplateColumns =
        `repeat(${layout.columns}, minmax(0, 1fr))`;


    projectAllGrid.style.gridTemplateRows =
        `repeat(${layout.rows}, minmax(0, 1fr))`;

}

   BUILD VIEW ALL
   ===================================================== */

function buildProjectAllGrid() {

    const project =
        currentProject();


    projectAllGrid.innerHTML =
        "";


    project.images.forEach(
        (
            filename,
            index
        ) => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "project-all-thumb";


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                getPhotoThumbnailUrl(
                    filename
                );


            img.alt =
                "";


            img.loading =
                "eager";


            img.decoding =
                "async";


            /*
                The first few frames are usually already in
                imageCache because of preloadAhead(). Keep
                the remainder at normal priority so opening
                View All does not starve the UI thread.
            */
            img.fetchPriority =
                index < 4
                    ? "high"
                    : "auto";


            button.appendChild(
                img
            );


            button.addEventListener(
                "click",
                async event => {

                    event.stopPropagation();


                    await exitProjectAllToFrame(
                        index
                    );

                }
            );


            projectAllGrid.appendChild(
                button
            );

        }
    );

}

/* =====================================================
   INDEX SORT
   ===================================================== */

function getChronologicalProjects() {

    return projects
        .map(
            (
                project,
                originalIndex
            ) => ({
                project,
                originalIndex
            })
        )
        .sort(
            (
                a,
                b
            ) => {

                const dateA =
                    a.project.sortDate ||
                    "";


                const dateB =
                    b.project.sortDate ||
                    "";


                if (
                    dateA > dateB
                ) {

                    return -1;

                }


                if (
                    dateA < dateB
                ) {

                    return 1;

                }


                return (
                    a.originalIndex -
                    b.originalIndex
                );

            }
        );

}


/* =====================================================
   INDEX CARD CASE CONTROLLER
   ===================================================== */

function createCaseController(
    element,
    baseText
) {

    const base =
        String(
            baseText
        ).toLowerCase();


    const positions =
        getMorphPositions(
            base
        );


    const total =
        positions.length;


    let state =
        0;


    let frameId =
        null;


    function render() {

        const activePositions =
            new Set(
                positions.slice(
                    0,
                    state
                )
            );


        renderInteractiveTypography(
            element,
            renderCaseFromActivePositions(
                base,
                activePositions
            ),
            activePositions
        );

    }


    function animateTo(
        target
    ) {

        if (
            frameId !== null
        ) {

            cancelAnimationFrame(
                frameId
            );

        }


        const startState =
            state;


        if (
            startState === target
        ) {

            render();


            return;

        }


        const start =
            performance.now();


        function frame(
            now
        ) {

            const progress =
                Math.min(
                    1,
                    (
                        now -
                        start
                    ) /
                    CASE_DURATION
                );


            state =
                Math.round(
                    startState +
                    (
                        target -
                        startState
                    ) *
                    progress
                );


            render();


            if (
                progress < 1
            ) {

                frameId =
                    requestAnimationFrame(
                        frame
                    );

            }

            else {

                state =
                    target;


                render();


                frameId =
                    null;

            }

        }


        frameId =
            requestAnimationFrame(
                frame
            );

    }


    render();


    return {

        upper() {

            animateTo(
                total
            );

        },

        lower() {

            animateTo(
                0
            );

        }

    };

}


/* =====================================================
   INDEX GEOMETRY
   ===================================================== */

/*
    Same visual logic as the film index:

    - every project owns the same invisible media stage height
    - portrait images can use almost all of that height
    - landscape images are width-limited instead of becoming tiny
    - the actual image is vertically centered inside the common stage
    - title/date always begin after the common stage
*/

function clampNumber(
    value,
    min,
    max
) {

    return Math.min(
        max,
        Math.max(
            min,
            value
        )
    );

}


function getPhotoIndexGeometry() {

    if (
        isPhonePortrait()
    ) {

        return {

            mediaHeight:
                clampNumber(
                    window.innerHeight * 0.31,
                    230,
                    285
                ),

            maxLandscapeWidth:
                window.innerWidth * 0.50

        };

    }


    if (
        isPhoneLandscape()
    ) {

        /*
            IMPORTANT:
            Landscape already has a dedicated safe-area calculation
            in updateLandscapeGeometry().

            That function computes the exact image height that fits:
                info/contact block
                +
                thumbnail
                +
                two caption lines
                +
                INDEX button

            The previous index rewrite ignored that calculated value
            and introduced a second viewport-based height. On some
            landscape phones that second value was taller than the
            actual available space, so the whole card was vertically
            clipped by the index viewport. It looked like the JPEG
            itself was cropped, and the date disappeared below the
            viewport.

            Use the ONE authoritative landscape height here.
        */

        const computed =
            getComputedStyle(
                document.documentElement
            );


        const safeMediaHeight =
            parseFloat(
                computed.getPropertyValue(
                    "--landscape-index-image-height"
                )
            ) || 136;


        const safeCardWidth =
            parseFloat(
                computed.getPropertyValue(
                    "--landscape-index-card-width"
                )
            ) || 205;


        return {

            mediaHeight:
                safeMediaHeight,

            /*
                Keep landscape images broad enough to have the same
                visual weight as the film index, but NEVER wider than
                the safe card produced by updateLandscapeGeometry().
            */

            maxLandscapeWidth:
                Math.min(
                    safeCardWidth,
                    Math.max(
                        138,
                        safeMediaHeight * 1.05
                    )
                ),

            cardWidth:
                safeCardWidth

        };

    }


    return {

        mediaHeight:
            clampNumber(
                window.innerHeight * 0.395,
                320,
                430
            ),

        maxLandscapeWidth:
            Math.min(
                window.innerWidth * 0.33,
                540
            )

    };

}


function getPhotoIndexItemMetrics(
    ratio
) {

    const geometry =
        getPhotoIndexGeometry();


    let displayHeight =
        geometry.mediaHeight;


    let displayWidth =
        displayHeight *
        ratio;


    if (
        displayWidth >
        geometry.maxLandscapeWidth
    ) {

        displayWidth =
            geometry.maxLandscapeWidth;


        displayHeight =
            displayWidth /
            ratio;

    }


    return {

        mediaHeight:
            geometry.mediaHeight,

        displayWidth,

        displayHeight

    };

}


function syncPhotoIndexCardSize(
    img,
    button,
    wrap
) {

    if (
        !img.naturalWidth ||
        !img.naturalHeight
    ) {

        return;

    }


    const ratio =
        img.naturalWidth /
        img.naturalHeight;


    const metrics =
        getPhotoIndexItemMetrics(
            ratio
        );


    const width =
        Math.max(
            1,
            Math.round(
                metrics.displayWidth
            )
        );


    const height =
        Math.max(
            1,
            Math.round(
                metrics.displayHeight
            )
        );


    const mediaHeight =
        Math.max(
            height,
            Math.round(
                metrics.mediaHeight
            )
        );


    const geometry =
        getPhotoIndexGeometry();


    const cardWidth =
        isPhoneLandscape()
            ? Math.max(
                width,
                geometry.cardWidth ||
                    width
            )
            : width;


    button.style.width =
        `${cardWidth}px`;

    button.style.flex =
        `0 0 ${cardWidth}px`;

    button.style.minWidth =
        `${cardWidth}px`;

    button.style.maxWidth =
        `${cardWidth}px`;


    wrap.style.width =
        `${cardWidth}px`;

    wrap.style.height =
        `${mediaHeight}px`;

    wrap.style.flexBasis =
        `${mediaHeight}px`;


    /*
        IMPORTANT:
        Never force both pixel width AND pixel height on index images.

        Some portrait files can carry orientation / rendering metadata
        that makes an explicit width+height pair look visually cropped
        on mobile landscape.

        The wrapper already defines the exact available media area.
        Let the browser preserve the image's intrinsic aspect ratio and
        fit the whole frame inside that area.
    */

    img.style.width =
        "auto";

    img.style.height =
        "auto";

    img.style.maxWidth =
        "100%";

    img.style.maxHeight =
        "100%";

    img.style.objectFit =
        "contain";


    if (
        isPhoneLandscape()
    ) {

        const previewOffset =
            Math.max(
                0,
                (
                    cardWidth -
                    width
                ) / 2
            );


        button.style.setProperty(
            "--landscape-preview-offset",
            button ===
                indexGrid.firstElementChild
                    ? "0px"
                    : `${previewOffset}px`
        );

    }

    else {

        button.style.removeProperty(
            "--landscape-preview-offset"
        );

    }

}


function resizePhotoIndexCards() {

    document
        .querySelectorAll(
            ".project-card"
        )
        .forEach(
            card => {

                const img =
                    card.querySelector(
                        ".card-image-wrap img"
                    );


                const wrap =
                    card.querySelector(
                        ".card-image-wrap"
                    );


                if (
                    img &&
                    wrap &&
                    img.naturalWidth &&
                    img.naturalHeight
                ) {

                    syncPhotoIndexCardSize(
                        img,
                        card,
                        wrap
                    );

                }

            }
        );

}


/* =====================================================
   BUILD TYPOGRAPHIC INDEX
   ===================================================== */

function resetIndexSelection() {

    selectedIndexProject =
        null;


    indexProjectRows.forEach(
        rowState => {

            rowState.titleCase.lower();
            rowState.dateCase.lower();

        }
    );


    indexPreview.classList.remove(
        "visible"
    );


    indexPreview.setAttribute(
        "aria-hidden",
        "true"
    );


    indexProjectAction.classList.remove(
        "visible"
    );


    indexProjectAction.setAttribute(
        "aria-hidden",
        "true"
    );


    indexPreviewImage.removeAttribute(
        "src"
    );


    indexProjectCount.textContent =
        "";


    indexProjectCount.dataset.rawText =
        "";


    if (
        indexViewAllCase
    ) {

        indexViewAllCase.lower();

    }

}


function layoutTypographicIndex() {

    if (
        !indexGrid ||
        !indexScroller
    ) {

        return;

    }


    const total =
        indexProjectRows.length;


    if (
        total === 0
    ) {

        return;

    }


    const computed =
        getComputedStyle(
            document.documentElement
        );


    const fontSize =
        parseFloat(
            computed.getPropertyValue(
                "--font-size"
            )
        ) || 13;


    const lineHeightMultiplier =
        parseFloat(
            computed.getPropertyValue(
                "--line-height"
            )
        ) || 1.15;


    const lineHeight =
        fontSize *
        lineHeightMultiplier;


    const gridComputed =
        getComputedStyle(
            indexGrid
        );


    const edgeGap =
        parseFloat(
            gridComputed.getPropertyValue(
                "--index-list-edge-gap"
            )
        ) || lineHeight;


    const minimumGap =
        lineHeight;


    body.classList.remove(
        "index-needs-scroll"
    );


    indexProjectRows.forEach(
        state => {

            state.row.style.removeProperty(
                "grid-column"
            );


            state.row.style.removeProperty(
                "grid-row"
            );

        }
    );


    /* =================================================
       PHONES — PORTRAIT + LANDSCAPE
       Always one text column: client/project on top,
       date directly below. Rows breathe as much as the
       viewport allows; once the gap would fall below one
       text line, the list becomes vertically scrollable.
       ================================================= */

    if (
        isPhoneLayout()
    ) {

        indexGrid.style.removeProperty(
            "--index-row-count"
        );


        indexGrid.style.removeProperty(
            "--index-column-count"
        );


        const availableHeight =
            Math.max(
                1,
                indexScroller.clientHeight -
                edgeGap * 2
            );


        const rowHeights =
            indexProjectRows.map(
                state =>
                    Math.max(
                        state.row.scrollHeight,
                        lineHeight * 2
                    )
            );


        const occupiedHeight =
            rowHeights.reduce(
                (
                    sum,
                    value
                ) =>
                    sum + value,
                0
            );


        const gapCount =
            Math.max(
                0,
                total - 1
            );


        const idealGap =
            gapCount
                ? (
                    availableHeight -
                    occupiedHeight
                ) /
                gapCount
                : 0;


        const needsScroll =
            gapCount > 0 &&
            idealGap <
            minimumGap;


        const rowGap =
            gapCount
                ? (
                    needsScroll
                        ? minimumGap
                        : Math.max(
                            minimumGap,
                            idealGap
                        )
                )
                : 0;


        indexGrid.style.setProperty(
            "--index-portrait-gap",
            `${rowGap}px`
        );


        body.classList.toggle(
            "index-needs-scroll",
            needsScroll
        );

        requestAnimationFrame(
            placeIndexScrollHintInLastVisibleSlot
        );

        return;

    }


    /* =================================================
       DESKTOP + MOBILE LANDSCAPE
       Text occupies the left field, preview the right.
       Use as many columns as comfortably fit that field,
       never fewer than two when two are possible.
       If the resulting rows cannot keep a one-line gap,
       the text field scrolls vertically.
       ================================================= */

    const usableWidth =
        Math.max(
            1,
            indexScroller.clientWidth
        );


    const widestProjectText =
        Math.max(
            1,
            ...indexProjectRows.map(
                state =>
                    Math.max(
                        state.titleButton.scrollWidth,
                        state.dateButton.scrollWidth
                    )
            )
        );


    const columnGap =
        Math.max(
            22,
            Math.min(
                72,
                usableWidth * 0.06
            )
        );


    const preferredColumnWidth =
        widestProjectText +
        Math.max(
            18,
            fontSize * 1.25
        );


    const maxColumnsByWidth =
        Math.max(
            1,
            Math.floor(
                (
                    usableWidth +
                    columnGap
                ) /
                (
                    preferredColumnWidth +
                    columnGap
                )
            )
        );


    const minimumColumns =
        total > 1 &&
        maxColumnsByWidth >= 2
            ? 2
            : 1;


    const columnCount =
        Math.max(
            minimumColumns,
            Math.min(
                total,
                maxColumnsByWidth
            )
        );


    const rowCount =
        Math.ceil(
            total /
            columnCount
        );


    const itemHeight =
        lineHeight * 2;


    const availableHeight =
        Math.max(
            1,
            indexScroller.clientHeight -
            edgeGap * 2
        );


    const occupiedHeight =
        rowCount *
        itemHeight;


    const gapCount =
        Math.max(
            0,
            rowCount - 1
        );


    const idealGap =
        gapCount
            ? (
                availableHeight -
                occupiedHeight
            ) /
            gapCount
            : 0;


    const needsScroll =
        gapCount > 0 &&
        idealGap <
        minimumGap;


    const rowGap =
        gapCount
            ? (
                needsScroll
                    ? minimumGap
                    : Math.max(
                        minimumGap,
                        idealGap
                    )
            )
            : 0;


    indexGrid.style.setProperty(
        "--index-row-count",
        String(rowCount)
    );


    indexGrid.style.setProperty(
        "--index-column-count",
        String(columnCount)
    );


    indexGrid.style.setProperty(
        "--index-column-gap",
        `${columnGap}px`
    );


    indexGrid.style.setProperty(
        "--index-row-gap",
        `${rowGap}px`
    );


    body.classList.toggle(
        "index-needs-scroll",
        needsScroll
    );


    indexProjectRows.forEach(
        (
            state,
            itemIndex
        ) => {

            const columnIndex =
                Math.floor(
                    itemIndex /
                    rowCount
                );


            const localRow =
                itemIndex %
                rowCount;


            state.row.style.gridColumn =
                String(
                    columnIndex + 1
                );


            state.row.style.gridRow =
                String(
                    localRow + 1
                );

        }
    );

}

function selectIndexProject(
    rowState
) {

    if (
        !rowState
    ) {

        return;

    }


    const previousSelection =
        selectedIndexProject;

    

    selectedIndexProject =
        rowState;


    indexProjectRows.forEach(
        state => {

            if (
                state === rowState
            ) {

                state.titleCase.upper();
                state.dateCase.upper();

            }

            else {

                state.titleCase.lower();
                state.dateCase.lower();

            }

        }
    );


    const project =
        rowState.project;


    const previewUrl =
        getPhotoThumbnailUrl(
            project.cover ||
            project.images[0]
        );


    if (
        indexPreviewImage.src !==
        previewUrl
    ) {

        indexPreviewImage.src =
            previewUrl;

    }


    indexPreview.classList.add(
        "visible"
    );


    indexPreview.setAttribute(
        "aria-hidden",
        "false"
    );


    const photoCount =
        project.images.length;


    const nextViewText =
        getViewVerbText(
            photoCount
        );


    if (
        previousSelection &&
        previousSelection !== rowState &&
        indexProjectViewAll.textContent
    ) {

        morphSequential(
            indexProjectViewAll,
            nextViewText,
            STATE_MORPH_DURATION
        ).catch(
            () => {}
        );

    }

    else {

        renderBaseTypography(
            indexProjectViewAll,
            nextViewText
        );


        indexProjectViewAll.dataset.rawText =
            nextViewText;

    }


    const nextCountText =
        getPhotoCountText(
            photoCount
        );


    if (
        previousSelection &&
        previousSelection !== rowState &&
        indexProjectCount.textContent
    ) {

        morphSequential(
            indexProjectCount,
            nextCountText,
            STATE_MORPH_DURATION
        ).catch(
            () => {}
        );

    }

    else {

        renderBaseTypography(
            indexProjectCount,
            nextCountText
        );


        indexProjectCount.dataset.rawText =
            nextCountText;

    }


    indexProjectAction.classList.add(
        "visible"
    );


    indexProjectAction.setAttribute(
        "aria-hidden",
        "false"
    );


    if (
        indexViewAllCase
    ) {

        indexViewAllCase.lower();

    }

}


function buildIndex() {

    indexGrid.innerHTML =
        "";


    indexProjectRows =
        [];


    resetIndexSelection();


    getChronologicalProjects()
        .forEach(
            item => {

                const project =
                    item.project;


                const originalIndex =
                    item.originalIndex;


                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "index-project-row";


                const titleButton =
                    document.createElement(
                        "button"
                    );


                titleButton.type =
                    "button";


                titleButton.className =
                    "index-project-title";


                const titleBase =
                    project.title.toLowerCase();


                renderBaseTypography(
                    titleButton,
                    titleBase
                );


                const dateButton =
                    document.createElement(
                        "button"
                    );


                dateButton.type =
                    "button";


                dateButton.className =
                    "index-project-date";


                const dateBase =
                    (
                        project.date ||
                        ""
                    ).toLowerCase();


                renderBaseTypography(
                    dateButton,
                    dateBase
                );


                const rowState =
                    {
                        row,
                        project,
                        originalIndex,
                        titleButton,
                        dateButton,
                        titleCase:
                            createCaseController(
                                titleButton,
                                titleBase
                            ),
                        dateCase:
                            createCaseController(
                                dateButton,
                                dateBase
                            )
                    };


                indexProjectRows.push(
                    rowState
                );


                [
                    titleButton,
                    dateButton
                ].forEach(
                    button => {

                        button.addEventListener(
                            "mouseenter",
                            () => {

                                if (
                                    !window.matchMedia(
                                        "(hover: hover)"
                                    ).matches
                                ) {

                                    return;

                                }


                                selectIndexProject(
                                    rowState
                                );

                            }
                        );


                        button.addEventListener(
                            "focus",
                            () => {

                                if (
                                    !window.matchMedia(
                                        "(hover: hover)"
                                    ).matches
                                ) {

                                    return;

                                }


                                selectIndexProject(
                                    rowState
                                );

                            }
                        );


                        button.addEventListener(
                            "click",
                            async event => {

                                event.stopPropagation();


                                /*
                                   Mouse/trackpad: one click always opens.
                                   Touch: first tap selects/previews, second
                                   tap on the same project opens View All.
                                */
                                /*
                                   Only phone portrait keeps the deliberate
                                   two-tap pattern. Desktop and landscape
                                   open View All on the first click/tap.
                                */
                                const mobileTwoTap =
                                    isPhoneLayout();


                                if (
                                    !mobileTwoTap
                                ) {

                                    selectIndexProject(
                                        rowState
                                    );


                                    /* Let selection state settle before the
                                       View All transition guard is checked. */
                                    await new Promise(
                                        resolve =>
                                            requestAnimationFrame(
                                                resolve
                                            )
                                    );


                                    await openSelectedIndexProjectAll();

                                }

                                else if (
                                    selectedIndexProject ===
                                    rowState
                                ) {

                                    await openSelectedIndexProjectAll();

                                }

                                else {

                                    selectIndexProject(
                                        rowState
                                    );

                                }

                            }
                        );

                    }
                );


                row.append(
                    titleButton,
                    dateButton
                );


                indexGrid.appendChild(
                    row
                );

            }
        );


    requestAnimationFrame(
        layoutTypographicIndex
    );

}


/* =====================================================
   WORD CASE
   ===================================================== */

function renderWordCase(
    word,
    upperCount
) {

    let result =
        "";


    for (
        let i = 0;
        i < word.length;
        i++
    ) {

        result +=
            i < upperCount
                ? word[i].toUpperCase()
                : word[i].toLowerCase();

    }


    return result;

}


/* =====================================================
   INDEX WORD
   ===================================================== */

const indexWord =
    "index";


let indexWordState =
    0;


let indexWordFrame =
    null;


function renderIndexWord(
    state
) {

    indexWordState =
        state;


    renderInteractiveTypography(
        indexButton,
        renderWordCase(
            indexWord,
            state
        ),
        new Set(
            getLetterPositions(
                indexWord
            ).slice(
                0,
                state
            )
        )
    );

}


/* =====================================================
   INDEX MORPH
   ===================================================== */

function morphIndexTo(
    target
) {

    if (
        indexWordFrame !== null
    ) {

        cancelAnimationFrame(
            indexWordFrame
        );

    }


    const startState =
        indexWordState;


    if (
        startState === target
    ) {

        renderIndexWord(
            target
        );


        return Promise.resolve();

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        INDEX_TRANSITION_DURATION
                    );


                const state =
                    Math.round(
                        startState +
                        (
                            target -
                            startState
                        ) *
                        progress
                    );


                renderIndexWord(
                    state
                );


                if (
                    progress < 1
                ) {

                    indexWordFrame =
                        requestAnimationFrame(
                            frame
                        );

                }

                else {

                    renderIndexWord(
                        target
                    );


                    indexWordFrame =
                        null;


                    resolve();

                }

            }


            indexWordFrame =
                requestAnimationFrame(
                    frame
                );

        }
    );

}

/* =====================================================
   INDEX POSITION
   ===================================================== */

function saveIndexPosition() {

    savedIndexScrollTop =
        0;

}


function restoreIndexPosition() {

    requestAnimationFrame(
        () => {

            indexScroller.scrollTop =
                0;

        }
    );

}


/* =====================================================
   ENTER INDEX
   ===================================================== */

async function enterIndex(
    {
        preserveSelection = false
    } = {}
) {

    if (
        indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    /*
        INDEX is an explicit interaction.
        From this point on the initial autoplay may never resume.
    */
    stopAutoSlideshow();


    updateIndexContentTop();


    if (
        isPhoneLandscape()
    ) {

        updateLandscapeGeometry();

    }


    indexMode =
        true;

    resetIndexScrollHint();


    body.classList.add(
        "index-mode"
    );


    indexView.classList.add(
        "visible"
    );


    restoreIndexPosition();


    layoutTypographicIndex();


    if (
        !preserveSelection
    ) {

        resetIndexSelection();

    }

    else if (
        selectedIndexProject
    ) {

        selectIndexProject(
            selectedIndexProject
        );

    }


    /* The INDEX word morph is cosmetic; unlock the list immediately. */
    morphIndexTo(
        indexWord.length
    );


    indexScroller.focus(
        {
            preventScroll: true
        }
    );


    interfaceAnimating =
        false;

}


/* =====================================================
   VIEW ALL -> INDEX
   ===================================================== */

async function enterIndexFromProjectAll() {

    if (
        projectViewAnimating ||
        interfaceAnimating
    ) {

        return;

    }


    await leaveProjectAll(
        {
            resume: false
        }
    );


    await enterIndex();

}


/* =====================================================
   RETURN FROM INDEX
   ===================================================== */

async function returnFromIndex() {

    if (
        !indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    saveIndexPosition();


    resetIndexSelection();


    await morphIndexTo(
        0
    );


    indexView.classList.remove(
        "visible"
    );


    indexMode =
        false;


    body.classList.remove(
        "index-mode"
    );


    updateResponsiveMode();


    syncMetadataAfterRender();


    /*
        Leaving INDEX always returns to a manual slideshow.
    */
    manualMode =
        true;


    clearTimeout(
        slideTimer
    );


    interfaceAnimating =
        false;

}


/* =====================================================
   INDEX -> PROJECT VIEW ALL
   ===================================================== */

async function openSelectedIndexProjectAll() {

    if (
        !indexMode ||
        !selectedIndexProject ||
        interfaceAnimating ||
        projectViewAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    stopAutoSlideshow();
    saveIndexPosition();


    projectAllOpenedFromIndex =
        true;


    indexSelectionBeforeProjectAll =
        selectedIndexProject;


    const targetProjectIndex =
        selectedIndexProject.originalIndex;


    const targetProject =
        projects[
            normalizeProjectIndex(
                targetProjectIndex
            )
        ];


    try {

        /*
            Load and prepare the selected project while INDEX is still
            covering the page. This prevents a slideshow frame from
            flashing between INDEX and VIEW ALL.
        */
        const loadedImage =
            await preloadImage(
                targetProject.images[0]
            );


        projectIndex =
            normalizeProjectIndex(
                targetProjectIndex
            );


        frameIndex =
            0;


        enterFocusedProjectMode(
            projectIndex
        );


        markFrameSeen(
            projectIndex,
            0
        );


        syncProjectUrl(
            "push"
        );


        renderImage(
            loadedImage
        );


        syncMetadataAfterRender();


        await updateMetadata(
            projectIndex,
            0
        );


        prepareProjectAllGrid();


        viewAllButton.dataset.rawText =
            viewAllButton.textContent;


        projectCounter.dataset.rawText =
            projectCounter.textContent;


        await morphIndexTo(
            0
        );


        indexView.classList.remove(
            "visible"
        );


        indexMode =
            false;


        body.classList.remove(
            "index-mode"
        );


        projectAllMode =
            true;


        body.classList.remove(
            "project-all-preparing"
        );


        body.classList.add(
            "project-all-mode"
        );


        const project =
            currentProject();


        await Promise.all(
            [
                animateCase(
                    projectTitle,
                    project.title,
                    true
                ),

                animateCase(
                    projectDate,
                    project.date || "",
                    true
                ),

                morphSequential(
                    projectCounter,
                    getAllCounterText(
                        project.images.length
                    ),
                    STATE_MORPH_DURATION
                ),

                morphSequential(
                    viewAllButton,
                    "close",
                    STATE_MORPH_DURATION
                )
            ]
        );


        manualMode =
            true;


        clearTimeout(
            slideTimer
        );


        preloadAhead();

    }

    catch (error) {

        console.warn(
            error
        );

    }


    interfaceAnimating =
        false;

}

/* =====================================================
   MOBILE INDEX CONTINUATION CUE

   No textual hint and no row clipping. The list remains a completely native
   scroll surface from the first touch. CSS supplies the bottom fade while
   more projects remain; the existing scroll listener dismisses it at the end.
   ===================================================== */

function clearIndexScrollHintHost() {
    /* intentionally empty: never mutate rows during a touch gesture */
}

function placeIndexScrollHintInLastVisibleSlot() {
    /* intentionally empty: continuation is represented only by the fade */
}

function resetIndexScrollHint() {
    body.classList.remove("index-scroll-hint-dismissed");
}

function dismissIndexScrollHint() {
    if (
        !indexMode ||
        !body.classList.contains("index-needs-scroll")
    ) {

    }

}

/* =====================================================
   INDEX SCROLL / AYBAK BOUNDARY

   A scrollable index consumes the current gesture first.
   AYBAK can open only from a NEW downward gesture that
   STARTS while the list is already at its bottom boundary.
   This prevents trackpad momentum from accidentally opening
   the black page as the list reaches its end.
   ===================================================== */

const INDEX_BOUNDARY_WHEEL_THRESHOLD =
    48;


const INDEX_NEW_GESTURE_GAP =
    190;


function indexCanScrollVertically() {

    return (
        indexScroller.scrollHeight -
        indexScroller.clientHeight
    ) > 2;

}


function indexIsAtBottom() {

    return (
        indexScroller.scrollTop +
        indexScroller.clientHeight
    ) >=
    (
        indexScroller.scrollHeight -
        2
    );

}


indexScroller.addEventListener(
    "wheel",
    event => {

        if (
            !indexMode ||
            aybakEndCardActive
        ) {

            return;

        }


        if (
            Math.abs(
                event.deltaY
            ) <=
            Math.abs(
                event.deltaX
            )
        ) {

            return;

        }


        event.preventDefault();

        clearIndexScrollHintHost();

        const now =
            performance.now();


        const newGesture =
            (
                now -
                indexLastWheelTime
            ) >
            INDEX_NEW_GESTURE_GAP;


        indexLastWheelTime =
            now;


        const canScroll =
            indexCanScrollVertically();


        const atBottomBefore =
            indexIsAtBottom();


        if (
            canScroll &&
            (
                event.deltaY < 0 ||
                !atBottomBefore
            )
        ) {

            indexScroller.scrollTop +=
                event.deltaY;


            indexBoundaryWheelAccumulator =
                0;


            return;

        }


        if (
            event.deltaY <= 0
        ) {

            indexBoundaryWheelAccumulator =
                0;


            return;

        }


        /*
            If the list has content to scroll, boundary activation
            is allowed only when this wheel sequence is a fresh gesture.
            If the list already fits, the normal first downward gesture
            can open AYBAK immediately, matching slideshow behaviour.
        */
        if (
            canScroll &&
            !newGesture
        ) {

            return;

        }


        clearTimeout(
            indexBoundaryWheelResetTimer
        );


        indexBoundaryWheelAccumulator +=
            event.deltaY;


        indexBoundaryWheelResetTimer =
            setTimeout(
                () => {

                    indexBoundaryWheelAccumulator =
                        0;

                },
                150
            );


        if (
            indexBoundaryWheelAccumulator >=
            INDEX_BOUNDARY_WHEEL_THRESHOLD
        ) {

            indexBoundaryWheelAccumulator =
                0;


            setAybakEndCard(
                true
            );

        }

    },
    {
        passive: false
    }
);


/* =====================================================
   INDEX TOUCH BOUNDARY
   ===================================================== */



indexScroller.addEventListener(
    "touchstart",
    event => {

        if (
            !indexMode ||
            !event.changedTouches.length
        ) {

            return;

        }

        indexTouchStartY =
            event.changedTouches[0].clientY;

        indexTouchLastY =
            indexTouchStartY;



        indexTouchStartedAtBottom =
            !indexCanScrollVertically() ||
            indexIsAtBottom();

    },
    {
        passive: true
    }
);


indexScroller.addEventListener(
    "touchmove",
    event => {
        if (
            !indexMode ||
            aybakEndCardActive ||
            !event.changedTouches.length
        ) {
            return;
        }

        /* Native overflow scrolling owns the gesture. Never preventDefault here. */
        indexTouchLastY = event.changedTouches[0].clientY;
    },
    {
        passive: true
    }
);


indexScroller.addEventListener(
    "touchend",
    event => {

        if (
            !indexMode ||
            indexTouchStartY === null ||
            !event.changedTouches.length
        ) {

            return;

        }


        const endY =
            event.changedTouches[0].clientY;


        const deltaY =
            endY -
            indexTouchStartY;


        indexTouchStartY =
            null;

        indexTouchLastY =
            null;


        if (
            indexTouchStartedAtBottom &&
            deltaY < -52
        ) {

            suppressClickUntil =
                Date.now() +
                500;


            setAybakEndCard(
                true
            );

        }

    },
    {
        passive: true
    }
);


/* =====================================================
   INDEX KEYBOARD
   ===================================================== */

indexScroller.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "ArrowDown" ||
            event.key === "PageDown" ||
            event.key === "End"
        ) {

            event.preventDefault();


            setAybakEndCard(
                true
            );

        }

    }
);


/* =====================================================
   INDEX SCROLL SAVE
   ===================================================== */

indexScroller.addEventListener(
    "scroll",
    () => {

        /* The hint remains visible while projects are still below.
           Once native scrolling has actually begun, reveal the rows that were
           hidden only to keep the initial composition free of partial entries. */
        if (
            indexMode &&
            indexScroller.scrollTop > 1
        ) {
            clearIndexScrollHintHost();
        }

        if (
            indexMode &&
            indexIsAtBottom()
        ) {
            dismissIndexScrollHint();
        }
        else if (
            indexMode &&
            body.classList.contains("index-needs-scroll")
        ) {
            /* The continuation cue comes back as soon as there are projects
               below again. Reaching the end is not a permanent dismissal. */
            body.classList.remove("index-scroll-hint-dismissed");
        }

        if (
            indexMode
        ) {

            savedIndexScrollTop =
                indexScroller.scrollTop;

        }

    },
    {
        passive: true
    }
);


/* =====================================================
   SLIDESHOW CLICK
   ===================================================== */

body.addEventListener(
    "click",
    async event => {

        if (
            Date.now() <
            suppressClickUntil
        ) {

            return;

        }


        if (
            aybakEndCardActive ||
            indexMode ||
            projectAllMode ||
            interfaceAnimating ||
            navigationAnimating ||
            projectViewAnimating
        ) {

            return;

        }


        if (
            event.target.closest(
                ".info, .section-switch, #index-button, #view-all-button"
            )
        ) {

            return;

        }


        if (
            !manualMode
        ) {

            stopAutoSlideshow();


            return;

        }


        const position =
            event.clientX /
            window.innerWidth;


        if (
            position < 0.25
        ) {

            await previousFrame();

        }

        else {

            await nextFrame();

        }

    }
);


/* =====================================================
   KEYBOARD
   ===================================================== */

document.addEventListener(
    "keydown",
    async event => {

        if (
            aybakEndCardActive
        ) {

            if (
                event.key === "ArrowUp" ||
                event.key === "Escape" ||
                event.key === "PageUp" ||
                event.key === "Home"
            ) {

                event.preventDefault();

                setAybakEndCard(
                    false
                );

            }


            return;

        }


        if (
            indexMode
        ) {

            if (
                event.key ===
                "Escape"
            ) {

                event.preventDefault();


                await returnFromIndex();

            }


            return;

        }


        if (
            projectAllMode
        ) {

            if (
                event.key ===
                "Escape"
            ) {

                event.preventDefault();


                await exitProjectAll();

            }


            return;

        }


        if (
            interfaceAnimating ||
            navigationAnimating ||
            projectViewAnimating
        ) {

            return;

        }


        if (
            event.key === "ArrowDown" ||
            event.key === "PageDown" ||
            event.key === "End"
        ) {

            event.preventDefault();

            setAybakEndCard(
                true
            );


            return;

        }


        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();


            await performPrimarySlideAction();


            return;

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            event.preventDefault();


            stopAutoSlideshow();


            await previousFrame();

        }


        else if (
            event.key ===
            "ArrowRight"
        ) {

            event.preventDefault();


            stopAutoSlideshow();


            await nextFrame();

        }

    }
);


/* =====================================================
   TOUCH
   ===================================================== */

document.addEventListener(
    "touchstart",
    event => {

        if (
            indexMode ||
            projectAllMode
        ) {

            return;

        }


        const touch =
            event.changedTouches[
                0
            ];


        touchStartX =
            touch.clientX;


        touchStartY =
            touch.clientY;

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchend",
    async event => {

        if (
            indexMode ||
            projectAllMode ||
            interfaceAnimating ||
            navigationAnimating ||
            projectViewAnimating ||
            touchStartX === null ||
            touchStartY === null
        ) {

            return;

        }


        const touch =
            event.changedTouches[
                0
            ];


        const deltaX =
            touch.clientX -
            touchStartX;


        const deltaY =
            touch.clientY -
            touchStartY;


        touchStartX =
            null;


        touchStartY =
            null;


        if (
            Math.abs(
                deltaX
            ) <=
            Math.abs(
                deltaY
            )
        ) {

            return;

        }


        if (
            Math.abs(
                deltaX
            ) < 45
        ) {

            return;

        }


        suppressClickUntil =
            Date.now() +
            500;


        stopAutoSlideshow();


        if (
            deltaX < 0
        ) {

            await nextFrame();

        }

        else {

            await previousFrame();

        }

    },
    {
        passive: true
    }
);


/* =====================================================
   LOGO
   ===================================================== */

const logo =
    document.querySelector(
        ".logo"
    );


const logoName =
    document.getElementById(
        "logo-name"
    );


const letters =
    [

        document.getElementById(
            "letter-a"
        ),

        document.getElementById(
            "letter-y"
        ),

        document.getElementById(
            "letter-b"
        ),

        document.getElementById(
            "letter-a2"
        ),

        document.getElementById(
            "letter-k"
        )

    ];


const lowercase =
    [
        "a",
        "y",
        "b",
        "a",
        "k"
    ];


const uppercase =
    [
        "A",
        "Y",
        "B",
        "A",
        "K"
    ];


let logoState =
    0;


let logoTarget =
    0;


let logoTimer =
    null;


let logoResolve =
    null;


function setLogoState(
    state
) {

    logoState =
        state;


    logoName.textContent =
        state === 0
            ? "Denizalp"
            : "denizalp";


    for (
        let i = 0;
        i < letters.length;
        i++
    ) {

        const isMorphUpper =
            i < state;


        letters[i].textContent =
            isMorphUpper
                ? uppercase[i]
                : lowercase[i];


        letters[i].style.fontFamily =
            isMorphUpper
                ? 'var(--morph-font)'
                : 'var(--sans-font)';


        letters[i].style.fontWeight =
            isMorphUpper
                ? 'var(--morph-weight)'
                : 'var(--sans-weight)';

    }

}


function moveLogo() {

    if (
        logoState ===
        logoTarget
    ) {

        logoTimer =
            null;


        if (
            logoResolve
        ) {

            const resolve =
                logoResolve;


            logoResolve =
                null;


            resolve();

        }


        return;

    }


    setLogoState(
        logoState <
        logoTarget
            ? logoState + 1
            : logoState - 1
    );


    logoTimer =
        setTimeout(
            moveLogo,
            LOGO_STEP_DURATION
        );

}


function animateLogoTo(
    target
) {

    logoTarget =
        target;


    if (
        logoTimer !== null
    ) {

        clearTimeout(
            logoTimer
        );

    }


    if (
        logoResolve
    ) {

        logoResolve();

        logoResolve =
            null;

    }


    return new Promise(
        resolve => {

            logoResolve =
                resolve;


            moveLogo();

        }
    );

}


logo.addEventListener(
    "mouseenter",
    () => {

        if (
            !isPhoneLayout()
        ) {

            animateLogoTo(
                5
            );

        }

    }
);


logo.addEventListener(

    () => {

        if (
            !isPhoneLayout()
        ) {

            animateLogoTo(
                0
            );

        }

    }
);


/* =====================================================
   MOBILE LOGO TAP

   Mobile only:
   Denizalp / aybak
        ->
   denizalp / AYBAK
        -> short hold
        -> landing page

   No automatic logo animation.
   Desktop hover/click behaviour stays unchanged.
   ===================================================== */

logo.addEventListener(

/* =====================================================
   FILM
   ===================================================== */

const sectionSwitchLandingText =
    document.getElementById(
        "section-switch-landing-text"
    );

function getLandingSwitchWord() {
    return isPhoneLayout()
        ? "PHOTOGRAPHY."
        : "PHOTOGRAPHY.denizalpaybak.com";
}

let landingSwitchWord = getLandingSwitchWord();

function syncLandingSwitchWordForLayout() {
    const nextWord = getLandingSwitchWord();

    if (nextWord === landingSwitchWord) return;

    landingSwitchWord = nextWord;
    sectionSwitchLandingText.textContent = landingSwitchWord;
}

window.addEventListener(
    "resize",

    { passive: true }
);

window.addEventListener(
    "orientationchange",

    { passive: true }
);

sectionSwitchLandingText.textContent = landingSwitchWord;

sectionSwitchLandingText.parentElement.addEventListener(
