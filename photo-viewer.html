const sectionSwitchText =
    document.getElementById(
        "section-switch-text"
    );


function getSwitchWord() {
    return isPhoneLayout()
        ? "film."
        : "film.denizalpaybak.com";
}

let switchWord = getSwitchWord();


let switchState =
    0;


let switchFrame =
    null;

function syncSwitchWordForLayout() {
    const nextWord = getSwitchWord();
    if (nextWord === switchWord) return;
    switchWord = nextWord;
    sectionSwitchText.textContent = switchWord;
    switchState = 0;
}

window.addEventListener("resize", syncSwitchWordForLayout, { passive: true });
window.addEventListener("orientationchange", syncSwitchWordForLayout, { passive: true });
requestAnimationFrame(syncSwitchWordForLayout);


function renderSwitch(
    state
) {

    switchState =
        state;


    renderInteractiveTypography(
        sectionSwitchText,
        renderWordCase(
            switchWord,
            state
        ),
        new Set(
            getLetterPositions(
                switchWord
            ).slice(
                0,
                state
            )
        )
    );

}


function morphSwitchTo(
    target
) {

    if (
        switchFrame !== null
    ) {

        cancelAnimationFrame(
            switchFrame
        );

    }


    const startState =
        switchState;


    if (
        startState === target
    ) {

        renderSwitch(
            target
        );


        return Promise.resolve();

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        WORD_TRANSITION_DURATION
                    );


                const state =
                    Math.round(
                        startState +
                        (
                            target -
                            startState
                        ) *
                        progress
                    );


                renderSwitch(
                    state
                );


                if (
                    progress < 1
                ) {

                    switchFrame =
                        requestAnimationFrame(
                            frame
                        );

                }

                else {

                    renderSwitch(
                        target
                    );


                    switchFrame =
                        null;


                    resolve();

                }

            }


            switchFrame =
                requestAnimationFrame(
                    frame
                );

        }
    );

}


sectionSwitch.addEventListener(
    "mouseenter",
    () => {

        if (
            !isPhoneLayout()
        ) {

            morphSwitchTo(

            );

        }

sectionSwitch.addEventListener(

        ) {

            morphSwitchTo(

        }

);


/* =====================================================
   MOBILE FILM TAP

   Mobile only:
   film -> FILM -> short hold -> film site

   Desktop remains normal hover + immediate link.
   ===================================================== */

sectionSwitch.addEventListener(

    async event => {

        event.preventDefault();
        event.stopPropagation();

        if (canHover()) {
            window.location.href =
                sectionSwitch.href;
            return;
        }

        await morphSwitchTo(
            switchWord.length
        );

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    MOBILE_NAV_HOLD
                )
        );

        window.location.href =
            sectionSwitch.href;

    }
);


/* =====================================================
   GEOMETRY CHANGE
   ===================================================== */

function handleGeometryChange() {

    updateResponsiveMode();


    updateIndexContentTop();


    if (
        isPhoneLandscape()
    ) {

        requestAnimationFrame(
            updateLandscapeGeometry
        );

    }


    syncMetadataAfterRender();


    if (
        projectAllMode
    ) {

        requestAnimationFrame(
            () => {

                requestAnimationFrame(
                    layoutProjectAllGrid
                );

            }
        );

    }

}


window.addEventListener(
    "resize",
    handleGeometryChange
);


window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            handleGeometryChange,
            100
        );


        setTimeout(
            handleGeometryChange,
            350
        );


        setTimeout(
            handleGeometryChange,
            700
        );

    }
);


if (
    window.visualViewport
) {

    window
        .visualViewport
        .addEventListener(
            "resize",
            handleGeometryChange
        );

}


/* =====================================================
   BROWSER BACK / FORWARD
   ===================================================== */

window.addEventListener(
    "popstate",
    async () => {

        if (
            !projects.length
        ) {

            return;

        }


        const deepLink =
            getDeepLinkRequest();


        const requestedProjectIndex =
            findProjectIndexById(
                deepLink.projectId
            );


        const targetProjectIndex =
            requestedProjectIndex >= 0
                ? requestedProjectIndex
                : 0;


        const targetProject =
            projects[
                targetProjectIndex
            ];


        let targetFrameIndex =
            0;


        if (
            requestedProjectIndex >= 0 &&
            deepLink.imageNumber !==
                null
        ) {

            const resolved =
                getRuntimeFrameIndexFromOriginalNumber(
                    targetProject,
                    deepLink.imageNumber
                );


            if (
                resolved >= 0
            ) {

                targetFrameIndex =
                    resolved;

            }

        }


        if (
            targetProjectIndex ===
                projectIndex &&
            targetFrameIndex ===
                frameIndex &&
            !indexMode &&
            !projectAllMode
        ) {

            return;

        }


        clearTimeout(
            slideTimer
        );


        leaveFocusedProjectMode();


        indexMode =
            false;


        projectAllMode =
            false;


        body.classList.remove(
            "index-mode",
            "project-all-mode",
            "project-all-preparing"
        );


        indexView.classList.remove(
            "visible"
        );


        projectAllGrid.innerHTML =
            "";


        /*
            "replace" avoids creating a new history entry while
            the browser itself is restoring an existing one.
        */

        await showFrame(
            targetProjectIndex,
            targetFrameIndex,
            "replace"
        );


        manualMode =
            true;


        clearTimeout(
            slideTimer
        );

    }
);


/* =====================================================
   LOAD
   ===================================================== */

async function loadProjects() {

    try {

        const response =
            await fetch(
                PROJECTS_JSON,
                {
                    cache: "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "projects.json could not be loaded."
            );

        }


        const data =
            await response.json();


        projects =
            data
                .filter(
                    project =>
                        project &&
                        Array.isArray(
                            project.images
                        ) &&
                        project.images.length > 0
                )
                .map(
                    prepareProject
                );


        if (
            projects.length === 0
        ) {

            return;

        }


        updateResponsiveMode();


        buildIndex();


        const deepLink =
            getDeepLinkRequest();


        const requestedProjectIndex =
            findProjectIndexById(
                deepLink.projectId
            );


        projectIndex =
            requestedProjectIndex >= 0
                ? requestedProjectIndex
                : 0;


        const requestedProject =
            currentProject();


        let requestedRuntimeFrameIndex =
            -1;


        if (
            requestedProjectIndex >= 0 &&
            deepLink.imageNumber !==
                null
        ) {

            requestedRuntimeFrameIndex =
                getRuntimeFrameIndexFromOriginalNumber(
                    requestedProject,
                    deepLink.imageNumber
                );

        }


        /*
            Project-only links keep the random opening-image
            behaviour.

            Valid project + image links open that exact original
            projects.json image.

            Invalid image numbers safely fall back to the current
            project's runtime first image.
        */

        frameIndex =
            requestedRuntimeFrameIndex >= 0
                ? requestedRuntimeFrameIndex
                : 0;


        if (
            deepLink.projectId &&
            requestedProjectIndex < 0
        ) {

            const cleanUrl =
                new URL(
                    window.location.href
                );


            cleanUrl.searchParams.delete(
                "project"
            );


            cleanUrl.searchParams.delete(
                "image"
            );


            window.history.replaceState(
                {},
                "",
                cleanUrl
            );

        }


        else if (
            requestedProjectIndex >= 0
        ) {

            /*
                Normalize project-only / invalid-image deep links
                to the exact stable original image number.
            */

            syncProjectUrl(
                "replace"
            );

        }


        const hasValidImageDeepLink =
            requestedProjectIndex >= 0 &&
            requestedRuntimeFrameIndex >= 0;


        if (
            hasValidImageDeepLink
        ) {

            /*
                An explicit project + image deep link (for example from
                the PDF portfolio) must stay on the exact requested image.

                Treat it like an INDEX / VIEW ALL project selection:
                show the complete selected project manually first, then
                return to the normal max-3 project rotation.

                Autoplay is permanently disabled for this page session.
            */

            frameIndex =
                requestedRuntimeFrameIndex;


            enterFocusedProjectMode(
                projectIndex
            );


            autoplayPermanentlyDisabled =
                true;


            manualMode =
                true;


            clearTimeout(
                slideTimer
            );

        }

        else {

            /*
                Ordinary site entry keeps the existing max-3 autoplay
                behaviour and ascending frame order within each pass.
            */

            buildNormalProjectSequence(
                projectIndex
            );


            normalSequencePosition =
                0;


            frameIndex =
                normalSequenceFrames[0];

        }


        const firstImage =
            await preloadImage(
                currentProject().images[
                    frameIndex
                ]
            );


        renderedProjectIndex =
            projectIndex;


        renderImage(
            firstImage
        );


        markFrameSeen(
            projectIndex,
            frameIndex
        );


        const title =
            currentProject()
                .title
                .toLowerCase();


        const date =
            (
                currentProject().date ||
                ""
            ).toLowerCase();


        renderBaseTypography(
            projectTitle,
            title
        );


        projectTitle.dataset.rawText =
            title;


        renderBaseTypography(
            projectDate,
            date
        );


        projectDate.dataset.rawText =
            date;


        renderBaseTypography(
            projectCounter,
            getProjectPhotoCountText(
                currentProject()
                    .images.length
            )
        );


        projectCounter.dataset.rawText =
            projectCounter.textContent;


        viewAllButton.textContent =
            "view all";


        viewAllButton.dataset.rawText =
            "view all";


        /*
            Do not preload every project cover at startup.

            That used to make the first page load much more
            expensive on mobile. The index now lazy-loads its
            covers, while only the next project is warmed by
            preloadAhead().
        */

        preloadAhead();


        const warmInitialIndexCovers =
            () => {

                projects
                    .slice(
                        0,
                        isPhoneLayout()
                            ? 2
                            : 3
                    )
                    .forEach(
                        project => {

                            preloadImage(
                                project.cover
                            ).catch(
                                () => {}
                            );

                        }
                    );

            };


        if (
            "requestIdleCallback" in window
        ) {

            requestIdleCallback(
                warmInitialIndexCovers,
                {
                    timeout:
                        1500
                }
            );

        }

        else {

            setTimeout(
                warmInitialIndexCovers,
                500
            );

        }


        updateIndexContentTop();


        if (
            isPhoneLandscape()
        ) {

            requestAnimationFrame(
                updateLandscapeGeometry
            );

        }


        syncMetadataAfterRender();


        if (
            hasValidImageDeepLink
        ) {

            clearTimeout(
                slideTimer
            );


            manualMode =
                true;

        }

        else {

            startAutoSlideshow();

        }


    }

    catch (error) {

        console.error(
            error
        );

    }

}


/* =====================================================
   START
   ===================================================== */

setLogoState(
    0
);


renderSwitch(
    0
);


renderIndexWord(
    0
);


loadProjects();


/* =====================================================
   INDEX RESPONSIVE RESYNC
   ===================================================== */

let photoIndexResizeFrame =
    null;


window.addEventListener(
    "resize",
    () => {

        if (
            photoIndexResizeFrame
        ) {

            cancelAnimationFrame(
                photoIndexResizeFrame
            );

        }


        photoIndexResizeFrame =
            requestAnimationFrame(
                () => {

                    resizePhotoIndexCards();

                    photoIndexResizeFrame =
                        null;

                }
            );

    },
    {
        passive: true
    }
);



/* UNIFIED EMBED BOOTSTRAP */
(function(){
    const unifiedParams = new URLSearchParams(window.location.search);
    if(unifiedParams.get("view") !== "all") return;
    const unifiedTarget = unifiedParams.get("project");
    let unifiedTries = 0;
    const unifiedBoot = () => {
        unifiedTries++;
        try {
            if(
                unifiedTarget &&
                projects.length &&
                typeof findProjectIndexById === "function" &&
                typeof enterProjectAll === "function"
            ){
                const i=findProjectIndexById(unifiedTarget);
                if(i>=0){
                    currentProjectIndex=i;
                    renderedProjectIndex=null;
                    if(typeof currentVideoIndex !== "undefined") currentVideoIndex=0;
                    if(typeof currentImageIndex !== "undefined") currentImageIndex=0;
                    Promise.resolve(enterProjectAll()).catch(()=>{});
                    return;
                }
            }
        }catch(error){console.error(error);}
        if(unifiedTries<100) window.setTimeout(unifiedBoot,100);
    };
    window.setTimeout(unifiedBoot,120);
})();

<script>
/* =====================================================
   PROJECT BEHAVIOUR / THEME OVERRIDES — V20
   ===================================================== */

let pageThemeIsDark = false;
let projectAllSwitching = false;
let projectTitleHovering = false;
let projectAllTouchX = null;
let projectAllTouchY = null;
let projectAllSlideOrigin = null;

function applyPageTheme(isDark) {
    /* Photography surface is permanently white; black belongs only to AYBAK. */
    pageThemeIsDark = false;
    body.classList.remove("theme-dark");

}

function invertPageTheme() {
    applyPageTheme(!pageThemeIsDark);
}

/* First project is always white. */
applyPageTheme(false);

/* -----------------------------------------------------
   NORMAL SLIDE = EXACTLY ONE RANDOM FRAME PER PROJECT
   ----------------------------------------------------- */
buildNormalProjectSequence = function(
    targetProjectIndex,
    { includeFrame = null } = {}
) {
    const normalized = normalizeProjectIndex(targetProjectIndex);
    const project = projects[normalized];
    const total = project.images.length;

    let selectedFrame;

    if (
        Number.isInteger(includeFrame) &&
        includeFrame >= 0 &&
        includeFrame < total
    ) {
        selectedFrame = includeFrame;
    } else {
        selectedFrame = Math.floor(Math.random() * total);
    }

    normalSequenceProjectIndex = normalized;
    normalSequenceFrames = [selectedFrame];
    normalSequencePosition = 0;

    return normalSequenceFrames;
};

/* Theme flips only when the PROJECT changes, never when its frame changes. */
const showFrameV19 = showFrame;
showFrame = async function(targetProjectIndex, targetFrameIndex, urlMode = "push") {
    const normalized = normalizeProjectIndex(targetProjectIndex);
    const projectWillChange = normalized !== projectIndex;

    /*
        Start the black/white transition at the same instant as the
        navigation gesture. Do not wait for the next full-resolution
        image to finish loading/decoding.
    */
    if (projectWillChange) {
        invertPageTheme();
    }

    const ok = await showFrameV19(targetProjectIndex, targetFrameIndex, urlMode);

    /* If navigation fails, restore the previous theme. */
    if (!ok && projectWillChange) {
        invertPageTheme();
    }

    return ok;
};

/* -----------------------------------------------------
   INDEX IS ALWAYS THE INVERSE OF THE PAGE IT CAME FROM
   ----------------------------------------------------- */
const enterIndexV19 = enterIndex;
enterIndex = async function(options = {}) {
    if (!indexMode) {
        invertPageTheme();
    }
    return enterIndexV19(options);
};

const returnFromIndexV19 = returnFromIndex;
returnFromIndex = async function() {
    if (indexMode) {
        invertPageTheme();
    }
    return returnFromIndexV19();
};

const openSelectedIndexProjectAllV19 = openSelectedIndexProjectAll;
openSelectedIndexProjectAll = async function() {
    if (indexMode && selectedIndexProject) {
        invertPageTheme();
    }
    return openSelectedIndexProjectAllV19();
};

const returnProjectAllToIndexV19 = returnProjectAllToIndex;
returnProjectAllToIndex = async function() {
    if (projectAllMode && projectAllOpenedFromIndex) {
        invertPageTheme();
    }
    return returnProjectAllToIndexV19();
};

/* -----------------------------------------------------
   VIEW ALL COPY: NEXT / PREVIOUS
   ----------------------------------------------------- */
function setProjectAllNavigationCopy() {
    if (!projectAllMode && !body.classList.contains("project-all-preparing")) {
        return;
    }

    renderBaseTypography(projectCounter, "next project");
    projectCounter.dataset.rawText = projectCounter.textContent;
    projectCounter.setAttribute("aria-label", "Next project");

    renderBaseTypography(viewAllButton, "previous project");
    viewAllButton.dataset.rawText = viewAllButton.textContent;
    viewAllButton.setAttribute("aria-label", "Previous project");
}

const enterProjectAllV19 = enterProjectAll;
enterProjectAll = async function() {
    if (!projectAllMode && !indexMode && !projectAllOpenedFromIndex) {
        projectAllSlideOrigin = {
            projectIndex,
            frameIndex,
            themeIsDark: pageThemeIsDark
        };
    }

    const result = await enterProjectAllV19();
    setProjectAllNavigationCopy();
    return result;
};

/* Original INDEX -> VIEW ALL flow writes ALL()/CLOSE at the end. Fix it immediately after. */
const openSelectedIndexProjectAllV20Base = openSelectedIndexProjectAll;
openSelectedIndexProjectAll = async function() {
    const result = await openSelectedIndexProjectAllV20Base();
    setProjectAllNavigationCopy();
    return result;
};

async function switchProjectAll(direction) {
    if (!projectAllMode || projectAllSwitching || projectViewAnimating) {
        return;
    }

    projectAllSwitching = true;
    stopAutoSlideshow();

    const targetIndex = normalizeProjectIndex(projectIndex + direction);
    const targetProject = projects[targetIndex];

    projectIndex = targetIndex;
    frameIndex = 0;
    renderedProjectIndex = targetIndex;

    leaveFocusedProjectMode();
    syncProjectUrl("push");
    invertPageTheme();

    projectAllGrid.innerHTML = "";
    buildProjectAllGrid();
    syncProjectAllBounds(true);
    layoutProjectAllGrid(true);

    await Promise.all([
        morphSequential(
            projectTitle,
            targetProject.title.toUpperCase(),
            TEXT_MORPH_DURATION
        ),
        morphSequential(
            projectDate,
            (targetProject.date || "").toUpperCase(),
            TEXT_MORPH_DURATION
        )
    ]);

    setProjectAllNavigationCopy();
    preloadAhead();
    projectAllSwitching = false;
}

/* -----------------------------------------------------
   CLIENT NAME = VIEW TOGGLE
   Desktop hover only animates. Click performs the change.
   Mobile tap animates first, then changes view.
   ----------------------------------------------------- */
async function animateProjectClientState(toAlternateState) {
    const project = currentProject();
    await Promise.all([
        animateCase(projectTitle, project.title, toAlternateState),
        animateCase(projectDate, project.date || "", toAlternateState)
    ]);
}

projectTitle.addEventListener("mouseenter", async () => {
    if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches || projectViewAnimating) {
        return;
    }
    projectTitleHovering = true;
    await animateProjectClientState(!projectAllMode);
});

projectTitle.addEventListener("mouseleave", async () => {
    if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches || projectViewAnimating) {
        return;
    }
    projectTitleHovering = false;
    await animateProjectClientState(projectAllMode);
});

projectTitle.addEventListener("click", async event => {
    event.preventDefault();
    event.stopPropagation();

    if (projectViewAnimating || interfaceAnimating || navigationAnimating || projectAllSwitching) {
        return;
    }

    if (projectAllMode) {
        await animateProjectClientState(false);

        if (projectAllOpenedFromIndex) {
            await returnProjectAllToIndex();
        } else {
            const origin = projectAllSlideOrigin;
            await exitProjectAll();

            if (origin) {
                await showFrameV19(
                    origin.projectIndex,
                    origin.frameIndex,
                    "replace"
                );
                applyPageTheme(origin.themeIsDark);
                projectAllSlideOrigin = null;
            }
        }
    } else {
        stopAutoSlideshow();
        await animateProjectClientState(true);
        await enterProjectAll();
    }
}, true);

/* -----------------------------------------------------
   VIEW ALL NEXT / PREVIOUS BUTTONS
   ----------------------------------------------------- */
projectCounter.addEventListener("mouseenter", async event => {
    if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;

    if (projectAllMode) {
        await animateCase(projectCounter, "next project", true);
        return;
    }

    if (isSlideViewAllControlElement(event.relatedTarget)) return;
    await animateSlideViewAllControl(true);
});

projectCounter.addEventListener("mouseleave", async event => {
    if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;

    if (projectAllMode) {
        await animateCase(projectCounter, "next project", false);
        return;
    }

    if (isSlideViewAllControlElement(event.relatedTarget)) return;
    await animateSlideViewAllControl(false);
});

projectCounter.addEventListener("click", async event => {
    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation();

    if (projectViewAnimating || interfaceAnimating || navigationAnimating || projectAllSwitching) return;

    if (projectAllMode) {
        await animateCase(projectCounter, "next project", true);
        await switchProjectAll(1);
        return;
    }

    stopAutoSlideshow();
    await animateSlideViewAllControl(true);
    await enterProjectAll();
}, true);

/* PREVIOUS PROJECT hover is handled by the original View All button
   listeners above. Keeping a single animation owner avoids competing
   morphs and makes the control reliably clickable. */

/* Arrow-key and swipe project navigation use the same case-morph gesture. */
async function activateProjectAllDirection(direction) {
    if (!projectAllMode || projectAllSwitching || projectViewAnimating) {
        return;
    }

    const element = direction >= 0 ? projectCounter : viewAllButton;
    const text = direction >= 0 ? "next project" : "previous project";

    await animateCase(element, text, true);

    await new Promise(resolve =>
        setTimeout(resolve, MOBILE_NAV_HOLD)
    );

    await switchProjectAll(direction >= 0 ? 1 : -1);
}

/* -----------------------------------------------------
   KEYBOARD
   Left / right = project navigation in VIEW ALL.
   Up / down = physical two-state page / AYBAK navigation everywhere.
   ----------------------------------------------------- */
document.addEventListener("keydown", async event => {
    stopProjectAutoplayFromInteraction();

    if (event.key === "ArrowDown" && !aybakEndCardActive) {
        event.preventDefault();
        event.stopImmediatePropagation();
        setAybakEndCard(true);
        return;
    }

    if (event.key === "ArrowUp" && aybakEndCardActive) {
        event.preventDefault();
        event.stopImmediatePropagation();
        setAybakEndCard(false);
        return;
    }

    if (projectAllMode && !aybakEndCardActive) {
        if (event.key === "ArrowRight") {
            event.preventDefault();
            event.stopImmediatePropagation();
            await switchProjectAll(1);
        } else if (event.key === "ArrowLeft") {
            event.preventDefault();
            event.stopImmediatePropagation();
            await switchProjectAll(-1);
        }
    }
}, true);

/* -----------------------------------------------------
   MOBILE AYBAK PAGE SWIPE — RELIABLE CAPTURE FALLBACK

   Keep the existing gesture system intact, but capture the physical
   up/down page gesture before project/view listeners can consume it.
   INDEX keeps its own boundary-aware swipe logic.
   ----------------------------------------------------- */
let mobileAybakTouchStartX = null;
let mobileAybakTouchStartY = null;

document.addEventListener("touchstart", event => {
    if (!event.changedTouches.length) return;

    const touch = event.changedTouches[0];
    mobileAybakTouchStartX = touch.clientX;
    mobileAybakTouchStartY = touch.clientY;
}, { passive: true, capture: true });

document.addEventListener("touchend", event => {
    if (
        mobileAybakTouchStartX === null ||
        mobileAybakTouchStartY === null ||
        !event.changedTouches.length
    ) {
        return;
    }

    const touch = event.changedTouches[0];
    const dx = touch.clientX - mobileAybakTouchStartX;
    const dy = touch.clientY - mobileAybakTouchStartY;

    mobileAybakTouchStartX = null;
    mobileAybakTouchStartY = null;

    if (
        Math.abs(dy) <= Math.abs(dx) ||
        Math.abs(dy) < AYBAK_SWIPE_THRESHOLD
    ) {
        return;
    }

    /* INDEX already has boundary-aware touch handling. */
    if (indexMode && !aybakEndCardActive) return;

    if (!aybakEndCardActive && dy < 0) {
        suppressClickUntil = Date.now() + 500;
        setAybakEndCard(true);
        return;
    }

    if (aybakEndCardActive && dy > 0) {
        suppressClickUntil = Date.now() + 500;
        setAybakEndCard(false);
    }
}, { passive: true, capture: true });

/* -----------------------------------------------------
   MOBILE VIEW ALL SWIPE = PROJECT NAVIGATION
   ----------------------------------------------------- */
document.addEventListener("touchstart", event => {
    if (!projectAllMode || aybakEndCardActive || !event.changedTouches.length) return;
    projectAllTouchX = event.changedTouches[0].clientX;
    projectAllTouchY = event.changedTouches[0].clientY;
}, { passive: true, capture: true });

document.addEventListener("touchend", async event => {
    if (!projectAllMode || aybakEndCardActive || projectAllTouchX === null || projectAllTouchY === null || !event.changedTouches.length) {
        return;
    }

    const x = event.changedTouches[0].clientX;
    const y = event.changedTouches[0].clientY;
    const dx = x - projectAllTouchX;
    const dy = y - projectAllTouchY;

    projectAllTouchX = null;
    projectAllTouchY = null;

    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) >= 45) {
        suppressClickUntil = Date.now() + 500;
        await switchProjectAll(dx < 0 ? 1 : -1);
    }
}, { passive: true, capture: true });

/* -----------------------------------------------------
   INITIAL VIEW ALL STABILISATION + PROJECT AUTOPLAY
   ----------------------------------------------------- */
const PROJECT_AUTOPLAY_DURATION = 4000;
let projectAutoplayTimer = null;
let projectAutoplayEnabled = true;

function stopProjectAutoplayFromInteraction() {
    if (!projectAutoplayEnabled) return;
    projectAutoplayEnabled = false;
    clearTimeout(projectAutoplayTimer);
}

function scheduleProjectAutoplay() {
    clearTimeout(projectAutoplayTimer);

    if (!projectAutoplayEnabled || !projectAllMode || indexMode || aybakEndCardActive) {
        return;
    }

    projectAutoplayTimer = setTimeout(async () => {
        if (!projectAutoplayEnabled || !projectAllMode || indexMode || aybakEndCardActive) {
            return;
        }

        await switchProjectAll(1);
        scheduleProjectAutoplay();
    }, PROJECT_AUTOPLAY_DURATION);
}

["pointerdown", "wheel", "keydown", "touchstart"].forEach(type => {
    document.addEventListener(type, stopProjectAutoplayFromInteraction, {
        capture: true,
        passive: type === "wheel" || type === "touchstart"
    });
});

/* Hover/focus on actual interface controls also counts as interaction.
   Merely moving the pointer across empty page space does not. */
const AUTOPLAY_INTERACTIVE_SELECTOR = [
    "a",
    "button",
    ".project-all-thumb",
    ".index-project-title",
    ".index-project-date",
    "#index-preview-image",
    "#project-title",
    "#project-date"
].join(",");

document.addEventListener("pointerover", event => {
    if (event.target.closest?.(AUTOPLAY_INTERACTIVE_SELECTOR)) {
        stopProjectAutoplayFromInteraction();
    }
}, { capture: true, passive: true });

document.addEventListener("focusin", event => {
    if (event.target.closest?.(AUTOPLAY_INTERACTIVE_SELECTOR)) {
        stopProjectAutoplayFromInteraction();
    }
}, true);

async function waitForProjectAllImageDimensions() {
    const images = Array.from(projectAllGrid.querySelectorAll("img"));

    await Promise.all(images.map(img => {
        if (img.naturalWidth && img.naturalHeight) {
            return Promise.resolve();
        }

        return new Promise(resolve => {
            const done = () => resolve();
            img.addEventListener("load", done, { once: true });
            img.addEventListener("error", done, { once: true });
        });
    }));

    layoutProjectAllGrid(true);
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
}


function syncSinglePhotoViewCopy() {
    if (projectAllMode || body.classList.contains("project-all-preparing") || !projects.length) return;
    const total = currentProject().images.length;
    renderBaseTypography(viewAllButton, getViewVerbText(total));
    renderBaseTypography(projectCounter, getProjectPhotoCountText(total));
    viewAllButton.dataset.rawText = viewAllButton.textContent;
    projectCounter.dataset.rawText = projectCounter.textContent;
}

const syncMetadataAfterRenderV24 = syncMetadataAfterRender;
syncMetadataAfterRender = function() {
    const result = syncMetadataAfterRenderV24.apply(this, arguments);
    syncSinglePhotoViewCopy();
    return result;
};

/* -----------------------------------------------------
   INITIAL VIEW
   Desktop and mobile both start in the single-photo slide view.
   loadProjects() starts the normal slideshow automatically.
   ----------------------------------------------------- */

/* Re-score VIEW ALL as soon as thumbnail aspect ratios are available. */
projectAllGrid.addEventListener(
    "load",
    event => {
        if (
            (projectAllMode || body.classList.contains("project-all-preparing")) &&
            event.target instanceof HTMLImageElement
        ) {
            requestAnimationFrame(() => {
                layoutProjectAllGrid(true);
            });
        }
    },
    true
);
</script>
