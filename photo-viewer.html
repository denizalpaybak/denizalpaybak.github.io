<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>



<title>Denizalp Aybak — Photography</title>
<link rel="stylesheet" href="https://use.typekit.net/rmn7qgm.css">
<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #fff;
    color: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

button {
    font: inherit;
}

/* =====================================================
   VARIABLES
   ===================================================== */

:root {

    --font-size: 15px;
    --line-height: 1.15;

    /*
        NUMERAL ACTIVE STATE
        Digits cannot uppercase, so during the same morph state
        they gain a subtle amount of tracking instead.
    */
    --active-number-tracking: 0.055em;

    --side: 48px;
    --top: 32px;

    --index-bottom: 24px;

    --meta-gap: 6px;

    --image-max-width: 82vw;

    --visual-height: 84vh;

    --image-max-height:
        calc(
            var(--visual-height) -
            22px
        );

    --meta-top-gap: 10px;

    --index-content-top: 130px;

    --portrait-visual-top: 140px;


    /*
        PHONE LANDSCAPE —
        dynamically calculated by JS.
    */

    --landscape-safe-left: 300px;
    --landscape-safe-right: 120px;

    --landscape-index-top: 220px;

    --landscape-index-image-height: 220px;

    /*
        Wider than before.

        Long titles now have substantially more
        horizontal room underneath the image.
    */

    --landscape-index-card-width: 220px;

}


/* =====================================================
   BODY
   ===================================================== */

body {
    cursor: default;
}

/* Desktop and mobile both open directly in the single-photo slide view. */

/* Explicit pointer states only for genuinely interactive elements. */
a,
button,
.project-card,
.project-all-thumb {
    cursor: pointer;
}

/* The slideshow itself remains clickable, without making empty page space look clickable. */
.spread-image {
    pointer-events: auto;
    cursor: pointer;
}


/* =====================================================
   INFO
   ===================================================== */

.info {
    position: fixed;

    top: var(--top);
    left: var(--side);

    z-index: 500;

    font-size: var(--font-size);
    line-height: var(--line-height);
}


/* =====================================================
   LOGO
   ===================================================== */

.logo {
    position: relative;

    display: block;

    width: 190px;
    height: 52px;

    color: inherit;
    text-decoration: none;
}

.logo-name {
    position: absolute;

    top: 0;
    left: 0;

    white-space: nowrap;
}

.logo-aybak {
    position: absolute;

    top: 17px;
    left: 0;

    white-space: nowrap;
}


/* =====================================================
   CONTACT
   ===================================================== */

.contact,
.social {
    margin: 0;
    padding: 0;
}

.social {
    display: flex;
    flex-direction: column;
}

.info a {
    color: inherit;
    text-decoration: none;
}

.info a:hover {
    text-decoration: underline;
}


/* =====================================================
   FILM
   ===================================================== */

.section-switch {
    position: fixed;

    top: var(--top);
    right: var(--side);

    z-index: 500;

    color: #000;
    text-decoration: none;

    font-size: var(--font-size);
    line-height: var(--line-height);

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   PROJECT
   ===================================================== */

#project-stage {
    position: fixed;

    inset: 0;

    z-index: 10;

    pointer-events: none;
}

#project-block {
    position: absolute;

    inset: 0;

    pointer-events: none;
}


/* =====================================================
   VISUAL ZONE — DESKTOP / TABLET
   ===================================================== */

#visual-zone {
    position: absolute;

    top: 50%;
    left: 0;

    width: 100%;
    height: var(--visual-height);

    transform: translateY(-50%);

    display: flex;

    align-items: center;
    justify-content: center;

    pointer-events: none;
}


/* =====================================================
   SLIDESHOW IMAGE
   ===================================================== */

#spread,
.image-cell {
    display: flex;

    align-items: center;
    justify-content: center;

    pointer-events: none;
}

.spread-image {
    display: block;

    width: auto;
    height: auto;

    max-width: var(--image-max-width);
    max-height: var(--image-max-height);

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   PROJECT META — DESKTOP / TABLET
   ===================================================== */

#project-meta {
    position: absolute;

    top:
        calc(
            50% +
            var(--visual-height) / 2 +
            var(--meta-top-gap)
        );

    left: 50%;

    width: 0;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    grid-template-rows:
        auto
        auto;

    font-size: var(--font-size);
    line-height: var(--line-height);

    pointer-events: none;
}


/* =====================================================
   META LEFT
   ===================================================== */

#project-title {
    grid-column: 1;
    grid-row: 1;

    text-align: left;

    white-space: nowrap;
}

#project-date {
    grid-column: 1;
    grid-row: 2;

    text-align: left;

    white-space: nowrap;
}


/* =====================================================
   META RIGHT
   ===================================================== */

#project-counter {
    grid-column: 2;
    grid-row: 1;

    justify-self: end;

    padding-left: 28px;

    text-align: right;

    white-space: nowrap;
}


/* =====================================================
   VIEW ALL / CLOSE
   ===================================================== */

#view-all-button {
    grid-column: 2;
    grid-row: 2;

    justify-self: end;

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: inherit;

    line-height: inherit;

    text-align: right;

    white-space: nowrap;

    cursor: pointer;

    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
}

#view-all-button:hover,
#view-all-button:focus,
#view-all-button:active {
    outline: 0;
    text-decoration: none;
}


/* =====================================================
   VIEW ALL MODE
   ===================================================== */

body.project-all-mode #spread {
    visibility: hidden;
}


/* =====================================================
   INVISIBLE GRID PREPARATION
   ===================================================== */

body.project-all-preparing #project-all-view {
    display: block;

    visibility: hidden;
}


/* =====================================================
   VIEW ALL
   ===================================================== */

#project-all-view {
    position: fixed;

    z-index: 30;

    display: none;

    overflow: hidden;

    pointer-events: auto;
}

body.project-all-mode #project-all-view {
    display: block;

    visibility: visible;
}


/* =====================================================
   VIEW ALL GRID

   Tighter gap = larger usable thumbnails.
   ===================================================== */

#project-all-grid {
    display: grid;

    width: 100%;
    height: 100%;

    place-content: center;

    align-items: center;
    justify-items: center;

    gap: 7px;
}

.project-all-thumb {
    appearance: none;
    -webkit-appearance: none;

    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

.project-all-thumb img {
    display: block;

    max-width: 100%;
    max-height: 100%;

    width: auto;
    height: auto;

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   INDEX BUTTON
   ===================================================== */

#index-button {
    position: fixed;

    top: var(--top);
    right: var(--side);

    z-index: 600;

    transform: none;

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    font-size: var(--font-size);
    line-height: var(--line-height);

    white-space: nowrap;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   INDEX VIEW
   ===================================================== */

#index-view {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    background: #fff;
}

#index-view.visible {
    display: block;
}


/* =====================================================
   INDEX SCROLLER
   ===================================================== */

#index-scroller {
    position: absolute;

    top: var(--index-content-top);

    left: 0;
    right: 0;

    bottom:
        calc(
            18px +
            env(safe-area-inset-bottom)
        );

    display: flex;

    align-items: center;

    overflow-x: auto;
    overflow-y: hidden;

    scrollbar-width: none;

    -webkit-overflow-scrolling: touch;

    user-select: none;

    cursor: grab;

    outline: none;
}

#index-scroller::-webkit-scrollbar {
    display: none;
}

#index-scroller.dragging {
    cursor: grabbing;
}


/* =====================================================
   INDEX RAIL
   ===================================================== */

#index-grid {
    display: flex;

    flex-direction: row;
    flex-wrap: nowrap;

    align-items: center;

    gap: 54px;

    width: max-content;

    padding-left: var(--side);
    padding-right: var(--side);

    transform: translateY(-8px);
}


/* =====================================================
   INDEX CARD
   ===================================================== */

.project-card {
    appearance: none;
    -webkit-appearance: none;

    flex:
        0
        0
        285px;

    display: flex;
    flex-direction: column;

    align-items: flex-start;

    width: 285px;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;
    color: #000;

    text-align: left;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   INDEX IMAGE
   ===================================================== */

.card-image-wrap {
    display: flex;

    flex: 0 0 auto;

    align-items: center;
    justify-content: flex-start;

    overflow: visible;

    pointer-events: none;
}

.card-image-wrap img {
    position: static;

    display: block;

    flex: 0 0 auto;

    margin: 0;

    width: auto;
    height: auto;

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   INDEX COPY
   ===================================================== */

.card-copy {
    display: flex;
    flex-direction: column;

    align-items: flex-start;

    width: 100%;

    margin-top: var(--meta-gap);

    font-size: var(--font-size);
    line-height: var(--line-height);

    text-align: left;

    pointer-events: none;
}

.card-title,
.card-date {
    display: block;

    margin: 0;
    padding: 0;

    max-width: 100%;

    text-align: left;

    white-space: nowrap;

    overflow: hidden;
}


/* =====================================================
   INDEX MODE
   ===================================================== */

body.index-mode #project-stage {
    visibility: hidden;
}


/* =====================================================
   TABLET
   ===================================================== */

@media
    (min-width: 601px)
    and (max-width: 1366px) {

    :root {

        --image-max-width: 80vw;

        --visual-height: 82vh;

        --image-max-height:
            calc(
                var(--visual-height) -
                22px
            );

    }

    .project-card {
        flex:
            0
            0
            250px;

        width: 250px;
    }

    #index-grid {
        gap: 46px;
    }

}


/* =====================================================
   PHONE BASE
   ===================================================== */

body.phone-portrait,
body.phone-landscape {

    --font-size: 13px;

    --side: 24px;
    --top: 20px;

    --index-bottom: 18px;

    --meta-gap: 5px;

}

body.phone-portrait .logo,
body.phone-landscape .logo {
    width: 160px;
    height: 45px;
}

body.phone-portrait .logo-aybak,
body.phone-landscape .logo-aybak {
    top: 15px;
}


/* =====================================================
   PHONE PORTRAIT
   ===================================================== */

body.phone-portrait #project-meta {
    top: auto;

    left: var(--side) !important;

    width:
        calc(
            100vw -
            var(--side) * 2
        ) !important;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom) +
            27px
        );
}

body.phone-portrait #project-counter {
    padding-left: 16px;
}

body.phone-portrait #visual-zone {
    top: var(--portrait-visual-top);

    left: var(--side);
    right: var(--side);

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom) +
            72px
        );

    width: auto;
    height: auto;

    transform: none;

    padding: 4px 0;

    overflow: hidden;
}

body.phone-portrait #spread,
body.phone-portrait .image-cell {
    width: 100%;
    height: 100%;
}

body.phone-portrait .spread-image {
    width: auto;
    height: auto;

    max-width: 100%;
    max-height: 100%;

    object-fit: contain;
}


/* =====================================================
   PHONE PORTRAIT INDEX
   ===================================================== */

body.phone-portrait #index-scroller {
    bottom:
        calc(
            14px +
            env(safe-area-inset-bottom)
        );
}

body.phone-portrait #index-grid {
    gap: 30px;

    transform: translateY(-4px);
}

body.phone-portrait .project-card {
    flex:
        0
        0
        48vw;

    width: 48vw;
}


body.phone-portrait #project-all-grid {
    gap: 5px;
}


/* =====================================================
   PHONE LANDSCAPE
   ===================================================== */

body.phone-landscape {

    --side: 24px;
    --top: 18px;

    --index-bottom: 14px;

}


/* =====================================================
   LANDSCAPE META
   ===================================================== */

body.phone-landscape #project-meta {

    top: auto;

    left: var(--side) !important;

    width:
        calc(
            100vw -
            var(--side) * 2
        ) !important;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom) +
            24px
        );
}

body.phone-landscape #project-counter {
    padding-left: 16px;
}


/* =====================================================
   LANDSCAPE SLIDESHOW
   ===================================================== */

body.phone-landscape #visual-zone {

    top: 0;

    left: var(--landscape-safe-left);
    right: var(--landscape-safe-right);

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom) +
            24px
        );

    width: auto;
    height: auto;

    transform: none;

    display: flex;

    align-items: flex-end;
    justify-content: center;

    padding:
        18px
        0
        0;

    overflow: hidden;
}

body.phone-landscape #spread,
body.phone-landscape .image-cell {
    width: 100%;
    height: 100%;

    align-items: flex-end;
}

body.phone-landscape .spread-image {

    width: auto;
    height: auto;

    max-width: 100%;
    max-height: 100%;

    object-fit: contain;
}


/* =====================================================
   LANDSCAPE INDEX

   Cards are deliberately wider now.

   The image height still obeys the safe vertical
   area, while width gets extra room for long titles.
   ===================================================== */

body.phone-landscape #index-scroller {

    top: var(--landscape-index-top);

    bottom:
        calc(
            12px +
            env(safe-area-inset-bottom)
        );

    align-items: center;

    overflow-x: auto;
    overflow-y: hidden;
}

body.phone-landscape #index-grid {

    /*
        Smaller gap than before.
        Bigger cards can therefore coexist without
        making the rail feel excessively sparse.
    */

    gap: 26px;

    padding-left: var(--side);
    padding-right: var(--side);

    transform: none;
}

body.phone-landscape .project-card {

    flex:
        0
        0
        var(--landscape-index-card-width);

    width:
        var(--landscape-index-card-width);

    overflow: visible;
}

body.phone-landscape .card-image-wrap {
    align-items: center;
    justify-content: center;

    overflow: visible;
}

body.phone-landscape .card-image-wrap img {
    position: static;

    transform: none;

    width: auto !important;
    height: auto !important;

    max-width: 100% !important;
    max-height: 100% !important;

    object-fit: contain !important;
    object-position: center center !important;
}

body.phone-landscape .card-copy {
    margin-left:
        var(--landscape-preview-offset, 0px);
}


/*
    The first INDEX work should begin on the same left axis
    as Denizalp / contact.

    Other cards keep the centered-image / wider-caption-card
    logic, but the first project's visible thumbnail and copy
    start exactly at --side.
*/
body.phone-landscape .project-card:first-child .card-image-wrap {
    justify-content: flex-start;
}

body.phone-landscape .project-card:first-child .card-copy {
    margin-left: 0;
}

body.phone-landscape .card-copy {

    width: 100%;
}


/*
    Long title must remain inside the card width.

    With the wider card this should normally stay
    one line. On exceptionally long names it is
    clipped rather than visually escaping the card.
*/

body.phone-landscape .card-title,
body.phone-landscape .card-date {

    max-width: none;

    overflow: visible;

    text-overflow: clip;

    white-space: nowrap;
}


body.phone-landscape #project-all-grid {
    gap: 4px;
}


/* =====================================================
   SLIDE META — GLOBAL EDGE ALIGNMENT

   Keep the slide copy on the same outer grid as the
   site identity / section switch on every viewport:

   title + date       -> left edge = --side
   counter + view all -> right edge = --side
   bottom gap         -> same value as top gap = --top

   These rules intentionally come after the phone-specific
   metadata rules above so one geometry system wins on every
   device and orientation.
   ===================================================== */

#project-meta,
body.phone-portrait #project-meta,
body.phone-landscape #project-meta {
    top: auto !important;
    left: var(--side) !important;
    right: var(--side) !important;

    width: auto !important;

    bottom: var(--top) !important;
}

#project-title,
#project-date {
    justify-self: start;
    text-align: left;
}

#project-counter,
#view-all-button {
    justify-self: end;
    text-align: right;
}

/* =====================================================
   MOBILE INDEX SCROLL HINT
   ===================================================== */

/*
   The hint belongs to the viewport, not to the narrow text scroller.
   That keeps the full sentence visible even while the right side of
   the index is reserved for project preview media.
*/
#index-scroll-hint {
    position: fixed;
    left: var(--side);
    right: var(--side);
    top: auto;
    bottom: var(--top);
    z-index: 520;
    display: none;
    align-items: center;
    gap: 0.30em;
    width: auto;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: var(--font-size);
    line-height: var(--line-height);
    color: #000;
    opacity: 1;
    pointer-events: none;
    white-space: nowrap;
}

body.phone-portrait.index-mode.index-needs-scroll:not(.index-scroll-hint-dismissed) #index-scroll-hint,
body.phone-landscape.index-mode.index-needs-scroll:not(.index-scroll-hint-dismissed) #index-scroll-hint {
    display: inline-flex;
}

.index-scroll-hint-host {
    position: relative !important;
}

.index-scroll-hint-clipped {
    visibility: hidden !important;
    pointer-events: none !important;
}

/* =====================================================
   AYBAK END CARD

   Same identity system as the main landing page:
   centered two-line logo, same site typography, same letter-by-letter
   case morph. Contact / section information remains untouched.
   ===================================================== */

#aybak-end-card {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-sizing: border-box;
    background: #000;
    color: #fff;
    visibility: hidden;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    opacity: 0;
    transition: opacity 300ms linear, visibility 0s linear 300ms;
}

body.aybak-end-card-active #aybak-end-card {
    visibility: visible;
    pointer-events: auto;
    opacity: 1;
    transition: opacity 300ms linear, visibility 0s linear 0s;
}

body.aybak-end-card-leaving, html.aybak-end-card-leaving {
    background: #fff !important;
}

body.aybak-end-card-leaving #aybak-end-card {
    visibility: visible;
    pointer-events: none;
    opacity: 0;
    transition: opacity 300ms linear, visibility 0s linear 300ms;
}

#aybak-end-card-logo {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: max-content;
    height: auto;
    margin: 0;
    padding: 0;
    border: 0;
    outline: 0;
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    color: #fff;
    font-family: inherit;
    font-size: var(--font-size);
    font-weight: 400;
    line-height: var(--line-height);
    text-align: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

#aybak-end-card-name,
#aybak-end-card-aybak {
    display: block;
    height: calc(var(--font-size) * var(--line-height));
    white-space: nowrap;
}

.aybak-end-card-copy {
    position: absolute;
    z-index: 2;
    font-family: Arial, Helvetica, sans-serif;
    font-size: var(--font-size);
    line-height: var(--line-height);
    opacity: 0;
    transition: opacity 170ms ease 0ms;
}

body.aybak-end-card-active .aybak-end-card-copy {
    opacity: 1;
    transition-delay: 0ms;
}

.aybak-end-card-photography {
    top: var(--top);
    left: var(--side);
}

.aybak-end-card-film {
    top: var(--top);
    right: var(--side);
    text-align: right;
}

.aybak-end-card-bottom-left {
    left: var(--side);
    bottom: calc(var(--top) + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: flex-start;
}

.aybak-end-card-bottom-right {
    right: var(--side);
    bottom: calc(var(--top) + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    text-align: right;
}

.aybak-end-card-copy a {
    color: #fff;
    text-decoration: none;
}

.aybak-end-card-copy a:hover,
.aybak-end-card-copy a:focus,
.aybak-end-card-copy a:active {
    text-decoration: none;
    outline: 0;
}

#aybak-end-card .section-switch,
#aybak-end-card .section-switch:hover,
#aybak-end-card .section-switch:focus,
#aybak-end-card .section-switch:active,
#aybak-end-card .aybak-end-card-link,

<script>

/* =====================================================
   AYBAK END CARD — TWO-STATE VERTICAL NAVIGATION
   ===================================================== */

const aybakEndCard =
    document.getElementById(
        "aybak-end-card"
    );


let aybakEndCardActive =
    false;

let aybakTouchStartX =
    null;

let aybakTouchStartY =
    null;

let aybakTouchStartedInIndexScroller =
    false;

let aybakWheelAccumulator =
    0;

let aybakWheelResetTimer =
    null;

const AYBAK_WHEEL_THRESHOLD =
    48;

const AYBAK_SWIPE_THRESHOLD =
    52;


/*
    Fit the actual Acumin Pro Wide ink — not the CSS text box —
    slightly wider than the viewport, then center those visible ink bounds.
    This creates the same tiny, symmetrical side crop on every screen size.
*/
/* =====================================================
   AYBAK END CARD — LOGO SYSTEM
   ===================================================== */

const aybakEndCardLogo = document.getElementById("aybak-end-card-logo");
const aybakEndCardName = document.getElementById("aybak-end-card-name");
const aybakEndCardAybak = document.getElementById("aybak-end-card-aybak");

const aybakLogoLowercase = ["a", "y", "b", "a", "k"];
const aybakLogoUppercase = ["A", "Y", "B", "A", "K"];

let aybakLogoState = 0;
let aybakLogoTarget = 0;
let aybakLogoTimer = null;
let aybakLogoReturnTimer = null;
let aybakEndCardLeaving = false;

function canHover() {
    return window.matchMedia("(hover: hover) and (pointer: fine)").matches;
}

function setAybakLogoState(state) {
    aybakLogoState = Math.max(0, Math.min(5, state));
    aybakEndCardName.textContent = aybakLogoState === 0 ? "Denizalp" : "denizalp";
    aybakEndCardAybak.textContent = aybakLogoLowercase.map((letter, index) =>
        index < aybakLogoState ? aybakLogoUppercase[index] : letter
    ).join("");
}

function animateAybakLogoTo(target, callback = null) {
    aybakLogoTarget = target;
    if (aybakLogoTimer !== null) {
        clearTimeout(aybakLogoTimer);
        aybakLogoTimer = null;
    }

    function step() {
        if (aybakLogoState === aybakLogoTarget) {
            aybakLogoTimer = null;
            if (typeof callback === "function") callback();
            return;
        }

        aybakLogoState += aybakLogoState < aybakLogoTarget ? 1 : -1;
        setAybakLogoState(aybakLogoState);
        aybakLogoTimer = setTimeout(step, LOGO_STEP_DURATION);
    }

    step();
}

function clearAybakLogoReturnTimer() {
    if (aybakLogoReturnTimer !== null) {
        clearTimeout(aybakLogoReturnTimer);
        aybakLogoReturnTimer = null;
    }
}

function returnAybakLogoAfterMobileHold() {
    clearAybakLogoReturnTimer();
    aybakLogoReturnTimer = setTimeout(() => {
        animateAybakLogoTo(0);
        aybakLogoReturnTimer = null;
    }, MOBILE_NAV_HOLD);
}

function setAybakEndCard(active) {
    const next = Boolean(active);
    if (next === aybakEndCardActive) return;

    if (next) {
        aybakEndCardLeaving = false;
        document.body.classList.remove("aybak-end-card-leaving");
        document.documentElement.classList.remove("aybak-end-card-leaving");
        clearAybakLogoReturnTimer();
        aybakEndCardActive = true;
        document.body.classList.add("aybak-end-card-active");
        document.documentElement.classList.add("aybak-end-card-active");
        aybakEndCard.setAttribute("aria-hidden", "false");
        setAybakLogoState(aybakLogoState);
        aybakWheelAccumulator = 0;
        return;
    }

    aybakEndCardActive = false;
    document.body.classList.remove("aybak-end-card-active");
    document.documentElement.classList.remove("aybak-end-card-active");
    aybakEndCard.setAttribute("aria-hidden", "true");
    clearAybakLogoReturnTimer();
    aybakWheelAccumulator = 0;
}

const AYBAK_END_CARD_FADE_DURATION = 300;
const AYBAK_END_CARD_CLICK_HOLD_DESKTOP = 100;
const AYBAK_END_CARD_CLICK_HOLD_MOBILE = 420;

function leaveAybakEndCard() {
    if (aybakEndCardLeaving) return;
    aybakEndCardLeaving = true;
    clearAybakLogoReturnTimer();

    /* Keep the visible logo exactly as-is while the black surface fades. */
    document.body.classList.add("aybak-end-card-leaving");
    document.documentElement.classList.add("aybak-end-card-leaving");

    window.setTimeout(() => {
        setAybakEndCard(false);
        document.body.classList.remove("aybak-end-card-leaving");
        document.documentElement.classList.remove("aybak-end-card-leaving");
        aybakEndCardLeaving = false;
        /* Reset only after the white page is already back. */
        animateAybakLogoTo(0);
    }, AYBAK_END_CARD_FADE_DURATION);
}

aybakEndCardLogo.addEventListener("mouseenter", () => {
    if (!canHover() || aybakEndCardLeaving) return;
    clearAybakLogoReturnTimer();
    animateAybakLogoTo(5);
});

aybakEndCardLogo.addEventListener("mouseleave", () => {
    if (!canHover() || aybakEndCardLeaving) return;
    animateAybakLogoTo(0);
});

aybakEndCardLogo.addEventListener("click", event => {
    event.preventDefault();
    event.stopPropagation();

    if (aybakEndCardLeaving) return;
    clearAybakLogoReturnTimer();

    /* Desktop and mobile: reach full uppercase first, hold it, then fade. */
    animateAybakLogoTo(5, () => {
        window.setTimeout(() => {
            leaveAybakEndCard();
        }, canHover() ? AYBAK_END_CARD_CLICK_HOLD_DESKTOP : AYBAK_END_CARD_CLICK_HOLD_MOBILE);
    });
});

setAybakLogoState(0);


window.addEventListener("wheel", event => {
    if (Math.abs(event.deltaY) <= Math.abs(event.deltaX)) return;

    if (
        !aybakEndCardActive &&
        (interfaceAnimating || navigationAnimating || projectViewAnimating)
    ) return;

    if (
        !aybakEndCardActive &&
        indexMode &&
        indexScroller.contains(event.target)
    ) return;

    event.preventDefault();
    clearTimeout(aybakWheelResetTimer);
    aybakWheelAccumulator += event.deltaY;

    aybakWheelResetTimer = setTimeout(() => {
        aybakWheelAccumulator = 0;
    }, 140);

    if (!aybakEndCardActive && aybakWheelAccumulator >= AYBAK_WHEEL_THRESHOLD) {
        setAybakEndCard(true);
        return;
    }

    if (aybakEndCardActive && aybakWheelAccumulator <= -AYBAK_WHEEL_THRESHOLD) {
        leaveAybakEndCard();
    }
}, { passive: false });

/* Mobile swipe: explicitly handle the active end-card so Safari cannot lock it. */
function recordAybakTouchStart(event) {
    if (!event.changedTouches.length) return;
    const touch = event.changedTouches[0];
    aybakTouchStartX = touch.clientX;
    aybakTouchStartY = touch.clientY;
    aybakTouchStartedInIndexScroller = Boolean(
        indexMode && indexScroller.contains(event.target)
    );
}

function handleAybakTouchEnd(event) {
    if (
        aybakTouchStartX === null ||
        aybakTouchStartY === null ||
        !event.changedTouches.length
    ) return;

    const touch = event.changedTouches[0];
    const deltaX = touch.clientX - aybakTouchStartX;
    const deltaY = touch.clientY - aybakTouchStartY;

    aybakTouchStartX = null;
    aybakTouchStartY = null;

    if (
        Math.abs(deltaY) <= Math.abs(deltaX) ||
        Math.abs(deltaY) < AYBAK_SWIPE_THRESHOLD
    ) {
        aybakTouchStartedInIndexScroller = false;
        return;
    }

    if (
        !aybakEndCardActive &&
        (
            interfaceAnimating ||
            navigationAnimating ||
            projectViewAnimating ||
            (indexMode && aybakTouchStartedInIndexScroller)
        )
    ) {
        aybakTouchStartedInIndexScroller = false;
        return;
    }

    aybakTouchStartedInIndexScroller = false;
    suppressClickUntil = Date.now() + 500;

    /* Swipe up: white -> black. */
    if (!aybakEndCardActive && deltaY < 0) {
        setAybakEndCard(true);
        return;
    }

    /* Swipe down: black -> white, with a simple fade only. */
    if (aybakEndCardActive && deltaY > 0) {
        leaveAybakEndCard();
    }
}

window.addEventListener("touchstart", recordAybakTouchStart, { passive: true });
window.addEventListener("touchend", handleAybakTouchEnd, { passive: true });
aybakEndCard.addEventListener("touchstart", recordAybakTouchStart, { passive: true });
aybakEndCard.addEventListener("touchend", handleAybakTouchEnd, { passive: true });

aybakEndCard.addEventListener("click", event => {
    event.stopPropagation();
});

/* =====================================================
   INDEX IMAGE LAZY LOADING
   ===================================================== */

/*
    Index covers are no longer all downloaded during the
    initial page load.

    They begin loading only when they approach the visible
    horizontal index viewport. This is especially useful on
    phones, where downloading every full-resolution cover
    before the index is opened was unnecessary work.
*/

const indexImageObserver =
    new IntersectionObserver(
        entries => {

            entries.forEach(
                entry => {

                    if (
                        !entry.isIntersecting
                    ) {

                        return;

                    }


                    const img =
                        entry.target;


                    if (
                        !img.src &&
                        img.dataset.src
                    ) {

                        img.src =
                            img.dataset.src;

                    }


                    indexImageObserver.unobserve(
                        img
                    );

                }
            );

        },
        {
            root:
                indexScroller,

            rootMargin:
                isPhoneLayout()
                    ? "0px 220px"
                    : "0px 500px"
        }
    );


function activateIndexImagesNearViewport() {

    const scrollerRect =
        indexScroller.getBoundingClientRect();


    indexGrid
        .querySelectorAll(
            "img[data-src]"
        )
        .forEach(
            img => {

                if (
                    img.src
                ) {

                    return;

                }


                const card =
                    img.closest(
                        ".project-card"
                    );


                if (
                    !card
                ) {

                    return;

                }


                const rect =
                    card.getBoundingClientRect();


                const margin =
                    isPhoneLayout()
                        ? 220
                        : 500;


                if (
                    rect.right >=
                    scrollerRect.left -
                    margin &&
                    rect.left <=
                    scrollerRect.right +
                    margin
                ) {

                    img.src =
                        img.dataset.src;


                    indexImageObserver.unobserve(
                        img
                    );

                }

            }
        );

}

/* =====================================================
   RANDOM PROJECT START / COVER
   ===================================================== */

/*
    A project is never fully shuffled.

    Instead, one image is chosen as the starting point and
    the existing sequence is rotated around it.

    Example:
        1, 2, 3, 4
    random start = 3
        3, 4, 1, 2

    This preserves the relationships between neighbouring
    frames / looks while removing the need to manually pick
    a cover for every project.

    Optional JSON override:
        "coverOverride": "filename.jpg"

    When present, that image always becomes the first frame
    and therefore the index cover.
*/

function rotateImagesFromIndex(
    images,
    startIndex
) {

    if (
        images.length <= 1 ||
        startIndex <= 0
    ) {

        return images.slice();

    }


    return [
        ...images.slice(
            startIndex
        ),
        ...images.slice(
            0,
            startIndex
        )
    ];

}


function prepareProject(
    project
) {

    /*
        Typography normalization for the Q–P project title:
        use an en dash instead of a hyphen in every view/state.
    */
    project = {
        ...project,
        title:
            String(
                project.title || ""
            ).replace(
                /q-p/gi,
                "q–p"
            )
    };


    const originalImages =
        project.images.slice();


    let startIndex =
        0;


    if (
        project.coverOverride
    ) {

        const overrideIndex =
            originalImages.indexOf(
                project.coverOverride
            );


        if (
            overrideIndex >= 0
        ) {

            startIndex =
                overrideIndex;

        }

        else {

            console.warn(
                `coverOverride "${project.coverOverride}" was not found in`,
                project.title
            );


            startIndex =
                Math.floor(
                    Math.random() *
                    originalImages.length
                );

        }

    }

    else {

        startIndex =
            Math.floor(
                Math.random() *
                originalImages.length
            );

    }


    const rotatedImages =
        rotateImagesFromIndex(
            originalImages,
            startIndex
        );


    return {
        ...project,

        /*
            Keep an immutable copy of projects.json order.

            The runtime images[] array may rotate around a random
            cover, but permanent external links use this original
            order so PDF / shared URLs never change meaning.
        */
        originalImages:
            originalImages.slice(),

        images:
            rotatedImages,

        /*
            Existing index code can keep using project.cover.
            It is generated at runtime instead of maintained
            manually in projects.json.
        */
        cover:
            rotatedImages[0]
    };

}

    Permanent URL structure:

    This remains true even when the site randomly rotates a
    project's runtime opening image.

    Example JSON:

    Runtime random opening:

    Deep link:

    still opens original image #2.
*/

function getDeepLinkRequest() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const projectId =
        params.get(
            "project"
        );


    const rawImage =
        params.get(
            "image"
        );


    let imageNumber =
        null;


    if (
        rawImage !==
        null
    ) {

        const parsed =
            Number.parseInt(
                rawImage,
                10
            );


        if (
            Number.isFinite(
                parsed
            ) &&
            parsed >= 1
        ) {

            imageNumber =
                parsed;

        }

    }


    return {
        projectId,
        imageNumber
    };

}

function getOriginalImageNumber(

    if (

function getRuntimeFrameIndexFromOriginalNumber(

    const originalImages =

    if (

        originalIndex >=
            originalImages.length
    ) {

    const filename =

    return project.images.indexOf(

/* =====================================================
   PRELOAD
   ===================================================== */

function preloadImage(
    filename
) {

    if (
        imageCache.has(
            filename
        )
    ) {

        return imageCache.get(
            filename
        );

    }


    const promise =
        new Promise(
            (
                resolve,
                reject
            ) => {

                const img =
                    new Image();


                img.decoding =
                    "async";


                img.onload =
                    async () => {

                        try {

                            if (
                                img.decode
                            ) {

                                await img.decode();

                            }

                        }

                        catch (error) {}


                        resolve(
                            img
                        );

                    };


                img.onerror =
                    () => {

                        imageCache.delete(
                            filename
                        );


                        reject(
                            new Error(
                                `Could not load ${filename}`
                            )
                        );

                    };


                img.src =
                    getPhotoUrl(
                        filename
                    );

            }
        );


    imageCache.set(
        filename,
        promise
    );


    return promise;

}


/* =====================================================
   LANDSCAPE GEOMETRY
   ===================================================== */

function updateLandscapeGeometry() {

    if (
        !isPhoneLandscape()
    ) {

        return;

    }


    const root =
        document.documentElement;


    const infoRect =
        info.getBoundingClientRect();


    const rightControlRect =
        indexButton.getBoundingClientRect();


    const indexRect =
        indexButton.getBoundingClientRect();


    const computed =
        getComputedStyle(
            root
        );


    const fontSize =
        parseFloat(
            computed.getPropertyValue(
                "--font-size"
            )
        ) || 13;


    const lineHeightMultiplier =
        parseFloat(
            computed.getPropertyValue(
                "--line-height"
            )
        ) || 1.15;


    const lineHeight =
        fontSize *
        lineHeightMultiplier;


    /* =================================================
       SLIDE — HORIZONTAL SAFE AREA
       ================================================= */


    const slideLeftGap =
        24;


    const slideRightGap =
        32;


    const safeLeft =
        Math.ceil(
            infoRect.right +
            slideLeftGap
        );


    const safeRight =
        Math.max(
            24,
            Math.ceil(
                window.innerWidth -
                rightControlRect.left +
                slideRightGap
            )
        );


    root.style.setProperty(
        "--landscape-safe-left",
        `${safeLeft}px`
    );


    root.style.setProperty(
        "--landscape-safe-right",
        `${safeRight}px`
    );


    /* =================================================
       INDEX — SAFE VERTICAL AREA
       ================================================= */


    const indexTopGap =
        22;


    const indexBottomGap =
        20;


    const safeIndexTop =
        Math.ceil(
            Math.max(
                infoRect.bottom,
                indexRect.bottom
            ) +
            indexTopGap
        );


    const safeIndexBottom =
        Math.floor(
            window.innerHeight -
            indexBottomGap
        );


    const availableHeight =
        Math.max(
            120,
            safeIndexBottom -
            safeIndexTop
        );


    const copyHeight =
        lineHeight *
        2;


    const copyGap =
        5;


    /*
        Reduced from previous value.

        We use more of the available vertical space
        while still leaving a safety buffer.
    */

    const innerSafety =
        3;


    const imageHeight =
        Math.max(
            80,
            Math.floor(
                availableHeight -
                copyHeight -
                copyGap -
                innerSafety
            )
        );


    /*
        KEY CHANGE:

        The card width no longer follows the image
        width so tightly.

        Give the text enough room for long titles,
        while keeping the image vertically constrained.

        A typical landscape phone will produce
        roughly 210–245px cards.
    */

    const cardWidth =
        Math.max(
            205,
            Math.min(
                275,
                Math.round(
                    imageHeight *
                    1.12
                )
            )
        );


    root.style.setProperty(
        "--landscape-index-top",
        `${safeIndexTop}px`
    );


    root.style.setProperty(
        "--landscape-index-image-height",
        `${imageHeight}px`
    );


    root.style.setProperty(
        "--landscape-index-card-width",
        `${cardWidth}px`
    );

}


/* =====================================================
   RESPONSIVE MODE
   ===================================================== */

function updateResponsiveMode() {

    const portrait =
        isPhonePortrait();


    const landscape =
        isPhoneLandscape();


    const newMode =
        getResponsiveMode();


    const modeChanged =
        previousResponsiveMode !== null &&
        previousResponsiveMode !==
        newMode;


    body.classList.toggle(
        "phone-portrait",
        portrait
    );


    body.classList.toggle(
        "phone-landscape",
        landscape
    );



    if (
        portrait
    ) {

        const infoRect =
            info.getBoundingClientRect();


        document
            .documentElement
            .style
            .setProperty(
                "--portrait-visual-top",
                `${Math.ceil(
                    infoRect.bottom +
                    18
                )}px`
            );

    }


    if (
        landscape
    ) {

        updateLandscapeGeometry();


        /*
            updateLandscapeGeometry() changes the authoritative
            landscape media height/card width, so already-loaded
            thumbnails must be resized from those fresh values.
        */

        requestAnimationFrame(
            resizePhotoIndexCards
        );

    }


    if (
        modeChanged &&
        indexMode &&
        (
            newMode ===
            "phone-landscape" ||
            previousResponsiveMode ===
            "phone-landscape"
        )
    ) {

        savedIndexScrollTop =
            0;


        indexScroller.scrollTop =
            0;

    }


    previousResponsiveMode =
        newMode;

}


/* =====================================================
   INDEX TOP
   ===================================================== */

function updateIndexContentTop() {

    const rect =
        info.getBoundingClientRect();


    let gap =
        30;


    if (
        isPhonePortrait()
    ) {

        gap =
            24;

    }


    document
        .documentElement
        .style
        .setProperty(
            "--index-content-top",
            `${Math.ceil(
                rect.bottom +
                gap
            )}px`
        );

}


/* =====================================================
   TYPOGRAPHY
   ===================================================== */

function renderInteractiveTypography(
    element,
    text,
    activePositions =
        new Set()
) {

    const fragment =
        document.createDocumentFragment();


    Array.from(
        String(
            text
        )
    ).forEach(
        (
            character,
            index
        ) => {

            const span =
                document.createElement(
                    "span"
                );


            span.textContent =
                character;


            const isDigit =
                /[0-9]/.test(
                    character
                );


            const isActiveDigit =
                isDigit &&
                activePositions.has(
                    index
                );


            /*
                Keep Helvetica/Arial throughout.
                Active digits only gain spacing; no font swap.
            */
            if (
                isActiveDigit
            ) {

                span.style.letterSpacing =
                    "var(--active-number-tracking)";

            }


            fragment.appendChild(
                span
            );

        }
    );


    element.replaceChildren(
        fragment
    );

}


function renderBaseTypography(
    element,
    text
) {

    renderInteractiveTypography(
        element,
        text,
        new Set()
    );

}


function getMorphPositions(
    text
) {

    return Array.from(
        String(
            text
        )
    )
        .map(
            (
                character,
                index
            ) => {

                const isLetter =
                    character.toLowerCase() !==
                    character.toUpperCase();


                const isDigit =
                    /[0-9]/.test(
                        character
                    );


                return (
                    isLetter ||
                    isDigit
                )
                    ? index
                    : -1;

            }
        )
        .filter(
            index =>
                index >= 0
        );

}


function renderCaseFromActivePositions(
    baseText,
    activePositions
) {

    return String(
        baseText
    )
        .split(
            ""
        )
        .map(
            (
                character,
                index
            ) => {

                const isLetter =
                    character.toLowerCase() !==
                    character.toUpperCase();


                return (
                    isLetter &&
                    activePositions.has(
                        index
                    )
                )
                    ? character.toUpperCase()
                    : character.toLowerCase();

            }
        )
        .join(
            ""
        );

}


/* =====================================================
   SIMPLE SEQUENTIAL CHARACTER MORPH
   ===================================================== */

function morphSequential(
    element,
    nextText,
    duration =
        TEXT_MORPH_DURATION
) {

    const oldText =
        element.dataset.rawText !==
        undefined
            ? element.dataset.rawText
            : element.textContent;


    if (
        oldText ===
        nextText
    ) {

        renderInteractiveTypography(
            element,
            nextText,
            new Set()
        );


        element.dataset.rawText =
            nextText;


        return Promise.resolve();

    }


    const length =
        Math.max(
            oldText.length,
            nextText.length
        );


    const from =
        oldText
            .padEnd(
                length,
                " "
            )
            .split(
                ""
            );


    const to =
        nextText
            .padEnd(
                length,
                " "
            )
            .split(
                ""
            );


    const changedPositions =
        [];


    for (
        let i = 0;
        i < length;
        i++
    ) {

        if (
            from[i] !==
            to[i]
        ) {

            changedPositions.push(
                i
            );

        }

    }


    const originalWidth =
        element
            .getBoundingClientRect()
            .width;


    if (
        originalWidth > 0
    ) {

        element.style.minWidth =
            `${originalWidth}px`;

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const completed =
                    Math.floor(
                        progress *
                        (
                            changedPositions.length +
                            1
                        )
                    );


                const current =
                    from.slice();


                for (
                    let i = 0;
                    i < completed;
                    i++
                ) {

                    const position =
                        changedPositions[
                            i
                        ];


                    if (
                        position ===
                        undefined
                    ) {

                        continue;

                    }


                    current[
                        position
                    ] =
                        to[
                            position
                        ];

                }


                renderInteractiveTypography(
            element,
            current
                        .join(
                            ""
                        )
                        .trimEnd(),
            new Set()
        );


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    renderInteractiveTypography(
            element,
            nextText,
            new Set()
        );


                    element.dataset.rawText =
                        nextText;


                    element.style.minWidth =
                        "";


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}


/* =====================================================
   CASE HELPERS
   ===================================================== */

function getLetterPositions(
    text
) {

    const result =
        [];


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const character =
            text[i];


        if (
            character.toLowerCase() !==
            character.toUpperCase()
        ) {

            result.push(
                i
            );

        }

    }


    return result;

}


function renderPrefixCase(
    baseText,
    upperCount
) {

    const positions =
        getLetterPositions(
            baseText
        );


    const upper =
        new Set(
            positions.slice(
                0,
                upperCount
            )
        );


    return baseText
        .split(
            ""
        )
        .map(
            (
                character,
                index
            ) => {

                return upper.has(
                    index
                )
                    ? character.toUpperCase()
                    : character.toLowerCase();

            }
        )
        .join(
            ""
        );

}



function renderCaseFromActivePositions(
    baseText,
    activePositions
) {

    return baseText
        .split(
            ""
        )
        .map(
            (
                character,
                index
            ) => {

                const isLetter =
                    character.toLowerCase() !==
                    character.toUpperCase();


                return (
                    isLetter &&
                    activePositions.has(
                        index
                    )
                )
                    ? character.toUpperCase()
                    : character.toLowerCase();

            }
        )
        .join(
            ""
        );

}


/* =====================================================
   CASE ANIMATION
   ===================================================== */

function animateCase(
    element,
    baseText,
    toUpper,
    duration =
        CASE_DURATION
) {

    const base =
        String(
            baseText
        ).toLowerCase();


    const positions =
        getMorphPositions(
            base
        );


    const total =
        positions.length;


    /*
        Detect the current uppercase-letter prefix from text.
        Digits do not reveal state in text, so when spans exist we
        also detect active tracking from their inline style.
    */
    let currentState =
        0;


    const children =
        Array.from(
            element.children
        );


    if (
        children.length ===
        base.length
    ) {

        for (
            let i = 0;
            i < positions.length;
            i++
        ) {

            const position =
                positions[i];


            const character =
                base[
                    position
                ];


            const span =
                children[
                    position
                ];


            const isDigit =
                /[0-9]/.test(
                    character
                );


            const isLetter =
                character.toLowerCase() !==
                character.toUpperCase();


            const active =
                isDigit
                    ? (
                        span &&
                        !!span.style.letterSpacing
                    )
                    : (
                        isLetter &&
                        span &&
                        span.textContent ===
                            character.toUpperCase()
                    );


            if (
                active
            ) {

                currentState++;

            }

            else {

                break;

            }

        }

    }

    else {

        const currentText =
            element.textContent;


        for (
            let i = 0;
            i < positions.length;
            i++
        ) {

            const position =
                positions[i];


            const character =
                base[
                    position
                ];


            const isLetter =
                character.toLowerCase() !==
                character.toUpperCase();


            if (
                isLetter &&
                currentText[
                    position
                ] ===
                    character.toUpperCase()
            ) {

                currentState++;

            }

            else {

                break;

            }

        }

    }


    const target =
        toUpper
            ? total
            : 0;


    function renderState(
        state
    ) {

        const activePositions =
            new Set(
                positions.slice(
                    0,
                    state
                )
            );


        renderInteractiveTypography(
            element,
            renderCaseFromActivePositions(
                base,
                activePositions
            ),
            activePositions
        );

    }


    if (
        currentState ===
        target
    ) {

        renderState(
            target
        );


        return Promise.resolve();

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const state =
                    Math.round(
                        currentState +
                        (
                            target -
                            currentState
                        ) *
                        progress
                    );


                renderState(
                    state
                );


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    renderState(
                        target
                    );


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}


/* =====================================================
   IMAGE
   ===================================================== */

function renderImage(
    imageData
) {

    spread.innerHTML =
        "";


    const cell =
        document.createElement(
            "div"
        );


    cell.className =
        "image-cell";


    const img =

        );

    );
